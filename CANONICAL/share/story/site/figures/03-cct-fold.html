    <span class="cf-milnote">still these four rows (counts only shown): totals, not samples; the table grows with program shape, not traffic</span>
  </div>

  <figcaption>Run <code>run1</code> folded: every call adds its numbers into
  the one row for its calling context and is then forgotten: eight calls,
  four rows, none skipped. <code>call6</code>&rsquo;s failure stays visible as
  <code>context4</code>&rsquo;s <code>errored&nbsp;=&nbsp;1</code> even though every
  <code>ProcessCustomer</code> succeeded; row labels like <code>context1</code>
  are readable placeholders for teaching; real identifiers are opaque.</figcaption>
