<figure class="fig fig-08-where-things-live">
  <div class="wtl-map">

    <section class="wtl-panel">
      <h5 class="fh">Your laptop</h5>
      <div class="wtl-card wtl-imm">
        <h6 class="wtl-name"><code>.baml/</code>
          <span class="wtl-tag wtl-tag-imm">immutable &middot; canonical</span>
          <span class="chip c-built" title="On this branch today; numbers are implementation defaults, not frozen contracts">built</span></h6>
        <p class="wtl-body">Sealed artifacts and the value store: the
          canonical evidence for everything captured on this machine.</p>
      </div>
      <p class="wtl-localnote">No upload configured: this panel is the entire
        system: capture, tape, values, queries, all offline.
        <span class="chip c-built" title="On this branch today; numbers are implementation defaults, not frozen contracts">built</span></p>
    </section>

    <div class="wtl-boundary">
      <div class="wtl-cross">
        <span class="wtl-crosslabel">upload (sealed&nbsp;bytes)</span>
        <span class="wtl-crossarrow" aria-hidden="true"></span>
      </div>
      <span class="wtl-blabel">network boundary</span>
    </div>

    <section class="wtl-panel">
      <h5 class="fh">Cloud</h5>
      <div class="wtl-cloudgrid">

        <div class="wtl-card wtl-imm wtl-s3">
          <h6 class="wtl-name">S3 <span class="wtl-sub">object storage</span>
            <span class="wtl-tag wtl-tag-imm">immutable &middot; canonical</span>
            <span class="chip c-v1" title="Committed target with a delivery gate; designed, not built">v1</span></h6>
          <p class="wtl-body">The uploaded, accepted copy of the same sealed
            evidence, values included: the canonical hosted evidence.</p>
        </div>

        <div class="wtl-proj">
          <span class="wtl-projline" aria-hidden="true"></span>
          <span class="wtl-projlabel">projection</span>
        </div>

        <div class="wtl-card wtl-reb wtl-ch">
          <h6 class="wtl-name">ClickHouse
            <span class="wtl-tag wtl-tag-reb">rebuildable</span>
            <span class="chip c-v1" title="Committed target with a delivery gate; designed, not built">v1</span></h6>
          <p class="wtl-body">Small rebuildable facts behind the tables you
            query: <code>runs</code>, <code>calling_contexts</code>,
            <code>retained_calls</code>, &hellip;</p>
          <p class="wtl-never"><s>args &middot; returns &middot; errors
            &middot; &hellip;</s> never value bodies
            <span class="wtl-d8">(D8, settled)</span></p>
          <p class="wtl-rebuild"><span class="wtl-cyc" aria-hidden="true">&#x27F3;</span>
            wipe + replay the sealed evidence from S3 &rArr; identical tables;
            a release gate performs exactly this rebuild.</p>
        </div>

        <div class="wtl-bypass">
          <span class="wtl-bline" aria-hidden="true"></span>
          <span class="wtl-bypasslabel">values fetched on demand from the
            value store / S3, not the query tables (doc&nbsp;05)</span>
          <span class="wtl-bline wtl-bline-a" aria-hidden="true"></span>
          <div class="wtl-qnode">your query</div>
        </div>

      </div>

      <div class="wtl-card wtl-mut wtl-pg">
        <h6 class="wtl-name">PostgreSQL
          <span class="wtl-tag wtl-tag-mut">mutable</span>
          <span class="chip c-v1" title="Committed target with a delivery gate; designed, not built">v1</span></h6>
        <p class="wtl-body">Ownership and workflow: projects, what has been
          accepted, what is in progress (the only mutable store).
          Evidence never changes.</p>
      </div>
    </section>

  </div>

  <div class="wtl-legend">
    <span class="wtl-lg"><span class="wtl-sw wtl-sw-imm" aria-hidden="true"></span>
      immutable &middot; canonical: sealed evidence; never edited</span>
    <span class="wtl-lg"><span class="wtl-sw wtl-sw-reb" aria-hidden="true"></span>
      rebuildable: a projection of sealed evidence; safe to wipe</span>
    <span class="wtl-lg"><span class="wtl-sw wtl-sw-mut" aria-hidden="true"></span>
      mutable: the only store that changes in place</span>
  </div>

  <figcaption>Where each kind of data rests once upload is configured:
  evidence is immutable in local <code>.baml/</code> files and S3, ClickHouse
  is a rebuildable projection of that evidence and never holds value bodies
  (settled, decision D8), and PostgreSQL alone is mutable. Without upload
  configured, the laptop panel is the entire system.</figcaption>
