<figure class="fig fig-07-hash-not-dep">
  <div class="hnd-grid">

    <div class="hnd-scope">
      <span class="hnd-scopetag">what the hash covers</span>
      <div class="fig-scroll">
        <pre class="hnd-code"><span class="k">function</span> ClassifyCustomer(c: <span class="hnd-ref">Customer</span>) -&gt; Verdict {
  <span class="k">client</span> <span class="k">"openai/gpt-5"</span>
  <span class="k">prompt</span> #"
    &hellip; {{ c.name }} &hellip;  <span class="cmt">&larr; renders customer data</span>
  "#
}</pre>
      </div>
      <div class="hnd-scopenote">one function&rsquo;s <em>own</em> compiled signature and bytecode &rarr; local hash <code>lh_9a</code></div>
    </div>

    <div class="hnd-link">
      <span class="hnd-linklabel">referenced by name only; contents not hashed</span>
      <span class="hnd-line" aria-hidden="true"></span>
    </div>

    <div class="hnd-refwrap">
      <span class="hnd-reftag">outside the hash</span>
      <div class="hnd-class">
        <div class="hnd-classhead"><span class="k">class</span> <span class="hnd-ref">Customer</span></div>
        <div class="hnd-frow">name string</div>
        <div class="hnd-frow">email string</div>
        <div class="hnd-frow">plan string</div>
        <div class="hnd-frow hnd-new"><span>+ new field</span><span class="hnd-hyp">hypothetical</span></div>
      </div>
    </div>

  </div>

  <div class="hnd-verdicts">
    <div class="hnd-v">
      <span class="hnd-vk">revision</span>
      <span class="hnd-vv">new</span>
      <span class="hnd-vn">whole-program rule: any edit makes a new revision</span>
    </div>
    <div class="hnd-v">
      <span class="hnd-vk">local hash</span>
      <span class="hnd-vv">unchanged &middot; <code>lh_9a</code></span>
      <span class="hnd-vn">its own text still says only &ldquo;Customer&rdquo;</span>
    </div>
    <div class="hnd-v hnd-vq">
      <span class="hnd-vk">behavior</span>
      <span class="hnd-vv">may differ?</span>
      <span class="hnd-vn">the prompt renders customer data: uncertainty, not a detected change</span>
    </div>
  </div>

  <div class="hnd-alt">
    <strong>Deferred alternative:</strong> an honest <em>dependency-aware</em> hash
    (equal hash meaning equal behavior) would hash the full dependency
    closure: every referenced type, template, and callee. A real future design,
    explicitly not in v1 <span class="chip c-open" title="Decision not yet made">open</span>.
  </div>

  <figcaption>A hypothetical third revision adds a field to
  <code>class Customer</code>: a new revision under the whole-program rule, an
  unchanged local hash (<code>lh_9a</code>), and possibly different behavior.
  An unchanged local hash never proves unchanged behavior; the revision remains
  the only exact statement of &ldquo;this program&rdquo;.</figcaption>
</figure>
