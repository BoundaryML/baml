<figure class="fig fig-10-investigation-ladder">
  <div class="il-head">
    <span class="fh">The investigation ladder</span>
    <span class="il-chips"><span class="il-chipname">table schemas</span><span class="chip c-v1" title="Committed target with a delivery gate; designed, not built">v1</span></span>
  </div>

  <div class="fig-scroll">
    <div class="il-grid">

      <div class="il-band il-band-complete">
        <b>complete layer</b>
        <span>panels query here</span>
      </div>

      <div class="il-group il-group-complete">
        <div class="il-rung">
          <code>runs</code>
          <span class="il-q">which run should I look at?</span>
          <span class="il-recipe">recipe 1</span>
          <span class="il-shape il-shape-complete">complete</span>
        </div>
        <div class="il-rung il-in1 il-elbow">
          <code>calling_contexts</code>
          <span class="il-q">which function, under which parent, misbehaved?</span>
          <span class="il-recipe">recipes 2 · 5</span>
          <span class="il-shape il-shape-complete">complete</span>
        </div>
      </div>

      <div class="il-band il-band-retained">
        <b>retained layer</b>
        <span>investigations descend here</span>
      </div>

      <div class="il-group il-group-retained">
        <div class="il-rung il-in2 il-elbow il-elbow-far">
          <code>retained_calls</code>
          <span class="il-q">which exact call can I inspect?</span>
          <span class="il-recipe">recipe 3</span>
          <span class="il-shape il-shape-selected">selected</span>
        </div>
        <div class="il-leaves">
          <div class="il-rung il-leaf il-virtual">
            <span class="il-virtlabel">virtual fields: not a table</span>
            <code>args / return / error</code>
            <span class="il-q">what data did it carry?</span>
            <span class="il-leafmeta"><span class="il-recipe">recipe 3</span>
              <span class="il-shape il-shape-selected">selected</span></span>
          </div>
          <div class="il-rung il-leaf">
            <code>tape_dumps</code>
            <span class="il-q">what else was happening right then?</span>
            <span class="il-leafmeta"><span class="il-recipe">recipe 4</span>
              <span class="il-shape il-shape-bounded">bounded</span></span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <figcaption>All recipes walk the same ladder: panels query the top,
  investigations descend it, and each rung carries the shape of answer it
  yields. The ladder is not all of the table schemas: the recipes use further
  tables not shown here; doc 09 lists the full set.</figcaption>
