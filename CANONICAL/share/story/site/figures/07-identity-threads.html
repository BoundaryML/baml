    </div>
    <div class="it-insetrow">
      <code>dk4</code>
      <span class="it-cutband" aria-hidden="true"><i class="seg"></i></span>
      <b class="cutword">cut</b>
      <span class="it-cutband" aria-hidden="true"><i class="seg"></i></span>
      <span class="newkey">a new definition_key, changed on purpose</span>

    <p class="it-insetnote">Studio does not guess intent: a rename makes a new logical function, and a hash match across a rename is a hint, not identity.</p>
  </div>

  <p class="it-foot"><code>dk4</code>, <code>lh_9a</code>, and the integer ids are teaching placeholders. The real key is a readable string closer to <code>function:user.ClassifyCustomer</code> <span class="chip c-built" title="On this branch today; numbers are implementation defaults, not frozen contracts">built</span>; its exact physical spelling, like every physical identifier form, is not frozen for v1 <span class="chip c-open" title="Decision not yet made">open</span>.</p>

  <figcaption><code>ClassifyCustomer</code> across two revisions: <code>function_id</code> and local hash are revision-scoped; the <code>definition_key</code> is the identity that survives, and a rename cuts it on purpose. The integers 18 and 16 are illustrative; dense ids are assigned fresh at each compile, in an order the contract does not specify.</figcaption>
