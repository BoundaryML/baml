<figure class="fig fig-05-values-pipeline">
  <div class="vp-pipe">

    <section class="vp-station">
      <h5 class="vp-name">The call</h5>
      <div class="vp-where">hot path</div>
      <p class="vp-body">Bounded deep copy out of the program&rsquo;s memory:
        no disk, no hash, the program never waits.
        <span class="chip c-built" title="On this branch today; numbers are implementation defaults, not frozen contracts">built</span></p>
    </section>

    <div class="vp-arrow">
      <span class="vp-arrowlabel">bounded deep copy</span>
    </div>

    <section class="vp-station">
      <h5 class="vp-name">Drafts in memory</h5>
      <div class="vp-where">until run end</div>
      <p class="vp-body">Role + call identity; encoded once, synchronously,
        at run end; a promoted draft joins the same write.
        <span class="chip c-built" title="On this branch today; numbers are implementation defaults, not frozen contracts">built</span></p>
      <p class="vp-hazard">crash before run end: drafts lost;
        structural tape survives (doc&nbsp;08)</p>
      <p class="vp-note">incremental flush while a run is open: drain service
        exists, unused
        <span class="chip c-open" title="Decision not yet made">open</span></p>
    </section>

    <div class="vp-arrow">
      <span class="vp-arrowlabel">encode at run end</span>
    </div>

    <section class="vp-station">
      <h5 class="vp-name">Value store</h5>
      <div class="vp-where">this machine</div>
      <p class="vp-body">One copy per distinct content.</p>
      <p class="vp-stat">64-turn agent conversation: &ge;20&times; reduction
        <span class="chip c-built" title="On this branch today; numbers are implementation defaults, not frozen contracts">built</span></p>
      <p class="vp-note">local first: nothing uploads by default;
        upload is explicit opt-in (doc&nbsp;08)
        <span class="chip c-built" title="On this branch today; numbers are implementation defaults, not frozen contracts">built</span></p>
      <p class="vp-note">&ldquo;bodies live only in the value store&rdquo; is
        the v1 target
        <span class="chip c-v1" title="Committed target with a delivery gate; designed, not built">v1</span></p>
    </section>

  </div>

  <figcaption>A value is copied once on the hot path, encoded once at run
  end, and stored once per distinct content, locally. Drafts still in memory
  when a run crashes mid-flight are lost; the structural tape survives with
  its intact prefix (doc 08).</figcaption>
