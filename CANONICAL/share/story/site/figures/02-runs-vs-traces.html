<figure class="fig fig-02-runs-vs-traces">
  <div class="rvt-cols">

    <!-- LEFT: trace = correlation -->
    <div class="rvt-pan">
      <div class="rvt-phead">
        <strong>A trace is a correlation</strong>
        <span class="rvt-kick">structure inferred from stitching</span>
      </div>

      <div class="fh">emitted spans, in arrival order</div>
      <div class="rvt-strip">
        <span class="rvt-span">span d19 · parent b07</span>
        <span class="rvt-span">span b07 · parent e41</span>
        <span class="rvt-span">span a63 · parent f8c</span>
        <span class="rvt-span">span e41 · root</span>
        <span class="rvt-span rvt-span-q">span f8c · parent ?</span>
        <span class="rvt-span">span c52 · parent e41</span>
      </div>

      <div class="rvt-stitch" aria-hidden="true">
        <svg viewBox="0 0 160 26" width="160" height="26" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2 L80 21" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
          <path d="M80 2 L80 21" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
          <path d="M148 2 L80 21" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
          <path d="M75 17 L80 24 L85 17" stroke="var(--muted)" stroke-width="1" fill="none"/>
        </svg>
      </div>
      <div class="rvt-stitchlabel">a backend later stitches matching IDs into a tree</div>

      <div class="rvt-asm">
        <div class="rvt-stree">
          <div class="rvt-srow"><span class="rvt-sn">span e41</span></div>
          <div class="rvt-srow"><span class="rvt-si t"></span><span class="rvt-sn">span b07</span></div>
          <div class="rvt-srow"><span class="rvt-si v"></span><span class="rvt-si l"></span><span class="rvt-sn">span d19</span></div>
          <div class="rvt-srow"><span class="rvt-si l"></span><span class="rvt-sn">span c52</span></div>
        </div>
        <div class="rvt-ghost">
          <div class="rvt-srow"><span class="rvt-sn">span f8c</span></div>
          <div class="rvt-srow"><span class="rvt-si l"></span><span class="rvt-sn">span a63</span></div>
          <div class="rvt-glabel">orphaned: never attached</div>
        </div>
      </div>

      <div class="rvt-callout">unpropagated ID → subtree orphaned. No record it existed.</div>

      <div class="rvt-pfoot">
        <strong>silent hole</strong>: the tree is simply smaller.
        <span class="rvt-pnote">under sampling, most requests produce no tree at all</span>
      </div>
    </div>

    <!-- RIGHT: run = produced -->
    <div class="rvt-pan">
      <div class="rvt-phead">
        <strong>A run is produced</strong>
        <span class="rvt-kick">the runtime creates every call
          <span class="chip c-built" title="On this branch today; numbers are implementation defaults, not frozen contracts">built</span></span>
      </div>

      <div class="fh">no spans to stitch, none to sample away</div>

      <div class="fig-scroll">
        <div class="rt">
          <div class="rt-row">
            <span class="rt-main">
              <span class="rt-tree"></span>
              <span class="rt-id">call1</span>
              <span class="rt-fn"><span class="rt-tag">entrypoint</span></span>
            </span>
            <span class="rt-st"><span class="sp sp-ok">succeeded</span></span>
          </div>
          <div class="rt-row">
            <span class="rt-main">
              <span class="rt-tree"><i class="rt-i t"></i></span>
              <span class="rt-id">call2</span>
              <span class="rt-fn"></span>
            </span>
            <span class="rt-st"><span class="sp sp-ok">succeeded</span></span>
          </div>
          <div class="rt-row">
            <span class="rt-main">
              <span class="rt-tree"><i class="rt-i t"></i></span>
              <span class="rt-id">call3</span>
              <span class="rt-fn"></span>
            </span>
            <span class="rt-st"><span class="sp sp-ok">succeeded</span></span>
          </div>
          <div class="rt-row">
            <span class="rt-main">
              <span class="rt-tree"><i class="rt-i v"></i><i class="rt-i l"></i></span>
              <span class="rt-id">call4</span>
              <span class="rt-fn"></span>
            </span>
            <span class="rt-st"><span class="sp sp-ok">succeeded</span></span>
          </div>
          <div class="rt-row">
            <span class="rt-main rt-wide">
            <span class="rt-tree"><i class="rt-i l"></i></span>
            <span class="rvt-gap">
              <span class="rvt-gaphead"><span aria-hidden="true">⚠</span>
                <span class="sp sp-warn">records lost</span>
                <span class="rvt-gapwhy">process died mid-run, or records dropped under extreme load</span></span>
              <span class="rvt-gapnote">the loss is recorded as a typed, queryable fact; the tree is marked
                incomplete (doc 06)
                <span class="chip c-v1" title="Committed target with a delivery gate; designed, not built">v1</span></span>
            </span>
            </span>
          </div>
        </div>
      </div>

      <div class="rvt-pfoot">
        <strong>declared gap</strong>: the loss itself is on the record.
      </div>
    </div>
  </div>

  <div class="rvt-xstrip">cross-process work is a <strong>related run</strong>: linked and separately
    clocked, never spliced into one timeline
    <span class="chip c-v1" title="Committed target with a delivery gate; designed, not built">v1</span></div>

  <figcaption>Both panels show structure being lost. In the trace the hole is silent:
  the assembled tree is simply smaller; in the run the loss is declared where it
  happened and the tree is marked incomplete (recording the tree at creation is
  built; declared-loss persistence is v1).</figcaption>
