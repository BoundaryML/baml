<figure class="fig fig-06-status-evidence-quadrant">
  <div class="seq-wrap">
    <div class="seq-axisy">status: how the program did</div>

    <div class="seq-main">
      <div class="seq-axisx">evidence: how much of what Studio promised is present</div>
      <div class="fig-scroll">
      <div class="seq-grid">
        <div class="seq-corner" aria-hidden="true"></div>
        <div class="seq-colhead">Evidence complete</div>
        <div class="seq-colhead">Evidence incomplete</div>

        <div class="seq-rowhead">Run succeeded</div>

        <div class="seq-cell">
          <div class="seq-pin"><code>run1</code></div>
          <div class="seq-marks">
            <span class="seq-st"><i class="seq-dot seq-dot-ok"></i>succeeded</span>
            <span class="seq-evm"><i class="seq-evbar seq-evbar-solid"></i>complete</span>
          </div>
          <p class="seq-note">Trust every number.</p>
        </div>

        <div class="seq-cell">
          <div class="seq-pin"><code>runX</code> <span class="seq-hyp">hypothetical</span></div>
          <div class="seq-marks">
            <span class="seq-st"><i class="seq-dot seq-dot-ok"></i>succeeded</span>
            <span class="seq-evm"><i class="seq-evbar seq-evbar-hatch"></i>incomplete</span>
          </div>
          <p class="seq-note">Succeeded, yet 10,000 events are missing: anything
            computed over the run is a lower bound.</p>
          <div class="seq-issue">
            <span class="seq-issuelabel">one row in <code>evidence_issues</code></span>
            <code class="seq-issuerow">kind=structure reason=records_dropped count=10,000</code>
            <span class="chip c-v1" title="Committed target with a delivery gate; designed, not built">v1</span>
          </div>
        </div>

        <div class="seq-rowhead">Run failed</div>

        <div class="seq-cell">
          <div class="seq-pin"><code>run3</code></div>
          <div class="seq-marks">
            <span class="seq-st"><i class="seq-dot seq-dot-err"></i>failed</span>
            <span class="seq-evm"><i class="seq-evbar seq-evbar-solid"></i>complete</span>
          </div>
          <p class="seq-note">The failure is fully evidenced: tape dump
            <code>dump2</code>, the retained calls, and the captured error value
            are present, so it can be debugged.</p>
        </div>

        <div class="seq-cell seq-absent">
          <p class="seq-note">no example run: worst case, and both facts are
            still labeled</p>
        </div>
      </div>
      </div>
    </div>

    <aside class="seq-pending">
      <div class="fh">a third case</div>
      <div class="seq-pin"><code>run2</code> <span class="sp sp-run">running</span></div>
      <p class="seq-note">Evidence <em>pending</em>, not incomplete: counters
        are &ldquo;so far&rdquo;, and running data never masquerades as final.
        <span class="chip c-v1" title="Committed target with a delivery gate; designed, not built">v1</span></p>
    </aside>
  </div>

  <figcaption>A run&rsquo;s status answers how the program did; its evidence
    answers how much of what Studio promised is present; neither implies the
    other, and the hypothetical <code>runX</code> shows success with suspect
    numbers. The still-running <code>run2</code> sits outside the grid: its
    evidence is pending, not incomplete <span class="chip c-v1" title="Committed target with a delivery gate; designed, not built">v1</span>.</figcaption>
