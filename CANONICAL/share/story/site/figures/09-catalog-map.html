<figure class="fig fig-09-catalog-map">
  <div class="fh">table-schema v1 &middot; eleven relations, two data patterns</div>

  <div class="fcard cm-anchor">
    <span class="cm-kicker">the anchor</span>
    <h5><code>runs</code> <span class="chip c-v1" title="Committed target with a delivery gate; designed, not built">v1</span></h5>
    <p class="cm-grain">one row per run, never per call; complete: every run has a row</p>
  </div>

  <div class="cm-grid">
    <div class="lp lp-complete cm-bg cm-bg-complete" aria-hidden="true"></div>
    <div class="lp lp-retained cm-bg cm-bg-retained" aria-hidden="true"></div>

    <div class="cm-h cm-h-complete">
      <h4>Complete layer</h4>
      <p class="cm-sub">complete: every call contributes</p>
    </div>
    <div class="cm-h cm-h-retained">
      <h4>Retained layer</h4>
      <p class="cm-sub">exact evidence, selected by policy</p>
    </div>

    <div class="fcard cm-card cm-cc">
      <h5><code>calling_contexts</code></h5>
      <p class="cm-grain">one aggregate: run × calling context</p>
    </div>
    <div class="fcard cm-card cm-rc">
      <h5><code>retained_calls</code></h5>
      <p class="cm-grain">one kept call</p>
    </div>

    <div class="fcard cm-card cm-llm">
      <h5><code>llm_usage</code> <span class="cm-flag">provisional</span> <span class="chip c-open" title="Decision not yet made">open</span></h5>
      <p class="cm-grain">&hellip; × provider × model</p>
    </div>
    <div class="fcard cm-card cm-td">
      <h5><code>tape_dumps</code></h5>
      <p class="cm-grain">one saved tape slice</p>
    </div>

    <div class="fcard cm-card cm-te">
      <h5><code>thread_edges</code> <span class="cm-flag">conditional</span> <span class="chip c-open" title="Decision not yet made">open</span></h5>
      <p class="cm-grain">one spawn edge</p>
    </div>
    <div class="fcard cm-card cm-rt">
      <h5><code>retained_threads</code> <span class="cm-flag">conditional</span> <span class="chip c-open" title="Decision not yet made">open</span></h5>
      <p class="cm-grain">one kept spawned thread</p>
    </div>

    <div class="cm-link cm-link-1" aria-hidden="true"></div>
    <div class="cm-link cm-link-2" aria-hidden="true"></div>
  </div>

  <p class="cm-mirror"><span class="cm-dotline" aria-hidden="true"></span> dotted
    pairs, same two-layer pattern: <code>thread_edges</code>&hairsp;/&hairsp;<code>retained_threads</code>
    repeats <code>calling_contexts</code>&hairsp;/&hairsp;<code>retained_calls</code> for spawns</p>

  <div class="cm-strips">
    <div class="fcard cm-strip">
      <h5>Code identity</h5>
      <p class="cm-grain"><code>revisions</code> &middot; <code>functions</code> &middot;
        <code>call_sites</code>: one compiled program, one function in it,
        one call expression; complete per revision</p>
      <p class="cm-flagline"><code>call_sites</code> producer not built, so it is
        not yet navigable <span class="chip c-open" title="Decision not yet made">open</span></p>
    </div>
    <div class="fcard cm-strip">
      <h5>Evidence health</h5>
      <p class="cm-grain"><code>evidence_issues</code>: one grouped report
        of evidence Studio failed to keep; complete, and empty when healthy</p>
    </div>
  </div>

  <div class="fcard absent cm-cut">
    <h5><span class="cm-cutlabel">cut from v1</span> <s><code>cct_windows</code></s></h5>
    <p class="cm-grain">never existed as a public table: grew with active
      locations × time buckets; mutable open bucket</p>
  </div>

  <figcaption>Table-schema v1 as layer membership and grain: eleven relations, two
    data patterns (complete-layer aggregates every call contributes to,
    retained-layer evidence selected by policy), with the spawn pair
    repeating the calls pair; join keys stay in the relationship diagram above.
    <code>cct_windows</code> was cut from v1 and never existed as a public
    table; table names are rename proposals <span class="chip c-open" title="Decision not yet made">open</span>, and the public relations
    freeze at table-schema v1 <span class="chip c-v1" title="Committed target with a delivery gate; designed, not built">v1</span>.</figcaption>
