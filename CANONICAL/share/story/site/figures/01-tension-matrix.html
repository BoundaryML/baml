<figure class="fig fig-01-tension-matrix">
  <div class="fig-scroll">
    <div class="txm">
      <div class="txm-corner">standard escape</div>
      <div class="txm-h">complete counting</div>
      <div class="txm-h">exact evidence</div>
      <div class="txm-h">bounded cost</div>
      <div class="txm-h txm-q3 txm-q3-top">loss accounting (Q3)<span class="txm-hsub">&ldquo;what is missing?&rdquo;</span></div>

      <div class="txm-rl">one record per call</div>
      <div class="txm-cell"><span class="sp sp-ok"><span class="txm-g" aria-hidden="true">✓</span> kept</span></div>
      <div class="txm-cell"><span class="sp sp-ok"><span class="txm-g" aria-hidden="true">✓</span> kept</span></div>
      <div class="txm-cell"><span class="sp sp-warn"><span class="txm-g" aria-hidden="true">✕</span> cost unbounded</span></div>
      <div class="txm-cell txm-q3"><span class="txm-dash" role="img" aria-label="absent">none</span></div>

      <div class="txm-rl txm-sep">sample (keep ~1%)</div>
      <div class="txm-cell txm-sep"><span class="sp sp-warn"><span class="txm-g" aria-hidden="true">✕</span> completeness gone</span></div>
      <div class="txm-cell txm-sep"><span class="sp sp-ok"><span class="txm-g" aria-hidden="true">✓</span> kept</span></div>
      <div class="txm-cell txm-sep"><span class="sp sp-ok"><span class="txm-g" aria-hidden="true">✓</span> kept</span></div>
      <div class="txm-cell txm-q3"><span class="txm-dash" role="img" aria-label="absent">none</span></div>

      <div class="txm-rl txm-sep">metrics only</div>
      <div class="txm-cell txm-sep"><span class="sp sp-ok"><span class="txm-g" aria-hidden="true">✓</span> kept</span></div>
      <div class="txm-cell txm-sep"><span class="sp sp-warn"><span class="txm-g" aria-hidden="true">✕</span> exact evidence gone</span></div>
      <div class="txm-cell txm-sep"><span class="sp sp-ok"><span class="txm-g" aria-hidden="true">✓</span> kept</span></div>
      <div class="txm-cell txm-q3"><span class="txm-dash" role="img" aria-label="absent">none</span></div>

      <div class="txm-band txm-q3">absent from all three</div>
    </div>
  </div>

  <figcaption>Each standard escape keeps two of the three required properties and gives up the third; loss accounting (question 3) is absent from all three.</figcaption>

      text-transform:uppercase;color:var(--muted);padding:.45rem .55rem .5rem;
      display:flex;flex-direction:column;justify-content:flex-end;line-height:1.4;
      border-bottom:1px solid var(--line)}
