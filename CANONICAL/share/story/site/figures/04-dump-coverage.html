<figure class="fig fig-04-dump-coverage">
  <div class="fh">What a dump covers
    <span class="chip c-built" title="On this branch today; numbers are implementation defaults, not frozen contracts">built</span>
  </div>
  <div class="fig-scroll">
    <div class="dc">

      <div class="dc-lane">
        <div class="dc-head"><code>run1</code><span class="dc-sub">long run</span></div>
        <div class="dc-toprow">
          <span class="dc-open-note">&#9666; earlier activity</span>
          <span class="dc-trig">trigger: <code>call8</code> completes, <span class="dc-num">6.2&nbsp;s</span></span>
        </div>
        <div class="dc-track">
          <div class="dc-bar dc-bar-fade"></div>
          <div class="dc-bracket dc-br1">
            <span class="dc-backarrow" aria-hidden="true"></span>
            <span class="dc-x" aria-hidden="true">&#10005;</span>
            <span class="dc-trigflag" aria-hidden="true"><i class="dc-trighead"></i></span>
          </div>
        </div>
        <div class="dc-under dc-under1">
          <div class="dc-reach">the window reaches back just over six seconds; Bo's provider failure (<code>call6</code> <span class="dc-xs">&#10005;</span>, handled, fired nothing) sits just inside its edge</div>
          <div class="dc-tag"><code>dump1</code> &middot; ~130 events, the <span class="dc-num">6.2&nbsp;s</span> ending at the trigger</div>
        </div>
      </div>

      <div class="dc-lane">
        <div class="dc-head"><code>run3</code><span class="dc-sub">short run</span></div>
        <div class="dc-toprow dc-toprow3">
          <span class="dc-trig dc-trig3">trigger: unhandled error at root (the error <span class="dc-xs">&#10005;</span> is the trigger)</span>
        </div>
        <div class="dc-track">
          <div class="dc-bar dc-bar3"></div>
          <div class="dc-bracket dc-br3">
            <span class="dc-backarrow" aria-hidden="true"></span>
            <span class="dc-x dc-x3" aria-hidden="true">&#10005;</span>
            <span class="dc-trigflag" aria-hidden="true"><i class="dc-trighead"></i></span>
          </div>
        </div>
        <div class="dc-under">
          <div class="dc-tag"><code>dump2</code> &middot; ~40 events, the whole short run</div>
        </div>
      </div>

      <div class="dc-legend">
        <span class="dc-lg"><span class="dc-lg-bracket" aria-hidden="true"></span> saved tape slice (dump)</span>
        <span class="dc-lg"><span class="dc-lg-trig" aria-hidden="true"><i class="dc-trighead"></i></span> trigger: the dump copies the tape at this moment, reaching backwards</span>
        <span class="dc-lg"><span class="dc-xs">&#10005;</span> failure event (fires a dump only when unhandled at the root)</span>
      </div>

    </div>
  </div>
  <figcaption>Coverage of the two dumps from the toy program. A dump reaches backwards from its trigger, never forward: <code>dump1</code>'s window ends at the slow-call trigger, and <code>call6</code>'s handled failure sits inside it only because the window reaches back that far. <code>dump2</code> encloses all of short <code>run3</code> because the run fits in the tape; <code>run1</code>'s earlier activity continues past the left edge, and the drawing claims no total run length.</figcaption>
