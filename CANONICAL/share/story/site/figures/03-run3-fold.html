  <figcaption><code>run3</code>, folded: three context rows for three calls.
  One error propagating through two calls ends both, so <code>errored = 1</code>
  appears in both <code>context1</code> and <code>context3</code>: the counters
  record how calls ended, not how many distinct errors existed. The audit
  thread's <code>cancelled = 1</code> is a different fact than failure, and a
  context row exists only for paths that ran; Eve's run never reached
  the classifier.</figcaption>
