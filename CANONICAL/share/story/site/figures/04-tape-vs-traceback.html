<figure class="fig fig-04-tape-vs-traceback">
  <div class="tvt-panels">

    <section class="tvt-panel tvt-left">
      <div class="tvt-phead">
        <div class="fh">The traceback</div>
        <span class="tvt-badge">t = 0.19 s</span>
      </div>
      <div class="tvt-sub">one stack, one thread, one instant</div>
      <div class="tvt-stack">
        <div class="tvt-frame"><code>validate_email</code><span class="tvt-ftag">the failing call</span></div>
        <div class="tvt-arrow">&darr;</div>
        <div class="tvt-frame"><code>ProcessCustomer</code></div>
        <div class="tvt-arrow">&darr;</div>
        <div class="tvt-frame"><code>map</code></div>
        <div class="tvt-arrow">&darr;</div>
        <div class="tvt-frame"><code>ProcessCustomers</code><span class="tvt-ftag">the root</span></div>
      </div>
      <div class="tvt-empty">no record of anything else</div>
    </section>

    <section class="tvt-panel tvt-right">
      <div class="tvt-phead">
        <div class="fh"><code>dump2</code> &middot; <code>run3</code> <span class="chip c-built" title="On this branch today; numbers are implementation defaults, not frozen contracts">built</span></div>
      </div>
      <div class="tvt-sub">~40 events &middot; shape only</div>
      <div class="fig-scroll">
        <div class="tvt-timeline">
          <div class="tvt-axis">
            <span class="tvt-tick r1 first" style="left:0">0.00&#8202;s</span>
            <span class="tvt-tick r2" style="left:5%">0.01</span>
            <span class="tvt-tick r1" style="left:10%">0.02</span>
            <span class="tvt-tick r2" style="left:95%">0.19</span>
            <span class="tvt-tick r1 last" style="left:100%">0.20&#8202;s</span>
            <div class="tvt-axisline">
              <i class="tvt-tm" style="left:0"></i>
              <i class="tvt-tm" style="left:5%"></i>
              <i class="tvt-tm" style="left:10%"></i>
              <i class="tvt-tm" style="left:95%"></i>
              <i class="tvt-tm" style="left:100%"></i>
            </div>
          </div>
          <div class="tvt-lanes">
            <i class="tvt-grid" style="left:0"></i>
            <i class="tvt-grid" style="left:5%"></i>
            <i class="tvt-grid" style="left:10%"></i>
            <i class="tvt-grid" style="left:95%"></i>
            <i class="tvt-grid" style="left:100%"></i>

            <div class="tvt-lane">
              <div class="tvt-lanelabel"><code>thread1</code></div>
              <div class="tvt-row">
                <div class="tvt-bar cap-err" style="left:0;width:100%"><code>call1</code> &middot; <code>ProcessCustomers</code></div>
                <i class="tvt-trig" style="left:100%"></i>
              </div>
              <div class="tvt-row">
                <div class="tvt-bar cap-err" style="left:10%;width:85%"><code>call3</code> &middot; <code>ProcessCustomer</code><i class="tvt-hatch"></i></div>
              </div>
              <div class="tvt-ann" style="padding-left:10%"><i class="tvt-swatch"></i> pause / resume records elided: ~30 of the ~40 events, including <code>validate_email</code>&rsquo;s work</div>
              <div class="tvt-ann ra" style="padding-right:5%"><code>call3</code> <span class="sp sp-err">errored</span> <span class="tvt-t">0.19&#8202;s</span> &middot; the failure</div>
              <div class="tvt-ann ra"><code>call1</code> <span class="sp sp-err">errored</span> <span class="tvt-t">0.20&#8202;s</span> &middot; root observes it; <i class="tvt-trigmark"></i>trigger fires</div>
            </div>

            <div class="tvt-lane">
              <div class="tvt-lanelabel"><code>thread2</code></div>
              <div class="tvt-ann" style="padding-left:5%"><i class="tvt-dot"></i> thread starts &middot; spawned by <code>call1</code></div>
              <div class="tvt-row">
                <div class="tvt-bar cap-warn" style="left:5%;width:95%"><code>call2</code> &middot; <code>WriteAuditLog</code></div>
              </div>
              <div class="tvt-ann ra"><code>call2</code> <span class="sp sp-warn">cancelled</span> <span class="tvt-t">0.20&#8202;s</span> &middot; teardown, adjacent to the failure</div>
            </div>
          </div>
        </div>
      </div>
      <div class="tvt-note">Event names simplified. About ten of the ~40 events are the call and
      thread records drawn here; the rest are the pause / resume records an awaiting
      thread writes.</div>
    </section>

  </div>
  <figcaption>The traceback for <code>run3</code>&rsquo;s error (the chain of
  frames waiting on the failing call) is complete for its purpose but records
  one stack, on one thread, at one instant. <code>dump2</code>, saved when the error
  reached the root, also preserves the audit thread that was alive beside the failure
  and cancelled at teardown: structural events only, no data bodies.</figcaption>
</figure>
