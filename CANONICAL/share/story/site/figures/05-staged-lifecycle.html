<figure class="fig fig-05-staged-lifecycle">
  <div class="fh">Promote-on-error: lifecycle of one staged draft</div>
  <div class="sl-flow">

    <div class="fcard sl-staged">
      <h5 class="sl-state">staged</h5>
      <p class="sl-main">bounded in-memory buffer</p>
      <p class="sl-sub">no encoding, no hashing, no disk</p>
      <p class="sl-size"><span class="sl-num">32&nbsp;MiB</span> native / <span class="sl-num">8&nbsp;MiB</span> wasm · implementation defaults <span class="chip c-built" title="On this branch today; numbers are implementation defaults, not frozen contracts">built</span></p>
    </div>

    <div class="sl-edge sl-e1">
      <span class="sl-elabel">call succeeds</span>
      <span class="sl-eline" aria-hidden="true"></span>
    </div>
    <div class="fcard sl-out sl-dropped">
      <h5 class="sl-state">dropped</h5>
      <p class="sl-main">free, never encoded</p>
    </div>

    <div class="sl-edge sl-e2">
      <span class="sl-elabel">trigger fires</span>
      <span class="sl-eline" aria-hidden="true"></span>
    </div>
    <div class="fcard sl-out sl-promoted">
      <h5 class="sl-state">promoted</h5>
      <p class="sl-main">durable, tagged with the justifying trigger</p>
      <p class="sl-sub">still the args, return, or error it always was</p>
    </div>

    <div class="sl-edge sl-e3">
      <span class="sl-elabel">buffer fills</span>
      <span class="sl-eline" aria-hidden="true"></span>
    </div>
    <div class="fcard sl-out sl-evicted">
      <h5 class="sl-state">evicted</h5>
      <p class="sl-main">counted: <code>staging_evicted</code></p>
    </div>

  </div>

  <div class="sl-banner">
    The staging buffer, promotion machinery, and eviction counter exist on the
    branch, and a failure at the run's root calls promotion
    <span class="chip c-built" title="On this branch today; numbers are implementation defaults, not frozen contracts">built</span>,
    but no production code path stages helper drafts today; the delivery plan
    requires wiring helper staging or removing the promise
    <span class="chip c-open" title="Decision not yet made">open</span>
  </div>

  <figcaption>Every staged draft ends in exactly one of three terminal
  states; full capture cost is paid only for failures that proved they
  mattered.</figcaption>

  <style>
    .fig-05-staged-lifecycle .sl-flow{
      display:grid;
      grid-template-columns:minmax(0,1.1fr) minmax(6rem,.7fr) minmax(0,1.5fr);
      grid-template-rows:auto auto auto;
      column-gap:0;row-gap:.7rem;align-items:stretch;margin-top:.2rem}
    .fig-05-staged-lifecycle .sl-staged{
      grid-column:1;grid-row:1 / 4;align-self:center}
    .fig-05-staged-lifecycle .sl-e1{grid-column:2;grid-row:1}
    .fig-05-staged-lifecycle .sl-e2{grid-column:2;grid-row:2}
    .fig-05-staged-lifecycle .sl-e3{grid-column:2;grid-row:3}
    .fig-05-staged-lifecycle .sl-out{grid-column:3}
    .fig-05-staged-lifecycle .sl-dropped{grid-row:1}
    .fig-05-staged-lifecycle .sl-promoted{grid-row:2}
    .fig-05-staged-lifecycle .sl-evicted{grid-row:3}

    .fig-05-staged-lifecycle .sl-state{
      margin:0 0 .25rem;font-size:.72rem;font-weight:700;
      letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}
    .fig-05-staged-lifecycle .sl-main{margin:0;font-size:.8rem;color:var(--ink)}
    .fig-05-staged-lifecycle .sl-sub{margin:.2rem 0 0;font-size:.7rem;color:var(--muted)}
    .fig-05-staged-lifecycle .sl-size{
      margin:.5rem 0 0;font-size:.7rem;color:var(--muted);
      border-top:1px solid var(--line);padding-top:.45rem}
    .fig-05-staged-lifecycle .sl-num{font-variant-numeric:tabular-nums}

    .fig-05-staged-lifecycle .sl-edge{
      display:flex;flex-direction:column;justify-content:center;
      align-items:center;gap:.25rem;padding:0 .35rem;min-width:0}
    .fig-05-staged-lifecycle .sl-elabel{
      font-size:.68rem;color:var(--muted);text-align:center;line-height:1.3}
    .fig-05-staged-lifecycle .sl-eline{
      position:relative;display:block;width:100%;height:0;
      border-top:1px solid var(--muted)}
    .fig-05-staged-lifecycle .sl-eline::after{
      content:"";position:absolute;right:0;top:-4.5px;
      border-left:6px solid var(--muted);
      border-top:4px solid transparent;border-bottom:4px solid transparent}

    .fig-05-staged-lifecycle .sl-dropped{border-color:var(--line)}
    .fig-05-staged-lifecycle .sl-dropped .sl-state{color:var(--muted)}
    .fig-05-staged-lifecycle .sl-dropped .sl-main{color:var(--muted)}

    .fig-05-staged-lifecycle .sl-promoted{
      background:var(--teal-soft);
      border-color:color-mix(in srgb,var(--teal) 35%,transparent)}

    .fig-05-staged-lifecycle .sl-evicted{
      background:color-mix(in srgb,var(--fig-warn) 10%,transparent);
      border-color:color-mix(in srgb,var(--fig-warn) 40%,transparent)}

    .fig-05-staged-lifecycle .sl-banner{
      margin-top:.9rem;padding:.55rem .8rem;font-size:.74rem;
      line-height:1.5;color:var(--ink);border-radius:8px;
      background:var(--ochre-soft);
      border:1px solid color-mix(in srgb,var(--ochre) 35%,transparent)}

    @media (max-width:860px){
      .fig-05-staged-lifecycle .sl-flow{display:flex;flex-direction:column;gap:.55rem}
      .fig-05-staged-lifecycle .sl-edge{
        flex-direction:row;justify-content:flex-start;gap:.5rem;
        padding:0 0 0 .9rem}
      .fig-05-staged-lifecycle .sl-elabel::after{content:" ↓"}
      .fig-05-staged-lifecycle .sl-eline{display:none}
    }
  </style>
</figure>
