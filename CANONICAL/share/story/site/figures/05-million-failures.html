<figure class="fig fig-05-million-failures">
  <div class="fh">One incident, three bounded destinations</div>
  <div class="mf-grid">

    <div class="mf-src">
      <div class="mf-count">1,000,000</div>
      <div class="mf-what"><code>ClassifyCustomer</code> calls <span class="sp sp-err">failed</span></div>
      <div class="mf-why">provider outage</div>
    </div>

    <div class="mf-arrow mf-a1" aria-hidden="true"></div>
    <div class="fcard mf-dest">
      <h5><span class="mf-k">Aggregates</span> &middot; everything, cheaply <span class="chip c-built" title="On this branch today; numbers are implementation defaults, not frozen contracts">built</span></h5>
      <p>All million failures increment counters on the same few
      <code>calling_contexts</code> rows. Counting is never sampled or turned
      off: a million failures cost the same rows as three.</p>
    </div>

    <div class="mf-arrow" aria-hidden="true"></div>
    <div class="fcard mf-dest">
      <h5><span class="mf-k">Tape dumps</span> &middot; a bounded few <span class="chip c-built" title="On this branch today; numbers are implementation defaults, not frozen contracts">built</span></h5>
      <p>Error triggers are rate-limited: at least five seconds between
      dumps, at most sixteen per engine (implementation defaults).
      Dumps suppressed by the limit are counted.</p>
    </div>

    <div class="mf-arrow" aria-hidden="true"></div>
    <div class="fcard mf-dest">
      <h5><span class="mf-k">Values</span> &middot; by policy, deduplicated <span class="chip c-built" title="On this branch today; numbers are implementation defaults, not frozen contracts">built</span></h5>
      <p>Each failing LLM call&rsquo;s error is captured per the policy matrix and
      stored by content: many small capture rows, <strong>one</strong> stored
      body per distinct content. The rows scale with the failures; only the
      body is shared: a million copies of the same provider error are
      one stored body.</p>
      <p class="mf-foot">Staged helper values, once wired, are bounded by the
      staging buffer, with evictions counted
      (<code>staging_evicted</code>) <span class="chip c-open" title="Decision not yet made">open</span></p>
    </div>

  </div>
  <figcaption>A provider outage fans one million failed
  <code>ClassifyCustomer</code> calls into three bounded destinations: counter
  increments on the same few <code>calling_contexts</code> rows, a
  rate-limited handful of tape dumps, and per-policy error values whose
  identical bodies are stored once. Every bound is explicit and gets a counter
  by design rule, and a hit limit is queryable (doc 06).</figcaption>
