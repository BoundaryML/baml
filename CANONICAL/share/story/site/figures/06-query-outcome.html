<figure class="fig fig-06-query-outcome">
  <div class="qo-flow">

    <section class="qo-panel">
      <div class="fh">rows the query touches</div>
      <p class="qo-sub">retained <code>ClassifyCustomer</code> calls with
        <code>status&nbsp;=&nbsp;'succeeded'</code>; window widened to include <code>runX</code></p>
      <div class="qo-calls">
        <div class="fcard qo-call">
          <h5><code>call8</code> <span class="qo-src">healthy runs</span></h5>
          <div class="qo-ret"><span class="qo-k">return</span> <code>Approve</code> <span class="sp sp-ok">available</span></div>
        </div>
        <div class="fcard qo-call">
          <h5>retained call <span class="qo-src"><code>runX</code></span></h5>
          <div class="qo-ret"><span class="qo-k">return</span> <span class="sp sp-ok">available</span></div>
        </div>
        <div class="fcard qo-call qo-lost">
          <h5>retained call <span class="qo-src"><code>runX</code></span></h5>
          <div class="qo-ret"><span class="qo-k">return</span> <span class="qo-unknown">unknown: lost</span></div>
          <div class="qo-note">promised return lost in the overload</div>
        </div>
      </div>
    </section>

    <div class="qo-arrow"><span class="qo-glyph"></span><span class="arrow-label">evaluate<br>"return"</span></div>

    <section class="qo-panel">
      <div class="fh">evaluating the lost value</div>
      <div class="qo-path qo-no">
        <div class="qo-ph"><s>SQL <code>NULL</code></s> <span class="sp sp-err">never</span></div>
        <div class="qo-pb"><s>silent non-match: count comes back one short, no warning</s></div>
      </div>
      <div class="qo-path qo-yes">
        <div class="qo-ph">typed unknown <span class="chip c-v1" title="Committed target with a delivery gate; designed, not built">v1</span></div>
        <div class="qo-pb">a marked non-answer carrying its reason (<code>lost</code>),
          settled decision D12. Excluded from the count, declared in the outcome.</div>
      </div>
      <div class="qo-note">a captured BAML <code>null</code> is ordinary data, never confused with a typed unknown</div>
    </section>

    <div class="qo-arrow"><span class="qo-glyph"></span><span class="arrow-label">reconcile</span></div>

    <section class="qo-panel">
      <div class="fh">the query outcome <span class="chip c-v1" title="Committed target with a delivery gate; designed, not built">v1</span></div>
      <p class="qo-sub">exactly one per query, delivered alongside the rows (settled decision D13)</p>
      <div class="qo-inflow">
        <div class="qo-in"><span class="qo-in-n">2</span> available returns → evaluated against <code>'Approve'</code></div>
        <div class="qo-in"><span class="qo-in-n">1</span> <span class="qo-unknown">unknown: lost</span> → not counted, declared below</div>
      </div>
      <div class="qo-card">
        <div class="qo-row"><span class="qo-fk">resultState</span><span class="sp sp-warn">incomplete</span></div>
        <div class="qo-grp">valueEvaluations</div>
        <div class="qo-row qo-ind"><span class="qo-fk">attempted</span><span class="qo-fv">3</span></div>
        <div class="qo-row qo-ind"><span class="qo-fk">available</span><span class="qo-fv">2</span></div>
        <div class="qo-row qo-ind"><span class="qo-fk">unavailable</span><span class="qo-fv">1</span></div>
        <div class="qo-row qo-ind"><span class="qo-fk">byReason</span><span class="qo-fv">{ lost: 1 }</span></div>
        <div class="qo-cardnote">field names and wire shape illustrative <span class="chip c-open" title="Decision not yet made">open</span></div>
      </div>
      <p class="qo-result">the rows' <code>approvals</code> count reads as a <strong>labeled lower bound</strong>, not a silent undercount</p>
    </section>

  </div>
  <figcaption>Widened to include <code>runX</code>, the approvals query touches three
    retained calls, and one promised return value was lost. The lost value evaluates
    to a typed unknown rather than SQL <code>NULL</code>, and the query outcome
    reconciles the totals: the count is a labeled lower bound, not a silent
    undercount; outcome field names and wire shape are illustrative.</figcaption>
