<figure class="fig fig-01-wager-layers">
  <div class="fh">count everything, keep the interesting ones</div>
  <div class="wl-panels">
    <div class="lp lp-complete">
      <h4>Layer 1: the complete layer</h4>
      <p class="wl-desc">cheap, bounded summaries of <strong>every call</strong>: always on, no sampling</p>
      <p class="wl-q"><span class="wl-qtag">Q1</span> what happened across every call? <span class="wl-doc">&rarr; doc&nbsp;03</span></p>
    </div>
    <div class="lp lp-retained">
      <h4>Layer 2: the retained layer</h4>
      <p class="wl-desc">exact evidence (real events and values) for the <strong>interesting few</strong>, selected by explicit policy, not by chance</p>
      <p class="wl-q"><span class="wl-qtag">Q2</span> which exact call, with what context? <span class="wl-doc">&rarr; docs&nbsp;04&ndash;05</span></p>
    </div>
  </div>
  <div class="wl-band">
    <span class="wl-qtag">Q3</span> what is missing? when the machinery itself drops
    something, the loss is recorded and queryable
    <span class="wl-doc">&rarr; doc&nbsp;06</span>
  </div>
  <div class="wl-footer">
    <div class="wl-foot-item">
      <span class="wl-qtag">Q4</span> which code produced it? the exact compiled
      version, known to the runtime
      <span class="chip c-built" title="On this branch today; numbers are implementation defaults, not frozen contracts">built</span>
      <span class="wl-doc">&rarr; doc&nbsp;07</span>
    </div>
    <div class="wl-foot-item">
      query it all: <code>baml query</code>, plain SQL
      <span class="chip c-v1" title="Committed target with a delivery gate; designed, not built">v1</span>
    </div>
  </div>
  <figcaption>The two layers and where each of the four questions is
  answered: complete summaries for counting (doc 03), evidence selected by
  policy (docs 04&ndash;05), loss declared by the machinery itself (doc 06),
  and compiled identity (doc 07). <code>baml query</code> is the committed
  v1 target, not on the branch today.</figcaption>
