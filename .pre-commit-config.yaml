# Prek/pre-commit configuration
# Install: prek install (or: pre-commit install)
# Run manually: prek run --all-files

fail_fast: false

exclude: |
  (?x)^(
    crates/.*/snapshots/.*|
    baml_language/.*\.pyi
  )$

repos:
  # Fast built-in hooks (no network, no environment setup)
  - repo: builtin
    hooks:
      - id: no-commit-to-branch
        args: [-b, canary]
        always_run: true
        fail_fast: true

      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        fail_fast: true
        files: ^baml_language/
        # Exclude: snapshots, IDE test files, and special test files (class.rs, enum.rs)
        exclude: (baml_tests/projects/|lsp_actions_tests/test_files/|lsp2_actions_tests/test_files/|\.snap$|class\.rs$|enum\.rs$)

      - id: check-merge-conflict
        fail_fast: true

      - id: check-toml
        fail_fast: true

      - id: check-yaml
        args: [--allow-multiple-documents]
        fail_fast: true

  - repo: local
    hooks:
      # Priority ordering:
      # 1: Formatters and validators (fmt, stow) - format/validate generated code
      # 2: Linters (clippy) - final checks on formatted code

      - id: grammar-single-source
        name: tmLanguage grammar single-source check
        entry: bash -c 'node typescript2/pkg-grammar/scripts/sync.mjs --check'
        language: system
        pass_filenames: false
        files: ^typescript2/(pkg-grammar/(.*\.tmLanguage\.json|language-configuration\.json)|app-vscode-ext/(syntaxes/.*\.tmLanguage\.json|language-configuration\.json))$
        priority: 0

      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cd baml_language && mise run fmt'
        language: system
        pass_filenames: false
        types: [rust]
        files: ^baml_language/
        priority: 2

      - id: clang-format-cpp
        name: clang-format (C++ SDK)
        entry: bash -c 'cd baml_language && mise run fmt-cpp'
        language: system
        pass_filenames: false
        files: ^baml_language/(sdks/cpp/|sdk_tests/crates/cpp/).*\.(h|cc)$
        priority: 2

      - id: baml-fmt-stdlib
        name: baml fmt (stdlib)
        entry: bash -c 'cd baml_language && mise run fmt-stdlib'
        language: system
        pass_filenames: false
        files: ^baml_language/crates/baml_builtins2/baml_std/.*\.baml$
        priority: 2

      - id: baml-fmt-type-quiz
        name: baml fmt (type quiz)
        entry: bash -c 'cd baml_language && mise run fmt-type-quiz'
        language: system
        pass_filenames: false
        files: ^baml_language/tools/type_quiz/.*\.baml$
        priority: 2

      - id: cargo-stow
        name: cargo stow
        entry: bash -c 'cd baml_language && mise run stow'
        language: system
        pass_filenames: false
        files: ^baml_language/(Cargo\.toml|stow\.toml|crates/.*/Cargo\.toml|crates/tools_stow/)
        priority: 2

      - id: validate-markdown
        name: validate markdown files
        entry: bash -c 'cd baml_language && mise run validate-markdown'
        language: system
        pass_filenames: false
        files: ^baml_language/(.*\.md|\.markdown-whitelist)$
        priority: 0

      # `latest`/`stable`/`nightly` resolve to whatever upstream shipped last, so a
      # workflow can break with no change here (node-version: latest once picked a
      # Node alpha whose npm changed `npm pack --json`). Pin exact versions; a line
      # that must float can end with `# float-ok: <reason>`.
      # `latest`/`stable`/`nightly` resolve to whatever upstream shipped last, so a
      # workflow can break with no change here. Pin exact versions; a line that
      # must float can end with `# float-ok: <reason>`.
      - id: no-floating-versions
        name: no floating tool versions in workflows
        language: pygrep
        files: ^\.github/.*\.ya?ml$
        entry: |-
          (?ix)
          ^(?!.*\#[ \t]*float-ok:[ \t]*\S)[^\#]*?
          (?:
            # node-version: latest, toolchain: stable, NODE_VERSION: lts/*, input default: stable
            (?:^[ \t]*(?:-[ \t]+)?(?:[\w-]*(?:version|toolchain)|rubygems|default)[ \t]*:[ \t]*
              ['"]?(?:latest|stable|beta|nightly|current|lts/[^\s'"]*)['"]?[ \t]*(?:\#.*)?$)
            | dtolnay/rust-toolchain@(?:stable|beta|nightly)\b
            | @latest\b
            | \b(?:cargo|rustc)[ \t]+\+(?:stable|beta|nightly)\b(?!-\d)
            | \brustup[ \t]+(?:toolchain[ \t]+install|install|default|override[ \t]+set)[ \t]+(?:stable|beta|nightly)\b(?!-\d)
          )
        priority: 0

      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cd baml_language && mise run clippy'
        language: system
        pass_filenames: false
        types: [rust]
        files: ^baml_language/
        priority: 3

      - id: cargo-clippy-wasm
        name: cargo clippy (wasm)
        entry: bash -c 'cd baml_language && mise run clippy-wasm'
        language: system
        pass_filenames: false
        types: [rust]
        files: ^baml_language/
        priority: 4
        stages: [manual]

      # Temporarily disabled while the Hawk check is paused in CI.
