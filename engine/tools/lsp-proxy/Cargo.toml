[package]
name = "lsp-proxy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lsp-proxy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lsp-server = "0.7"
lsp-types = "0.95"
crossbeam-channel = "0.5"
chrono = { version = "0.4", features = ["serde"] }

# Local dependencies for recording functionality
language-server = { path = "../../language_server" }