[package]
edition = "2021"
name = "baml-cli"
version.workspace = true
authors.workspace = true
description.workspace = true
license-file.workspace = true

[package.metadata.rustflags]
RSTEST_TIMEOUT = "10"

[build-dependencies]
anyhow.workspace = true

[lints.rust]
dead_code = "deny"
elided_named_lifetimes = "deny"
unused_imports = "deny"
unused_variables = "deny"

[dependencies]
anyhow.workspace = true
baml-runtime = { path = "../baml-runtime", default-features = false, features = ["internal"] }
language-server = { path = "../language_server", default-features = false, optional = true }
baml-types.workspace = true
baml-log.workspace = true
clap = { workspace = true, features = ["color", "env"] }
clap-cargo = "0.12"
ctrlc = "3.4"
internal-baml-core.workspace = true
log.workspace = true
tokio = { version = "1", default-features = false, features = [
  "macros",
  "time",
] }

# Boundary Cloud (auth/login/deploy) dependencies, behind the `cloud` feature.
axum = { workspace = true, optional = true }
baml-http = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bstd = { workspace = true, optional = true }
console = { version = "0.15.0", optional = true }
derive_more = { workspace = true, optional = true }
dialoguer = { version = "0.11.0", optional = true }
etcetera = { version = "0.8.0", optional = true }
futures = { workspace = true, optional = true }
generators-lib = { path = "../generators/utils/generators_lib", optional = true }
indexmap = { workspace = true, optional = true }
indicatif = { version = "0.17.8", optional = true }
open = { version = "5.3.0", optional = true }
pathdiff = { version = "0.1.0", optional = true }
rand = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.10.8", optional = true }
similar = { version = "2.6.0", features = ["inline"], optional = true }
web-time = { workspace = true, optional = true }

[features]
default = [
  "bedrock",
  "lsp",
  "serve",
  "dev",
  "repl",
  "cloud",
  "vertex",
  "optimize",
  "tui",  "studio",
]
# AWS Bedrock provider support, forwarded through the runtime stack. On by
# default; a parent (e.g. baml-python-ffi) that sets default-features = false on
# this crate drops the aws-* dependency tree.
# NOTE: language-server is a weak ("?") dep here so enabling bedrock does not
# force the LSP (and its ~87-crate tree) back in when lsp is disabled.
bedrock = ["baml-runtime/bedrock", "language-server?/bedrock"]
# Language server (LSP) subcommand. On by default for the standalone `baml`
# binary; a parent that sets default-features = false (e.g. baml-python-ffi)
# drops the entire language-server dependency tree (tonic/prost, a second axum,
# lsp-server/lsp-types, tokio-tungstenite, schemars, tar, ...).
lsp = ["dep:language-server"]
# `baml serve` / `baml dev` (axum HTTP server + file watching, via the runtime).
serve = ["baml-runtime/serve"]
dev = ["baml-runtime/dev", "serve"]
# `baml repl`.
repl = ["baml-runtime/repl"]
# `baml optimize` (GEPA; TUI-driven).
optimize = ["baml-runtime/optimize"]
# Boundary Studio tracing publisher in the runtime.
studio = ["baml-runtime/studio"]
# Interactive terminal UIs (ratatui/crossterm) in the runtime.
tui = ["baml-runtime/tui"]
# Vertex AI provider auth (gcp_auth), forwarded to the runtime.
vertex = ["baml-runtime/vertex"]
# Boundary Cloud commands: `baml auth`, `baml login`, `baml deploy`.
cloud = [
  "dep:axum",
  "dep:baml-http",
  "dep:base64",
  "dep:bstd",
  "dep:console",
  "dep:derive_more",
  "dep:dialoguer",
  "dep:etcetera",
  "dep:futures",
  "dep:generators-lib",
  "dep:indexmap",
  "dep:indicatif",
  "dep:open",
  "dep:pathdiff",
  "dep:rand",
  "dep:serde",
  "dep:serde_json",
  "dep:sha2",
  "dep:similar",
  "dep:web-time",
]
defaults = []
internal = []
skip-integ-tests = []
# Kept as a no-op alias: the HTTP stack (baml-http) statically links its
# crypto (rustls + ring), so there is no system OpenSSL to opt into anymore.
static-ssl = []
# Statically vendor OpenSSL (forwarded to the runtime).
native-tls-vendored = ["baml-runtime/native-tls-vendored"]

[dev-dependencies]
assert_cmd = "2"
console_log = "1"
dissimilar = "1.0.4"
expect-test = "1.1.0"
indoc.workspace = true
either = "1.8.1"
rstest = "0.22.0"
wasm-bindgen-test = "0.3.42"
walkdir = "2.5.0"
wasm-logger = "0.2.0"
