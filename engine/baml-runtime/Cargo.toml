[package]
edition = "2021"
name = "baml-runtime"
version.workspace = true
authors.workspace = true
description.workspace = true
license-file.workspace = true

[package.metadata.rustflags]
RSTEST_TIMEOUT = "10"

[build-dependencies]
anyhow.workspace = true

[lints.rust]
dead_code = "allow"
elided_named_lifetimes = "deny"
unused_imports = "allow"
unused_variables = "allow"

[lints.clippy]
module_inception = "allow"
result_large_err = "allow"
large_enum_variant = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
arc_with_non_send_sync = "allow"

[dependencies]
anyhow.workspace = true
baml-compiler = { path = "../baml-compiler" }
baml-http = { workspace = true }
baml-ids.workspace = true
internal-baml-ast = { path = "../baml-lib/ast" }
internal-baml-diagnostics = { path = "../baml-lib/diagnostics" }
baml-log.workspace = true
baml-viz-events = { path = "../baml-viz-events" }
baml-types.workspace = true
baml-rpc = { workspace = true, optional = true }
baml-vm = { path = "../baml-vm" }
base64.workspace = true
bytes.workspace = true
cfg-if.workspace = true
clap.workspace = true
colored.workspace = true
dashmap.workspace = true
derive-new.workspace = true
derive_more.workspace = true
dunce = "1.0.4"
either.workspace = true
env_logger.workspace = true
futures.workspace = true
http.workspace = true
http-body.workspace = true
indexmap.workspace = true
indoc.workspace = true
# instant = "0.1"  # do not use this or wasm-timer - use web-time instead
json_comments = "0.2.2"
jsonish.workspace = true
generators-lib = { path = "../generators/utils/generators_lib" }
generators-openapi = { path = "../generators/languages/openapi" }
internal-llm-client.workspace = true
internal-baml-core.workspace = true
internal-baml-jinja.workspace = true
log.workspace = true
minijinja.workspace = true
pin-project-lite.workspace = true
pretty.workspace = true
percent-encoding = "2.3.1"
regex.workspace = true
scopeguard.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
strsim.workspace = true
strum.workspace = true
strum_macros.workspace = true
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = [
  "macros",
  "time",
] }
tokio-stream = "0.1.15"
# NOTE(sam): adding this caused a build error, I suspect because tower uses nightly features or something
# tower = "0.5.0"
uuid.workspace = true
web-time.workspace = true
static_assertions.workspace = true
mime_guess = "=2.0.5"
mime = "0.3.17"

# For tracing
chrono = "0.4.38"
tokio-util = { version = "0.7", features = ["rt"] }
fastrand = "2.1.0"
infer = "0.16.0"
url = "2.5.2"
shell-escape = "0.1.5"
aws-sigv4 = { version = "1.2.2", optional = true }
aws-credential-types = { version = "1.2.1", optional = true }
aws-runtime = { version = "1.5.5", optional = true }
aws-smithy-async = { version = "1.2.1", optional = true }
aws-smithy-runtime-api = { version = "1.7.0", optional = true }
aws-smithy-types = { version = "1.2.0", optional = true }
aws-smithy-runtime = { version = "1.6.0", optional = true }
enum_dispatch = "0.3.13"
aws-smithy-json = { version = "0.60.7", optional = true }
valuable = { version = "0.1.0", features = ["derive"] }
tracing = { version = "0.1.40", features = ["valuable"] }
tracing-log = "0.2.0"
tracing-core = { version = "0.1.31" }
tracing-subscriber = { version = "0.3.18", features = [
  "json",
  "env-filter",
  "valuable",
] }
log-once = "0.4.1"
once_cell.workspace = true
time.workspace = true
tempfile = "3.19.0"
blake3 = { version = "1.8.2", optional = true }
flate2 = { version = "1.1.5", optional = true }
similar = "2.6"


[target.'cfg(target_arch = "wasm32")'.dependencies]
aws-config = { version = "=1.5.3", default-features = false, optional = true, features = [] }
# You will run into some crypto/install issues with vertex tests if you move further than this due to https://github.com/awslabs/aws-sdk-rust/releases/tag/release-2025-03-11 . The new version uses aws_lc_rs instead of ring.
# but depending on ring and aws_lc_rs leads to issues.
# https://github.com/rustls/rustls/issues/1877
# https://github.com/awslabs/aws-sdk-rust/issues/1263
# same goes for aws-config.
# Potential migration https://docs.aws.amazon.com/sdk-for-rust/latest/dg/http.html#tlsProviders
aws-sdk-bedrockruntime = { version = "=1.106.0", default-features = false, optional = true, features = [
] }
colored = { version = "2.1.0", default-features = false, features = [
  "no-color",
] }
futures-timer = { version = "3.0.3", features = ["wasm-bindgen"] }
js-sys.workspace = true
send_wrapper = { version = "0.6.0", features = ["futures"] }
serde-wasm-bindgen = "0.6.5"
uuid = { workspace = true, features = ["v4", "serde", "js"] }
# WARNING: Do not add serde-serialize feature to wasm-bindgen.
# It may produce a dependency cycle in projects that use wasm and import baml.
wasm-bindgen = "^0.2.74"
wasm-bindgen-futures = "0.4"
web-sys.workspace = true
wasmtimer = "0.4.3"
tokio = { version = "1", features = ["rt", "sync"] }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aws-config = { version = "=1.5.3", optional = true }
# You will run into some crypto/install issues with vertex tests if you move further than this due to https://github.com/awslabs/aws-sdk-rust/releases/tag/release-2025-03-11 . The new version uses aws_lc_rs instead of ring.
# but depending on ring and aws_lc_rs leads to issues.
# https://github.com/rustls/rustls/issues/1877
# https://github.com/awslabs/aws-sdk-rust/issues/1263
# same goes for aws-config.
# Potential migration https://docs.aws.amazon.com/sdk-for-rust/latest/dg/http.html#tlsProviders
aws-sdk-bedrockruntime = { version = "=1.106.0", default-features = false, optional = true, features = [
] }
axum = { version = "0.7.5", optional = true }
axum-extra = { version = "0.9.3", features = [
  "erased-json",
  "typed-header",
], optional = true }
# Vendored, ring-free fork (native-tls + rsa crate). See vendored/gcp-auth.
gcp_auth = { path = "../vendored/gcp-auth", optional = true }
hostname = "0.3.1"
http-body-util = "0.1"
notify-debouncer-full = { version = "0.3.1", optional = true }
tokio = { version = "1", features = ["full"] }
walkdir = "2.5.0"
which = "7"
indicatif = "0.17"
junit-report = "0.8.3"
ratatui = { version = "0.29", optional = true }
unicode-width = { version = "0.1", optional = true }
dirs = { version = "5.0", optional = true }
supports-color = { version = "3", optional = true }
crossterm = { version = "0.28", optional = true }


[features]
default = [
  "bedrock",
  "serve",
  "dev",
  "repl",
  "vertex",
  "optimize",
  "tui",
  "studio",
]
defaults = ["skip-integ-tests"]
# Statically vendor OpenSSL for the native-tls backend (portable Linux builds
# with no system libssl). Forwarded from baml-http.
native-tls-vendored = ["baml-http/native-tls-vendored"]
internal = []
skip-integ-tests = []
# `baml serve`: the local OpenAPI HTTP server. Off in minimal/vendored builds to
# drop the axum/tower web-server tree.
serve = ["dep:axum", "dep:axum-extra"]
# `baml dev`: serve + file-watching (notify).
dev = ["serve", "dep:notify-debouncer-full"]
# Interactive terminal UIs (ratatui + crossterm). Without it, `baml init`
# falls back to its plain-text output.
tui = ["dep:ratatui", "dep:crossterm"]
# `baml optimize` (GEPA prompt optimizer; TUI-driven).
optimize = ["tui"]
# Boundary Studio tracing publisher (trace/blob upload, RPC event conversion).
# Off in vendored builds: drops baml-rpc (ts-rs, serde_with) and blake3.
studio = [
  "dep:baml-rpc",
  "dep:blake3",
  "dep:flate2",
  "internal-baml-core/ir-hasher",
]
# `baml repl`: interactive REPL.
repl = ["dep:dirs", "dep:supports-color", "dep:unicode-width", "tui"]
# Vertex AI (Google Cloud) provider auth. Off to drop the gcp_auth tree if the
# vertex-ai provider is not used.
vertex = ["dep:gcp_auth"]
# Use the THIR interpreter runtime instead of the VM bytecode runtime
thir-interpreter = []
# AWS Bedrock provider support. On by default; disable (e.g. --no-default-features)
# to build without the aws-* SDK dependency tree.
bedrock = [
  "dep:aws-config",
  "dep:aws-sdk-bedrockruntime",
  "dep:aws-sigv4",
  "dep:aws-credential-types",
  "dep:aws-runtime",
  "dep:aws-smithy-async",
  "dep:aws-smithy-runtime-api",
  "dep:aws-smithy-types",
  "dep:aws-smithy-runtime",
  "dep:aws-smithy-json",
]


[dev-dependencies]
assert_cmd = "2"
console_log = "1"
criterion = "0.5.1"
# Tests use reqwest directly; production code goes through baml-http.
reqwest.workspace = true
pretty_assertions = "1.4.0"
test-log = "0.2.16"
dissimilar = "1.0.4"
expect-test = "1.1.0"
indoc.workspace = true
either = "1.8.1"
rstest = "0.22.0"
wasm-bindgen-test = "0.3.42"
walkdir = "2.5.0"
wasm-logger = "0.2.0"
serial_test = "3.2.0"
console_error_panic_hook = "0.1.7"
insta = { version = "1.43.2", features = ["yaml", "glob"] }
