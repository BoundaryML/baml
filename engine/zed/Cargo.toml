[package]
name = "zed_baml"
edition = "2024"
version = "0.0.1"
description = "BAML language support for Zed"

[lints.rust]
dead_code = "deny"
mismatched_lifetime_syntaxes = "deny"
unused_imports = "deny"
unused_variables = "deny"

[lib]
crate-type = ["cdylib"]

[features]
# This enables the debug mode by default
# default = ["debug"]
# Use this for releases
default = []
debug = []

[dependencies]
zed_extension_api = "0.1.0"

[workspace]
# Empty workspace table to make this package standalone
