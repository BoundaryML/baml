[workspace]
members = [
    "baml-lib/*",
    "baml-lsp-types",
    "baml-router",
    "baml-rpc",
    "baml-runtime",
    "baml-schema-wasm",
    "bstd",
    "cli",
    "language_client_cffi",
    "language_client_codegen",
    "language_client_python",
    "language_client_ruby/ext/ruby_ffi",
    "language_client_typescript",
    "language_server",
    "sandbox",
]
default-members = [
    "baml-lsp-types",
    "baml-lib/*",
    "baml-rpc",
    "baml-runtime",
    "bstd",
    "cli",
    "language_client_cffi",
    "language_client_codegen",
    "language_client_python",
    "language_client_ruby/ext/ruby_ffi",
    "language_client_typescript",
    "language_server",
]
resolver = "2"

[workspace.metadata.workspaces]
allow_branch = "canary"

[workspace.package]
version = "0.88.0"
authors = ["Boundary <contact@boundaryml.com>"]
description = "BAML Toolchain"
license-file = "LICENSE"

[workspace.dependencies]
anyhow = "1.0"
askama = "0.12.1"
base64 = "0.22.1"
bytes = "1.6.0"
cfg-if = "1.0.0"
dashmap = "5.5.3"
derive-new = "0.7"
derive_builder = "0.20.0"
either = "1.8.1"
env_logger = "0.11.3"
http = "1.1.0"
http-body = "1.0.0"
indoc = "2.0.5"
log = "0.4.20"
once_cell = "1"
pin-project-lite = "0.2.14"
pretty_assertions = "1.4.1"
rand = "0.8.5"
regex = "1.10.4"
scopeguard = "1.2.0"
serde_yaml = "0.9.34"
static_assertions = "1.1.0"
strum_macros = "0.26.2"
thiserror = "2.0.12"
url = "2.5.2"
walkdir = "2.5.0"
web-time = "1.1.0"

[workspace.dependencies.baml-cli]
path = "cli"

[workspace.dependencies.baml-log]
path = "baml-lib/baml-log"

[workspace.dependencies.baml-lsp-types]
path = "baml-lsp-types"

[workspace.dependencies.baml-types]
path = "baml-lib/baml-types"

[workspace.dependencies.bstd]
path = "bstd"

[workspace.dependencies.clap]
version = "4.4.6"
features = [
    "cargo",
    "derive",
]

[workspace.dependencies.derive_more]
version = "0.99.18"
features = ["constructor"]

[workspace.dependencies.futures]
version = "0.3.30"
features = ["executor"]

[workspace.dependencies.indexmap]
version = "2.1.0"
features = ["serde"]

[workspace.dependencies.internal-baml-codegen]
path = "language_client_codegen"

[workspace.dependencies.internal-baml-core]
path = "baml-lib/baml-core"

[workspace.dependencies.internal-baml-jinja]
path = "baml-lib/jinja-runtime"

[workspace.dependencies.internal-llm-client]
path = "baml-lib/llm-client"

[workspace.dependencies.jsonish]
path = "baml-lib/jsonish"

[workspace.dependencies.lsp-server]
version = "0.7.6"

[workspace.dependencies.lsp-types]
version = "0.95.0"

[workspace.dependencies.minijinja]
version = "1.0.16"
features = [
    "macros",
    "builtins",
    "debug",
    "preserve_order",
    "adjacent_loop_items",
    "unicode",
    "json",
    "unstable_machinery",
    "unstable_machinery_serde",
    "custom_syntax",
    "internal_debug",
    "deserialization",
]
default-features = false

[workspace.dependencies.reqwest]
version = "0.12.12"
features = [
    "json",
    "native-tls-alpn",
    "native-tls-vendored",
    "stream",
]

[workspace.dependencies.secrecy]
version = "0.10.3"
features = ["serde"]

[workspace.dependencies.serde]
version = "1"
features = [
    "alloc",
    "derive",
    "rc",
]

[workspace.dependencies.serde_json]
version = "1"
features = [
    "float_roundtrip",
    "preserve_order",
]

[workspace.dependencies.strum]
version = "0.26.2"
features = ["derive"]

[workspace.dependencies.time]
version = "0.3.36"
features = ["formatting"]

[workspace.dependencies.tokio]
version = "1"
features = [
    "macros",
    "time",
]
default-features = false

[workspace.dependencies.tracing-core]
version = "0.1.31"

[workspace.dependencies.uuid]
version = "1.8.0"
features = [
    "v4",
    "v7",
    "serde",
]

[profile.dev]
lto = false

[profile.dev2]
inherits = "dev"

[profile.release]
lto = true
