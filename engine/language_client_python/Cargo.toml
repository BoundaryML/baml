[package]
name = "baml-python-ffi"
edition = "2021"
version.workspace = true
authors.workspace = true
description = "BAML v0 — Python runtime for baml_client"
license = "Apache-2.0"

[lib]
name = "baml_py"
crate-type = ["cdylib"]

[lints.rust]
dead_code = "deny"
elided_named_lifetimes = "deny"
unused_imports = "deny"
unused_must_use = "deny"
unused_variables = "deny"

[lints.clippy]
too_many_arguments = "allow"

[dependencies]
anyhow.workspace = true
baml-cli = { path = "../cli", default-features = false }
baml-ids.workspace = true
baml-log.workspace = true
baml-compiler = { path = "../baml-compiler" }
baml-runtime = { path = "../baml-runtime", default-features = false, features = ["internal"] }
baml-types.workspace = true
dashmap = "5.5"
internal-baml-core.workspace = true
env_logger.workspace = true
futures.workspace = true
indexmap.workspace = true
libc = "0.2"
once_cell = "1.19"
jsonish = { path = "../baml-lib/jsonish" }
log.workspace = true
# Consult https://pyo3.rs/main/migration for migration instructions
pyo3 = { version = "0.28", default-features = false, features = [
  "abi3-py38",
  "extension-module",
  "generate-import-lib",
  "indexmap",
  "serde",
  "either",
] }
pyo3-async-runtimes = { version = "0.28", features = [
  "attributes",
  "tokio-runtime",
] }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tracing-subscriber = { version = "0.3.18", features = [
  "json",
  "env-filter",
  "valuable",
] }
uuid.workspace = true
either.workspace = true
ctrlc = "3.4.5"

[build-dependencies]
pyo3-build-config = "0.28"

[features]
default = [
  "bedrock",
  "lsp",
  "serve",
  "dev",
  "repl",
  "cloud",
  "vertex",
  "optimize",
  "tui",
  "studio",
]
# AWS Bedrock provider support (forwards to baml-runtime). On by default; build
# with --no-default-features to drop the aws-* dependency tree.
bedrock = ["baml-runtime/bedrock", "baml-cli/bedrock"]
# `baml-cli lsp` (the language server).
lsp = ["baml-cli/lsp"]
# Statically vendor OpenSSL for portable/hermetic Linux builds.
native-tls-vendored = ["baml-runtime/native-tls-vendored", "baml-cli/native-tls-vendored"]
# `baml-cli serve` / `baml-cli dev` (axum HTTP server + file watching).
serve = ["baml-cli/serve"]
dev = ["baml-cli/dev"]
# `baml-cli repl`.
repl = ["baml-cli/repl"]
# Boundary Cloud commands (`baml-cli auth/login/deploy`).
cloud = ["baml-cli/cloud"]
# Vertex AI provider auth (gcp_auth).
vertex = ["baml-cli/vertex", "baml-runtime/vertex"]
# `baml-cli optimize` and the interactive terminal UIs.
optimize = ["baml-cli/optimize"]
tui = ["baml-cli/tui"]
# Boundary Studio tracing publisher.
studio = ["baml-cli/studio", "baml-runtime/studio"]
# Use the THIR interpreter runtime instead of the VM bytecode runtime
thir-interpreter = ["baml-runtime/thir-interpreter"]
