    # NOTE: -lite variants MUST come before base models (first match wins)
    overrides:
      # Gemini 3.1 Pro Preview ($2/$12 per MTok)
      - match: >
          response.model | regex_match('gemini-3\\.1-pro')

        constants:
          INPUT_TOKEN_COST: 0.000002
