[package]
edition = "2021"
name = "baml_cffi"
version.workspace = true
authors.workspace = true
description.workspace = true
license-file.workspace = true

[lib]
# cdylib - Dynamic library for runtime linking (used by Go, Rust, etc.)
# See https://doc.rust-lang.org/reference/linkage.html
crate-type = ["cdylib"]

[dependencies]
libc = "0.2.2"
baml-cli = { path = "../cli", default-features = false }
baml-ids.workspace = true
baml-log.workspace = true
baml-types.workspace = true
baml-runtime = { path = "../baml-runtime", default-features = false, features = [
  "internal",
] }
internal-baml-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
once_cell.workspace = true
anyhow.workspace = true
env_logger.workspace = true
prost = "0.14"
baml_cffi_macros = { path = "../baml_cffi_macros" }
indexmap.workspace = true
dashmap = "6.1"

[features]
# AWS Bedrock provider support, forwarded through the runtime stack. On by
# default; build with --no-default-features to drop the aws-* dependency tree.
default = [
  "bedrock",
  "lsp",
  "serve",
  "dev",
  "repl",
  "cloud",
  "vertex",
  "optimize",
  "tui",
  "studio",
]
bedrock = ["baml-runtime/bedrock", "baml-cli/bedrock"]
# Forwarded baml-cli surface; all on by default so the published package is
# unchanged. Minimal/vendored builds use --no-default-features.
lsp = ["baml-cli/lsp"]
serve = ["baml-cli/serve"]
dev = ["baml-cli/dev"]
repl = ["baml-cli/repl"]
cloud = ["baml-cli/cloud"]
vertex = ["baml-cli/vertex", "baml-runtime/vertex"]
# `baml-cli optimize` and the interactive terminal UIs.
optimize = ["baml-cli/optimize"]
tui = ["baml-cli/tui"]
# Boundary Studio tracing publisher.
studio = ["baml-cli/studio", "baml-runtime/studio"]

[build-dependencies]
cbindgen = "0.28.0"
prost-build = "0.14.1"
protoc-bin-vendored = "3"
protoc = "2"
