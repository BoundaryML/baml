# Vendored fork of gcp_auth 0.12.3 (https://github.com/djc/gcp_auth), MIT.
#
# Changes from upstream, to keep the `ring` crate out of the dependency tree
# (required for monorepos that ban ring and mandate a system/BoringSSL crypto
# stack):
#   - HTTPS client: hyper-rustls -> hyper-tls (platform/native TLS).
#   - JWT RS256 signing: ring::signature -> the pure-Rust `rsa` + `sha2` crates.
# Both changes are localized to src/types.rs. To use a different signing backend
# (e.g. BoringSSL), replace the `Signer` impl in that file.
[package]
edition = "2021"
rust-version = "1.70"
name = "gcp_auth"
version = "0.12.3"
description = "GCP authentication (vendored fork; ring-free)"
readme = "README.md"
license = "MIT"
repository = "https://github.com/djc/gcp_auth"

[lib]
name = "gcp_auth"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4.31", features = ["serde"] }
home = "0.5.5"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = [
  "client",
  "http1",
  "http2",
] }
hyper-tls = "0.6"
native-tls = { version = "0.2", features = ["alpn"] }
tokio-native-tls = "0.3"
hyper-util = { version = "0.1.4", features = [
  "client-legacy",
  "http1",
  "http2",
  "tokio",
] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.1", features = ["fs", "sync"] }
tracing = "0.1.29"
tracing-futures = "0.2.5"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
