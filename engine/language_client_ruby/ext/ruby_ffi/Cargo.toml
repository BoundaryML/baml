[package]
name = "ruby_ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# This controls the name of the generated .so file
crate-type = ["cdylib"]

[lints.clippy]
too_many_arguments = "allow"

[dependencies]
anyhow.workspace = true
baml-cli = { path = "../../../cli", default-features = false }
baml-ids.workspace = true
baml-log.workspace = true
baml-runtime = { path = "../../../baml-runtime", default-features = false, features = ["internal"] }
baml-types.workspace = true
base64.workspace = true
env_logger.workspace = true
futures.workspace = true
indexmap.workspace = true
internal-baml-core.workspace = true
jsonish = { path = "../../../baml-lib/jsonish" }
log.workspace = true
magnus = { version = "0.7.1", features = ["rb-sys"] }
# Must be kept in sync with ../../Gemfile
rb-sys = { version = "0.9.111", features = [
  "global-allocator",
  "bindgen-rbimpls",
  "bindgen-deprecated-types",
  "stable-api",
  "stable-api-compiled-fallback",
] }
serde.workspace = true
serde_json.workspace = true
serde_magnus = { version = "0.9.0" }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3.18", features = [
  "json",
  "env-filter",
  "valuable",
] }

[features]
# AWS Bedrock provider support, forwarded through the runtime stack. On by
# default; build with --no-default-features to drop the aws-* dependency tree.
default = [
  "bedrock",
  "lsp",
  "serve",
  "dev",
  "repl",
  "cloud",
  "vertex",
  "optimize",
  "tui",
  "studio",
]
bedrock = ["baml-runtime/bedrock", "baml-cli/bedrock"]
# Forwarded baml-cli surface; all on by default so the published package is
# unchanged. Minimal/vendored builds use --no-default-features.
lsp = ["baml-cli/lsp"]
serve = ["baml-cli/serve"]
dev = ["baml-cli/dev"]
repl = ["baml-cli/repl"]
cloud = ["baml-cli/cloud"]
vertex = ["baml-cli/vertex", "baml-runtime/vertex"]
# `baml-cli optimize` and the interactive terminal UIs.
optimize = ["baml-cli/optimize"]
tui = ["baml-cli/tui"]
# Boundary Studio tracing publisher.
studio = ["baml-cli/studio", "baml-runtime/studio"]

[dev-dependencies.magnus]
version = "0.7.1"
features = ["rb-sys", "embed"]

[build-dependencies]
rb-sys-env = { version = "0.2.2" }
