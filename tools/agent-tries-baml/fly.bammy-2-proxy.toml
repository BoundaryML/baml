app            = 'bammy-2-proxy'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile.proxy'

[env]
  PROXY_LISTEN_PORT = '9090'
  STAGING_ROOT      = '/tmp/staging'
  BAML_CACHE_DIR    = '/var/baml-cache'
  CLAUDE_AUTH_MODE  = 'auto'
  # Fly machines are isolated VMs; signal a sandbox so the agent's tool use
  # (bypassPermissions) is allowed while running as root.
  IS_SANDBOX        = '1'
  # Set ANTHROPIC_API_KEY (metered) + LLM_FORWARD=1 to forward, OR leave the key
  # empty and rely on the Claude subscription (OAuth on the mounted volume).
  # Set ATB_CLAUDE_PROXY_TOKEN via `fly secrets` so services authorize to /v1/messages.

[[services]]
  internal_port        = 9090
  protocol             = 'tcp'
  auto_stop_machines   = 'off'
  auto_start_machines  = true
  min_machines_running = 1

[[mounts]]
  source      = 'bammy_2_proxy_state'
  destination = '/root/.claude'

[[vm]]
  size   = 'shared-cpu-2x'
  memory = '2gb'
