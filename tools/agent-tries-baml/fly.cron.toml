app            = 'bench3-cron'
primary_region = 'sjc'

# Daily: POST /baml/update then enqueue curated task(s). A simple loop
# (CRON_INTERVAL_SECS). Scale to 0/1 as desired.
[build]
  dockerfile = 'docker/Dockerfile.python'

[processes]
  app = 'python -m services.cron'

[env]
  INFISICAL_PROJECT_ID = 'bdd280e2-259c-4750-9b16-a8597a67214c'
  INFISICAL_ENV        = 'prod'
  INFISICAL_PATH       = '/'
  SERVICE_URL       = 'http://bench3-api.internal:8080'
  CRON_INTERVAL_SECS = '86400'
  SLACK_RESULTS_CHANNEL = 'C0B36EDQEN6'
  # secrets: SERVICE_TOKEN

[[vm]]
  size   = 'shared-cpu-1x'
  memory = '256mb'
