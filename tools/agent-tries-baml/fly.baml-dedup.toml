app            = 'bench3-baml-dedup'
primary_region = 'sjc'

[build]
  dockerfile = 'docker/Dockerfile.python'

[processes]
  app = 'python -m services.baml_dedup'

[env]
  INFISICAL_PROJECT_ID = 'bdd280e2-259c-4750-9b16-a8597a67214c'
  INFISICAL_ENV        = 'prod'
  INFISICAL_PATH       = '/'
  SERVICE_URL       = 'http://bench3-api.internal:8080'
  CLAUDE_PROXY_URLS = 'http://bench3-claude-proxy.internal:9090'
  BAML_DEDUP_MODEL       = 'claude-sonnet-4-6'
  # secrets: SERVICE_TOKEN, CLAUDE_PROXY_TOKEN

[[vm]]
  size   = 'shared-cpu-1x'
  memory = '512mb'
