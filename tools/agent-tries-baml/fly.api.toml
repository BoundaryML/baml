app            = 'bench3-api'
primary_region = 'sjc'

# The central API + sole Convex gateway. Public (bearer-protected) so we
# can curl it and the UI/ingress can reach it.
[build]
  dockerfile = 'docker/Dockerfile.python'

[processes]
  app = 'python -m services.api'

[env]
  INFISICAL_PROJECT_ID = 'bdd280e2-259c-4750-9b16-a8597a67214c'
  INFISICAL_ENV        = 'prod'
  INFISICAL_PATH       = '/'
  PORT           = '8080'
  HOST           = '::'
  # Convex cloud (team boundary / project agent-tries-baml / prod). The old
  # self-hosted backend was bench3-convex.flycast:3210; rollback = revert this.
  CONVEX_URL     = 'https://charming-terrier-498.convex.cloud'
  BLOB_DIR       = '/data/blobs'
  BAML_REPO_SLUG = 'BoundaryML/baml'
  BAML_REF       = 'canary'
  # secrets: SERVICE_TOKEN, GITHUB_TOKEN (ATB_CONVEX_ADMIN_KEY is ignored on cloud)

[http_service]
  internal_port        = 8080
  force_https          = true
  processes            = ['app']
  auto_stop_machines   = 'off'
  auto_start_machines  = true
  min_machines_running = 1

[[mounts]]
  source      = 'bench3_api_blobs'
  destination = '/data/blobs'

[[vm]]
  size   = 'shared-cpu-1x'
  memory = '1gb'
