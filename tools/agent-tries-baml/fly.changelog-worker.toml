app            = 'bench3-changelog-worker'
primary_region = 'sjc'

[build]
  dockerfile = 'docker/Dockerfile.python'

[processes]
  app = 'python -m services.changelog_worker'

[env]
  INFISICAL_PROJECT_ID = 'bdd280e2-259c-4750-9b16-a8597a67214c'
  INFISICAL_ENV        = 'prod'
  INFISICAL_PATH       = '/'
  SERVICE_URL          = 'http://bench3-api.internal:8080'
  CLAUDE_PROXY_URLS    = 'http://bench3-claude-proxy.internal:9090'
  CHANGELOG_MODEL      = 'claude-opus-4-8'
  CHANGELOG_PUBLIC_URL = 'https://new.boundaryml.com/changelog'
  # secrets: ATB_SERVICE_TOKEN, ATB_CLAUDE_PROXY_TOKEN, GITHUB_TOKEN, ATB_SLACK_BOT_TOKEN

[[vm]]
  size   = 'shared-cpu-1x'
  memory = '512mb'
