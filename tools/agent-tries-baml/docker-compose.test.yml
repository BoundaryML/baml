# TEST-ONLY override for local container validation (not committed config for prod).
# Run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
# Wires the api supervisor to run web+ingress+baml_dedup, points the LLM clients at
# the proxy, and swaps the proxy's `claude` for the fake stand-in (docker/fake-claude)
# so the stack runs without a real Claude subscription.
services:
  api:
    environment:
      SUPERVISE: "web,ingress,baml_worker,baml_dedup,linear_sync"
      INGRESS_PORT: "8081"
      CONVEX_URL: "http://convex:3210"
      # Local self-hosted Convex admin key — mint one with:
      #   docker compose exec convex ./generate_admin_key.sh
      # then export CONVEX_ADMIN_KEY before `docker compose ... up`.
      CONVEX_ADMIN_KEY: "${CONVEX_ADMIN_KEY:?mint via: docker compose exec convex ./generate_admin_key.sh}"
      SERVICE_URL: "http://localhost:8080"
      SERVICE_TOKEN: "devservicetoken"
      CLAUDE_PROXY_URLS: "http://claude-proxy:9090"
      CLAUDE_PROXY_TOKEN: "devproxytoken"
      LLM_BASE_URL: "http://claude-proxy:9090"
      LLM_API_KEY: "devproxytoken"
      BAML_DEDUP_MODEL: "claude-sonnet-4-6"
      BATCH_SIZE: "20"
      # Linear status-group label ids (Symptom 2: MERGED -> closed).
      LINEAR_STATUS_MERGED: "lbl-merged"
      LINEAR_STATUS_APPROVED: "lbl-approved"
      LINEAR_STATUS_REDRAFT: "lbl-redraft"
      LINEAR_STATUS_PR_PREP: "lbl-pr-prep"
      LINEAR_STATUS_REJECTED: "lbl-rejected"
      # Webhook auth (the new ingress verifies both; Slack fails closed).
      ATB_SLACK_SIGNING_SECRET: "test-slack-signing"
      ATB_LINEAR_WEBHOOK_SECRET: "test-linear-secret"
    ports:
      - "8081:8081"

  claude-proxy:
    environment:
      CLAUDE_BIN: "/usr/local/bin/fake-claude"
      CLAUDE_PROXY_TOKEN: "devproxytoken"
      ANTHROPIC_API_KEY: ""
      BAML_CACHE_DIR: "/var/baml-cache"
    volumes:
      - ./docker/fake-claude:/usr/local/bin/fake-claude:ro
