app            = 'bench3-ui'
primary_region = 'sjc'

# Public read-only dashboard. Fetches the service over .internal.
[build]
  dockerfile = 'ui/Dockerfile'

[env]
  PORT          = '9877'
  HOSTNAME      = '0.0.0.0'
  SERVICE_URL   = 'http://bench3-api.internal:8080'
  CHANGELOG_API = 'https://bench3-ingress.fly.dev'
  # secret: SERVICE_TOKEN

[http_service]
  internal_port        = 9877
  force_https          = true
  auto_stop_machines   = 'stop'
  auto_start_machines  = true
  min_machines_running = 0

[[vm]]
  size   = 'shared-cpu-1x'
  memory = '512mb'
