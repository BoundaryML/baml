app            = 'bench3-cohort-compare'
primary_region = 'sjc'

[build]
  dockerfile = 'docker/Dockerfile.python'

[processes]
  app = 'python -m services.cohort_compare'

[env]
  INFISICAL_PROJECT_ID = 'bdd280e2-259c-4750-9b16-a8597a67214c'
  INFISICAL_ENV        = 'prod'
  INFISICAL_PATH       = '/'
  SERVICE_URL       = 'http://bench3-api.internal:8080'
  CLAUDE_PROXY_URLS = 'http://bench3-claude-proxy.internal:9090'
  ARENA_MODEL       = 'claude-sonnet-4-6'
  UI_BASE_URL       = 'https://bench3-ui.fly.dev'
  # secrets: SERVICE_TOKEN, CLAUDE_PROXY_TOKEN, (optional SLACK_BOT_TOKEN)

[[vm]]
  size   = 'shared-cpu-1x'
  memory = '512mb'
