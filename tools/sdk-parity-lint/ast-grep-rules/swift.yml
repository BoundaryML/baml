id: swift-test
language: Swift
rule:
  pattern: 'func $NAME($$$ARGS) { $$$BODY }'
constraints:
  NAME:
    regex: '^test_[A-Za-z0-9_]+$'
---
id: swift-audit-test
language: Swift
rule:
  pattern: 'func $NAME($$$ARGS) { $$$BODY }'
constraints:
  NAME:
    regex: '^test[A-Za-z0-9_]*$'
---
id: sdk-parity-lint-skip
language: Swift
rule:
  all:
    - kind: comment
    - regex: 'SDK_PARITY_LINT\(skip\):'
