id: rust-test
language: Rust
rule:
  all:
    - any:
        - pattern: 'fn $NAME($$$ARGS) { $$$BODY }'
        - pattern: 'async fn $NAME($$$ARGS) { $$$BODY }'
    - follows:
        all:
          - kind: attribute_item
          - regex: '^#\[(tokio::)?test\]$'
        stopBy:
          kind: function_item
constraints:
  NAME:
    regex: '^test_[A-Za-z0-9_]+$'
---
id: rust-audit-test
language: Rust
rule:
  all:
    - any:
        - pattern: 'fn $NAME($$$ARGS) { $$$BODY }'
        - pattern: 'async fn $NAME($$$ARGS) { $$$BODY }'
    - follows:
        all:
          - kind: attribute_item
          - regex: '^#\[.*test.*\]$'
        stopBy:
          kind: function_item
---
id: sdk-parity-lint-skip
language: Rust
rule:
  all:
    - kind: line_comment
    - regex: 'SDK_PARITY_LINT\(skip\):'
