app = "baml-hw-0910-node-baml"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "10s"
[build]
  dockerfile = "Dockerfile"
[env]
  PORT = "8080"
  BAML_PROFILE = "0"
  BAML_TELEMETRY_DISABLED = "1"
  BAML_LOG = "off"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 800
    hard_limit = 1000
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"
[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[metrics]
  port = 9091
  path = "/metrics"
