# The atb2 runner on Fly. Two processes on one image:
#   babysit   serves "@bammy babysit <PR>" requests from the store
#   pipeline  runs the feedback pipeline every five minutes
#
#   fly deploy tools/atb2 --config tools/atb2/deploy/fly.toml
#   (from the repo root; the build context is tools/atb2; CI does this on
#    every push to canary touching tools/atb2)
#
# One machine per process; both mount the same volume for the cached clone
# and cargo target, so create the volume once:
#   fly volumes create atb2_data --size 80 --region sjc -a atb2-runner
# Secrets: the machine holds one, INFISICAL_TOKEN; the entrypoint pulls the
# rest from Infisical (boundary-tools, prod) at start with `infisical run`:
#   fly secrets set -a atb2-runner INFISICAL_TOKEN=...   # once
# What the pipeline reads must be in that project: FEEDBACK_SUPABASE_URL/_KEY,
# ATB_SLACK_BOT_TOKEN, ATB_SLACK_FIX_CHANNEL, ATB_POSTHOG_* (there already),
# plus GH_TOKEN and CLAUDE_CODE_OAUTH_TOKEN for the runner. CI never sees any
# of them; it only holds a Fly deploy token.
app = "atb2-runner"
primary_region = "sjc"

[build]
  dockerfile = "deploy/Dockerfile"
  # relative to the build context, tools/atb2

[env]
  ATB2_HOME = "/data"
  ATB2_DATASET = "live"
  ATB2_POLL_S = "60"
  INFISICAL_PROJECT_ID = "bdd280e2-259c-4750-9b16-a8597a67214c"
  INFISICAL_ENV = "prod"

[processes]
  babysit = "babysit_loop()"
  pipeline = "pipeline_loop(every_s = 300)"

[[mounts]]
  source = "atb2_data"
  destination = "/data"
  processes = ["babysit", "pipeline"]

# the gate runs cargo builds and nextest: give it room
[[vm]]
  size = "performance-8x"
  memory = "32gb"
  processes = ["babysit", "pipeline"]

[checks]
  # no http surface; liveness is the process itself
