s.batches) {\n        let cells: Cell[] = [];\n        let i = 0;\n        while (i < s.width) {\n            let cell = Cell { value: batch + i, payload: [i, i + 1, i + 2, i + 3] };\n            let alias = cell;\n            alias.value += 1;\n            alias.payload[0] += 1;\n            cells.push(cell);\n            i += 1;\n        }\n        for (let cell in cells) { checksum += cell.value + cell.payload[0]; }\n        if (s.retain > 0) {\n            if (retained.length() < s.retain) { retained.push(cells); }\n            else { retained[batch % s.retain] = cells; }\n        }\n        batch += 1;\n    }\n    let live_sum = 0;\n    for (let cells in retained) {\n        for (let cell in cells) { live_sum += cell.value + cell.payload[0]; }\n    }\n    baml.json.to_string([checksum, live_sum])\n}\n", "headline": {"node": 0.7609441700845401, "go": 11.186628383921247}}, {"name": "json-aggregate", "label": "parse, validate and aggregate 1,024 JSON rows", "case": "03_json_aggregate", "values": {"native-off": {"median": 73.7265625, "min": 73.359375, "max": 73.90234375, "n": 20}, "native-low": {"median": 75.798828125, "min": 75.53515625, "max": 76.13671875, "n": 20}, "native-medium": {"median": 75.783203125, "min": 75.546875, "max": 75.98046875, "n": 20}, "native-high": {"median": 76.92578125, "min": 76.6171875, "max": 77.43359375, "n": 20}, "vm-off": {"median": 73.6796875, "min": 73.4453125, "max": 73.90234375, "n": 20}, "vm-low": {"median": 75.84765625, "min": 75.54296875, "max": 76.15625, "n": 20}, "vm-medium": {"median": 75.79296875, "min": 75.56640625, "max": 75.9765625, "n": 20}, "vm-high": {"median": 76.8359375, "min": 76.59375, "max": 77.21875, "n": 20}, "rust": {"median": 3.1875, "min": 3.12890625, "max": 3.2265625, "n": 20}, "go": {"median": 8.640625, "min": 8.33203125, "max": 8.796875, "n": 20}, "node": {"median": 68.544921875, "min": 68.203125, "max": 68.91796875, "n": 20}, "bun": {"median": 33.544921875, "min": 32.81640625, "max": 33.8203125, "n": 20}, "python": {"median": 24.5625, "min": 24.53125, "max": 24.578125, "n": 20}}, "source": "class State { raw: string }\nclass Row { account: string, amount_cents: int | float, active: bool }\nclass Total { account: string, total_cents: int }\nclass Invalid { message: string }\nfunction prepare(raw: string) -> State { State { raw: raw } }\nfunction aggregate(raw: string) -> string {\n    let rows = baml.json.deserialize<Row[]>(raw);\n    let totals: map<string, int> = {};\n    if (rows.length() > 1000000) { throw Invalid { message: \"too many rows\" }; }\n    for (let row in rows) {\n        if (!row.account.is_ascii()) { throw Invalid { message: \"non-ASCII account\" }; }\n        let amount = match (row.amount_cents) {\n            let n: int => n,\n            let f: float => {\n                if (f != f.floor() || f < 0.0 || f > 1000000.0) {\n                    throw Invalid { message: \"invalid amount\" };\n                }\n                f.itrunc()\n            }\n        };\n        if (amount < 0 || amount > 1000000) { throw Invalid { message: \"invalid amount\" }; }\n        if (row.active) { totals[row.account] = (totals.get(row.account) ?? 0) + amount; }\n    }\n    let accounts = totals.keys();\n    accounts.sort();\n    let output: Total[] = [];\n    for (let account in accounts) {\n        output.push(Total { account: account, total_cents: totals.get(account) ?? 0 });\n    }\n    baml.json.to_string(output)\n}\nfunction run(state: State) -> string {\n    aggregate(state.raw) catch (_) { let _ => \"{\\\"error\\\":\\\"invalid\\\"}\" }\n}\n", "headline": {"node": 1.0755948140760792, "go": 8.53254972875226}}, {"name": "merge-random", "label": "merge sort 1,024 random integers", "case": "02_merge_sort", "values": {"native-off": {"median": 32.53125, "min": 32.41015625, "max": 32.83984375, "n": 20}, "native-low": {"median": 34.830078125, "min": 34.640625, "max": 34.953125, "n": 20}, "native-medium": {"median": 34.828125, "min": 34.671875, "max": 34.9609375, function standing(k, e) {
  const n = e && e.values['native-off'], h = e && e.headline || {};
  const rel = x => x == null ? null : (k.better === 'higher' ? x : 1 / x);
  const word = k.better === 'higher' ? 'faster than' : 'less than', back = k.better === 'higher' ? 'faster' : 'leaner';
  const vs = (x, name) => x == null ? null : x >= 1 ? `${fmtR(x)} ${word} ${name}` : `${name} is ${fmtR(1 / x)} ${back}`;
  const short = (x, name) => x == null ? null : x >= 1 ? `${fmtR(x)} vs ${name}` : `${name} ${fmtR(1 / x)} ahead`;
  return {n: has(n) ? fmt(n.median, k.unit) : '—',
          long: has(n) ? [vs(rel(h.node), 'Node'), vs(rel(h.go), 'Go')].filter(Boolean).join(' · ') : '',
          short: has(n) ? [short(rel(h.node), 'Node'), short(rel(h.go), 'Go')].filter(Boolean).map(esc).join('<br>') : 'no native row'};
}

// tiles: one per charted KPI, native's number for the default workload
document.getElementById('tiles').innerHTML = charted.map(k => {
  const s = standing(k, entryOf(k));
  return `<a class="tile" href="#${k.key}"><div class="k">${esc(k.title)}</div><div class="v">${s.n}</div><div class="s">${s.short}</div></a>`;
}).join('');

function niceStep(max) { const p = Math.pow(10, Math.floor(Math.log10(max))); const q = max / p; return q >= 5 ? p : q >= 2 ? p / 2 : p / 5; }
function placeholder(rw, st) {
  if (st && st.note) return {text: st.note, why: st.note, note: true};
  if (rw.status === 'unsupported') return {text: 'not yet', why: D.reasons.unsupported};
  if (rw.status === 'not_run') return {text: 'next run', why: D.reasons.not_run};
  return {text: 'no data', why: 'this row produced no value in this run'};
}
function chart(k, e, big) {
  const W = big ? 1180 : 560, LEFT = big ? 190 : 150, LABEL = big ? 90 : 72, TOP = 4, BAR = big ? 16 : 11, GAP = big ? 5 : 3, FGAP = 12, RIGHT = 8, AX = 30;
  const plotW = W - LEFT - RIGHT - LABEL;
  const vals = D.rows.map(rw => (e.values[rw.key] || {}).median).filter(v => v != null && v > 0);
  const max = Math.max(...vals) || 1, min = Math.min(...vals) || 1;
  const log = max / min > 30;
  const lo = log ? Math.pow(10, Math.floor(Math.log10(min))) : 0;
  const hi = log ? Math.pow(10, Math.ceil(Math.log10(max))) : Math.ceil(max / niceStep(max)) * niceStep(max);
  const x = v => LEFT + (log ? (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) : v / hi) * plotW;
  const fams = [...new Set(D.rows.map(rw => rw.family))];
  let H = TOP; fams.forEach(f => { H += 14 + D.rows.filter(rw => rw.family === f).length * (BAR + GAP) + FGAP; }); H += AX;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(k.title)}: ${esc(e.label)}">`, y = TOP;
  const ticks = log ? Array.from({length: Math.round(Math.log10(hi) - Math.log10(lo)) + 1}, (_, i) => lo * Math.pow(10, i)) : Array.from({length: Math.round(hi / niceStep(max)) + 1}, (_, i) => i * niceStep(max));
  ticks.forEach(tv => { if (tv > 0 || !log) s += `<line class="grid" x1="${x(tv).toFixed(1)}" x2="${x(tv).toFixed(1)}" y1="${TOP}" y2="${H - AX + 2}"/>`; });
  fams.forEach((f, fi) => {
    s += `<text class="fam" x="${LEFT - 8}" y="${y + 10}" text-anchor="end">${esc(f.toUpperCase())}</text>`; y += 14;
    D.rows.filter(rw => rw.family === f).forEach(rw => {
      const st = e.values[rw.key], hi2 = rw.key === 'native-off';
      s += `<g class="row"><text class="lbl ${hi2?'hi':''} ${has(st)?'':'dim'}" x="${LEFT - 8}" y="${y + BAR - 2}" text-anchor="end">${esc(rw.label)}</text>`;
      if (has(st)) {
        const w = Math.max(1.5, x(st.median) - LEFT);
        s += `<rect x="${LEFT}" y="${y}" width="${w.toFixed(1)}" height="${BAR}" fill="${COLOR(rw.key)}"><title>${esc(rw.label)}: ${fmt(st.median, k.unit)}${st.us_per_job != null ? ' (' + fmtU(st.us_per_job) + ' per job)' : ''}${st.n ? ', n=' + st.n : ''}${st.min != null ? ', range ' + fmt(st.min, k.unit) + ' to ' + fmt(st.max, k.unit) : ''}</title></rect>`;
        s += `<text class="val ${hi2?'hi':''}" x="${LEFT + w + 5}" y="${y + BAR - 2}">${fmt(st.median, k.unit)}</text>`;
      } else {
        const p = placeholder(rw, st);
        if (p.note) s += `<text class="note" x="${LEFT + 2}" y="${y + BAR - 2}"><title>${esc(p.why)}</title>${esc(p.text)}</text>`;
        else s += `<rect class="ny" x="${LEFT}" y="${y}" width="46" height="${BAR}"><title>${esc(p.why)}</title></rect><text class="val" x="${LEFT + 52}" y="${y + BAR - 2}">${esc(p.text)}</text>`;
      }
      s += `</g>`; y += BAR + GAP;
    });
    y += FGAP; if (fi < fams.length - 1) s += `<line class="sep" x1="${LEFT}" x2="${W - RIGHT}" y1="${y - FGAP / 2}" y2="${y - FGAP / 2}"/>`;
  });
  const ay = H - AX + 2;
  s += `<line class="axis" x1="${LEFT}" x2="${LEFT + plotW}" y1="${ay}" y2="${ay}"/>`;
  ticks.forEach(tv => { if (tv > 0 || !log) s += `<text class="tick" x="${x(tv).toFixed(1)}" y="${ay + 12}" text-anchor="middle">${fmt(tv, k.unit)}</text>`; });
  s += `<text class="dir" x="${LEFT}" y="${ay + 25}">${esc(k.unit)}</text>`;
  s += `<text class="dir" x="${LEFT + plotW}" y="${ay + 25}" text-anchor="end">${k.better === 'higher' ? 'HIGHER IS BETTER →' : '← LOWER IS BETTER'}${log ? ' · LOG SCALE' : ''}</text>`;
  return s + '</svg>';
}
function table(k, e) {
  const t = k.unit === 'ops/s';
  return `<table><tr><th>implementation</th><th>${esc(k.unit)}</th>${t ? '<th>per job</th><th>min</th><th>max</th>' : ''}<th>n</th></tr>` + D.rows.map(rw => {
    const st = e.values[rw.key];
    if (!has(st)) return `<tr><td>${esc(rw.label)}</td><td class="n" colspan="${t ? 5 : 2}">${esc(placeholder(rw, st).text)}</td></tr>`;
    return `<tr><td>${esc(rw.label)}</td><td>${fmt(st.median, k.unit)}</td>${t ? `<td>${fmtU(st.us_per_job)}</td><td>${fmt(st.min, k.unit)}</td><td>${fmt(st.max, k.unit)}</td>` : ''}<td>${st.n || ''}</td></tr>`;
  }).join('') + '</table>';
}
function idx(k, e) {
  const s = standing(k, e);
  return `<div class="n">${s.n}</div><div class="t">BAML native, telemetry off</div>${s.long ? `<div class="t">${esc(s.long)}</div>` : ''}`;
}
function body(k, e) {
  return `<div class="zoom" data-zoom="${k.key}" title="click to enlarge">${chart(k, e)}</div><p class="measure">${esc(k.measure || '')}</p>
    <div class="more"><details><summary>table</summary>${table(k, e)}</details>${e.source ? `<details><summary>BAML source</summary><pre>${esc(e.source)}</pre></details>` : ''}</div>`;
}
document.getElementById('grid').innerHTML = charted.map(k => {
  const e = entryOf(k);
  const sel = k.scenarios.length > 1 ? `<label for="sel-${k.key}">workload</label><select id="sel-${k.key}" data-kpi="${k.key}">${k.scenarios.map(s => `<option value="${esc(s.name)}">${esc(s.label)}</option>`).join('')}</select>` : esc(e.label);
  return `<article class="box" id="${k.key}"><div class="hd"><div class="tl"><h2>${esc(k.title)}</h2><p class="q">${esc(k.question)}</p></div><div class="idx" id="idx-${k.key}">${idx(k, e)}</div></div>
    <div class="ctl">${sel}</div><div class="body" id="body-${k.key}">${body(k, e)}</div></article>`;
}).join('');
document.getElementById('pending').innerHTML = pending.map(k =>
  `<div class="strip" id="${k.key}"><h2>${esc(k.title)}</h2><p class="q">${esc(k.question)}</p><div class="r"><b>Not measured in this run.</b> ${esc(k.pending || 'no data')}. ${esc(k.measure || '')}</div></div>`).join('');
function current(k) { const sel = document.getElementById('sel-' + k.key); return k.scenarios.find(s => s.name === (sel ? sel.value : k.default)) || k.scenarios[0]; }
document.querySelectorAll('select[data-kpi]').forEach(s => s.addEventListener('change', () => {
  const k = D.kpis.find(x => x.key === s.dataset.kpi), e = current(k);
  document.getElementById('idx-' + k.key).innerHTML = idx(k, e);
  document.getElementById('body-' + k.key).innerHTML = body(k, e);
}));

// click a chart to enlarge it; ?zoom=<kpi> opens one on load
const dlg = document.getElementById('dlg'), dlgBody = document.getElementById('dlg-body');
function enlarge(key) {
  const k = D.kpis.find(x => x.key === key); if (!k) return; const e = current(k); if (!e) return;
  dlgBody.innerHTML = `<h2>${esc(k.title)}: ${esc(e.label)}</h2><p class="measure">${esc(k.measure || '')}</p>${chart(k, e, true)}`;
  if (!dlg.open) dlg.showModal();
}
document.getElementById('grid').addEventListener('click', ev => { const z = ev.target.closest('[data-zoom]'); if (z) enlarge(z.dataset.zoom); });
document.getElementById('dlg-x').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', ev => { if (ev.target === dlg) dlg.close(); });
const want = new URLSearchParams(location.search).get('zoom'); if (want) enlarge(want);

document.getElementById('why').innerHTML = `<b>Why some rows are empty.</b> Native at low, medium and high: ${esc(D.reasons.unsupported)}. Rows marked next run: ${esc(D.reasons.not_run)}. Rows in italics do not apply to that implementation and say why. ${pending.length ? pending.map(k => esc(k.title) + ': ' + esc(k.pending)).join('. ') + '. ' : ''}An empty row is drawn, never dropped, so the comparison a reader expects is visibly missing rather than silently absent.`;
const dm = D.drift.length ? D.drift.map(d => Math.abs(d.ratio - 1) * 100).sort((a, b) => a - b)[Math.floor(D.drift.length / 2)] : null;
document.getElementById('ft').innerHTML = `<details><summary>How this was produced</summary>
 <ol><li>Stage: emit <code>run</code> and <code>prepare</code> of nine BAML programs through <code>baml __emit-rust</code>; archive <code>baml_language</code> at HEAD.</li>
 <li>Boot an ephemeral VM from the <code>${esc(D.machine.name)}</code> snapshot: identical bits every time, idle guest, ${esc(D.machine.cpu)}.</li>
 <li>Build every native executable from a clean target in release (fat LTO, ${esc(D.machine.rustc)}); compile bytecode with the pinned VM host; freeze the snapshot's native executables as a control row.</li>
 <li>Verify every implementation on every program's edge-case inputs against an independent oracle; stop on any failure.</li>
 <li>Run ${D.run.trials_total} trials: ${D.protocol.trials} per bar, shuffled with a fixed seed, one pinned core, a fresh process each, the timed region inside the process, peak RSS from wait4. BAML rows set <code>BAML_TELEMETRY</code> per bar; levels other than off must produce a recording.</li>
 <li>Summarize, write <code>kpis.json</code>, render this page from it, delete the VM.</li></ol>
 <p>Host drift this run: the frozen native control moved a median ${dm == null ? '—' : dm.toFixed(1) + '%'} against the candidate across ${D.drift.length} workloads. Started ${esc(D.run.started)}, finished ${esc(D.run.finished)}; load ${esc(D.run.loadavg_start)} → ${esc(D.run.loadavg_end)}; glibc ${esc(D.machine.glibc)}; protocol <code>${esc((D.protocol.sha256||'').slice(0,16))}</code>. Data: <a href="kpis.json">kpis.json</a>; every trial: <code>results/trials.csv</code>.</p></details>`;
})();
</script>
</body>
</html>
