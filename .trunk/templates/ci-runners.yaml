version: 1
name: CI runners

# The template env reaches the build steps AND every Kiln job (through $GITHUB_ENV).
# Put a value here only when the jobs need it too.
env:
  # jdx/mise-action finds the baked mise binary and tools here.
  MISE_DATA_DIR: /cache/mise
  # No job checks out LFS objects, so the bake does not download them.
  GIT_LFS_SKIP_SMUDGE: "1"

build:
  size: xlarge
  disk_gib: 400
  timeout_minutes: 120
  rebuild_nightly: true

steps:
  # Clones the synced commit with full history to /opt/actions-runner/_work/baml/baml, the
  # path the job uses, and binds it at /workspace/baml. The bind stays in /etc/fstab.
  - checkout: { on: build, repo: . }

  # The steps below run as one bash script, so `cd` and variables carry from step to step.
  - script:
      name: Toolchains
      on: build
      run: |
        set -euo pipefail
        # Build at the job's path, not at /workspace/baml. Cargo keeps absolute paths in
        # its output, so a tree built at another path is stale or wrong in the job.
        SRC=/opt/actions-runner/_work/baml/baml
        cd "${SRC}/baml_language"

        # The toolchain that rust-toolchain.toml pins, also as the default for cargo calls
        # from the repository root.
        rustup show
        rustup default "$(rustup show active-toolchain | head -n1 | cut -d' ' -f1)"
        rustup target add x86_64-unknown-linux-musl wasm32-unknown-unknown
        sudo DEBIAN_FRONTEND=noninteractive apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y musl-tools

        # mise-action uses $MISE_DATA_DIR/bin/mise when it is there. mise installs the
        # `cargo:` tools from binaries only when cargo-binstall is on PATH.
        # TODO: pin the mise and cargo-binstall versions.
        mkdir -p "${MISE_DATA_DIR}/bin"
        curl -fsSL https://mise.run | MISE_INSTALL_PATH="${MISE_DATA_DIR}/bin/mise" sh
        curl -fsSL https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz |
          tar -xz -C "${MISE_DATA_DIR}/bin" cargo-binstall
        export PATH="${MISE_DATA_DIR}/bin:${PATH}" MISE_YES=1 MISE_TRUSTED_CONFIG_PATHS="${SRC}"
        # Every job sets CARGO_INCREMENTAL=0.
        export CARGO_INCREMENTAL=0

        # The union of the `install_args` in .github/workflows/kiln-shadow.yml. Run from the
        # repository root, as mise-action does, so mise resolves the same versions.
        (cd "${SRC}" && mise install \
          sccache direnv node npm:pnpm protoc protoc-gen-go python uv clang-format ast-grep \
          go java gradle dotnet ruby github:rustwasm/wasm-pack cargo:prek cargo:cargo-insta cargo:cargo-nextest)

        cargo fetch

        # build.rs puts BAML_GIT_SHA in the artifacts. Each job reads the basis marker below and
        # sets the same value, so the baked units stay fresh.
        BAML_GIT_SHA=$(git -C "${SRC}" rev-parse HEAD)
        export BAML_GIT_SHA

        # The packages with wasm_support, as the wasm32 and pre-commit jobs select them.
        wasm_packages=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[]
          | select(.source == null and (.metadata.ci.wasm_support // true)) | "-p \(.name)"' | xargs)

  # Each command must equal the job's command, with the job's env. Cargo puts the profile
  # env, the features and the package set in the fingerprint of each unit.
  - script:
      name: Rust builds of the cargo, doc and snapshot jobs
      on: build
      run: |
        (
          export CARGO_PROFILE_DEV_OPT_LEVEL=1 CARGO_PROFILE_TEST_OPT_LEVEL=1

          # cargo test (x86_64-unknown-linux-gnu)
          cargo test --no-run --all-features --workspace \
            --exclude baml_tests --exclude baml_cli --exclude baml_pack_host --exclude "sdk_test_*" --exclude baml_bridge
          # Compiler and documentation tests
          cargo build --tests --bins -p baml_tests -p baml_cli -p baml_pack_host --all-features
          # cargo doc
          RUSTDOCFLAGS="-D warnings" cargo doc --all --no-deps
          # The cargo commands of the sdk setup scripts, one package for each command.
          cargo build -p sdk_test_codegen
          cargo build -p bridge_cffi
          cargo build -p bridge_java
          cargo build -p bridge_cffi --no-default-features --features ring-crypto,bundle-http

          # cargo test (x86_64-unknown-linux-musl)
          (
            export CARGO_BUILD_TARGET=x86_64-unknown-linux-musl
            export CC_x86_64_unknown_linux_musl=musl-gcc CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            cargo build --tests --bin baml-cli --bin baml-pack-host --workspace \
              --exclude baml_tests --exclude "sdk_test_*" --exclude baml_bridge
            cargo test --no-run --workspace --exclude baml_tests --exclude "sdk_test_*" --exclude baml_bridge
          )

          # cargo test (wasm32-unknown-unknown)
          # shellcheck disable=SC2086 # one -p flag for each package
          cargo build ${wasm_packages} --target wasm32-unknown-unknown --no-default-features --release
        )

  # These jobs do not set the opt-level env, so the subshell does not set it either.
  - script:
      name: Rust builds of the pre-commit, webview and wasm-pack jobs
      on: build
      run: |
        (
          # Pre-commit Checks: keep the clippy arguments equal to baml_language/mise.toml.
          cargo build -p baml_cli
          cargo build -p cargo-stow
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          # shellcheck disable=SC2086
          CLIPPY_CONF_DIR="$(pwd)/clippy-wasm" cargo clippy ${wasm_packages} --target wasm32-unknown-unknown \
            --all-features --locked -- -D warnings -W clippy::disallowed-types

          # Typecheck, Unit Tests and Browser Tests: `pnpm --filter pkg-playground build:wasm`.
          (cd "${SRC}/typescript2/pkg-playground" &&
            mise exec github:rustwasm/wasm-pack -- wasm-pack build ../../baml_language/crates/bridge_wasm \
              --target web --out-dir ../../../typescript2/pkg-playground/wasm --release)

          # wasm-pack test
          cargo check -p bridge_wasm --target wasm32-unknown-unknown
          (cd crates/bridge_wasm && mise exec node github:rustwasm/wasm-pack -- wasm-pack test --node)
        )

  # The sdk legs run the job's own commands. A leg that fails makes a smaller warm tree,
  # not a failed bake: its name goes to the log and to /cache/trunk-template-skipped.
  - script:
      name: SDK test legs
      on: build
      run: |
        : >/cache/trunk-template-skipped
        sdk_leg() {
          local sdk=$1
          shift
          if ! (
            export CARGO_PROFILE_DEV_OPT_LEVEL=1 CARGO_PROFILE_TEST_OPT_LEVEL=1 CI=true
            cargo test --no-run -p "sdk_test_${sdk}" --all-features &&
              mise exec "$@" -- "./sdk_tests/crates/${sdk}/setup.sh"
          ); then
            echo "sdk leg ${sdk}" | tee -a /cache/trunk-template-skipped >&2
          fi
        }
        sdk_leg typescript node npm:pnpm
        sdk_leg typescript_web node npm:pnpm github:rustwasm/wasm-pack
        sdk_leg rust
        sdk_leg java java gradle
        sdk_leg python_pydantic2 python uv
        sdk_leg go go
        sdk_leg csharp dotnet
        sdk_leg cpp
        sdk_leg ruby_sorbet ruby

        # pnpm links node_modules to a store that the job cannot use (ERR_PNPM_UNEXPECTED_STORE),
        # so the jobs run a cold `pnpm install`. Only the Rust units of these legs stay warm.
        find "${SRC}" -path "${SRC}/baml_language/target" -prune -o -type d -name node_modules -prune \
          -exec rm -rf {} +
        rm -rf "${SRC}/.pnpm-store" "${SRC}/baml_language/target/pnpm-store"

  # Write the markers last: a bake that stops before this point publishes no snapshot.
  - script:
      name: Markers
      on: build
      run: |
        # Run the git stat refresh once here, not in the first checkout of each job.
        git -C "${SRC}" update-index --refresh >/dev/null || true
        echo "${BAML_GIT_SHA}" >/cache/trunk-template-basis-sha
        echo "${SRC}" >/cache/trunk-template-built-at
        echo "trunk-warm-template-v10" >/cache/trunk-template-variant
        df -h / && du -sh "${SRC}/baml_language/target" "${MISE_DATA_DIR}"
        echo "sdk legs that failed:" && cat /cache/trunk-template-skipped
