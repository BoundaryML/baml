[package]
name = "baml"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "BAML runtime for Rust - type-safe LLM function calls"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
baml-macros = { workspace = true }
libc = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }

[features]
default = []
# For development/testing - links against local build output
dev = []

# Target-specific dependencies on vendored FFI crates
[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dependencies]
baml-ffi-x86_64-unknown-linux-gnu = { version = "0.1.0", path = "../baml-ffi-x86_64-unknown-linux-gnu" }

[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))'.dependencies]
baml-ffi-aarch64-unknown-linux-gnu = { version = "0.1.0", path = "../baml-ffi-aarch64-unknown-linux-gnu" }

[target.'cfg(all(target_arch = "x86_64", target_os = "macos"))'.dependencies]
baml-ffi-x86_64-apple-darwin = { version = "0.1.0", path = "../baml-ffi-x86_64-apple-darwin" }

[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies]
baml-ffi-aarch64-apple-darwin = { version = "0.1.0", path = "../baml-ffi-aarch64-apple-darwin" }

[target.'cfg(all(target_arch = "x86_64", target_os = "windows", target_env = "msvc"))'.dependencies]
baml-ffi-x86_64-pc-windows-msvc = { version = "0.1.0", path = "../baml-ffi-x86_64-pc-windows-msvc" }
