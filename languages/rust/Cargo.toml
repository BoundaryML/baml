[workspace]
members = [
    "baml",
    "baml-macros",
    "baml-ffi-x86_64-unknown-linux-gnu",
    "baml-ffi-aarch64-unknown-linux-gnu",
    "baml-ffi-x86_64-apple-darwin",
    "baml-ffi-aarch64-apple-darwin",
    "baml-ffi-x86_64-pc-windows-msvc",
]
resolver = "2"

[workspace.package]
# Please update rustfmt.toml when bumping the Rust edition
edition = "2024"
# This is the MSRV (Minimum Supported Rust Version) for the workspace
rust-version = "1.89"
authors = ["Boundary <contact@boundaryml.com>"]
homepage = "https://github.com/BoundaryML/baml"
documentation = "https://docs.boundaryml.com"
repository = "https://github.com/BoundaryML/baml"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# external dependencies
libc = "0.2"
prost = "0.13"
prost-build = "0.13"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
thiserror = "2"

# internal dependencies
baml-macros = { version = "0.1.0", path = "baml-macros" }

[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
# Allowed pedantic lints
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
implicit_hasher = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
single_match_else = "allow"
too_many_lines = "allow"
needless_continue = "allow"
unnecessary_debug_formatting = "allow"
needless_raw_string_hashes = "allow"
# Disallowed restriction lints
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
# nursery rules
redundant_clone = "warn"
debug_assert_with_mut_call = "warn"
unused_peekable = "warn"
if_not_else = "allow"
large_stack_arrays = "allow"

[profile.release]
lto = "fat"
codegen-units = 16

[profile.dev]
lto = false
