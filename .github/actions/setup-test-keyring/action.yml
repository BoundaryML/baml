name: "Setup test credential store"
description: "Start an isolated, unlocked Linux Secret Service for CLI authentication tests"

runs:
  using: composite
  steps:
    - name: Start temporary Secret Service
      shell: bash
      run: |
        set -euo pipefail

        privilege=()
        if [ "$(id -u)" -ne 0 ]; then privilege=(sudo); fi
        "${privilege[@]}" apt-get update -qq
        "${privilege[@]}" apt-get install -y --no-install-recommends dbus gnome-keyring

        export XDG_DATA_HOME="$(mktemp -d "${RUNNER_TEMP}/baml-keyring-data.XXXXXX")"
        export XDG_RUNTIME_DIR="$(mktemp -d "${RUNNER_TEMP}/baml-keyring-runtime.XXXXXX")"
        export DBUS_SESSION_BUS_ADDRESS
        DBUS_SESSION_BUS_ADDRESS="$(dbus-daemon --session --fork --print-address=1)"
        printf '%s\n' 'baml-ci-test-keyring' | gnome-keyring-daemon --unlock --components=secrets --daemonize

        # Fail setup rather than running tests against an unavailable store.
        dbus-send --session --print-reply --dest=org.freedesktop.secrets \
          /org/freedesktop/secrets org.freedesktop.DBus.Peer.Ping

        printf 'DBUS_SESSION_BUS_ADDRESS=%s\nXDG_DATA_HOME=%s\nXDG_RUNTIME_DIR=%s\n' \
          "$DBUS_SESSION_BUS_ADDRESS" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
