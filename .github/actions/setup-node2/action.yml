# typescript2 is a separate pnpm workspace from the legacy root workspace.
name: Setup Node.js for typescript2
description: Install the pinned Node.js and pnpm tools through mise, then project dependencies.
inputs:
  working-directory:
    description: Directory containing pnpm-lock.yaml
    required: false
    default: typescript2
runs:
  using: composite
  steps:
    - name: Install Node.js and pnpm
      uses: ./.github/actions/setup-mise
      with:
        install_args: node@24 npm:pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: ${{ inputs.working-directory }}
