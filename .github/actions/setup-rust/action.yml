name: "Setup Rust"
description: "Setup Rust toolchain with caching and optional WASM support"

inputs:
  toolchain:
    description: "Rust toolchain version"
    required: false
    default: "1.93.0"
  enable-wasm:
    description: "Enable WASM support (adds wasm32-unknown-unknown target and wasm-pack)"
    required: false
    default: "false"
  wasm-pack-version:
    description: "wasm-pack version to install (only used when enable-wasm is true)"
    required: false
    default: "0.14.0"
  cross-version:
    description: "cross-rs crate version to install when cross is enabled"
    required: false
    default: "0.2.5"
  protoc-version:
    description: "Exact protoc version installed when protoc is enabled"
    required: false
    default: "23.4"
  rustup-init-version:
    description: "Archived rustup-init release used to bootstrap Windows ARM64"
    required: false
    default: "1.28.2"
  rustup-init-aarch64-windows-sha256:
    description: "Expected SHA-256 for the Windows ARM64 rustup-init bootstrap"
    required: false
    default: "de9f7d29ccd39efa59a3dda3ec363b396e09b92681229b9b8f6aaa4c84285e9c"
  enable-cross:
    description: "Enable cross-rs for cross-compilation"
    required: false
    default: "true"
  targets:
    description: "Additional Rust targets to install (space-separated)"
    required: false
    default: ""
  workspace:
    description: "Workspace path for Rust cache"
    required: false
    default: "engine"
  prefix-key:
    description: "Cache key prefix for Rust cache"
    required: false
    default: "key-1"
  cache-on-failure:
    description: "Cache even if the workflow fails"
    required: false
    default: "false"
  enable-cache:
    description: "Enable Rust cache"
    required: false
    default: "true"
  github-token:
    description: "GitHub token for API access (e.g., protoc installation)"
    required: false
    default: ${{ github.token }}
  skip-protoc:
    description: "Skip protoc installation (useful for cross-compilation targets)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Ensure rustup exists on Windows ARM64 runners
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_OS:-}" == "Windows" && "${RUNNER_ARCH:-}" =~ [Aa][Rr][Mm]64 ]]; then
          if ! command -v rustup >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              --output rustup-init.exe \
              "https://static.rust-lang.org/rustup/archive/${{ inputs.rustup-init-version }}/aarch64-pc-windows-msvc/rustup-init.exe"
            actual="$(sha256sum rustup-init.exe | awk '{print $1}')"
            expected="${{ inputs.rustup-init-aarch64-windows-sha256 }}"
            test "$actual" = "$expected"
            ./rustup-init.exe --default-toolchain none -y
            rm rustup-init.exe
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          fi
        fi

    # - name: Check for mise Rust installation
    #   id: check-rust
    #   run: |
    #     if command -v rustc &> /dev/null; then
    #       echo "rust-installed=true" >> $GITHUB_OUTPUT
    #       echo "Rust is already installed by mise"
    #       rustc --version
    #     else
    #       echo "rust-installed=false" >> $GITHUB_OUTPUT
    #     fi
    #   shell: bash

    - name: Setup Rust toolchain
      # if: steps.check-rust.outputs.rust-installed != 'true'
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: rustfmt

    - name: Add additional targets
      if: inputs.targets != ''
      run: |
        IFS=' ' read -ra TARGETS <<< "${{ inputs.targets }}"
        for target in "${TARGETS[@]}"; do
          echo "Installing target: $target"
          rustup target add "$target"
        done
      shell: bash

    - name: Setup Rust cache
      if: inputs.enable-cache == 'true'
      uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      with:
        workspaces: ${{ inputs.workspace }}
        prefix-key: ${{ inputs.prefix-key }}
        cache-on-failure: ${{ inputs.cache-on-failure }}

    - name: Add wasm32 target
      if: inputs.enable-wasm == 'true'
      run: rustup target add wasm32-unknown-unknown
      shell: bash

    - name: Install wasm-pack
      if: inputs.enable-wasm == 'true'
      run: cargo install wasm-pack --locked --version ${{ inputs.wasm-pack-version }}
      shell: bash

    - name: Install cross-rs
      if: inputs.enable-cross == 'true'
      run: cargo install cross --locked --version ${{ inputs.cross-version }}
      shell: bash

    - name: Install Protoc
      if: inputs.skip-protoc != 'true'
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
      with:
        version: ${{ inputs.protoc-version }}
        repo-token: ${{ inputs.github-token }}
