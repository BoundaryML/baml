name: Setup baml_language Rust
description: Install Rust through rustup, optional tools through mise, and load the repository R2 cache.
inputs:
  toolchain:
    description: Rust toolchain version
    required: false
    default: '1.98.0'
  enable-wasm:
    description: Add the wasm target and mise-pinned wasm-pack
    required: false
    default: 'false'
  enable-cross:
    description: Install mise-pinned cross-rs
    required: false
    default: 'true'
  targets:
    description: Additional Rust targets (space-separated)
    required: false
    default: ''
  skip-protoc:
    description: Skip mise-pinned protoc
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Bootstrap rustup when absent
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v rustup >/dev/null 2>&1; then
          if [[ "${RUNNER_OS:-}" == Windows ]]; then
            curl --fail --location --output rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe --default-toolchain none -y
            rm rustup-init.exe
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
        fi
    - name: Install Rust toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt
        rustup default "$TOOLCHAIN"
        echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
        for target in $TARGETS; do
          rustup target add --toolchain "$TOOLCHAIN" "$target"
        done
    - name: Export BAML build fingerprint
      shell: bash
      run: echo "BAML_GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
    - name: Setup R2 sccache
      uses: ./.github/actions/setup-sccache
    - name: Add wasm32 target
      if: inputs.enable-wasm == 'true'
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: rustup target add --toolchain "$TOOLCHAIN" wasm32-unknown-unknown
    - name: Install wasm-pack
      if: inputs.enable-wasm == 'true'
      uses: ./.github/actions/setup-mise
      with:
        install_args: github:rustwasm/wasm-pack
    - name: Install cross-rs
      if: inputs.enable-cross == 'true'
      uses: ./.github/actions/setup-mise
      with:
        install_args: cargo:cross
    - name: Install protoc
      if: inputs.skip-protoc != 'true'
      uses: ./.github/actions/setup-mise
      with:
        install_args: protoc
