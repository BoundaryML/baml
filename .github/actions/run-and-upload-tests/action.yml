name: "Run tests and analyze them in Trunk"
description: >-
  Runs a test command, enriches its JUnit report with source-file paths where
  the reporter cannot emit them, and uploads it to one Flaky Tests collection.
  The step fails when the tests fail: with quarantining off that is the test
  outcome, and with quarantining on Trunk clears failures it owns.

inputs:
  run:
    description: "Test command. Runs in bash."
    required: true
  working-directory:
    description: "Directory to run the test command in, relative to the repo root."
    required: false
    default: "."
  junit-path:
    description: "Path to the JUnit report, relative to the repo root."
    required: true
  collection:
    description: "Trunk test collection short ID. Each collection is a different grouping of tests, with its own monitors, quarantining settings, and ticketing settings."
    required: true
  normalize:
    description: "Reporter fixup to apply before uploading: 'nextest', 'node-test', 'prefix', or 'none'."
    required: false
    default: "none"
  cargo-manifest-path:
    description: "Cargo.toml the nextest report came from. Required when normalize is 'nextest'."
    required: false
    default: ""
  path-prefix:
    description: "Repo-relative directory the report's paths are relative to. Required when normalize is 'prefix'."
    required: false
    default: ""
  token:
    description: "Trunk organization token. Absent on fork PRs, which skips the upload."
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Enrichment has to land between the test run and the upload, so the
    # tests run here rather than through analytics-uploader's own `run`.
    - name: "Run tests"
      id: tests
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TEST_COMMAND: ${{ inputs.run }}
      run: eval "$TEST_COMMAND"

    # Best-effort: a missing path costs attribution, not correctness.
    - name: "Enrich the JUnit report"
      continue-on-error: true
      if: >-
        inputs.normalize != 'none' && inputs.token != ''
        && hashFiles(inputs.junit-path) != ''
      shell: bash
      run: |
        "$(command -v python3 || command -v python)" \
          .github/scripts/junit-normalize.py "${{ inputs.normalize }}" \
          "${{ inputs.junit-path }}" \
          --repo-root . \
          --manifest-path "${{ inputs.cargo-manifest-path || 'Cargo.toml' }}" \
          --prefix "${{ inputs.path-prefix }}"

    # This sets the step's outcome. If there are no test files,
    # previous-step-outcome is used. If there are test files, the pass or fail
    # is determined by whether there are any unquarantined test failures. When
    # quarantining is disabled, this matches the tests' own result.
    - name: "Analyze in Trunk"
      if: inputs.token != ''
      uses: trunk-io/analytics-uploader@v2
      with:
        junit-paths: ${{ inputs.junit-path }}
        org-slug: boundaryml
        token: ${{ inputs.token }}
        test-collection-id: ${{ inputs.collection }}
        previous-step-outcome: ${{ steps.tests.outcome }}
        allow-missing-junit-files: false
        repo-root: .

    # Fork PRs have no token, so nothing above gated the result.
    - name: "Fail on test failure when no upload gated it"
      if: steps.tests.outcome == 'failure' && inputs.token == ''
      shell: bash
      run: |
        echo "::error::tests failed and no Trunk token was available to gate the result"
        exit 1
