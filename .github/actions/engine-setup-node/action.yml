name: 'Setup Node.js and pnpm for engine'
description: 'Setup Node.js with pnpm package manager for engine workflows'

inputs:
  node-version:
    description: 'Node.js version to install'
    required: false
    # Includes the eMudhra CA distrust and CVE-2026-111497 Brotli fix.
    default: '22.23.4'
  pnpm-version:
    description: 'pnpm version to install'
    required: false
    default: '9.12.0'
  cache:
    description: 'Whether to cache the pnpm store'
    required: false
    default: 'true'
  install-dependencies:
    description: 'Whether to install dependencies with pnpm'
    required: false
    default: 'true'
  frozen-lockfile:
    description: 'Use frozen lockfile for installation'
    required: false
    default: 'true'
  enable-turbo-cache:
    description: 'Enable Turbo build cache using GitHub Actions cache'
    required: false
    default: 'true'
  turbo-cache-path:
    description: 'Path for Turbo cache directory'
    required: false
    default: '.turbo'
runs:
  using: 'composite'
  steps:
    - name: Cache Turbo build setup
      if: inputs.enable-turbo-cache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ inputs.turbo-cache-path }}
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        # pnpm/action-setup needs npm even on containers without a system Node.
        # Let the pnpm action restore its cache after pnpm is installed.
        package-manager-cache: false
        registry-url: "https://registry.npmjs.org"

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false
        cache: ${{ inputs.cache == 'true' }}
        cache_dependency_path: pnpm-lock.yaml

    - name: Install Node dependencies
      if: inputs.install-dependencies == 'true'
      run: pnpm install ${{ inputs.frozen-lockfile == 'true' && '--frozen-lockfile' || '' }}
      shell: bash
