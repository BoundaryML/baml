name: Setup Ruby
description: Install Ruby through the canonical mise action.
inputs:
  ruby-version:
    description: Ruby version to install
    required: false
    default: '3.2.2'
runs:
  using: composite
  steps:
    - name: Install Ruby
      uses: ./.github/actions/setup-mise
      with:
        install_args: ruby@${{ inputs.ruby-version }}
