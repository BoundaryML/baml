name: "Cache the Cargo target directory"
description: >-
  EXPERIMENT (do not merge). Restores and saves the whole Cargo target
  directory, workspace crates and test binaries included, and restores
  build-input timestamps so Cargo treats unchanged crates as fresh. Uses
  Astral's timestamp and pruning helpers around a plain actions/cache entry.
  Swatinem/rust-cache is not used for the target directory because its cleanup
  deletes integration-test binaries, bin targets, and path dependencies outside
  the workspace members (vendor/quanta), which forces them to rebuild.

inputs:
  workspace:
    description: "Cargo workspace directory, relative to the checkout"
    default: "baml_language"
  profile:
    description: "Profile directories inside target/, separated by newlines"
    default: "debug"
  key:
    description: "Distinguishes jobs whose builds differ (features, target, profile)"
    required: true

outputs:
  cache-hit:
    description: "'true' when an exact cache match was restored"
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: inputs
      uses: astral-sh/github-actions/rust-workspace-cache/inputs/prepare@61a5a2c7e0df1c0caf46fe5d1e74a4cb8a7205f8 # 2026.11.16.1
      with:
        workspace: ${{ inputs.workspace }}

    - id: cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ inputs.workspace }}/target
          ${{ steps.inputs.outputs.directory }}
        key: target-v2-${{ inputs.key }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/Cargo.lock', inputs.workspace), format('{0}/rust-toolchain.toml', inputs.workspace)) }}

    - uses: astral-sh/github-actions/rust-workspace-cache/inputs@61a5a2c7e0df1c0caf46fe5d1e74a4cb8a7205f8 # 2026.11.16.1
      with:
        workspace: ${{ inputs.workspace }}
        target-directory: target
        profile: ${{ inputs.profile }}
        directory: ${{ steps.inputs.outputs.directory }}
        save: ${{ steps.cache.outputs.cache-hit != 'true' }}

    # Post steps run in reverse order, so pruning finishes before the save.
    - uses: astral-sh/github-actions/rust-workspace-cache/prune@61a5a2c7e0df1c0caf46fe5d1e74a4cb8a7205f8 # 2026.11.16.1
      with:
        workspace: ${{ inputs.workspace }}
        target-directory: target
        profile: ${{ inputs.profile }}
        enabled: ${{ steps.cache.outputs.cache-hit != 'true' }}
