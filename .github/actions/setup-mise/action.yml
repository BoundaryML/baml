name: "Setup mise"
description: |
  Install mise and every tool pinned in mise.toml, sharing a single cache
  scope across every baml_language workflow.

  Centralizing the action version + cache settings here means future bumps
  (e.g. when jdx/mise-action ships a new major, or when we want to bust
  the cache prefix) only need to touch this one file.

  Cache key composition (per the jdx/mise-action README): the default
  cache key is `<prefix>-<platform>-<hash>`, where `<platform>` gives
  automatic cross-platform isolation and `<hash>` folds in both the
  mise.toml files and an install_args hash. So a cache entry is shared
  across workflows that run on the same platform AND pass the same
  `install_args` tool set — distinct tool sets are distinct entries by
  design (each holds a different set of installed tools). Our own
  `cache_key_prefix` (`mise-baml3`, not the upstream default) scopes the
  whole family, so bumping its trailing number busts every entry at once.

inputs:
  install_args:
    description: |
      Space-separated list of tool names passed through to `mise install`,
      restricting installation to just those tools (e.g. "github:rustwasm/wasm-pack"
      for a wasm-pack-only job). If empty, every tool in mise.toml is
      installed.

      Callers should pass the narrowest set their job actually uses —
      mise.toml has a lot of `cargo:*` entries (cargo-watch, ripgrep,
      just, bacon, cross, and prek) and even with binstall some
      of them fall back to source compiles or hit crates.io rate limits.
      Skipping them when they aren't needed is the cheapest win.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # cargo-binstall must be on PATH *before* `mise install` resolves
    # the `cargo:*` entries in mise.toml — otherwise mise's cargo
    # backend silently falls back to `cargo install` (compile from
    # source). With `cargo_binstall = true` set in mise.toml's [settings]
    # and cargo-binstall on PATH here, every `cargo:bacon`, `cargo:cross`,
    # `cargo:prek`, ... in mise.toml installs from a
    # prebuilt binary in seconds instead of minutes.
    #
    # Skipped when the job's install_args has no `cargo:*` entries
    # (and isn't the all-tools default) — there's nothing for binstall
    # to do then, and even the ~5s download adds up across the workflow.
    - name: Install cargo-binstall
      if: ${{ inputs.install_args == '' || contains(inputs.install_args, 'cargo:') }}
      uses: cargo-bins/cargo-binstall@main

    - name: Install mise
      uses: jdx/mise-action@v4.2.4
      env:
        # The default 10s timeout is too short for the precompiled Python
        # metadata endpoint during transient infrastructure slowdowns.
        MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 60
      with:
        fetch_from_github: false
        # Our own prefix (not the upstream default), shared across every
        # baml_language workflow. Bump the trailing number to invalidate
        # every consumer's cache at once.
        # v3 also prevents old caches from restoring mise 2025.10.13, which
        # cannot install the current Python layout or clang 22.1.7.
        cache_key_prefix: mise-baml3
        # Only WRITE the cache on canary — mirrors the Swatinem rust-cache
        # `save-if` on the same branch. mise-action's default cache key
        # includes an install_args hash, so each distinct tool set is its own
        # entry; letting every PR and merge-queue run save its own copy of each
        # (scoped to its own ref) is what produced dozens of `mise-baml2-*`
        # entries. Reads stay on (governed by `cache`), so PR/merge-queue runs
        # still RESTORE canary's caches — they just don't write new ones.
        cache_save: ${{ github.ref == 'refs/heads/canary' }}
        install_args: ${{ inputs.install_args }}
        # Keep mise's shims OFF $PATH. mise-action exports the concrete
        # installed-tool bin dirs into PATH directly, so the narrow set we
        # asked for via install_args still resolves. But if the shims dir is
        # on PATH, the first bare invocation of any shimmed tool (e.g. the
        # `sccache --version` verify step, or cargo using RUSTC_WRAPPER=sccache)
        # makes mise materialize the *whole* mise.toml environment, and with
        # MISE_YES=1 (set by mise-action) it auto-installs every other tool in
        # the config — cargo:bacon/cross/..., protoc, pnpm, etc. That
        # defeats install_args entirely and, on Windows where those cargo:*
        # tools fall back to failing source compiles, it breaks the job.
        add_shims_to_path: false

    - name: Disable mise task auto-install
      shell: bash
      run: |
        echo "disabling MISE_TASK_RUN_AUTO_INSTALL, all CI workflows must explicitly install the mise deps they use"
        echo "MISE_TASK_RUN_AUTO_INSTALL=false" >> "$GITHUB_ENV"
