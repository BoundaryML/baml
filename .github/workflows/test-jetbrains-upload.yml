name: Test JetBrains Upload Logic

on:
  push:
    branches:
      - sam/jetbrains
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions run ID to download artifacts from"
        type: string
        required: true
        default: "16376585916"

jobs:
  test-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        
      - name: Setup Java
        uses: ./.github/actions/setup-java
        
      # Download artifacts from the specified run
      - name: Download artifacts from run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.inputs.run_id || '16376585916' }}
          pattern: baml-jetbrains-zip
          path: ./jetbrains/build/distributions/
          merge-multiple: true
          
      - name: List downloaded extension zips
        run: ls -la ./jetbrains/build/distributions/
        
      - name: Verify artifact structure
        run: |
          echo "Checking artifact contents..."
          if [ -d "./jetbrains/build/distributions" ]; then
            echo "✅ Directory exists"
            ls -la ./jetbrains/build/distributions/
          else
            echo "❌ Directory does not exist"
            exit 1
          fi
          
      # Test the publish command (without actually publishing)
      - name: Test publish command (dry run)
        run: |
          cd ./jetbrains
          echo "Testing publish command structure..."
          echo "Would run: ./gradlew publishPlugin"
          echo "With token: ${{ secrets.SAM_INTELLIJ_PLATFORM_PUBLISH_TOKEN }}"
          # This will fail but shows the command would work
          ./gradlew publishPlugin --dry-run || echo "Expected failure - this is just testing the command structure"
        env:
          INTELLIJ_PLATFORM_PUBLISH_TOKEN: ${{ secrets.SAM_INTELLIJ_PLATFORM_PUBLISH_TOKEN }} 