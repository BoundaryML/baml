name: Docs Publishing (Reusable)

on:
  workflow_call:
    inputs:
      docs_changed:
        required: true
        type: string
      is_canary:
        required: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-docs
  cancel-in-progress: true

jobs:
  publish-docs:
    name: "publish docs"
    # PR previews run on ix; the canary publish stays on the ephemeral
    # Blacksmith runner it already used. Policy: jobs holding production
    # publish credentials (prod environment, FERN_TOKEN) never run on
    # persistent shared runners. Fork PRs also stay off the pool: its VMs are
    # reused by later trusted jobs.
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && !inputs.is_canary && fromJSON('["self-hosted", "ix"]')) || 'blacksmith-4vcpu-ubuntu-2404' }}
    # Skip outside the upstream repo: forks have no FERN_TOKEN, so `fern` fails
    # authentication and the whole job reports red on every PR.
    if: ${{ (inputs.docs_changed == 'true' || inputs.is_canary) && github.repository == 'BoundaryML/baml' }}
    permissions: write-all
    environment:
      name: ${{ inputs.is_canary && 'boundary-tools-prod' || 'boundary-tools-dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Start deployment
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: docs-${{ inputs.is_canary && 'prod' || 'dev' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Fern
        run: npm install -g fern-api

      - name: Check documentation
        run: fern check --strict-broken-links

      - name: Generate preview URL
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/canary" ]; then
            OUTPUT=$(fern generate --docs 2>&1) || true
          else
            OUTPUT=$(fern generate --docs --preview 2>&1) || true
          fi
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'Published docs to \K.*(?= \()')
          echo "🌿 Preview your docs: $URL" | tee preview_url.txt

      - name: Comment URL in PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: docs-preview
          path: preview_url.txt

      - name: Extract docs URL
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: docs_url
        run: |
          if [ -f preview_url.txt ]; then
            URL=$(cat preview_url.txt | grep -oP '🌿 Preview your docs: \K.*' || echo "")
            echo "url=$URL" >> $GITHUB_OUTPUT
          else
            echo "url=" >> $GITHUB_OUTPUT
          fi

      - name: Update deployment status
        uses: bobheadxi/deployments@v1
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: ${{ steps.deployment.outputs.env }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env_url: ${{ steps.docs_url.outputs.url }}
