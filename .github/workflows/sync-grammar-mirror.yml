# Sync the BAML grammar packages to their read-only mirror repos.
#
# The mirrors are the single external artifacts for every third-party consumer
# of BAML syntax highlighting. Grammar edits land in typescript2/pkg-grammar*
# packages; this workflow propagates them, so the mirrors must never be edited
# by hand:
#
#   pkg-grammar            → BoundaryML/textMate-baml
#       npm @boundaryml/baml-grammar (published by the mirror's own
#       publish.yml, which this sync also ships), the repo GitHub Linguist
#       vendors for .baml highlighting on github.com, the source URL the Shiki
#       grammar registry fetches from, and grammars/baml.sublime-syntax for
#       bat/Sublime Package Control.
#   pkg-grammar-hljs       → BoundaryML/baml-highlightjs
#       npm @boundaryml/baml-highlightjs (same publish.yml pattern).
#   pkg-grammar-treesitter → BoundaryML/baml-treesitter
#       consumed as a git repo (nvim-treesitter revisions, Zed grammar pins,
#       Helix); ships the generated src/parser.c.
#
# Auth: all mirror jobs use the shared GitHub token synced from Infisical's
# gh-baml-language-release environment. The token needs Contents write access
# to every mirror and Workflows write access because syncs can update each
# mirror's publish workflow.
#
# Versioning: npm-published mirrors get a patch bump + a v<version> git tag on
# every content change. The treesitter mirror is consumed by commit pin, so it
# gets commits only.
#
# Bootstrap note: npm OIDC trusted publishing cannot create a brand-new
# package. The first-ever npm publish must be done once by hand from a mirror
# checkout, then the trusted publisher (mirror repo + workflow publish.yml)
# configured in the npm package settings. Until then the final verify step
# fails; that is expected and is the reminder to finish setup.

name: Sync grammar mirror

on:
  push:
    branches: [canary]
    paths:
      - "typescript2/pkg-grammar/**"
      - "typescript2/pkg-grammar-hljs/**"
      - "typescript2/pkg-grammar-treesitter/**"
      - ".github/actions/setup-node2/**"
      - ".github/workflows/sync-grammar-mirror.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-grammar-mirror
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync-textmate:
    name: Sync to BoundaryML/textMate-baml
    runs-on: ubuntu-latest
    environment: infisical-github-baml-language-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js for typescript2
        uses: ./.github/actions/setup-node2

      - name: Build grammar artifacts
        working-directory: typescript2
        run: pnpm --filter @b/pkg-grammar build

      - name: Committed artifacts must match src/
        run: git diff --exit-code -- typescript2/pkg-grammar typescript2/app-vscode-ext

      - name: Run grammar tests
        working-directory: typescript2
        run: pnpm --filter @b/pkg-grammar test

      - name: Clone mirror
        env:
          GH_TOKEN: ${{ secrets.SAM_GITHUB_BOUNDARYML_READWRITE2 }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone --depth 50 https://github.com/BoundaryML/textMate-baml.git /tmp/mirror-repo

      - name: Assemble and diff against mirror
        id: diff
        run: |
          set -euo pipefail
          # Stamp with the mirror's current version first, so the version field
          # alone never registers as a content change (otherwise every rerun
          # would bump and republish).
          current="$(jq -r '.version // empty' /tmp/mirror-repo/package.json 2>/dev/null || true)"
          node typescript2/pkg-grammar/scripts/assemble-mirror.mjs \
            --out /tmp/mirror-package \
            ${current:+--version "$current"}
          rsync -a --delete --exclude .git /tmp/mirror-package/ /tmp/mirror-repo/
          if [ -n "$(git -C /tmp/mirror-repo status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git -C /tmp/mirror-repo status --porcelain
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Mirror already up to date."
          fi
          echo "current=${current}" >> "$GITHUB_OUTPUT"

      - name: Stamp next version, push, and tag
        id: push
        if: steps.diff.outputs.changed == 'true'
        env:
          CURRENT: ${{ steps.diff.outputs.current }}
          GH_TOKEN: ${{ secrets.SAM_GITHUB_BOUNDARYML_READWRITE2 }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Next version: patch bump on whichever is ahead of npm latest and
          # the mirror's own package.json (they can diverge if a publish
          # failed); 0.1.0 if the package has never existed anywhere.
          latest="$(npm view @boundaryml/baml-grammar version 2>/dev/null || true)"
          base="$(printf '%s\n%s\n' "$latest" "$CURRENT" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -z "$base" ]; then
            next="0.1.0"
          else
            next="$(echo "$base" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')"
          fi
          echo "version: base=${base:-<none>} next=${next}"
          jq --arg v "$next" '.version = $v' /tmp/mirror-repo/package.json > /tmp/pkg.json
          mv /tmp/pkg.json /tmp/mirror-repo/package.json

          cd /tmp/mirror-repo
          # -A, not commit -a: newly assembled files (dist/, package.json, the
          # publish workflow) are untracked in the mirror and -a would drop them.
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync from BoundaryML/baml@${SOURCE_SHA} (v${next})"
          # Tag every published version: bat submodules, Package Control, and
          # Linguist bumps all want stable tags to pin. --atomic so main can
          # never advance without its tag (a half-push would make the next run
          # see no content diff and skip re-tagging).
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "v${next}" -m "v${next}"
          git push --atomic origin main "v${next}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"

      - name: Verify npm publish landed
        if: steps.diff.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.push.outputs.version }}
        run: |
          set -euo pipefail
          echo "Waiting for @boundaryml/baml-grammar@${VERSION} to appear on npm (published by the mirror's publish.yml)..."
          for i in $(seq 1 40); do
            existing="$(npm view "@boundaryml/baml-grammar@${VERSION}" version 2>/dev/null || true)"
            if [ "$existing" = "$VERSION" ]; then
              echo "Published: @boundaryml/baml-grammar@${VERSION}"
              exit 0
            fi
            sleep 15
          done
          echo "::error::@boundaryml/baml-grammar@${VERSION} did not appear on npm within 10 minutes." \
            "Check the publish workflow run in BoundaryML/textMate-baml." \
            "If this is the first publish: npm OIDC cannot create a new package —" \
            "run 'npm publish --access public' once from a mirror checkout, then configure the" \
            "trusted publisher (repo BoundaryML/textMate-baml, workflow publish.yml) in the npm package settings."
          exit 1

  sync-highlightjs:
    name: Sync to BoundaryML/baml-highlightjs
    runs-on: ubuntu-latest
    environment: infisical-github-baml-language-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js for typescript2
        uses: ./.github/actions/setup-node2

      - name: Run highlight.js grammar tests
        working-directory: typescript2
        run: pnpm --filter @b/pkg-grammar-hljs test

      - name: Clone mirror
        env:
          GH_TOKEN: ${{ secrets.SAM_GITHUB_BOUNDARYML_READWRITE2 }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone --depth 50 https://github.com/BoundaryML/baml-highlightjs.git /tmp/mirror-repo

      - name: Assemble and diff against mirror
        id: diff
        run: |
          set -euo pipefail
          current="$(jq -r '.version // empty' /tmp/mirror-repo/package.json 2>/dev/null || true)"
          node typescript2/pkg-grammar-hljs/scripts/assemble-mirror.mjs \
            --out /tmp/mirror-package \
            ${current:+--version "$current"}
          rsync -a --delete --exclude .git /tmp/mirror-package/ /tmp/mirror-repo/
          if [ -n "$(git -C /tmp/mirror-repo status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git -C /tmp/mirror-repo status --porcelain
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Mirror already up to date."
          fi
          echo "current=${current}" >> "$GITHUB_OUTPUT"

      - name: Stamp next version, push, and tag
        id: push
        if: steps.diff.outputs.changed == 'true'
        env:
          CURRENT: ${{ steps.diff.outputs.current }}
          GH_TOKEN: ${{ secrets.SAM_GITHUB_BOUNDARYML_READWRITE2 }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest="$(npm view @boundaryml/baml-highlightjs version 2>/dev/null || true)"
          base="$(printf '%s\n%s\n' "$latest" "$CURRENT" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -z "$base" ]; then
            next="0.1.0"
          else
            next="$(echo "$base" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')"
          fi
          echo "version: base=${base:-<none>} next=${next}"
          jq --arg v "$next" '.version = $v' /tmp/mirror-repo/package.json > /tmp/pkg.json
          mv /tmp/pkg.json /tmp/mirror-repo/package.json

          cd /tmp/mirror-repo
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync from BoundaryML/baml@${SOURCE_SHA} (v${next})"
          # --atomic: main must never advance without its tag (see sync-textmate).
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "v${next}" -m "v${next}"
          git push --atomic origin main "v${next}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"

      - name: Verify npm publish landed
        if: steps.diff.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.push.outputs.version }}
        run: |
          set -euo pipefail
          echo "Waiting for @boundaryml/baml-highlightjs@${VERSION} to appear on npm (published by the mirror's publish.yml)..."
          for i in $(seq 1 40); do
            existing="$(npm view "@boundaryml/baml-highlightjs@${VERSION}" version 2>/dev/null || true)"
            if [ "$existing" = "$VERSION" ]; then
              echo "Published: @boundaryml/baml-highlightjs@${VERSION}"
              exit 0
            fi
            sleep 15
          done
          echo "::error::@boundaryml/baml-highlightjs@${VERSION} did not appear on npm within 10 minutes." \
            "Check the publish workflow run in BoundaryML/baml-highlightjs." \
            "If this is the first publish: npm OIDC cannot create a new package —" \
            "run 'npm publish --access public' once from a mirror checkout, then configure the" \
            "trusted publisher (repo BoundaryML/baml-highlightjs, workflow publish.yml) in the npm package settings."
          exit 1

  sync-treesitter:
    name: Sync to BoundaryML/baml-treesitter
    runs-on: ubuntu-latest
    environment: infisical-github-baml-language-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js for typescript2
        uses: ./.github/actions/setup-node2

      - name: Run tree-sitter grammar tests
        working-directory: typescript2
        run: pnpm --filter @b/pkg-grammar-treesitter test

      - name: Clone mirror
        env:
          GH_TOKEN: ${{ secrets.SAM_GITHUB_BOUNDARYML_READWRITE2 }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone --depth 50 https://github.com/BoundaryML/baml-treesitter.git /tmp/mirror-repo

      - name: Assemble and diff against mirror
        id: diff
        run: |
          set -euo pipefail
          node typescript2/pkg-grammar-treesitter/scripts/assemble-mirror.mjs \
            --out /tmp/mirror-package
          rsync -a --delete --exclude .git /tmp/mirror-package/ /tmp/mirror-repo/
          if [ -n "$(git -C /tmp/mirror-repo status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git -C /tmp/mirror-repo status --porcelain
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Mirror already up to date."
          fi

      - name: Push
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SAM_GITHUB_BOUNDARYML_READWRITE2 }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd /tmp/mirror-repo
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync from BoundaryML/baml@${SOURCE_SHA}"
          git push origin main
