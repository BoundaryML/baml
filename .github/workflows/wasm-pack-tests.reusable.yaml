# @generated by `cargo xtask workflows` from tools_xtask::workflows::wasm_pack_tests -- DO NOT EDIT.
# Rebuild with: cd baml_language && cargo xtask workflows
name: WASM Pack Tests (Reusable)
env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  wasm-pack-test:
    name: wasm-pack test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - name: Checkout
      uses: useblacksmith/checkout@v1
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: |-
        rustup show
        rustup target add wasm32-unknown-unknown
      working-directory: baml_language
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: baml_language -> target
        shared-key: linux-wasm
        save-if: 'false'
    - name: Fetch cargo dependencies
      run: cargo fetch --target wasm32-unknown-unknown
      working-directory: baml_language
    - name: Install mise
      uses: ./.github/actions/setup-mise
      with:
        install_args: cargo:wasm-pack
    - name: Run wasm-pack tests (sys_llm)
      run: wasm-pack test --node crates/sys_llm
      working-directory: baml_language
    timeout-minutes: 20
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-wasm-pack-tests
  cancel-in-progress: true
defaults:
  run:
    shell: bash
