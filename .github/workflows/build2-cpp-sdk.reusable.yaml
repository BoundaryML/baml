name: BAML SDK Release - Build C++

on:
  workflow_call:
    inputs:
      release_plan_json:
        description: "Frozen BAML language release-plan.json content"
        type: string
        default: ""
        required: false
      source_sha:
        description: "Exact repository commit to build"
        type: string
        default: ""
        required: false

concurrency:
  # suffix is important to prevent a concurrency deadlock with the calling workflow
  group: ${{ github.workflow }}-${{ github.ref }}-build-cpp-sdk
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            before: |
              sudo apt-get update
              sudo apt-get install -y musl-tools
              echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            before: |
              sudo apt-get update
              sudo apt-get install -y musl-tools
              echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest

    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Stamp release plan
        env:
          RELEASE_PLAN_JSON: ${{ inputs.release_plan_json }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_PLAN_JSON:-}" ]]; then
            printf '%s\n' "$RELEASE_PLAN_JSON" > release-plan.json
          else
            scripts/baml-language-version plan --channel canary --out release-plan.json
          fi
          scripts/baml-language-version stamp --plan release-plan.json

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          workspace: baml_language
          prefix-key: v1-rust-baml-language-cpp-sdk-${{ matrix.target }}
          cache-on-failure: true
          enable-cross: false
          skip-protoc: true

      - name: Build tools setup
        if: matrix.before
        run: ${{ matrix.before }}

      - name: Package baml-cpp tarball
        env:
          BAML_CPP_TARGET: ${{ matrix.target }}
        run: baml_language/scripts/package_cpp_tarball.sh

      # aarch64 Windows is cross-compiled on an x86_64 runner, so the
      # produced dll cannot be executed there. Windows smoke coverage on
      # x86_64 needs an MSVC-driven link step and is tracked separately;
      # the unix targets all run the real user-consumption path.
      - name: Smoke test tarball
        if: ${{ !contains(matrix.target, 'windows') }}
        run: baml_language/scripts/smoke_cpp_tarball.sh

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: cpp-sdk-${{ matrix.target }}
          path: |
            baml_language/target/cpp-dist/*.tar.gz
            baml_language/target/cpp-dist/*.tar.gz.sha256
          if-no-files-found: error
