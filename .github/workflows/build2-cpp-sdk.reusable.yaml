name: BAML SDK Release - Build C++

on:
  workflow_call:
    inputs:
      release_plan_json:
        description: "Frozen BAML language release-plan.json content"
        type: string
        required: true
      source_sha:
        description: "Exact repository commit to build"
        type: string
        required: true

concurrency:
  # suffix is important to prevent a concurrency deadlock with the calling workflow
  group: ${{ github.workflow }}-${{ github.ref }}-build-cpp-sdk
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Matrices are derived from the repository-owned platform contract so the
  # target list is not another copied YAML matrix (bridge-release-contract.md).
  platform-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          sparse-checkout: release
      - id: derive
        run: |
          set -euo pipefail
          matrix="$(jq -c '{include: [.targets[] | select(.sdks.cpp != null and .sdks.cpp != "unsupported")]}' release/platforms.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: platform-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platform-matrix.outputs.matrix) }}
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Stamp release plan
        env:
          RELEASE_PLAN_JSON: ${{ inputs.release_plan_json }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_PLAN_JSON" > release-plan.json
          scripts/baml-language-version stamp --plan release-plan.json

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          workspace: baml_language
          prefix-key: v1-rust-baml-language-cpp-sdk-${{ matrix.target }}
          cache-on-failure: true
          enable-cross: false
          skip-protoc: true

      - name: Setup musl toolchain
        if: matrix.libc == 'musl'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          target='${{ matrix.target }}'
          cc_var="CC_$(echo "$target" | tr '-' '_')"
          linker_var="CARGO_TARGET_$(echo "$target" | tr 'a-z-' 'A-Z_')_LINKER"
          echo "$cc_var=musl-gcc" >> "$GITHUB_ENV"
          echo "$linker_var=musl-gcc" >> "$GITHUB_ENV"

      - name: Package baml-cpp tarball
        env:
          BAML_CPP_TARGET: ${{ matrix.target }}
        run: baml_language/scripts/package_cpp_tarball.sh

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: cpp-sdk-${{ matrix.target }}
          path: |
            baml_language/target/cpp-dist/*.tar.gz
            baml_language/target/cpp-dist/*.tar.gz.sha256
          if-no-files-found: error

  # Consumer verification: download the assembled artifact and use it exactly
  # as a user would (headers + library only, no repository build tree), on a
  # native runner for every target. musl artifacts are smoked inside a real
  # musl userspace (Alpine container), not against the glibc host.
  verify:
    needs: [platform-matrix, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platform-matrix.outputs.matrix) }}
    name: verify ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: cpp-sdk-${{ matrix.target }}
          path: cpp-dist

      - name: Resolve expected version
        env:
          RELEASE_PLAN_JSON: ${{ inputs.release_plan_json }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_PLAN_JSON" > release-plan.json
          expected="$(jq -r .canonical_version release-plan.json)"
          echo "BAML_EXPECTED_VERSION=$expected" >> "$GITHUB_ENV"

      - name: Verify checksum
        run: |
          set -euo pipefail
          cd cpp-dist
          if command -v sha256sum > /dev/null; then
            sha256sum -c ./*.tar.gz.sha256
          else
            shasum -a 256 -c ./*.tar.gz.sha256
          fi

      - name: Smoke test (unix)
        if: matrix.libc != 'musl' && !contains(matrix.target, 'windows')
        run: baml_language/scripts/smoke_cpp_tarball.sh cpp-dist/*.tar.gz

      - name: Smoke test (musl container)
        if: matrix.libc == 'musl'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work -e BAML_EXPECTED_VERSION \
            ${{ matrix.smoke_container }} \
            sh -c "apk add --no-cache bash g++ tar && bash baml_language/scripts/smoke_cpp_tarball.sh cpp-dist/*.tar.gz"

      - name: Smoke test (windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $tarball = (Get-ChildItem cpp-dist/*.tar.gz | Select-Object -First 1).FullName
          baml_language/scripts/smoke_cpp_tarball.ps1 -Tarball $tarball -MsvcArch ${{ matrix.msvc_arch }}
