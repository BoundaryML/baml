name: BAML SDK Release - Build Python

on:
  workflow_call:
    secrets:
      BAML_SCCACHE_R2_ACCESS_KEY_ID:
        required: false
      BAML_SCCACHE_R2_SECRET_ACCESS_KEY:
        required: false
    inputs:
      release_plan_json:
        description: "Frozen BAML language release-plan.json content"
        type: string
        default: ""
        required: false
      source_sha:
        description: "Exact repository commit to build"
        type: string
        default: ""
        required: false
  push:
    branches:
      - sam/publish-python
      - sam/sdks-rename

concurrency:
  # suffix is important to prevent a concurrency deadlock with the calling workflow
  group: ${{ github.workflow }}-${{ github.ref }}-build-python-sdk
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BAML_SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.BAML_SCCACHE_R2_ACCESS_KEY_ID }}
  BAML_SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BAML_SCCACHE_R2_SECRET_ACCESS_KEY }}

jobs:
  # Targets and their runner/manylinux/architecture/container come from
  # `release/platforms.json`, not a hand-copied matrix list.
  matrix:
    name: Compute target matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Generate the python build matrix from the platform contract
        id: gen
        run: |
          set -euo pipefail
          # target + python runner (as `runs_on`) + optional manylinux tag +
          # optional python-setup architecture and build container.
          # maturin/setup-python treat an absent field as empty, so
          # only-when-set matches the old matrix.
          include="$(jq -c '[.targets[]
            | select(.artifacts.python != null)
            | .artifacts.python as $p
            | {target: .triple, runs_on: $p.runner}
              + (if $p.manylinux then {manylinux: $p.manylinux} else {} end)
              + (if $p.container then {container: $p.container} else {} end)
              + (if $p.architecture then {architecture: $p.architecture} else {} end)]' release/platforms.json)"
          echo "include=$include" >> "$GITHUB_OUTPUT"
          jq . <<<"$include"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        _: ${{ fromJson(needs.matrix.outputs.include) }}

    name: ${{ matrix._.target }}
    runs-on: ${{ matrix._.runs_on }}
    steps:

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Stamp release plan
        env:
          RELEASE_PLAN_JSON: ${{ inputs.release_plan_json }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_PLAN_JSON:-}" ]]; then
            printf '%s\n' "$RELEASE_PLAN_JSON" > release-plan.json
          else
            scripts/baml-language-version plan --channel canary --out release-plan.json
          fi
          scripts/baml-language-version stamp --plan release-plan.json

      # Preserve the host Python versions used for the abi3 build through mise.
      # ARM64 Windows needs Python 3.11; other platforms use 3.10.
      - name: Setup Python
        uses: ./.github/actions/setup-mise
        with:
          install_args: python@${{ matrix._.target == 'aarch64-pc-windows-msvc' && '3.11' || '3.10' }}
      - name: Setup Rust and R2 sccache
        uses: ./.github/actions/setup-rust
        with:
          enable-cross: 'false'
          skip-protoc: 'true'

      - name: Locate mise sccache for the wheel container
        id: wheel-cache
        if: runner.os == 'Linux'
        run: echo "binary=$(command -v sccache)" >> "$GITHUB_OUTPUT"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          # see https://github.com/PyO3/maturin/issues/2110
          XWIN_VERSION: "16"
        with:
          target: ${{ matrix._.target }}
          # Use the same mise-installed sccache and R2 credentials in manylinux
          # containers. maturin-action's own sccache input uses GitHub caching.
          sccache: false
          docker-options: >-
            -v ${{ steps.wheel-cache.outputs.binary }}:/usr/local/bin/sccache:ro
            -e BAML_SCCACHE_R2_ACCESS_KEY_ID
            -e BAML_SCCACHE_R2_SECRET_ACCESS_KEY
          command: build
          working-directory: baml_language/sdks/python
          # No --manifest-path: that flag would make maturin resolve the
          # symlinked rust/bridge_python/pyproject.toml and then look for
          # python-source in rust/bridge_python/src/, which is empty
          # scaffolding for pyo3-stub-gen. [tool.maturin] manifest-path in
          # pyproject.toml already points at the right Cargo.toml.
          #
          # `--release` is `panic = "unwind"` workspace-wide: the engine is
          # embedded in the user's process, so the bridge's catch_unwind boundary
          # must be able to turn an engine panic into a catchable BamlPanic
          # instead of SIGABRT'ing the host. See the profile comment in
          # baml_language/Cargo.toml.
          args: --release --strip --out dist
          manylinux: ${{ matrix._.manylinux }}
          # Explicit musl images bypass maturin-action's implicit GHCR defaults.
          container: ${{ matrix._.container }}
          before-script-linux: |
            export PATH="$GITHUB_WORKSPACE/tools:$PATH"
            if command -v yum &> /dev/null; then
                yum update -y && yum install -y perl-core openssl openssl-devel pkgconfig libatomic
            else
                # apt-based images don't need anything extra today
                :
            fi

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-sdk-${{ matrix._.target }}
          path: baml_language/sdks/python/dist
          if-no-files-found: error
