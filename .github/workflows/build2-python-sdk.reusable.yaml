name: BAML SDK Release - Build Python

on:
  workflow_call:
    inputs:
      release_plan_json:
        description: "Frozen BAML language release-plan.json content"
        type: string
        default: ""
        required: false
      source_sha:
        description: "Exact repository commit to build"
        type: string
        default: ""
        required: false
  push:
    branches:
      - sam/publish-python
      - sam/sdks-rename

concurrency:
  # suffix is important to prevent a concurrency deadlock with the calling workflow
  group: ${{ github.workflow }}-${{ github.ref }}-build-python-sdk
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Target set + per-target runner/manylinux/architecture come from the platform
  # contract (`baml_language/crates/baml_release/platforms.json`), not a hand-copied matrix list.
  matrix:
    name: Compute target matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Generate the python build matrix from the platform contract
        id: gen
        run: |
          set -euo pipefail
          # target + python runner (as `runs_on`) + optional manylinux tag +
          # optional python-setup architecture. maturin/setup-python treat an
          # absent field as empty, so only-when-set matches the old matrix.
          include="$(jq -c '[.targets[]
            | select(.artifacts.python != null)
            | .artifacts.python as $p
            | {target: .triple, runs_on: $p.runner}
              + (if $p.manylinux then {manylinux: $p.manylinux} else {} end)
              + (if $p.architecture then {architecture: $p.architecture} else {} end)]' baml_language/crates/baml_release/platforms.json)"
          echo "include=$include" >> "$GITHUB_OUTPUT"
          jq . <<<"$include"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        _: ${{ fromJson(needs.matrix.outputs.include) }}

    name: ${{ matrix._.target }}
    runs-on: ${{ matrix._.runs_on }}
    steps:
      - name: Setup build environment (ARM64 Windows)
        if: matrix._.target == 'aarch64-pc-windows-msvc'
        shell: powershell
        run: |
          # rustup is not preinstalled on aarch64 Windows runners
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
              Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe" -OutFile "rustup-init.exe"
              .\rustup-init.exe --default-toolchain stable -y
              Remove-Item "rustup-init.exe"
              Add-Content -Path "$env:GITHUB_PATH" -Value "$env:USERPROFILE\.cargo\bin" -Encoding utf8
          }

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Stamp release plan
        env:
          RELEASE_PLAN_JSON: ${{ inputs.release_plan_json }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_PLAN_JSON:-}" ]]; then
            printf '%s\n' "$RELEASE_PLAN_JSON" > release-plan.json
          else
            scripts/baml-language-version plan --channel canary --out release-plan.json
          fi
          scripts/baml-language-version stamp --plan release-plan.json

      # NOTE: we deliberately do NOT use ./.github/actions/setup-mise here.
      # The host Python version pins the abi3 floor of the resulting wheel,
      # so we want a specific Python (3.10, matching the abi3-py310 target)
      # rather than whatever mise.toml's `python` is pinned to today.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          # abi3-py310 produces one interpreter-agnostic wheel per platform,
          # so a single Python is enough for the whole 3.10..3.13+ range.
          # ARM64 Windows: setup-python doesn't ship a 3.10 build for that
          # architecture, so use 3.11 there. The wheel is still abi3-py310
          # (built against the 3.10 stable ABI), so this only affects which
          # interpreter hosts the build.
          python-version: ${{ matrix._.target == 'aarch64-pc-windows-msvc' && '3.11' || '3.10' }}
          architecture: ${{ matrix._.architecture }}
          allow-prereleases: true

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          # see https://github.com/PyO3/maturin/issues/2110
          XWIN_VERSION: "16"
        with:
          target: ${{ matrix._.target }}
          command: build
          working-directory: baml_language/sdks/python
          # No --manifest-path: that flag would make maturin resolve the
          # symlinked rust/bridge_python/pyproject.toml and then look for
          # python-source in rust/bridge_python/src/, which is empty
          # scaffolding for pyo3-stub-gen. [tool.maturin] manifest-path in
          # pyproject.toml already points at the right Cargo.toml.
          #
          # `--profile release-bridge-python` (not `--release`): the engine is
          # embedded in the user's process, so it must be built `panic = "unwind"`
          # for the bridge's catch_unwind boundary to turn an engine panic into a
          # catchable BamlPanic instead of SIGABRT'ing the host. See the profile
          # comment in baml_language/Cargo.toml.
          args: --profile release-bridge-python --strip --out dist
          manylinux: ${{ matrix._.manylinux }}
          before-script-linux: |
            if command -v yum &> /dev/null; then
                yum update -y && yum install -y perl-core openssl openssl-devel pkgconfig libatomic
            else
                # apt-based images don't need anything extra today
                :
            fi

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-sdk-${{ matrix._.target }}
          path: baml_language/sdks/python/dist
          if-no-files-found: error
