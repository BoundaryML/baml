  dry-run-artifacts:
    name: Generate dry-run manifests and package files
    needs: [plan, all-builds]
    if: ${{ needs.plan.outputs.dry_run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: toolchain-*
          path: dist/toolchain
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: bridge-cffi-*
          path: dist/cffi
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: wrapper-*
          path: dist/wrapper
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: baml-vscode-vsix
          path: dist/vsix
      - uses: actions/download-artifact@v4
        with:
          name: csharp-product-package
          path: dist/csharp
      - uses: actions/download-artifact@v4
        with:
          name: swift-xcframework
          path: dist/swift
      - name: Generate dry-run files
        env:
          WRAPPER_CHANGED: ${{ needs.plan.outputs.wrapper_changed }}
          CRATES_IO_VERSION: ${{ needs.plan.outputs.crates_io_version }}
          NUGET_VERSION: ${{ needs.plan.outputs.nuget_version }}
          SWIFTPM_VERSION: ${{ needs.plan.outputs.swiftpm_version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASED_AT: ${{ needs.plan.outputs.released_at }}
          PYPI_VERSION: ${{ needs.plan.outputs.pypi_version }}
          WRAPPER_VERSION: ${{ needs.plan.outputs.wrapper_version }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$WRAPPER_CHANGED" == "true" ]]; then
            args+=(--wrapper-changed)
          fi
          # Dry-run rehearses the real manifest shape and binds it to the exact
          # verified native packages even though no registry mutation occurs.
          (
            cd dist/csharp
            sha256sum -c product-package.sha256
          )
          csharp_digest="$(cut -d ' ' -f 1 \
            dist/csharp/product-package.sha256)"
          mapfile -t swift_packages < <(
            find dist/swift -maxdepth 1 -type f \
              -name 'BamlBridgeFFI-*.xcframework.zip' -print
          )
          if [[ "${#swift_packages[@]}" -ne 1 ]]; then
            echo "::error::expected exactly one verified Swift XCFramework zip"
            exit 1
          fi
          swift_digest="$(sha256sum "${swift_packages[0]}" | cut -d ' ' -f 1)"
          args+=(
            --crates-io-version "$CRATES_IO_VERSION"
            --nuget-version "$NUGET_VERSION"
            --nuget-package-sha256 "$csharp_digest"
            --swiftpm-version "$SWIFTPM_VERSION"
            --swift-package-sha256 "$swift_digest"
          )
          scripts/baml-release-manifests \
            --toolchain-dir dist/toolchain \
            --cffi-dir dist/cffi \
            --wrapper-dir dist/wrapper \
            --vsix-dir dist/vsix \
            --out dry-run/manifest/v1 \
            --channel "$CHANNEL" \
            --version "$VERSION" \
            --released-at "$RELEASED_AT" \
            --pypi-version "$PYPI_VERSION" \
            --wrapper-version "$WRAPPER_VERSION" \
            "${args[@]}"
          scripts/baml-package-manager-artifacts \
            --wrapper-dir dist/wrapper \
            --version "$WRAPPER_VERSION" \
            --out dry-run/package-manager
      - uses: actions/upload-artifact@v4
        with:
          name: dry-run-release-files
          path: dry-run
      - uses: aws-actions/configure-aws-credentials@v6
        if: ${{ needs.plan.outputs.source_branch == 'canary' }}
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: baml-language-dry-run-${{ github.run_id }}
      - name: Upload public dry-run manifests
        if: ${{ needs.plan.outputs.source_branch == 'canary' }}
        run: |
          set -euo pipefail
          aws s3 sync dry-run/manifest/v1 "s3://$PKG_BUCKET/dryrun/${{ github.run_id }}/manifest/v1" \
            --content-type application/json \
            --cache-control "public, max-age=300"

  dry-run-summary:
    name: Dry-run summary
    needs: [plan, all-builds, dry-run-artifacts]
    if: ${{ needs.plan.outputs.dry_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          base="https://pkg.boundaryml.com/dryrun/${{ github.run_id }}/manifest/v1"
          {
            if [[ "${{ github.ref }}" == "refs/heads/canary" ]]; then
              echo "Dry-run manifest base: $base"
            else
              echo "Dry-run files were uploaded as the dry-run-release-files workflow artifact."
            fi
            echo
            echo 'Validation example:'
            echo '```bash'
            echo "BAML_HOME=\"\$(mktemp -d)\" BAML_MANIFEST_BASE_URL=\"$base\" baml toolchain use ${{ needs.plan.outputs.channel }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  notify-slack:
    name: Notify Slack
    needs:
      - plan
      - build-matrix
      - build-toolchain
      - build-vsix
      - build-wrapper
      - build-python-sdk
      - build-nodejs-sdk
      - build-java-sdk
      - build-web-sdk
      - build-bridge-cffi
      - build-go-sdk
      - verify-cpp-sdk
      - build-rust-sdk
      - verify-rust-sdk
      - all-builds
      - publish-pypi
      - publish-nodejs-sdk
      - publish-web-sdk
      - publish-maven
      - publish-gradle-plugin
      - publish-toolchain-release
      - publish-wrapper-release
      - publish-bridge-cffi-release
      - publish-go-sdk
      - publish-crates-io
      - publish-pkg-boundaryml-com
      - smoke-go-release
      - publish-homebrew
      # AUR is temporarily absent from the release graph during maintenance.
      # - publish-aur
      - dry-run-artifacts
      - dry-run-summary
      - build-swift-sdk
      - verify-swift-sdk
      - prepare-csharp-sdk
      - verify-csharp-sdk
      - publish-csharp-sdk
      - release-prerequisites-complete
      - release-complete
      - publish-pkg-channel
      - smoke-swift-release
    # Use the dispatch input so a failure in plan itself is still reportable.
    # This job must run after failed dependencies. Every production release result notifies Slack, including successful nightlies.
    if: ${{ always() && inputs.dry_run == false && (needs.plan.outputs.source_branch == 'canary' || (needs.plan.result == 'failure' && github.ref_type == 'tag' && github.ref_name == format('baml-language-source-{0}', inputs.source_sha))) }}
    runs-on: ubuntu-latest
    environment: boundary-tools-dev
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha || github.sha }}
          sparse-checkout: |
            .github/actions/setup-mise
            mise.toml
            tools/notify-release-failure.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install_args: uv
      - name: Notify Slack of the release result
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_CHANNEL: "#general"
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOUNDARY_BOT_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          RELEASE_SUCCEEDED: ${{ needs.publish-pkg-channel.result == 'success' }}
        run: uv run --script tools/notify-release-failure.py
