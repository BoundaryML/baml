name: Pages

# The repository's GitHub Pages site, whole, in one workflow.
#
# Pages serves what the last deploy uploaded, and a deploy uploads a complete
# site. There is therefore exactly one publisher: two workflows deploying
# independently would each erase the other's half. Both tools that live on the
# site are built here and deployed together — the stdlib matrix at the root,
# the type-system quiz under `type-quiz/`.
#
# The coupling that buys is real and deliberate: a commit touching either tool
# rebuilds and republishes the whole site. What it avoids is a second
# publishing mechanism, and a site that silently loses half of itself the
# first time both tools land in the same hour.
#
# THE MATRIX is built from canary, on the commits that can change what it
# says: the stdlib surface, its tool, its page, and the pinned TypeScript the
# surface is compared against. It was built from whatever the last release
# cut, which described the stdlib as it was rather than as it is, and the page
# fell behind canary by however long a release cycle took.
#
# Its cost is bounded by the report already published, fetched and passed as
# `--previous`: a symbol whose declaration and references are unchanged keeps
# the judgement it has and is never sent to a model again. `run --check`
# compares the INPUTS that report was built from, so a commit that did not
# move the stdlib costs a build and no model calls. A cold run judges the
# whole surface and has to be asked for by dispatch, so that a site outage
# cannot turn an unrelated commit into one.
#
# THE QUIZ is built from one checkout in one job, and must be: its SDK's
# bytecode is stamped with the commit it was generated at and the bridge
# refuses a mismatch, so a bridge from an earlier build strands the page. On a
# pull request touching it, this is its real check — the workspace-wide
# typecheck skips it, since the generated inputs do not exist in a bare
# checkout — and nothing is published.

on:
  push:
    branches: [canary]
    paths:
      # The quiz.
      - "typescript2/app-type-quiz/**"
      - "baml_language/tools/type_quiz/**"
      - "baml_language/crates/baml_fmt_wasm/**"
      # The matrix. The TypeScript its surface is compared against is pinned
      # in the root manifest and resolved by the lockfile beside it.
      - "baml_language/crates/baml_builtins2/baml_std/**"
      - "tools/stdlib-matrix/**"
      - "typescript2/app-stdlib-matrix/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "typescript2/app-type-quiz/**"
      - "baml_language/tools/type_quiz/**"
      - "baml_language/crates/baml_fmt_wasm/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Judge the whole stdlib surface, ignoring what is published"
        type: boolean
        default: false
        required: false

# Never cancel in flight: a cancelled run can leave Pages mid-deploy, and the
# matrix is expensive enough that finishing beats starting over.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

# Compiling is nearly all of what these jobs do, and sccache is what the rest
# of the repo compiles against: a content-addressed store in R2, keyed by what
# a rustc invocation would produce. It is the cache that works: on the morning
# the daily refresh purged every Actions cache, the canary wasm job answered
# 468 compiles from it with no misses and finished in 58 seconds.
#
# There is deliberately no Actions cache here. Swatinem/rust-cache folds the
# runner's toolchain list and the set of CARGO_*/RUST* variables into its key,
# so only a job set up exactly like the one that writes the key can read it —
# a condition this workflow does not meet on ubuntu-latest, and one that is
# silently broken elsewhere too (`wasm-pack test`, on the writer's own runner
# and the same lockfile, logs "No cache found"). A step that cannot hit is
# worse than no step: it reads as caching. sccache asks nothing of the runner.
env:
  # .envrc is the single source of truth for the rest; it maps these two to
  # the AWS_* names sccache wants. Absent on a fork, where sccache falls back
  # to a runner-local cache and the build is simply cold.
  BAML_SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.BAML_SCCACHE_R2_ACCESS_KEY_ID }}
  BAML_SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BAML_SCCACHE_R2_SECRET_ACCESS_KEY }}
  # sccache cannot cache an incremental compile and declines every one of
  # them, so leaving this on would cost the whole cache.
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  quiz:
    name: "Build the quiz"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js, pnpm, wasm-pack, sccache, and direnv
        uses: ./.github/actions/setup-mise
        with:
          install_args: "node npm:pnpm github:rustwasm/wasm-pack sccache direnv"

      - name: Setup Rust WASM target
        working-directory: baml_language
        run: |
          set -euo pipefail
          rustup show
          rustup target add wasm32-unknown-unknown

      - name: "Verify sccache"
        run: sccache --version

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # The release bridge: 15 MB of WebAssembly, against 100 for the debug
      # build the local `pnpm prepare:deps` makes.
      - name: Build the web bridge
        working-directory: baml_language/sdks/typescript/bridge_typescript_web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts
          pnpm build
          test -s dist/wasm/bridge_web_core_bg.wasm

      - name: Build the compiler
        working-directory: baml_language
        run: cargo build -p baml_cli

      - name: Install workspace dependencies
        working-directory: typescript2
        run: pnpm install --frozen-lockfile

      # The SDK and the formatter are generated from this checkout, beside the
      # bridge built from it: the same commit throughout.
      - name: Generate the SDK and build the formatter
        working-directory: typescript2/app-type-quiz
        env:
          BAML_AGENT_SKILL_CHECK: "off"
        run: |
          set -euo pipefail
          pnpm generate
          pnpm build:wasm
          test -s src/baml_sdk/index.ts
          test -s wasm/baml_fmt_wasm_bg.wasm

      - name: Typecheck and lint
        working-directory: typescript2/app-type-quiz
        run: |
          set -euo pipefail
          pnpm typecheck:strict
          pnpm exec biome check src scripts

      - name: Build the site
        working-directory: typescript2/app-type-quiz
        env:
          TYPE_QUIZ_COMMIT: ${{ github.sha }}
        run: pnpm build

      - name: Drive it in a browser
        working-directory: typescript2/app-type-quiz
        env:
          BAML_AGENT_SKILL_CHECK: "off"
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          pnpm test:smoke

      # What the cache did, in the job that used it: a hit rate that falls
      # says the compile is being paid for again, which is the whole cost of
      # this job.
      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Upload the quiz site"
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: quiz-site
          path: typescript2/app-type-quiz/dist
          if-no-files-found: error

  matrix:
    name: "Build the stdlib matrix"
    # Nothing to publish from a pull request, and the model calls below are
    # not something a fork can ask for.
    if: github.event_name != 'pull_request' && github.repository == 'BoundaryML/baml'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # A cold run is ~200 sessions, each up to seven model calls plus the
    # subprocess lookups between them, eight sessions at a time. An incremental
    # run is minutes; this bound is for the cold one.
    timeout-minutes: 120
    # Holds OPENAI_API_KEY.
    #
    # -prod rather than -dev: the key in -dev was rejected on every one of 199
    # sessions, and the one here is the more recently rotated.
    environment: boundary-tools-prod
    steps:
      - name: "Checkout"
        uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false

      # Rust arrives through rustup and baml_language/rust-toolchain.toml, node
      # and pnpm through the setup-node actions below, and jq is on the image.
      # mise is asked for sccache and direnv BY NAME: with no `install_args` it
      # pulls every tool in mise.toml — including `cargo:bacon`, whose binstall
      # failed and took the job with it.
      - name: "Install Rust toolchain"
        working-directory: baml_language
        run: rustup show

      - name: "Install sccache and direnv"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv"

      - name: "Verify sccache"
        run: sccache --version

      # This job compiles the same CLI the quiz job does, from the same
      # commit, so what one of them compiles the other reads back.
      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      - name: "Build the BAML CLI"
        run: cargo build --manifest-path baml_language/Cargo.toml -p baml_cli --bin baml-cli

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      # Two workspaces, deliberately. The extractor reads the repo-pinned
      # `typescript` and `@types/node` resolved against the ROOT package.json,
      # while the web app lives in typescript2's separate pnpm workspace.
      - name: "Setup Node for the root workspace"
        uses: ./.github/actions/setup-node
        with:
          enable-turbo-cache: "false"

      - name: "Setup Node for the web app"
        uses: ./.github/actions/setup-node2

      # A 404 is the expected FIRST run and nothing else. The site holds the
      # whole matrix, so after one publish the report is always there; a fetch
      # that fails later means the site is down, and treating that as "nothing
      # to carry forward" would turn an unrelated commit into a cold run that
      # judges the entire surface. So a cold run has to be asked for.
      - name: "Fetch the published report"
        id: previous
        env:
          SITE: ${{ vars.STDLIB_MATRIX_URL || 'https://boundaryml.github.io/baml' }}
          FORCED: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          if curl -fsSL --max-time 60 "${SITE}/matrix.json" -o previous.json; then
            # Both or neither: a site holding the report holds the rendering
            # of it, and publishing an empty one would read as a matrix that
            # had nothing to say.
            curl -fsSL --max-time 60 "${SITE}/matrix.md" -o previous.md
          else
            if [[ "${FORCED}" != "true" ]]; then
              echo "::error::no published report at ${SITE}/matrix.json. If this is the first run, or the report is gone, dispatch this workflow with force=true to judge the whole surface deliberately." >&2
              exit 1
            fi
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "Nothing published; this run judges the whole surface."
            exit 0
          fi
          # A report the tool can no longer read is worse than none: passing it
          # as --previous or --baseline is a hard error, which would fail the
          # job rather than fall back to a cold run. The format has changed once
          # already (the judgement key moved to the TypeScript side).
          #
          # `|| echo` rather than a bare `jq`: `set -e` is active, and a body
          # that is not JSON at all — an error page served with status 200 — is
          # the same situation as an old format, not a reason to fail.
          version="$(jq -r '.format_version // 0' previous.json 2>/dev/null || echo unreadable)"
          if [[ "${version}" != "2" ]]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::published report is format v${version}, this tool writes v2; judging the whole surface"
            rm -f previous.json
            exit 0
          fi
          echo "have=true" >> "$GITHUB_OUTPUT"
          jq -er '"carried forward from \(.counts.judgements) judgements"' previous.json

      # The ratchet compares the inputs the published report was built from. A
      # commit that did not move the stdlib stops here, before any model call.
      - name: "Has the surface moved?"
        id: ratchet
        env:
          FORCED: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          # `extracted` is reported separately from `changed`, because the build
          # below needs to know something different: whether data/ exists yet.
          # Both paths out of this step set it, and the early ones set it false
          # — a forced dispatch skips the comparison, and skipping the
          # comparison means skipping the extraction that comes with it.
          if [[ "${{ steps.previous.outputs.have }}" != "true" || "${FORCED}" == "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "extracted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # This run does the extraction; the build below reuses its data/, so
          # the decision and the report it gates are made from the same bytes.
          if tools/stdlib-matrix/run --check --baseline previous.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "extracted=true" >> "$GITHUB_OUTPUT"
            echo "The published report was built from these inputs; nothing to judge."
          else
            status=$?
            # 1 is "out of date", which is the whole point. 2 is a tool error.
            if ((status != 1)); then
              echo "stdlib-matrix: --check failed with ${status}" >&2
              exit "${status}"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "extracted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Build the matrix"
        if: steps.ratchet.outputs.changed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # Two independent questions, which were one flag until a forced
          # dispatch told them apart: whether there is a report to carry
          # forward, and whether data/ has already been built. A forced run has
          # the first and not the second, and claiming otherwise made the tool
          # refuse with "--skip-extract passed but data/ is incomplete".
          args=()
          if [[ "${{ steps.previous.outputs.have }}" == "true" ]]; then
            args+=(--previous "${GITHUB_WORKSPACE}/previous.json")
          fi
          if [[ "${{ steps.ratchet.outputs.extracted }}" == "true" ]]; then
            args+=(--skip-extract)
          fi
          # Written straight into the site's public directory rather than copied
          # there afterwards. `run` creates the destination directory, and that
          # directory is one git cannot supply: it holds nothing but the report,
          # which is gitignored, so a fresh checkout has no `public/` at all and
          # the copy that used to follow failed on it.
          tools/stdlib-matrix/run --llm \
            --json-output typescript2/app-stdlib-matrix/public/matrix.json \
            "${args[@]}"

      # A session that did not come back leaves symbols unjudged, which in the
      # published report is indistinguishable from symbols nothing reached — so
      # the question is whether this report says *less* than the one already
      # deployed, not whether anything failed at all.
      #
      # Refusing on any failure was the original rule, written when a failure
      # meant one call out of a few hundred. A session is now a multi-round loop
      # and there are two hundred of them, so at this scale some transient
      # failure is close to certain: a run judging 2557 symbols with six failed
      # sessions is a good run, and blocking it would mean never publishing
      # again. What must not happen is publishing a report with less coverage
      # than the one it replaces.
      - name: "Refuse to publish a thinner report"
        if: steps.ratchet.outputs.changed == 'true'
        run: |
          set -euo pipefail
          report=typescript2/app-stdlib-matrix/public/matrix.json
          failures="$(jq -er '.failures | length' "${report}")"
          if ((failures > 0)); then
            echo "::warning::${failures} sessions did not come back; their symbols are unjudged" >&2
            jq -r '.failures[] | "  \(.pass) · \(.subject) — \(.reason)"' "${report}" >&2
          fi
          jq -er '.counts | "matched \(.matched) · unnecessary \(.unnecessary) · absent \(.unmatched) · unjudged \(.unjudged)"' "${report}"

          # A run that mostly failed is not a thin report, it is a broken one.
          # This is checked before the comparison below, because "nothing to be
          # thinner than" was letting the worst case through: the first run
          # published 0 judgements and 2780 unjudged symbols — every session
          # having failed identically on a rejected API key — and an empty
          # matrix went live because there was no previous report to be worse
          # than. A healthy run leaves close to nothing unjudged.
          now="$(jq -er '.counts.unjudged' "${report}")"
          total="$(jq -er '.counts.ts_symbols' "${report}")"
          if ((now * 2 > total)); then
            echo "::error::${now} of ${total} symbols went unjudged; this run did not work, keeping whatever is deployed" >&2
            exit 1
          fi

          if [[ "${{ steps.previous.outputs.have }}" != "true" ]]; then
            # Nothing to be thinner than, and the check above says it is not
            # broken. A first run publishes what it got.
            exit 0
          fi
          before="$(jq -er '.counts.unjudged' previous.json)"
          if ((now > before)); then
            echo "::error::coverage regressed: ${before} unjudged deployed, ${now} in this run; keeping the deployed report" >&2
            exit 1
          fi

      # Always, judged or not. The deploy replaces the whole site, so a run
      # where the stdlib did not move still has to hand the matrix over as it
      # stands — otherwise publishing a change to the quiz would take the
      # matrix off the site.
      #
      # The report is fetched by the page at runtime, so it ships beside it.
      - name: "Build the site"
        working-directory: typescript2/app-stdlib-matrix
        env:
          CHANGED: ${{ steps.ratchet.outputs.changed }}
        run: |
          set -euo pipefail
          # When something was judged, `run` wrote the report straight into
          # public/ — which is also what created that directory. When nothing
          # was, the report to publish is the one already published.
          if [[ "${CHANGED}" != "true" ]]; then
            mkdir -p public
            cp "${GITHUB_WORKSPACE}/previous.json" public/matrix.json
          fi
          pnpm exec tsc -b --noEmit
          pnpm exec vite build
          if [[ "${CHANGED}" == "true" ]]; then
            cp "${GITHUB_WORKSPACE}/tools/stdlib-matrix/report/matrix.md" dist/matrix.md
          else
            cp "${GITHUB_WORKSPACE}/previous.md" dist/matrix.md
          fi

      - name: "Upload the matrix site"
        uses: actions/upload-artifact@v7
        with:
          name: matrix-site
          path: typescript2/app-stdlib-matrix/dist
          if-no-files-found: error

  deploy:
    name: "Deploy the site"
    needs: [quiz, matrix]
    if: github.event_name != 'pull_request' && github.repository == 'BoundaryML/baml'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: "The matrix, at the root"
        uses: actions/download-artifact@v8
        with:
          name: matrix-site
          path: site

      - name: "The quiz, under its own path"
        uses: actions/download-artifact@v8
        with:
          name: quiz-site
          path: site/type-quiz

      # Both halves or nothing: a deploy replaces the whole site, so one that
      # is missing a tool takes that tool off the air.
      - name: "Check the site is whole"
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/matrix.json
          test -s site/type-quiz/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: "Deploy"
        id: deploy
        uses: actions/deploy-pages@v5
