name: BAML SDK Release - Build Web

# Builds the platform-independent WASM/TypeScript package once and uploads its
# dist/ directory. Publishing is deliberately separate so dry runs exercise the
# complete build and the registry job receives only the frozen build artifact.

on:
  workflow_call:
    inputs:
      release_plan_json:
        description: "Frozen BAML language release-plan.json content"
        type: string
        default: ""
        required: false
      source_sha:
        description: "Exact repository commit to build"
        type: string
        default: ""
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-build-web-sdk
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  build:
    name: Build Web SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Stamp release plan
        env:
          RELEASE_PLAN_JSON: ${{ inputs.release_plan_json }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_PLAN_JSON:-}" ]]; then
            printf '%s\n' "$RELEASE_PLAN_JSON" > release-plan.json
          else
            scripts/baml-language-version plan --channel canary --out release-plan.json
          fi
          scripts/baml-language-version stamp --plan release-plan.json

      - name: Setup Node.js, pnpm, and wasm-pack
        uses: ./.github/actions/setup-mise
        with:
          install_args: "node npm:pnpm github:rustwasm/wasm-pack"

      - name: Setup Rust WASM target
        working-directory: baml_language
        run: |
          set -euo pipefail
          rustup show
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          shared-key: "linux-wasm"
          save-if: false

      - name: Install package dependencies
        working-directory: baml_language/sdks/typescript/bridge_typescript_web
        run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts

      - name: Build publishable package
        working-directory: baml_language/sdks/typescript/bridge_typescript_web
        run: pnpm build

      - name: Verify package artifact
        working-directory: baml_language/sdks/typescript/bridge_typescript_web
        run: |
          set -euo pipefail
          plan_version="$(jq -r .canonical_version ../../../../release-plan.json)"
          node_version="$(jq -r .version ../bridge_typescript/package.json)"
          web_version="$(jq -r .version package.json)"
          if [[ "$plan_version" != "$node_version" || "$plan_version" != "$web_version" ]]; then
            echo "::error::BAML npm package version mismatch: release plan=$plan_version, @boundaryml/baml-bridge=$node_version, @boundaryml/baml-bridge-web=$web_version"
            exit 1
          fi
          test -s dist/wasm/bridge_web_core_bg.wasm
          test -s dist/workerd-wasm/bridge_web_core_bg.wasm
          test -s dist/workerd/index.js
          npm pack --dry-run --json > package-dry-run.json
          test "$(jq -r '.[0].name' package-dry-run.json)" = "@boundaryml/baml-bridge-web"
          test "$(jq -r '.[0].version' package-dry-run.json)" = "$plan_version"

      - name: Upload Web SDK dist
        uses: actions/upload-artifact@v7
        with:
          name: web-sdk-dist
          path: baml_language/sdks/typescript/bridge_typescript_web/dist
          if-no-files-found: error
