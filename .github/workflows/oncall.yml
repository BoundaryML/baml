name: oncall

on:
  pull_request:
    paths:
      - '.github/workflows/oncall.yml'
      - 'tools/bctl'
      - 'tools/bctl_src/**'
  schedule:
    - cron: '0 17 * * 4'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [notify, fill-schedule, test-notify]
        default: fill-schedule
      sandbox_parent_ts:
        description: Existing #sam-sandbox thread for test-notify (no new parent)
        type: string
        default: '1789163124.808429'

env:
  UV_FROZEN: '1'

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: boundary-tools-prod
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.1.0
      - run: ./tools/bctl oncall check
      - name: Test oncall tooling
        working-directory: tools
        run: uv run --frozen pytest

      - name: Scope check - schedule-file-only PR?
        id: scope
        run: |
          files=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | tr '\n' ' ' | xargs)
          if [ "$files" = 'tools/bctl_src/oncall/data/schedule.oncall' ]; then
            echo "only_schedule=true" >> "$GITHUB_OUTPUT"
          fi

      # The intent of auto-merge here is to allow both automated schedule
      # filling to work and to allow team members to do shift swaps using
      # just github.dev. Repo-level auto-merge is disabled and the canary
      # branch uses a merge queue, so `gh pr merge --auto` is rejected;
      # enqueue directly via the GraphQL `enqueuePullRequest` mutation.
      - name: Enqueue to merge queue
        if: steps.scope.outputs.only_schedule == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
        run: |
          gh api graphql -f query='
            mutation($prId: ID!) {
              enqueuePullRequest(input: {pullRequestId: $prId}) {
                mergeQueueEntry { position }
              }
            }' -F prId="$PR_NODE_ID"

  notify:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'notify')
    runs-on: ubuntu-latest
    environment: boundary-tools-prod
    permissions:
      contents: write
      actions: read
    concurrency:
      group: oncall-notifications
      cancel-in-progress: false
    env:
      SLACK_BOUNDARY_BOT_TOKEN: ${{ secrets.SLACK_BOUNDARY_BOT_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Validate schedule
        run: ./tools/bctl oncall check
      - name: Post Thursday handoff and schedule Friday threaded reminders
        run: |
          # created_at stays fixed when rerunning on Friday or later.
          started_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          ./tools/bctl oncall notify --post-to-slack --run-started-at "$started_at"

  test-notify:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'test-notify'
    runs-on: ubuntu-latest
    environment: boundary-tools-prod
    permissions:
      contents: write
    concurrency:
      group: oncall-sandbox-notifications
      cancel-in-progress: false
    env:
      SLACK_BOUNDARY_BOT_TOKEN: ${{ secrets.SLACK_BOUNDARY_BOT_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SANDBOX_PARENT_TS: ${{ inputs.sandbox_parent_ts }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Schedule accelerated sandbox replies through Python
        run: ./tools/bctl oncall test-notify --parent-ts "$SANDBOX_PARENT_TS" --run-id "$GITHUB_RUN_ID"

  fill-schedule:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'fill-schedule')
    runs-on: ubuntu-latest
    environment: boundary-tools-prod
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.1.0
      - run: ./tools/bctl oncall fill-schedule
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: peter-evans/create-pull-request@v8
        if: steps.check_changes.outputs.has_changes == 'true'
        with:
          # Use a PAT so the generated pull_request event triggers CI.
          token: ${{ secrets.SAM_GITHUB_BOUNDARYML_READWRITE }}
          base: canary
          branch: oncall/fill-schedule
          title: "oncall: fill schedule horizon"
          commit-message: "fill schedule to 4mo horizon"
          body: "Automated: extending oncall schedule to 4-month horizon."

  notify-failure:
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    needs: [review, notify, fill-schedule]
    runs-on: ubuntu-latest
    environment: boundary-tools-prod
    env:
      SLACK_BOUNDARY_BOT_TOKEN: ${{ secrets.SLACK_BOUNDARY_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Identify failed jobs
        id: failed
        run: |
          failed=()
          [ "${{ needs.review.result }}" = "failure" ] && failed+=("review")
          [ "${{ needs.notify.result }}" = "failure" ] && failed+=("notify")
          [ "${{ needs.fill-schedule.result }}" = "failure" ] && failed+=("fill-schedule")
          echo "jobs=${failed[*]}" >> "$GITHUB_OUTPUT"
      - name: Post failure to general
        run: |
          ./tools/bctl oncall notify-failure \
            --jobs "${{ steps.failed.outputs.jobs }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
