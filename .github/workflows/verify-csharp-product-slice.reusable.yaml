name: BAML C# - Verify product package slice

on:
  workflow_call:
    inputs:
      release_plan_json:
        description: "Frozen BAML language release-plan.json content"
        type: string
        required: true
      source_sha:
        description: "Exact repository commit whose product is under test"
        type: string
        required: true
      platform_matrix_json:
        description: "Validated C# product matrix from the early release preflight"
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  abi-probe:
    name: Verify packaged C# ABI prefix and ownership lifetimes
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301

      - uses: actions/download-artifact@v8
        with:
          name: csharp-neutral-preparation
          path: neutral-preparation

      - uses: actions/download-artifact@v8
        with:
          name: csharp-product-package
          path: product-package

      - name: Extract the packaged native libraries and stamp the release plan
        env:
          RELEASE_PLAN_JSON: ${{ inputs.release_plan_json }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_PLAN_JSON" > release-plan.json
          scripts/baml-language-version stamp --plan release-plan.json
          package="$(find product-package -maxdepth 1 -type f -name 'baml-bridge.*.nupkg' -print)"
          test -n "$package"
          test "$(printf '%s\n' "$package" | wc -l)" -eq 1
          unzip -q "$package" 'runtimes/*' -d staging

      - name: Verify the C# ABI prefix and ownership lifetimes
        env:
          BAML_CSHARP_ABI_PROBE_BYTECODE: ${{ github.workspace }}/neutral-preparation/function-calls.bytecode
        run: |
          set -euo pipefail
          test -s "$BAML_CSHARP_ABI_PROBE_BYTECODE"
          native="$(jq -er '
            .targets[]
            | select(.artifacts.csharp.rid == "linux-x64")
            | "staging/runtimes/\(.artifacts.csharp.rid)/native/\(.artifacts.csharp.native_asset)"
          ' release/platforms.json)"
          test -f "$native"
          dotnet run --project \
            baml_language/sdks/csharp/bridge_csharp/tests/Baml.Bridge.AbiLifetimeProbe/Baml.Bridge.AbiLifetimeProbe.csproj \
            -p:BamlNativeProbeMode=Direct \
            -p:NuGetAudit=false \
            -- "$PWD/$native" \
            "$(jq -r .canonical_version release-plan.json)" \
            "$BAML_CSHARP_ABI_PROBE_BYTECODE"

  native-consumer:
    name: Product consumer ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platform_matrix_json) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        if: matrix.libc != 'musl'
        with:
          dotnet-version: 10.0.301

      - uses: actions/download-artifact@v8
        with:
          name: csharp-product-package
          path: product-package

      - name: Run exact package on the native host
        if: matrix.libc != 'musl'
        env:
          RID: ${{ matrix.rid }}
          CANONICAL: ${{ matrix.canonical }}
        run: |
          set -euo pipefail
          package="$(find product-package -maxdepth 1 \
            -type f -name 'baml-bridge.*.nupkg' -print)"
          test -n "$package"
          test "$(printf '%s\n' "$package" | wc -l)" -eq 1
          baml_language/sdks/csharp/bridge_csharp/tests/Baml.Bridge.NuGetPackageSmoke/verify.sh \
            "$package" \
            "$RID" \
            "$CANONICAL" \
            product-package/baml_sdk

      - name: Verify framework-dependent and self-contained deployment
        if: matrix.rid == 'linux-x64'
        run: |
          set -euo pipefail
          package="$(find product-package -maxdepth 1 -type f -name 'baml-bridge.*.nupkg' -print)"
          test -n "$package"
          test "$(printf '%s\n' "$package" | wc -l)" -eq 1
          baml_language/sdks/csharp/bridge_csharp/tests/Baml.Bridge.NuGetPackageSmoke/verify-deployment.sh \
            "$package" \
            linux-x64 \
            libbridge_cffi.so \
            product-package/baml_sdk

      - name: Run exact package in real musl userspace
        if: matrix.libc == 'musl'
        env:
          RID: ${{ matrix.rid }}
          CANONICAL: ${{ matrix.canonical }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e RID \
            -e CANONICAL \
            mcr.microsoft.com/dotnet/sdk@sha256:fac7cce841f78faa4bca416fb4c636d1a129c09abd9b50e9b45664b95fd008a0 \
            sh -c '
              set -eu
              apk add --no-cache bash ripgrep unzip
              package="$(find product-package -maxdepth 1 \
                -type f -name "baml-bridge.*.nupkg" -print)"
              test -n "$package"
              test "$(printf "%s\n" "$package" | wc -l)" -eq 1
              exec bash \
                baml_language/sdks/csharp/bridge_csharp/tests/Baml.Bridge.NuGetPackageSmoke/verify.sh \
                "$package" \
                "$RID" \
                "$CANONICAL" \
                product-package/baml_sdk
            '
