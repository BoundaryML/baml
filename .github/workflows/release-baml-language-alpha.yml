name: BAML Language Alpha Release

on:
  workflow_run:
    workflows: ["CI - BAML Language"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build"
        required: false
      alpha_number:
        description: "Numeric alpha suffix override"
        required: false
      publish_github_release:
        type: boolean
        default: false
      dispatch_homebrew:
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'canary') && 'baml-language-alpha-canary' || format('baml-language-alpha-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'canary' }}

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  prepare:
    name: Prepare Release
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'canary')
    runs-on: blacksmith-4vcpu-ubuntu-2204
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      publish: ${{ steps.gate.outputs.publish }}
      dispatch_homebrew: ${{ steps.gate.outputs.dispatch_homebrew }}
      checkout_ref: ${{ steps.gate.outputs.checkout_ref }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      ci_run_url: ${{ steps.gate.outputs.ci_run_url }}
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Gate release mode
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_ALPHA_NUMBER: ${{ inputs.alpha_number }}
          INPUT_PUBLISH: ${{ inputs.publish_github_release }}
          INPUT_DISPATCH_HOMEBREW: ${{ inputs.dispatch_homebrew }}
        run: |
          set -euo pipefail

          should_run=false
          publish=false
          dispatch_homebrew=false
          checkout_ref="${GITHUB_SHA}"
          alpha_number="${GITHUB_RUN_NUMBER}"
          ci_run_url=""

          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            if [[ "${WORKFLOW_CONCLUSION}" == "success" &&
                  "${WORKFLOW_NAME}" == "CI - BAML Language" &&
                  "${WORKFLOW_EVENT}" == "push" &&
                  "${WORKFLOW_HEAD_BRANCH}" == "canary" ]]; then
              should_run=true
              publish=true
              dispatch_homebrew=true
              checkout_ref="${WORKFLOW_HEAD_SHA}"
              alpha_number="${WORKFLOW_RUN_NUMBER}"
              ci_run_url="${WORKFLOW_RUN_URL}"
            fi
          else
            should_run=true
            publish="${INPUT_PUBLISH:-false}"
            dispatch_homebrew="${INPUT_DISPATCH_HOMEBREW:-false}"
            checkout_ref="${INPUT_REF:-${GITHUB_SHA}}"
            alpha_number="${INPUT_ALPHA_NUMBER:-${GITHUB_RUN_NUMBER}}"
          fi

          if [[ "${dispatch_homebrew}" == "true" && "${publish}" != "true" ]]; then
            echo "::error::dispatch_homebrew=true requires publish_github_release=true"
            exit 1
          fi

          if [[ ! "${alpha_number}" =~ ^[0-9]+$ ]]; then
            echo "::error::alpha_number must be numeric"
            exit 1
          fi

          {
            echo "should_run=${should_run}"
            echo "publish=${publish}"
            echo "dispatch_homebrew=${dispatch_homebrew}"
            echo "checkout_ref=${checkout_ref}"
            echo "alpha_number=${alpha_number}"
            echo "ci_run_url=${ci_run_url}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.gate.outputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve source
        if: steps.gate.outputs.should_run == 'true'
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            source_ref="${WORKFLOW_HEAD_BRANCH}"
          else
            source_ref="${INPUT_REF:-${GITHUB_REF_NAME}}"
          fi
          {
            echo "source_sha=${source_sha}"
            echo "source_ref=${source_ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Compute release version
        if: steps.gate.outputs.should_run == 'true'
        id: version
        env:
          ALPHA_NUMBER: ${{ steps.gate.outputs.alpha_number }}
        run: |
          set -euo pipefail
          scripts/baml-language-version check
          version="$(scripts/baml-language-version compute --alpha-number "${ALPHA_NUMBER}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=baml-language-${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            binary: baml-cli
            pack_host: baml-pack-host
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            binary: baml-cli
            pack_host: baml-pack-host
            archive_ext: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: blacksmith-4vcpu-ubuntu-2204
            binary: baml-cli
            pack_host: baml-pack-host
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: blacksmith-4vcpu-ubuntu-2204-arm
            binary: baml-cli
            pack_host: baml-pack-host
            archive_ext: tar.gz
          - target: x86_64-unknown-linux-musl
            os: blacksmith-4vcpu-ubuntu-2204
            binary: baml-cli
            pack_host: baml-pack-host
            archive_ext: tar.gz
            container: rust:alpine@sha256:606fd313a0f49743ee2a7bd49a0914bab7deedb12791f3a846a34a4711db7ed2
          - target: aarch64-unknown-linux-musl
            os: blacksmith-4vcpu-ubuntu-2204
            binary: baml-cli
            pack_host: baml-pack-host
            archive_ext: tar.gz
            cross: true
          - target: x86_64-pc-windows-msvc
            os: blacksmith-4vcpu-windows-2025
            binary: baml-cli.exe
            pack_host: baml-pack-host.exe
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    timeout-minutes: 45
    steps:
      - name: Install Alpine build dependencies
        if: matrix.container
        shell: sh
        run: apk add --no-cache bash git cmake clang openssl-dev openssl-libs-static perl make python3

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          persist-credentials: false

      - name: Setup Rust
        if: ${{ !matrix.container }}
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          workspace: baml_language
          enable-cache: true
          enable-cross: false
          skip-protoc: true

      - name: Install cross
        if: matrix.cross
        run: cargo install cross

      - name: Build baml-cli
        env:
          BAML_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          CARGO: ${{ matrix.cross && 'cross' || 'cargo' }}
        run: $CARGO build --release --bin baml-cli --target "${TARGET}"
        working-directory: baml_language

      - name: Build baml-pack-host
        env:
          BAML_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          CARGO: ${{ matrix.cross && 'cross' || 'cargo' }}
        run: $CARGO build --release -p baml_pack_host --bin baml-pack-host --target "${TARGET}"
        working-directory: baml_language

      - name: Smoke test version
        if: ${{ !matrix.cross && !matrix.cross_arch }}
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          binary="baml_language/target/${TARGET}/release/${BINARY}"
          output="$("${binary}" --version)"
          echo "${output}"
          grep -F "${EXPECTED_VERSION}" <<< "${output}"

      - name: Package archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          PACK_HOST: ${{ matrix.pack_host }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import shutil
          import tarfile
          import zipfile
          from pathlib import Path

          version = os.environ["VERSION"]
          target = os.environ["TARGET"]
          binary = os.environ["BINARY"]
          pack_host = os.environ["PACK_HOST"]
          archive_ext = os.environ["ARCHIVE_EXT"]

          root = Path.cwd()
          staging = root / "dist" / target / "staging"
          staging.mkdir(parents=True, exist_ok=True)
          release_dir = root / "baml_language" / "target" / target / "release"
          shutil.copy2(release_dir / binary, staging / binary)
          shutil.copy2(release_dir / pack_host, staging / pack_host)
          shutil.copy2(root / "README.md", staging / "README.md")
          shutil.copy2(root / "LICENSE", staging / "LICENSE")

          archive = root / "dist" / target / f"baml-language-{version}-{target}.{archive_ext}"
          contents = (binary, pack_host, "README.md", "LICENSE")
          if archive_ext == "zip":
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
                  for item in contents:
                      zf.write(staging / item, item)
          else:
              with tarfile.open(archive, "w:gz") as tf:
                  for item in contents:
                      tf.add(staging / item, item)

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (archive.with_suffix(archive.suffix + ".sha256")).write_text(f"{digest}  {archive.name}\n")
          print(f"{digest}  {archive.name}")
          PY

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: baml-language-archive-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/*
            !dist/${{ matrix.target }}/staging/**
          if-no-files-found: error

  # ARM musl is cross-compiled from x86, so we can't smoke test it in the build job.
  # GitHub Actions' JS-based actions (like actions/checkout) don't work in Alpine
  # containers on ARM runners, so we can't use a container there either.
  # Instead, we run a separate job on a native ARM runner to verify the binary works.
  test-arm-musl:
    name: Test ARM musl binary
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2204-arm
    timeout-minutes: 5
    steps:
      - name: Download ARM musl archive
        uses: actions/download-artifact@v4
        with:
          name: baml-language-archive-aarch64-unknown-linux-musl
          path: dist

      - name: Extract and test
        run: |
          set -euo pipefail
          tar -xzf dist/*.tar.gz
          ./baml-cli --version

  publish:
    name: Publish Release
    needs:
      - prepare
      - build
      - test-arm-musl
    if: needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.publish == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
      CI_RUN_URL: ${{ needs.prepare.outputs.ci_run_url }}
      DISPATCH_HOMEBREW: ${{ needs.prepare.outputs.dispatch_homebrew }}
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: baml-language-archive-*
          merge-multiple: true
          path: release-assets

      - name: Prepare release notes and payload
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["REPOSITORY"]
          source_sha = os.environ["SOURCE_SHA"]
          source_ref = os.environ["SOURCE_REF"]
          ci_run_url = os.environ["CI_RUN_URL"]
          release_run_url = os.environ["RELEASE_RUN_URL"]

          assets_dir = Path("release-assets")
          target_assets = {}
          rows = []
          for checksum_file in sorted(assets_dir.glob("*.sha256")):
              sha, filename = checksum_file.read_text().strip().split(maxsplit=1)
              filename = filename.strip()
              archive = assets_dir / filename
              if not archive.exists():
                  raise SystemExit(f"missing archive for checksum {filename}")
              prefix = f"baml-language-{version}-"
              suffix = ".zip" if filename.endswith(".zip") else ".tar.gz"
              target = filename.removeprefix(prefix).removesuffix(suffix)
              url = f"https://github.com/{repo}/releases/download/{tag}/{filename}"
              target_assets[target] = {"url": url, "sha256": sha}
              rows.append((target, filename, sha))

          expected = {
              "aarch64-apple-darwin",
              "x86_64-apple-darwin",
              "x86_64-unknown-linux-gnu",
              "aarch64-unknown-linux-gnu",
              "x86_64-unknown-linux-musl",
              "aarch64-unknown-linux-musl",
              "x86_64-pc-windows-msvc",
          }
          missing = expected - target_assets.keys()
          if missing:
              raise SystemExit(f"missing release assets for {sorted(missing)}")

          body = [
              f"Source commit: `{source_sha}`",
              f"Source ref: `{source_ref}`",
          ]
          if ci_run_url:
              body.append(f"Validated by CI run: {ci_run_url}")
          body.extend([
              f"Release workflow run: {release_run_url}",
              "",
              "| Target | Asset | SHA256 |",
              "| --- | --- | --- |",
          ])
          for target, filename, sha in rows:
              body.append(f"| `{target}` | `{filename}` | `{sha}` |")
          Path("release-body.md").write_text("\n".join(body) + "\n")

          payload = {
              "version": version,
              "source_repo": repo,
              "source_sha": source_sha,
              "release_tag": tag,
              "assets": target_assets,
          }
          Path("homebrew-payload.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY

      - name: Create or update GitHub release
        run: |
          set -euo pipefail
          title="BAML Language ${VERSION}"
          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GH_REPO}" \
              --title "${title}" \
              --notes-file release-body.md \
              --prerelease
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GH_REPO}" \
              --title "${title}" \
              --notes-file release-body.md \
              --prerelease \
              --latest=false \
              --target "${SOURCE_SHA}"
          fi
          gh release upload "${RELEASE_TAG}" release-assets/* --repo "${GH_REPO}" --clobber

      - name: Validate tap version before dispatch
        if: env.DISPATCH_HOMEBREW == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_BAML_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::HOMEBREW_BAML_DISPATCH_TOKEN is required when dispatch_homebrew=true"
            exit 1
          fi
          gh api repos/BoundaryML/homebrew-baml/contents/Formula/baml.rb -q .content | base64 --decode > current-baml.rb
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          incoming = json.loads(Path("homebrew-payload.json").read_text())["version"]
          content = Path("current-baml.rb").read_text()

          legacy = "GlooHQ/baml" in content or 'bin.install "baml"' in content
          match = re.search(r'version\s+"([^"]+)"', content)
          if not match or legacy:
              print("tap formula is legacy or unversioned; allowing one-time migration")
              raise SystemExit(0)

          semver = re.compile(r"^(\d+)\.(\d+)\.(\d+)(?:-alpha\.(\d+))?$")
          def key(value):
              parsed = semver.fullmatch(value)
              if not parsed:
                  raise SystemExit(f"unsupported tap formula version: {value}")
              major, minor, patch, alpha = parsed.groups()
              stable_rank = 1 if alpha is None else 0
              alpha_number = -1 if alpha is None else int(alpha)
              return (int(major), int(minor), int(patch), stable_rank, alpha_number)

          current = match.group(1)
          if key(incoming) < key(current):
              raise SystemExit(f"incoming Homebrew version {incoming} is older than current {current}")
          print(f"tap version check passed: {current} -> {incoming}")
          PY

      - name: Dispatch Homebrew update
        if: env.DISPATCH_HOMEBREW == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_BAML_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("homebrew-payload.json").read_text())
          Path("repository-dispatch.json").write_text(json.dumps({
              "event_type": "update-baml",
              "client_payload": payload,
          }, indent=2, sort_keys=True) + "\n")
          PY
          gh api --method POST repos/BoundaryML/homebrew-baml/dispatches --input repository-dispatch.json

  # AUR pkgver can't contain hyphens, so we convert 0.11.0-alpha.602 to 0.11.0.alpha.602.
  # When we exit alpha and use stable semver (e.g. 0.11.0), this conversion becomes a no-op.
  publish-to-aur:
    name: Publish to AUR
    needs:
      - prepare
      - publish
    if: needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts

          curl -fSL -o artifacts/x86_64.tar.gz \
            "https://github.com/BoundaryML/baml/releases/download/baml-language-${VERSION}/baml-language-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fSL -o artifacts/aarch64.tar.gz \
            "https://github.com/BoundaryML/baml/releases/download/baml-language-${VERSION}/baml-language-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
          curl -fSL -o artifacts/source.tar.gz \
            "https://github.com/BoundaryML/baml/archive/refs/tags/baml-language-${VERSION}.tar.gz"

          echo "SHA256_X86_64=$(sha256sum artifacts/x86_64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SHA256_AARCH64=$(sha256sum artifacts/aarch64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SHA256_SOURCE=$(sha256sum artifacts/source.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Install makepkg
        run: sudo apt-get update && sudo apt-get install -y pacman-package-manager

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

      - name: Push baml-bin
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          VERSION_AUR="${VERSION//-/.}"  # AUR pkgver can't have hyphens

          git clone ssh://aur@aur.archlinux.org/baml-bin.git aur-bin
          cd aur-bin

          cp ../packaging/aur/baml-bin/PKGBUILD .
          sed -i "s/__VERSION__/${VERSION_AUR}/g" PKGBUILD
          sed -i "s/__VERSION_ORIG__/${VERSION}/g" PKGBUILD
          sed -i "s/__SHA256_X86_64__/${SHA256_X86_64}/g" PKGBUILD
          sed -i "s/__SHA256_AARCH64__/${SHA256_AARCH64}/g" PKGBUILD

          makepkg --printsrcinfo > .SRCINFO

          git config user.name "BoundaryML Bot"
          git config user.email "aur@boundaryml.com"
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "Update to ${VERSION_AUR}"
            git push
          else
            echo "No changes to commit for baml-bin"
          fi

      - name: Push baml
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          VERSION_AUR="${VERSION//-/.}"  # AUR pkgver can't have hyphens

          git clone ssh://aur@aur.archlinux.org/baml.git aur-src
          cd aur-src

          cp ../packaging/aur/baml/PKGBUILD .
          sed -i "s/__VERSION__/${VERSION_AUR}/g" PKGBUILD
          sed -i "s/__VERSION_ORIG__/${VERSION}/g" PKGBUILD
          sed -i "s/__SHA256__/${SHA256_SOURCE}/g" PKGBUILD

          makepkg --printsrcinfo > .SRCINFO

          git config user.name "BoundaryML Bot"
          git config user.email "aur@boundaryml.com"
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "Update to ${VERSION_AUR}"
            git push
          else
            echo "No changes to commit for baml"
          fi
