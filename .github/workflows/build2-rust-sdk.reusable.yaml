name: BAML SDK Release - Build Rust

# Builds the Rust-specific SDK release artifact: the thin `baml_bridge` crate
# packaged for crates.io. Its deps are all crates.io deps, so the packaged
# `.crate` builds in isolation — `cargo package`'s verify step proves it.
#
# The engine cdylib the crate dlopens at runtime is NOT built here: it is a
# language-neutral artifact shared by every dylib-loader SDK, built once by
# `build2-bridge-cffi.reusable.yaml`.

on:
  workflow_call:
    inputs:
      release_plan_json:
        description: "Frozen BAML language release-plan.json content"
        type: string
        default: ""
        required: false
      source_sha:
        description: "Exact repository commit to build"
        type: string
        default: ""
        required: false
    secrets:
      BAML_SCCACHE_R2_ACCESS_KEY_ID:
        required: false
      BAML_SCCACHE_R2_SECRET_ACCESS_KEY:
        required: false
  # Manual-only standalone trigger for testing this reusable workflow before it
  # is wired into the release graph (with no inputs it packages a canary-stamped
  # crate). It is otherwise invoked via `workflow_call`.
  workflow_dispatch:

concurrency:
  # suffix is important to prevent a concurrency deadlock with the calling workflow
  group: ${{ github.workflow }}-${{ github.ref }}-build-rust-sdk
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  package-crate:
    name: package baml_bridge crate
    runs-on: ubuntu-22.04
    environment: infisical-github-ci
    env:
      BAML_SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.BAML_SCCACHE_R2_ACCESS_KEY_ID }}
      BAML_SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BAML_SCCACHE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Stamp release plan
        env:
          RELEASE_PLAN_JSON: ${{ inputs.release_plan_json }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_PLAN_JSON:-}" ]]; then
            printf '%s\n' "$RELEASE_PLAN_JSON" > release-plan.json
          else
            scripts/baml-language-version plan --channel canary --out release-plan.json
          fi
          scripts/baml-language-version stamp --plan release-plan.json

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          enable-cache: false

      - name: Setup shared R2 sccache
        uses: ./.github/actions/setup-r2-sccache

      - name: Package and verify the crate
        working-directory: baml_language
        run: |
          set -euo pipefail
          # Guard the glob below against any stale artifact (a fresh CI
          # checkout has none, but keep the step idempotent).
          rm -f target/package/baml_bridge-*.crate target/package/baml_bridge-*.crate.sha256
          # --allow-dirty: the working tree carries the just-stamped version.
          # `cargo package` verifies by compiling the packaged crate in
          # isolation — its deps are all crates.io deps, so this proves the
          # published `.crate` builds standalone. Leave --target-dir at the
          # default: it relocates the `.crate` output too (to
          # <dir>/package/), so overriding it would move the artifact away
          # from the upload path below.
          cargo package -p baml_bridge --allow-dirty
          crate="$(ls target/package/baml_bridge-*.crate)"
          (cd "$(dirname "$crate")" && sha256sum "$(basename "$crate")" > "$(basename "$crate").sha256")
          echo "Packaged ${crate}"
          cat "${crate}.sha256"

      - name: Upload crate artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-sdk-crate
          path: |
            baml_language/target/package/baml_bridge-*.crate
            baml_language/target/package/baml_bridge-*.crate.sha256
          if-no-files-found: error
