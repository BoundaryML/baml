name: Stdlib Matrix

# Publishes the BAML ↔ TypeScript stdlib comparison to GitHub Pages.
#
# Triggered by a completed BAML Language Release rather than by a push: the
# matrix describes a released stdlib surface, and rebuilding it for every commit
# would publish a view of code nobody can install yet.
#
# The release workflow serves every channel from one definition, and a
# `workflow_run` payload does not carry the inputs it was dispatched with, so
# there is no way here to tell a canary cut from a nightly or a dry run. That
# turns out not to matter: `run --check` compares the *inputs* the deployed
# report was built from — the stdlib surface's content hash and the TypeScript
# release — and stops the job when they have not moved. A release that did not
# touch the stdlib costs a build and no model calls at all.
#
# Cost is bounded by the same mechanism that makes the tool resumable. The
# currently-deployed matrix.json is fetched and passed as `--previous`, so a
# symbol whose declaration and references are unchanged keeps the judgement it
# already has and is never sent to a model again. Only what actually moved is
# re-judged. The first run, with nothing deployed to carry forward, is the one
# that pays in full.

on:
  workflow_run:
    workflows: ["BAML Language Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even when the stdlib surface is unchanged"
        type: boolean
        default: false
        required: false

# Never cancel in flight: a cancelled run can leave Pages mid-deploy, and the
# work is expensive enough that finishing beats starting over.
concurrency:
  group: stdlib-matrix
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: "Build the matrix and the site"
    # Only a release that succeeded describes a surface worth publishing.
    if: >-
      github.repository == 'BoundaryML/baml' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    # Holds ANTHROPIC_API_KEY. Pages needs its own environment, which is why
    # deploying is a separate job — a job may name only one.
    environment: boundary-tools-dev
    outputs:
      changed: ${{ steps.ratchet.outputs.changed }}
    steps:
      # A `workflow_run` job checks out the default branch unless told
      # otherwise, which would publish a matrix of whatever canary happens to
      # hold rather than of the surface that was just released.
      - name: "Checkout the released commit"
        uses: useblacksmith/checkout@v1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: "Install mise"
        uses: ./.github/actions/setup-mise

      - name: "Install Rust toolchain"
        working-directory: baml_language
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: "stdlib-matrix-baml-cli"

      - name: "Build the BAML CLI"
        run: cargo build --manifest-path baml_language/Cargo.toml -p baml_cli --bin baml-cli

      # Two workspaces, deliberately. The extractor reads the repo-pinned
      # `typescript` and `@types/node` resolved against the ROOT package.json,
      # while the web app lives in typescript2's separate pnpm workspace.
      - name: "Setup Node for the root workspace"
        uses: ./.github/actions/setup-node
        with:
          enable-turbo-cache: "false"

      - name: "Setup Node for the web app"
        uses: ./.github/actions/setup-node2

      # A 404 is the expected first run, not a failure: there is nothing
      # deployed to carry forward yet.
      - name: "Fetch the deployed report"
        id: previous
        env:
          SITE: ${{ vars.STDLIB_MATRIX_URL || 'https://boundaryml.github.io/baml' }}
        run: |
          set -euo pipefail
          if curl -fsSL --max-time 60 "${SITE}/matrix.json" -o previous.json; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            jq -er '"carried forward from \(.counts.judgements) judgements"' previous.json
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "Nothing deployed yet; this run judges the whole surface."
          fi

      # The ratchet compares the inputs the deployed report was built from. A
      # release that did not move the stdlib stops here, before any model call.
      - name: "Has the surface moved?"
        id: ratchet
        env:
          FORCED: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.previous.outputs.have }}" != "true" || "${FORCED}" == "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # This run does the extraction; the build below reuses its data/, so
          # the decision and the report it gates are made from the same bytes.
          if tools/stdlib-matrix/run --check --baseline previous.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The deployed report was built from these inputs; nothing to publish."
          else
            status=$?
            # 1 is "out of date", which is the whole point. 2 is a tool error.
            if ((status != 1)); then
              echo "stdlib-matrix: --check failed with ${status}" >&2
              exit "${status}"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Build the matrix"
        if: steps.ratchet.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ steps.previous.outputs.have }}" == "true" ]]; then
            # The ratchet step already extracted; reuse exactly what it judged.
            args=(--skip-extract --previous "${GITHUB_WORKSPACE}/previous.json")
          fi
          tools/stdlib-matrix/run --llm "${args[@]}"

      # A call that did not come back leaves symbols unjudged, which in the
      # published report is indistinguishable from symbols nothing reached. The
      # deployed site stays as it is rather than quietly losing coverage.
      - name: "Refuse to publish a partial report"
        if: steps.ratchet.outputs.changed == 'true'
        run: |
          set -euo pipefail
          failures="$(jq -er '.failures | length' tools/stdlib-matrix/report/matrix.json)"
          if ((failures > 0)); then
            echo "::error::${failures} model calls did not come back; keeping the deployed report" >&2
            jq -r '.failures[] | "  \(.pass) · \(.subject) — \(.reason)"' \
              tools/stdlib-matrix/report/matrix.json >&2
            exit 1
          fi
          jq -er '.counts | "matched \(.matched) · absent \(.unmatched) · unjudged \(.unjudged)"' \
            tools/stdlib-matrix/report/matrix.json

      # The report is fetched by the page at runtime, so it ships beside it.
      - name: "Build the site"
        if: steps.ratchet.outputs.changed == 'true'
        working-directory: typescript2/app-stdlib-matrix
        run: |
          set -euo pipefail
          cp "${GITHUB_WORKSPACE}/tools/stdlib-matrix/report/matrix.json" public/matrix.json
          pnpm exec tsc -b --noEmit
          pnpm exec vite build
          cp "${GITHUB_WORKSPACE}/tools/stdlib-matrix/report/matrix.md" dist/matrix.md

      - name: "Upload the site"
        if: steps.ratchet.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: typescript2/app-stdlib-matrix/dist

  deploy:
    name: "Deploy to Pages"
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: "Deploy"
        id: deploy
        uses: actions/deploy-pages@v4
