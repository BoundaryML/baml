# Redeploys the atb2 runner (tools/atb2/deploy) on every push to canary that
# touches tools/atb2; on a pull request touching the deploy files it only
# checks that the image builds. The Fly app, its volume and its secret must
# exist before FLY_API_TOKEN is set (tools/atb2/README.md, Deploy); the deploy
# step refuses to run against a missing app. Actions are pinned to commits. One secret: FLY_API_TOKEN, a deploy token scoped to the
# atb2-runner app. The runner's own secrets are set on Fly by hand (see
# tools/atb2/deploy/fly.toml); CI never handles them. The job skips itself
# until the token exists.
#
# The site (typescript2/app-feedback) deploys through the Vercel GitHub app
# once its project is linked; nothing here touches it.
name: atb2 deploy

on:
  push:
    branches: [canary]
    paths:
      - "tools/atb2/**"
      - ".github/workflows/atb2-deploy.yml"
  pull_request:
    paths:
      # everything the image copies in, not only the deploy files
      - "tools/atb2/**"
      - ".github/workflows/atb2-deploy.yml"
  workflow_dispatch:

concurrency:
  group: atb2-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # On a PR: the image must build. No deploy, no secrets.
  image:
    name: Runner image builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f tools/atb2/deploy/Dockerfile -t atb2-runner:ci tools/atb2
      - name: Verify runtime secret filtering
        run: python3 tools/atb2/deploy/test_launch_runtime.py
      - name: Verify builder cannot read the runtime login
        run: >-
          docker run --rm --network none --entrypoint bash
          --mount type=bind,src="${{ github.workspace }}/tools/atb2/deploy/test_build_isolation.sh",dst=/test-build-isolation.sh,readonly
          atb2-runner:ci /test-build-isolation.sh

  # On canary only: deploy. A manual run from any other ref is refused, so
  # the deploy token never runs against unreviewed code.
  runner:
    name: Fly (atb2-runner)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/canary'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skip without a Fly token
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN is not set; skipping the runner deploy"

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: env.FLY_API_TOKEN != ''

      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: |
          flyctl apps list --json | grep -q '"atb2-runner"' || { echo "the Fly app atb2-runner does not exist yet; see tools/atb2/README.md"; exit 1; }
          flyctl deploy tools/atb2 --config tools/atb2/deploy/fly.toml --remote-only --ha=false
