name: miniatb deploy

on:
  push:
    branches: [canary]
    paths:
      - "tools/miniatb/**"
      - "baml_language/**"
      - "release/platforms.json"
      - "skills/baml-core/SKILL.md"
      - ".github/workflows/atb2-deploy.yml"
  pull_request:
    paths:
      # everything the image copies in, not only the deploy files
      - "tools/miniatb/**"
      - "baml_language/**"
      - "release/platforms.json"
      - "skills/baml-core/SKILL.md"
      - ".github/workflows/atb2-deploy.yml"
  workflow_dispatch:

concurrency:
  group: atb2-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # On a PR: the image must build. No deploy, no secrets.
  image:
    name: Runner image builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build --build-arg BAML_GIT_SHA="$GITHUB_SHA" -f tools/miniatb/deployment/Dockerfile -t miniatb:ci .
      - name: Verify Linux resource and filesystem boundaries
        run: docker run --rm --privileged -e MINIATB_LINUX_TEST=1 -e MINIATB_RUN=0123456789abcdef01234567 miniatb:ci sh deployment/test-linux.sh

  # On canary only: deploy. A manual run from any other ref is refused, so
  # the deploy token never runs against unreviewed code.
  runner:
    name: Fly (atb2-runner)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/canary'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Skip without a Fly token
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN is not set; skipping the runner deploy"

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
        if: env.FLY_API_TOKEN != ''

      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: |
          flyctl apps list --json | grep -q '"atb2-runner"' || { echo "the Fly app atb2-runner does not exist yet; see tools/miniatb/README.md"; exit 1; }
          flyctl deploy . --build-arg BAML_GIT_SHA="$GITHUB_SHA" --config tools/miniatb/deployment/fly.toml --remote-only --ha=false
