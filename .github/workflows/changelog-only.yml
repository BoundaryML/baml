name: Changelog-only guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Changelog is the only changed file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check changed files
        uses: actions/github-script@v9
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        with:
          script: |
            const escapeHatch = 'TEST_CHANGELOG_ONLY=skip';
            if ((process.env.PR_BODY || '').includes(escapeHatch)) {
              core.notice(`Skipping the changelog-only check because the PR description contains ${escapeHatch}.`);
              return;
            }

            const changelog = 'baml_language/CHANGELOG.md';
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const changelogChanged = files.some(
              (file) => file.filename === changelog || file.previous_filename === changelog,
            );
            if (!changelogChanged) {
              core.info(`${changelog} was not changed.`);
              return;
            }

            const otherFiles = files
              .map((file) => file.filename)
              .filter((filename) => filename !== changelog);
            if (otherFiles.length === 0) {
              core.info(`${changelog} is the only changed file.`);
              return;
            }

            core.setFailed([
              `${changelog} must be the only changed file in this PR.`,
              `Other changed files:`,
              ...otherFiles.map((filename) => `- ${filename}`),
              `To bypass this check, add ${escapeHatch} to the PR description.`,
            ].join('\n'));
