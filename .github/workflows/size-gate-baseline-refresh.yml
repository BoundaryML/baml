name: Size Gate — Daily Baseline Refresh

# Re-pegs the committed size-gate baseline to the *real* sizes CI most
# recently measured on canary, so the gate never drifts far from reality.
#
# Key idea: it does NOT rebuild anything. Every canary CI run already builds
# and measures the artifacts and uploads `size-gate-<platform>.json`. This
# job just adopts the newest of those reports as the new baseline and opens
# a PR. (Rebuilding here would re-pay the mac/windows release builds that are
# already CI's long pole — no reason to pay them twice.)
#
# What the PR changes:
#   * .ci/size-gate/<platform>.toml  — exact recorded sizes (the relative
#     `max_delta_pct` baseline)
#   * .cargo/size-gate.toml          — absolute `max_*_bytes` ceilings, reset
#     to `margin_pct` above the recorded sizes
#
# The PR is reviewed before merge (opened with a PAT so its own size-gate
# CI runs), which is where a human sees and signs off on any ceiling bump.

on:
  schedule:
    # Daily at 09:17 UTC. Scheduled runs use the workflow file on the repo's
    # default branch; the job always checks out canary explicitly below.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch whose latest CI sizes to adopt"
        required: false
        default: "canary"
      margin_pct:
        description: "Ceiling margin above each recorded size (percent)"
        required: false
        default: "3.0"

permissions:
  contents: read
  actions: read

concurrency:
  group: size-gate-baseline-refresh
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  refresh:
    name: "Refresh baselines from latest canary CI"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: canary
          persist-credentials: false

      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          # Reuse the linux size-gate job's cache so building the debug
          # cargo-size-gate binary is a near-instant cache hit.
          shared-key: "linux-cargo"
          save-if: false

      - name: "Adopt latest CI sizes (bake --branch)"
        id: bake
        working-directory: baml_language
        env:
          # `bake --branch` shells out to `gh` to find the newest completed
          # CI run on the branch that has all four size-gate reports, download
          # them, and adopt them. This is the SAME path a developer runs
          # locally to fix a stale baseline — one tool, one code path.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.branch || 'canary' }}
          MARGIN_PCT: ${{ inputs.margin_pct || '3.0' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cargo run -p cargo-size-gate -- size-gate bake \
            --branch "$BRANCH" \
            --repo "$REPO" \
            --margin-pct "$MARGIN_PCT" \
            --download-dir "$GITHUB_WORKSPACE/reports" \
            --summary-out "$GITHUB_WORKSPACE/summary.json"

      - name: "Build the PR body"
        working-directory: baml_language
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=$(jq -r '.run_id // ""' "$GITHUB_WORKSPACE/summary.json")
          head_sha=$(jq -r '.head_sha // ""' "$GITHUB_WORKSPACE/summary.json")
          violations=$(jq -r '.violations // 0' "$GITHUB_WORKSPACE/summary.json")
          mapfile -t reports < <(find "$GITHUB_WORKSPACE/reports" -name 'size-gate-*.json' | sort)
          cargo run -p cargo-size-gate -- size-gate agg "${reports[@]}" > "$GITHUB_WORKSPACE/refresh-body.md"
          {
            echo "Adopted from CI run [\`$head_sha\`]($SERVER_URL/$REPO/actions/runs/$run_id)."
            echo ""
            if [ "$violations" -gt 0 ]; then
              echo "> ⚠️ **$violations platform report(s) exceeded the *previous* gate** — this refresh re-pegs the baseline and ceilings to the sizes below. Confirm the growth is intentional before merging."
              echo ""
            fi
            cat "$GITHUB_WORKSPACE/refresh-body.md"
          } > "$GITHUB_WORKSPACE/pr-body.md"
          cat "$GITHUB_WORKSPACE/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: "Open/update baseline-refresh PR"
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          # PAT (not GITHUB_TOKEN) so the PR triggers its own CI, including
          # the size-gate check that confirms the new baseline is green.
          token: ${{ secrets.SAM_GITHUB_BOUNDARYML_READWRITE }}
          base: canary
          branch: chore/size-gate-baseline-refresh
          delete-branch: true
          title: "chore: refresh size-gate baselines"
          commit-message: "chore: refresh size-gate baselines from canary CI"
          body-path: pr-body.md
          add-paths: |
            baml_language/.ci/size-gate/*.toml
            baml_language/.cargo/size-gate.toml

      - name: "Validate and enqueue baseline-refresh PR"
        # Only when create-pull-request returned the exact PR it created or
        # updated (no diff/no PR -> nothing to do). Repository auto-merge is
        # disabled, so enroll directly in canary's merge queue. The queue
        # preserves branch protection and waits for all required checks.
        #
        # Reuse the PAT required above so creating the PR still triggers CI;
        # the workflow's GITHUB_TOKEN remains read-only. Validate the full PR
        # identity and changed-file scope before making any merge mutation.
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.SAM_GITHUB_BOUNDARYML_READWRITE }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail

          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::create-pull-request returned an invalid PR number: $PR_NUMBER"
            exit 1
          fi

          echo "Inspecting BoundaryML/baml PR #$PR_NUMBER returned by create-pull-request"
          pr_json=$(gh api graphql \
            -F number="$PR_NUMBER" \
            -f query='query($number: Int!) {
              repository(owner: "BoundaryML", name: "baml") {
                nameWithOwner
                pullRequest(number: $number) {
                  id number state title headRefName headRefOid baseRefName
                  headRepository { nameWithOwner }
                  baseRepository { nameWithOwner }
                  mergeQueueEntry { position }
                  files(first: 100) { totalCount nodes { path } }
                }
              }
            }')

          state=$(jq -r '.data.repository.pullRequest.state // ""' <<< "$pr_json")
          if [[ "$state" == 'MERGED' ]]; then
            echo "PR #$PR_NUMBER is already merged; nothing to enqueue"
            exit 0
          fi

          file_count=$(jq '.data.repository.pullRequest.files.totalCount // 0' <<< "$pr_json")
          # Fail closed unless the exact automation PR and every changed path
          # match the create-pull-request configuration above. More than 100
          # files also fails because the query intentionally reads at most 100.
          if ! jq -e --argjson number "$PR_NUMBER" '
            .data.repository as $repo
            | ($repo.nameWithOwner == "BoundaryML/baml") and
              ($repo.pullRequest |
                .number == $number and
                .state == "OPEN" and
                .title == "chore: refresh size-gate baselines" and
                .headRefName == "chore/size-gate-baseline-refresh" and
                .baseRefName == "canary" and
                .headRepository.nameWithOwner == "BoundaryML/baml" and
                .baseRepository.nameWithOwner == "BoundaryML/baml" and
                .files.totalCount == (.files.nodes | length) and
                all(.files.nodes[].path;
                  test("^baml_language/\\.ci/size-gate/[^/]+\\.toml$") or
                  . == "baml_language/.cargo/size-gate.toml"))
          ' <<< "$pr_json" >/dev/null; then
            jq '.data.repository | {
              repository: .nameWithOwner,
              pullRequest: (.pullRequest | {
                number, state, title, headRefName, baseRefName,
                headRepository: .headRepository.nameWithOwner,
                baseRepository: .baseRepository.nameWithOwner,
                changedFiles: [.files.nodes[].path],
                changedFileCount: .files.totalCount
              })
            }' <<< "$pr_json"
            echo "::error::PR identity or changed-file scope did not match the baseline-refresh automation"
            exit 1
          fi

          if [[ "$file_count" -eq 0 ]]; then
            echo "PR #$PR_NUMBER has no changed files; nothing to enqueue"
            exit 0
          fi

          queue_position=$(jq -r '.data.repository.pullRequest.mergeQueueEntry.position // ""' <<< "$pr_json")
          if [[ -n "$queue_position" ]]; then
            echo "PR #$PR_NUMBER is already in the merge queue at position $queue_position"
            exit 0
          fi

          pr_id=$(jq -r '.data.repository.pullRequest.id' <<< "$pr_json")
          head_oid=$(jq -r '.data.repository.pullRequest.headRefOid' <<< "$pr_json")
          echo "Validated $file_count baseline file(s); enqueueing PR #$PR_NUMBER at head $head_oid"
          gh api graphql \
            -f query='mutation($prId: ID!, $headOid: GitObjectID!) {
              enqueuePullRequest(input: {pullRequestId: $prId, expectedHeadOid: $headOid}) {
                mergeQueueEntry { position }
              }
            }' \
            -F prId="$pr_id" \
            -F headOid="$head_oid" \
            --jq '"Enqueued in the canary merge queue at position \(.data.enqueuePullRequest.mergeQueueEntry.position)"'
