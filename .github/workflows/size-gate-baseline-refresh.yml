name: Size Gate — Daily Baseline Refresh

# Re-pegs the committed size-gate baseline to the *real* sizes CI most
# recently measured on canary, so the gate never drifts far from reality.
#
# Key idea: it does NOT rebuild anything. Every canary CI run already builds
# and measures the artifacts and uploads `size-gate-<platform>.json`. This
# job just adopts the newest of those reports as the new baseline and opens
# a PR. (Rebuilding here would re-pay the mac/windows release builds that are
# already CI's long pole — no reason to pay them twice.)
#
# What the PR changes:
#   * .ci/size-gate/<platform>.toml  — exact recorded sizes (the relative
#     `max_delta_pct` baseline)
#   * .cargo/size-gate.toml          — absolute `max_*_bytes` ceilings, reset
#     to `margin_pct` above the recorded sizes
#
# The PR is reviewed before merge (opened with a PAT so its own size-gate
# CI runs), which is where a human sees and signs off on any ceiling bump.

on:
  schedule:
    # Daily at 09:17 UTC. Scheduled runs use the workflow file on the repo's
    # default branch; the job always checks out canary explicitly below.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      margin_pct:
        description: "Ceiling margin above each recorded size (percent)"
        required: false
        default: "3.0"
      run_id:
        description: "Adopt this specific CI run id (default: latest successful canary run)"
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: size-gate-baseline-refresh
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  refresh:
    name: "Refresh baselines from latest canary CI"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: canary
          persist-credentials: false

      - name: "Select the canary CI run to adopt + download its reports"
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID_INPUT: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          # The four per-platform report artifacts a complete CI run uploads.
          # We require ALL of them so a refresh never bakes a partial set
          # (which would leave some platforms on a stale baseline).
          need=(size-gate-linux size-gate-macos size-gate-windows size-gate-wasm)

          # True if run $1 has all four size-gate report artifacts.
          has_all_reports() {
            local names
            names=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/$1/artifacts" \
              --jq '.artifacts[].name')
            local n
            for n in "${need[@]}"; do
              grep -qxF "$n" <<<"$names" || return 1
            done
            return 0
          }

          if [ -n "${RUN_ID_INPUT:-}" ]; then
            candidates="$RUN_ID_INPUT"
          else
            # Newest-first *completed* canary CI runs, regardless of overall
            # conclusion. Canary CI is frequently red for reasons unrelated
            # to size (flaky tests, etc.) while the size-gate jobs themselves
            # pass and upload valid reports — so the run conclusion is the
            # wrong signal. We also deliberately do NOT skip runs whose
            # size-gate flagged a violation: a run that's red because size
            # grew past the old gate is exactly when a refresh PR should
            # open. The reviewed (auto-merging) PR is the backstop.
            candidates=$(gh run list \
              --workflow ci.yaml \
              --branch canary \
              --status completed \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId')
          fi

          run_id=""
          for id in $candidates; do
            if has_all_reports "$id"; then
              run_id="$id"
              break
            fi
            echo "run $id: missing one or more size-gate reports — skipping"
          done

          if [ -z "$run_id" ]; then
            echo "::error::No recent completed canary run has all four size-gate reports." >&2
            exit 1
          fi

          head_sha=$(gh run view "$run_id" --json headSha --jq '.headSha')

          # `size-gate-*` matches the per-platform reports and NOT the
          # `cargo-timings-size-gate-*` artifacts (different prefix).
          gh run download "$run_id" --pattern 'size-gate-*' --dir reports

          # Guard: every downloaded report must parse and carry artifacts.
          # Also count how many flagged a violation vs the prior baseline —
          # informational, surfaced in the PR so the reviewer knows the
          # refresh is re-pegging a real jump.
          count=0
          violations=0
          while IFS= read -r f; do
            jq -e '.artifacts | type == "array"' "$f" >/dev/null \
              || { echo "::error::unparseable size-gate report: $f" >&2; exit 1; }
            count=$((count + 1))
            if jq -e '.ok == false' "$f" >/dev/null; then
              violations=$((violations + 1))
            fi
          done < <(find reports -name 'size-gate-*.json')

          if [ "$count" -lt "${#need[@]}" ]; then
            echo "::error::Expected ${#need[@]} size-gate reports, downloaded $count." >&2
            exit 1
          fi

          {
            echo "run_id=$run_id"
            echo "head_sha=$head_sha"
            echo "violations=$violations"
          } >> "$GITHUB_OUTPUT"
          echo "Adopting size-gate reports from run $run_id ($head_sha); $violations report(s) flagged a violation vs the prior baseline."

      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          # Reuse the linux size-gate job's cache so building the debug
          # cargo-size-gate binary is a near-instant cache hit.
          shared-key: "linux-cargo"
          save-if: false

      - name: "Bake baselines + ceilings (no rebuild)"
        working-directory: baml_language
        env:
          MARGIN_PCT: ${{ inputs.margin_pct || '3.0' }}
          HEAD_SHA: ${{ steps.find.outputs.head_sha }}
        run: |
          set -euo pipefail
          mapfile -t reports < <(find "$GITHUB_WORKSPACE/reports" -name 'size-gate-*.json' | sort)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::error::No size-gate JSON reports were downloaded." >&2
            exit 1
          fi
          cargo run -p cargo-size-gate -- size-gate bake \
            "${reports[@]}" \
            --margin-pct "$MARGIN_PCT" \
            --git-sha "$HEAD_SHA"

      - name: "Summarize the proposed baseline"
        working-directory: baml_language
        env:
          HEAD_SHA: ${{ steps.find.outputs.head_sha }}
          RUN_ID: ${{ steps.find.outputs.run_id }}
          VIOLATIONS: ${{ steps.find.outputs.violations }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t reports < <(find "$GITHUB_WORKSPACE/reports" -name 'size-gate-*.json' | sort)
          cargo run -p cargo-size-gate -- size-gate agg "${reports[@]}" > "$GITHUB_WORKSPACE/refresh-body.md"
          {
            echo "Adopted from canary CI run [\`$HEAD_SHA\`]($SERVER_URL/$REPO/actions/runs/$RUN_ID)."
            echo ""
            if [ "$VIOLATIONS" -gt 0 ]; then
              echo "> ⚠️ **$VIOLATIONS platform report(s) exceeded the *previous* gate** — this refresh re-pegs the baseline and ceilings to the sizes below. Confirm the growth is intentional before merging."
              echo ""
            fi
            cat "$GITHUB_WORKSPACE/refresh-body.md"
          } > "$GITHUB_WORKSPACE/pr-body.md"
          cat "$GITHUB_WORKSPACE/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: "Open/update baseline-refresh PR"
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          # PAT (not GITHUB_TOKEN) so the PR triggers its own CI, including
          # the size-gate check that confirms the new baseline is green.
          token: ${{ secrets.SAM_GITHUB_BOUNDARYML_READWRITE }}
          base: canary
          branch: chore/size-gate-baseline-refresh
          delete-branch: true
          title: "chore: refresh size-gate baselines"
          commit-message: "chore: refresh size-gate baselines from canary CI"
          body-path: pr-body.md
          add-paths: |
            baml_language/.ci/size-gate/*.toml
            baml_language/.cargo/size-gate.toml

      - name: "Enable auto-merge"
        # Only when a PR actually exists (no diff → no PR → nothing to do).
        # With canary's required checks, auto-merge waits for this PR's own
        # size-gate CI to pass before merging, so a refresh that would
        # regress never lands. Uses the PAT (the GITHUB_TOKEN can't enable
        # auto-merge on a PR it didn't author).
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.SAM_GITHUB_BOUNDARYML_READWRITE }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" \
            --squash --auto
