name: Integration Tests

on:
  push:
    branches: [ sam/integ-tests-ci ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        _:
          - runs-on: ubuntu-22.04
            ollama-install: |
              curl -fsSL https://ollama.com/install.sh | sh
          - runs-on: macos-14
            ollama-install: |
              brew install ollama
          # winget is not available on windows-2019 or windows-2022
          - runs-on: windows-2025
            ollama-install: |
              winget install --id=Ollama.Ollama -e --accept-package-agreements
    runs-on: ${{ matrix._.runs-on }}
    # For when we have go integ tests
    # env:
    #   GOARCH: ${{ matrix._.goarch }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ollama
        run: ${{ matrix._.ollama-install }}
      - name: Run simple smoke test
        run: |
          ollama serve &
          sleep 5
          ollama run tinyllama "2+2?"
