# @generated by `cargo xtask workflows` from tools_xtask::workflows::cargo_tests -- DO NOT EDIT.
# Rebuild with: cd baml_language && cargo xtask workflows
name: Cargo Tests (Reusable)
env:
  BAML_SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.BAML_SCCACHE_R2_ACCESS_KEY_ID }}
  BAML_SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BAML_SCCACHE_R2_SECRET_ACCESS_KEY }}
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
on:
  workflow_call:
    secrets:
      BAML_SCCACHE_R2_ACCESS_KEY_ID: {}
      BAML_SCCACHE_R2_SECRET_ACCESS_KEY: {}
permissions:
  contents: read
jobs:
  cargo-test-linux:
    name: cargo test (linux)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
    - uses: useblacksmith/checkout@v1
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: rustup show
      working-directory: baml_language
    - name: Install tools (mise)
      uses: ./.github/actions/setup-mise
      with:
        install_args: sccache direnv cargo:cargo-nextest
    - name: Verify sccache
      run: sccache --version
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: baml_language -> target
        cache-all-crates: true
        cache-targets: false
        save-if: ${{ github.ref == 'refs/heads/canary' }}
        shared-key: linux-cargo
    - name: Load .envrc with direnv
      run: |-
        set -euo pipefail

        direnv allow .envrc
        direnv export gha >> "$GITHUB_ENV"
    - name: Fetch cargo dependencies
      run: cargo fetch
      working-directory: baml_language
    - name: Build tests with --timings
      run: cargo test --no-run --all-features --timings
      working-directory: baml_language
    - name: Run tests with nextest
      run: cargo nextest run --all-features -E 'not package(baml_tests) and not package(/^sdk_test_/)'
      working-directory: baml_language
    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-failures-linux
        path: |
          baml_language/**/*.snap.new
          baml_language/**/target/nextest/
    - name: Show sccache stats
      if: always()
      run: sccache --show-stats
    - name: Dump sccache stats (json)
      if: always()
      run: sccache --show-stats --stats-format json > sccache-stats-test-linux.json
    - name: Upload sccache stats
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sccache-stats-test-linux
        path: sccache-stats-test-linux.json
        if-no-files-found: ignore
    - name: Rename cargo timings
      if: always()
      run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-linux.html
      working-directory: baml_language
    - name: Upload cargo timings
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cargo-timings-test-linux
        path: baml_language/target/cargo-timings/cargo-timing-test-linux.html
        if-no-files-found: ignore
    timeout-minutes: 25
  cargo-test-macos:
    if: ${{ github.event_name != 'merge_group' }}
    name: cargo test (macos)
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: rustup show
      working-directory: baml_language
    - name: Install tools (mise)
      uses: ./.github/actions/setup-mise
      with:
        install_args: sccache direnv cargo:cargo-nextest
    - name: Verify sccache
      run: sccache --version
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: baml_language -> target
        cache-all-crates: true
        cache-targets: false
        save-if: ${{ github.ref == 'refs/heads/canary' }}
        shared-key: macos-cargo
    - name: Load .envrc with direnv
      run: |-
        set -euo pipefail

        direnv allow .envrc
        direnv export gha >> "$GITHUB_ENV"
    - name: Fetch cargo dependencies
      run: cargo fetch
      working-directory: baml_language
    - name: Build tests with --timings
      run: cargo test --no-run --all-features --timings
      working-directory: baml_language
    - name: Run tests with nextest
      run: cargo nextest run --all-features -E 'not package(baml_tests) and not package(/^sdk_test_/)'
      working-directory: baml_language
    - name: Show sccache stats
      if: always()
      run: sccache --show-stats
    - name: Dump sccache stats (json)
      if: always()
      run: sccache --show-stats --stats-format json > sccache-stats-test-macos.json
    - name: Upload sccache stats
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sccache-stats-test-macos
        path: sccache-stats-test-macos.json
        if-no-files-found: ignore
    - name: Rename cargo timings
      if: always()
      run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-macos.html
      working-directory: baml_language
    - name: Upload cargo timings
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cargo-timings-test-macos
        path: baml_language/target/cargo-timings/cargo-timing-test-macos.html
        if-no-files-found: ignore
    timeout-minutes: 35
  cargo-test-windows:
    if: ${{ github.event_name != 'merge_group' }}
    name: cargo test (windows)
    runs-on: blacksmith-8vcpu-windows-2025
    env:
      CARGO_BUILD_JOBS: '16'
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: rustup show
      working-directory: baml_language
    - name: Install sccache, direnv, and cargo-nextest
      uses: ./.github/actions/setup-mise
      with:
        install_args: sccache direnv cargo:cargo-nextest
    - name: Verify sccache
      run: sccache --version
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: baml_language -> target
        cache-all-crates: true
        cache-targets: false
        save-if: ${{ github.ref == 'refs/heads/canary' }}
        shared-key: windows-cargo
    - name: Load .envrc with direnv
      run: |-
        set -euo pipefail

        direnv allow .envrc
        direnv export gha >> "$GITHUB_ENV"
    - name: Fetch cargo dependencies
      run: cargo fetch
      working-directory: baml_language
    - name: Build native sccache wrapper
      run: |-
        set -euo pipefail
        # The native RUSTC_WRAPPER (tools_sccache crate) maps the R2 creds and
        # execs sccache; cargo launches it via CreateProcess (32767-char
        # limit), avoiding cmd.exe's ~8191-char limit that windows-sys' huge
        # `--check-cfg cfg(feature, values(...))` line blows past. The binary
        # lives in the build tree, so build it first — .envrc leaves
        # RUSTC_WRAPPER unset until it exists, so this bootstrap compiles with
        # plain rustc — then point RUSTC_WRAPPER at it for the cargo steps
        # below.
        cargo build -p tools_sccache
        echo "RUSTC_WRAPPER=$(pwd -W)/target/debug/baml-sccache.exe" >> "$GITHUB_ENV"
      working-directory: baml_language
    - name: Build tests with --timings
      run: cargo test --no-run --all-features --timings
      working-directory: baml_language
    - name: Run tests
      run: cargo nextest run --all-features -E 'not package(baml_tests) and not package(/^sdk_test_/)'
      working-directory: baml_language
    - name: Show sccache stats
      if: always()
      run: sccache --show-stats
    - name: Dump sccache stats (json)
      if: always()
      run: sccache --show-stats --stats-format json > sccache-stats-test-windows.json
    - name: Upload sccache stats
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sccache-stats-test-windows
        path: sccache-stats-test-windows.json
        if-no-files-found: ignore
    - name: Rename cargo timings
      if: always()
      run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-windows.html
      working-directory: baml_language
    - name: Upload cargo timings
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cargo-timings-test-windows
        path: baml_language/target/cargo-timings/cargo-timing-test-windows.html
        if-no-files-found: ignore
    timeout-minutes: 50
  sdk-test-matrix:
    name: sdk test matrix
    runs-on: ubuntu-latest
    steps:
    - id: matrix
      name: Build matrix
      uses: actions/github-script@v8
      with:
        script: |
          const baseMatrix = [
            {
              "sdk-label": "python-pydantic2",
              "package-name": "sdk_test_python_pydantic2",
              "sdk-path": "python_pydantic2",
              "install-args": "sccache direnv python uv cargo:cargo-nextest",
              "os-label": "linux",
              "runs-on": "blacksmith-16vcpu-ubuntu-2404",
              "rust-cache-key": "linux-cargo",
              "timeout": 30,
            },
            {
              "sdk-label": "typescript-node",
              "package-name": "sdk_test_typescript_node",
              "sdk-path": "typescript_node",
              "install-args": "sccache direnv node npm:pnpm cargo:cargo-nextest",
              "os-label": "linux",
              "runs-on": "blacksmith-16vcpu-ubuntu-2404",
              "rust-cache-key": "linux-cargo",
              "timeout": 30,
            },
            {
              "sdk-label": "python-pydantic2",
              "package-name": "sdk_test_python_pydantic2",
              "sdk-path": "python_pydantic2",
              "install-args": "sccache direnv python uv cargo:cargo-nextest",
              "os-label": "macos",
              "runs-on": "blacksmith-6vcpu-macos-latest",
              "rust-cache-key": "macos-cargo",
              "timeout": 40,
            },
            {
              "sdk-label": "typescript-node",
              "package-name": "sdk_test_typescript_node",
              "sdk-path": "typescript_node",
              "install-args": "sccache direnv node npm:pnpm cargo:cargo-nextest",
              "os-label": "macos",
              "runs-on": "blacksmith-6vcpu-macos-latest",
              "rust-cache-key": "macos-cargo",
              "timeout": 40,
            },
            {
              "sdk-label": "python-pydantic2",
              "package-name": "sdk_test_python_pydantic2",
              "sdk-path": "python_pydantic2",
              "install-args": "sccache direnv python uv cargo:cargo-nextest",
              "os-label": "windows",
              "runs-on": "blacksmith-8vcpu-windows-2025",
              "rust-cache-key": "windows-cargo",
              "timeout": 60,
            },
            {
              "sdk-label": "typescript-node",
              "package-name": "sdk_test_typescript_node",
              "sdk-path": "typescript_node",
              "install-args": "sccache direnv node npm:pnpm cargo:cargo-nextest",
              "os-label": "windows",
              "runs-on": "blacksmith-8vcpu-windows-2025",
              "rust-cache-key": "windows-cargo",
              "timeout": 60,
            },
          ];

          const matrix = context.eventName === "merge_group"
            ? baseMatrix.filter((entry) => entry["os-label"] === "linux")
            : baseMatrix;

          core.setOutput("matrix", JSON.stringify(matrix, null, 2));
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
  sdk-tests:
    needs:
    - sdk-test-matrix
    name: sdk tests (${{ matrix.sdk-label }}, ${{ matrix.os-label }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.sdk-test-matrix.outputs.matrix) }}
      fail-fast: false
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: rustup show
      working-directory: baml_language
    - name: Install sdk test tools
      uses: ./.github/actions/setup-mise
      with:
        install_args: ${{ matrix.install-args }}
    - name: Verify sccache
      run: sccache --version
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: baml_language -> target
        cache-all-crates: true
        cache-targets: false
        save-if: false
        shared-key: ${{ matrix.rust-cache-key }}
    - name: Load .envrc with direnv
      run: |-
        set -euo pipefail

        direnv allow .envrc
        direnv export gha >> "$GITHUB_ENV"
    - name: Fetch cargo dependencies
      run: cargo fetch
      working-directory: baml_language
    - name: Build native sccache wrapper
      if: matrix.os-label == 'windows'
      run: |-
        set -euo pipefail
        cargo build -p tools_sccache
        echo "RUSTC_WRAPPER=$(pwd -W)/target/debug/baml-sccache.exe" >> "$GITHUB_ENV"
        # CARGO_BUILD_JOBS oversubscription only matters for the Windows build.
        echo "CARGO_BUILD_JOBS=16" >> "$GITHUB_ENV"
      working-directory: baml_language
    - name: Configure Python wheelhouse
      if: matrix.os-label == 'windows' && matrix.sdk-label == 'python-pydantic2'
      run: echo "UV_FIND_LINKS=$(pwd -W)/target/wheels" >> "$GITHUB_ENV"
      working-directory: baml_language
    - name: Build tests with --timings
      run: cargo test --no-run -p ${{ matrix.package-name }} --all-features --timings
      working-directory: baml_language
    - name: Show sccache stats
      if: always()
      run: sccache --show-stats
    - name: Run sdk test setup
      run: cargo nextest run -p ${{ matrix.package-name }} --all-features -E 'package(=${{ matrix.package-name }}) and test(setup_guard::ran)'
      working-directory: baml_language
    - name: Run sdk tests
      run: cargo nextest run -p ${{ matrix.package-name }} --all-features -E 'package(=${{ matrix.package-name }})'
      working-directory: baml_language
    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: sdk-test-failures-${{ matrix.sdk-label }}-${{ matrix.os-label }}
        path: |
          baml_language/sdk_tests/crates/${{ matrix.sdk-path }}/*/generated/
          baml_language/target/nextest/
        if-no-files-found: ignore
    - name: Show sccache stats
      if: always()
      run: sccache --show-stats
    - name: Dump sccache stats (json)
      if: always()
      run: sccache --show-stats --stats-format json > sccache-stats-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}.json
    - name: Upload sccache stats
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sccache-stats-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}
        path: sccache-stats-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}.json
        if-no-files-found: ignore
    - name: Rename cargo timings
      if: always()
      run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}.html
      working-directory: baml_language
    - name: Upload cargo timings
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cargo-timings-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}
        path: baml_language/target/cargo-timings/cargo-timing-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}.html
        if-no-files-found: ignore
    timeout-minutes: ${{ matrix.timeout }}
  cargo-test-wasm:
    name: cargo test (wasm)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - uses: useblacksmith/checkout@v1
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: |-
        rustup show
        rustup target add wasm32-unknown-unknown
      working-directory: baml_language
    - name: Install sccache and direnv
      uses: ./.github/actions/setup-mise
      with:
        install_args: sccache direnv
    - name: Verify sccache
      run: sccache --version
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: baml_language -> target
        cache-all-crates: true
        cache-targets: false
        save-if: ${{ github.ref == 'refs/heads/canary' }}
        shared-key: linux-wasm
    - name: Load .envrc with direnv
      run: |-
        set -euo pipefail

        direnv allow .envrc
        direnv export gha >> "$GITHUB_ENV"
    - name: Fetch cargo dependencies
      run: cargo fetch --target wasm32-unknown-unknown
      working-directory: baml_language
    - name: Build for WASM
      run: |-
        WASM_PACKAGES=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.source==null) | select(if .metadata.ci.wasm_support == null then true else .metadata.ci.wasm_support end) | "-p \(.name)"' | xargs)
        cargo build $WASM_PACKAGES --target wasm32-unknown-unknown --no-default-features --release --timings
      working-directory: baml_language
    - name: List WASM artifacts
      run: ls -lh target/wasm32-unknown-unknown/release/*.wasm || true
      working-directory: baml_language
    - name: Show sccache stats
      if: always()
      run: sccache --show-stats
    - name: Dump sccache stats (json)
      if: always()
      run: sccache --show-stats --stats-format json > sccache-stats-test-wasm.json
    - name: Upload sccache stats
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sccache-stats-test-wasm
        path: sccache-stats-test-wasm.json
        if-no-files-found: ignore
    - name: Rename cargo timings
      if: always()
      run: |-
        if [[ -f target/cargo-timings/cargo-timing.html ]]; then
          mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-wasm.html
        fi
      working-directory: baml_language
    - name: Upload cargo timings
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cargo-timings-test-wasm
        path: baml_language/target/cargo-timings/cargo-timing-test-wasm.html
        if-no-files-found: ignore
    timeout-minutes: 45
  cargo-build-msrv:
    name: cargo build (msrv)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
    - uses: useblacksmith/checkout@v1
      with:
        persist-credentials: false
    - id: msrv
      uses: SebRollen/toml-action@v1.2.0
      with:
        file: baml_language/Cargo.toml
        field: workspace.package.rust-version
    - name: Install Rust toolchain (MSRV)
      run: |-
        rustup toolchain install "${MSRV}"
        rustup default "${MSRV}"
      env:
        MSRV: ${{ steps.msrv.outputs.value }}
      working-directory: baml_language
    - name: Install sccache and direnv
      uses: ./.github/actions/setup-mise
      with:
        install_args: sccache direnv
    - name: Verify sccache
      run: sccache --version
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: baml_language -> target
        cache-all-crates: true
        cache-targets: false
        save-if: ${{ github.ref == 'refs/heads/canary' }}
        shared-key: linux-msrv
    - name: Load .envrc with direnv
      run: |-
        set -euo pipefail

        direnv allow .envrc
        direnv export gha >> "$GITHUB_ENV"
    - name: Fetch cargo dependencies
      run: cargo "+${MSRV}" fetch
      env:
        MSRV: ${{ steps.msrv.outputs.value }}
      working-directory: baml_language
    - name: Build with MSRV
      run: cargo "+${MSRV}" test --no-run --all-features --timings
      env:
        MSRV: ${{ steps.msrv.outputs.value }}
      working-directory: baml_language
    - name: Show sccache stats
      if: always()
      run: sccache --show-stats
    - name: Dump sccache stats (json)
      if: always()
      run: sccache --show-stats --stats-format json > sccache-stats-msrv.json
    - name: Upload sccache stats
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sccache-stats-msrv
        path: sccache-stats-msrv.json
        if-no-files-found: ignore
    - name: Rename cargo timings
      if: always()
      run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-msrv.html
      working-directory: baml_language
    - name: Upload cargo timings
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cargo-timings-msrv
        path: baml_language/target/cargo-timings/cargo-timing-msrv.html
        if-no-files-found: ignore
    timeout-minutes: 25
  cargo-doc:
    name: cargo doc
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - uses: useblacksmith/checkout@v1
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: rustup show
      working-directory: baml_language
    - name: Install sccache and direnv
      uses: ./.github/actions/setup-mise
      with:
        install_args: sccache direnv
    - name: Verify sccache
      run: sccache --version
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: baml_language -> target
        cache-all-crates: true
        cache-targets: false
        save-if: 'false'
        shared-key: linux-cargo
    - name: Load .envrc with direnv
      run: |-
        set -euo pipefail

