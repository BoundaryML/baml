# sccache strategy
# ================
#
# This workflow uses sccache for Rust compilation artifacts and
# Swatinem/rust-cache for Cargo registry/git state — i.e. everything cargo
# downloads before it compiles: the crates.io index, the `.crate` tarballs, and
# the git checkouts of our forks (minijinja, aws-sdk-rust, google-cloud-rust).
# `cache-all-crates: true` keeps all of those (the git forks in particular,
# which are large and otherwise re-cloned on every runner); `cache-targets:
# false` leaves the compiled `target/` tree to sccache so the two caches don't
# compete.
#
# Because `target/` is excluded, rust-cache's payload is small (registry + git,
# no build output). As on canary, only canary writes the cache
# (`save-if: ${{ github.ref == 'refs/heads/canary' }}`); PR branches read the
# shared entry instead of each saving a fresh one, so cache usage doesn't blow
# out. rust-cache keys are content-addressed on Cargo.lock, so jobs sharing a
# `shared-key` reuse the same entry.
#
# mise installs sccache and direnv, then each cargo job loads .envrc via
# `direnv export gha` so CI uses the exact same sccache config as local shells:
# .envrc is the single source of truth. The R2 credentials are passed through
# GitHub Actions secrets using the same BAML_SCCACHE_R2_* names that the
# RUSTC_WRAPPER maps to AWS_* before exec'ing sccache — the `tools/baml-sccache`
# script on POSIX, and the native `tools_sccache` crate's binary on Windows
# (built per-job; see the "Build native sccache wrapper" step).
#
# Secretless runs (e.g. fork PRs) still install sccache, but .envrc sees no R2
# credentials and falls back to the runner-local cache.
name: Cargo Tests (Reusable)

on:
  workflow_call:
    secrets:
      BAML_SCCACHE_R2_ACCESS_KEY_ID:
        required: false
      BAML_SCCACHE_R2_SECRET_ACCESS_KEY:
        required: false
  # EXPERIMENT HARNESS (build-caching/04): standalone push trigger so a *bare*
  # push (no PR) to this branch runs ONLY the two Windows SDK jobs. Every other
  # job below is gated `if: !<experiment>`, and the matrix is filtered to
  # windows, so nothing else in this file runs; no other workflow matches a bare
  # branch push either. DO NOT open a PR from this branch (that wakes ci.yaml /
  # primary.yml). Remove this block + the `experiment` gates before merging.
  push:
    branches:
      - sam/win-sdk-speedup

# Read-only by design: these jobs run PR-controlled cargo build/test code, so
# they should not need elevated repository permissions.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Inputs read by .envrc; everything else (RUSTC_WRAPPER, SCCACHE_*) is set by
  # .envrc itself so it stays the single source of truth across CI and local.
  # The R2 credentials .envrc maps to AWS_* for sccache (mapped to AWS_*).
  BAML_SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.BAML_SCCACHE_R2_ACCESS_KEY_ID }}
  BAML_SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BAML_SCCACHE_R2_SECRET_ACCESS_KEY }}
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  # With sccache, most compile units are R2 cache lookups/fetches (I/O-bound,
  # ~0.2s each) rather than CPU codegen, so cargo's default parallelism (=
  # core count, just 4 on the Windows runner) leaves cores idle waiting on the
  # network. Oversubscribe so cache-hit fetches overlap. Applies to every cargo
  # invocation in this workflow.
  CARGO_BUILD_JOBS: "16"

jobs:

  cargo-test-linux:
    name: "cargo test (linux)"
    # EXPERIMENT HARNESS (build-caching/04): skip on the win-sdk-speedup branch.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/sam/win-sdk-speedup') }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false

      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - name: "Install sccache and direnv"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: "linux-cargo"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: "Build tests with --timings"
        run: cargo test --no-run --all-features --timings
        working-directory: baml_language

      # Snapshot tests live in `baml_tests` and are exercised end-to-end by
      # the dedicated `snapshot-tests` job. The `sdk_test_*` crates need uv
      # and run in the dedicated `sdk-tests` matrix below. Skip both here.
      - name: "Run tests with nextest"
        run: cargo nextest run --all-features -E 'not package(baml_tests) and not package(/^sdk_test_/)'
        working-directory: baml_language

      - name: "Upload test results on failure"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failures-linux
          path: |
            baml_language/**/*.snap.new
            baml_language/**/target/nextest/

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-test-linux.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-test-linux
          path: sccache-stats-test-linux.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-linux.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test-linux
          path: baml_language/target/cargo-timings/cargo-timing-test-linux.html
          if-no-files-found: ignore

  cargo-test-macos:
    name: "cargo test (macos)"
    # Skip in the merge queue: macos already ran on the PR. The merge_group
    # event is inherited from ci.yaml through the workflow_call boundary.
    # EXPERIMENT HARNESS (build-caching/04): also skip on win-sdk-speedup.
    if: ${{ github.event_name != 'merge_group' && !(github.event_name == 'push' && github.ref == 'refs/heads/sam/win-sdk-speedup') }}
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - name: "Install sccache and direnv"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: "macos-cargo"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: "Build tests with --timings"
        run: cargo test --no-run --all-features --timings
        working-directory: baml_language

      # Snapshot tests live in `baml_tests` and are covered by the dedicated
      # `snapshot-tests` job. The `sdk_test_*` crates need uv and run in the
      # dedicated `sdk-tests` matrix below. Skip both here.
      - name: "Run tests"
        run: cargo nextest run --all-features -E 'not package(baml_tests) and not package(/^sdk_test_/)'
        working-directory: baml_language

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-test-macos.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-test-macos
          path: sccache-stats-test-macos.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-macos.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test-macos
          path: baml_language/target/cargo-timings/cargo-timing-test-macos.html
          if-no-files-found: ignore

  cargo-test-windows:
    name: "cargo test (windows)"
    # Skip in the merge queue: windows already ran on the PR. The merge_group
    # event is inherited from ci.yaml through the workflow_call boundary.
    # EXPERIMENT HARNESS (build-caching/04): also skip on win-sdk-speedup — the
    # SDK matrix below covers the Windows native build we're tuning.
    if: ${{ github.event_name != 'merge_group' && !(github.event_name == 'push' && github.ref == 'refs/heads/sam/win-sdk-speedup') }}
    runs-on: blacksmith-4vcpu-windows-2025
    # TODO: Reduce this once our changes to aws-sdk-rust are upstreamed
    # Right now it needs to download our repo every time which is very slow
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - name: "Install sccache and direnv"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: "windows-cargo"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      - name: "Build native sccache wrapper"
        run: |
          set -euo pipefail
          # The native RUSTC_WRAPPER (tools_sccache crate) maps the R2 creds and
          # execs sccache; cargo launches it via CreateProcess (32767-char
          # limit), avoiding cmd.exe's ~8191-char limit that windows-sys' huge
          # `--check-cfg cfg(feature, values(...))` line blows past. The binary
          # lives in the build tree, so build it first — .envrc leaves
          # RUSTC_WRAPPER unset until it exists, so this bootstrap compiles with
          # plain rustc — then point RUSTC_WRAPPER at it for the cargo steps
          # below.
          cargo build -p tools_sccache
          echo "RUSTC_WRAPPER=$(pwd -W)/target/debug/baml-sccache.exe" >> "$GITHUB_ENV"
        working-directory: baml_language

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: "Build tests with --timings"
        run: cargo test --no-run --all-features --timings
        working-directory: baml_language

      # Snapshot tests live in `baml_tests` and are covered by the dedicated
      # `snapshot-tests` job. The `sdk_test_*` crates need uv and run in the
      # dedicated `sdk-tests` matrix below. Skip both here.
      - name: "Run tests"
        run: cargo nextest run --all-features -E 'not package(baml_tests) and not package(/^sdk_test_/)'
        working-directory: baml_language

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-test-windows.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-test-windows
          path: sccache-stats-test-windows.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-windows.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test-windows
          path: baml_language/target/cargo-timings/cargo-timing-test-windows.html
          if-no-files-found: ignore

  sdk-test-matrix:
    name: "sdk test matrix"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: "Build matrix"
        id: matrix
        uses: actions/github-script@v8
        with:
          script: |
            const baseMatrix = [
              {
                "sdk-label": "python-pydantic2",
                "package-name": "sdk_test_python_pydantic2",
                "sdk-path": "python_pydantic2",
                "install-args": "sccache direnv python uv",
                "os-label": "linux",
                "runs-on": "blacksmith-16vcpu-ubuntu-2404",
                "rust-cache-key": "linux-cargo",
                "timeout": 30,
              },
              {
                "sdk-label": "typescript-node",
                "package-name": "sdk_test_typescript_node",
                "sdk-path": "typescript_node",
                "install-args": "sccache direnv node npm:pnpm",
                "os-label": "linux",
                "runs-on": "blacksmith-16vcpu-ubuntu-2404",
                "rust-cache-key": "linux-cargo",
                "timeout": 30,
              },
              {
                "sdk-label": "python-pydantic2",
                "package-name": "sdk_test_python_pydantic2",
                "sdk-path": "python_pydantic2",
                "install-args": "sccache direnv python uv",
                "os-label": "macos",
                "runs-on": "blacksmith-6vcpu-macos-latest",
                "rust-cache-key": "macos-cargo",
                "timeout": 40,
              },
              {
                "sdk-label": "typescript-node",
                "package-name": "sdk_test_typescript_node",
                "sdk-path": "typescript_node",
                "install-args": "sccache direnv node npm:pnpm",
                "os-label": "macos",
                "runs-on": "blacksmith-6vcpu-macos-latest",
                "rust-cache-key": "macos-cargo",
                "timeout": 40,
              },
              {
                "sdk-label": "python-pydantic2",
                "package-name": "sdk_test_python_pydantic2",
                "sdk-path": "python_pydantic2",
                "install-args": "sccache direnv python uv",
                "os-label": "windows",
                "runs-on": "blacksmith-4vcpu-windows-2025",
                "rust-cache-key": "windows-cargo",
                "timeout": 60,
              },
              {
                "sdk-label": "typescript-node",
                "package-name": "sdk_test_typescript_node",
                "sdk-path": "typescript_node",
                "install-args": "sccache direnv node npm:pnpm",
                "os-label": "windows",
                "runs-on": "blacksmith-4vcpu-windows-2025",
                "rust-cache-key": "windows-cargo",
                "timeout": 60,
              },
            ];

            // EXPERIMENT HARNESS (build-caching/04): on a bare push to the
            // win-sdk-speedup branch, run ONLY the two Windows SDK legs.
            const isWinSdkExperiment =
              context.eventName === "push" &&
              context.ref === "refs/heads/sam/win-sdk-speedup";

            const matrix = isWinSdkExperiment
              ? baseMatrix.filter((entry) => entry["os-label"] === "windows")
              : context.eventName === "merge_group"
              ? baseMatrix.filter((entry) => entry["os-label"] === "linux")
              : baseMatrix;

            core.setOutput("matrix", JSON.stringify(matrix, null, 2));

  # SDK tests (codegen end-to-end). The `sdk_test_*` generator crates emit
  # generated Python/TypeScript projects from `.baml` sources via build.rs,
  # then run their language-specific checks under nextest. Their setup scripts
  # do the expensive package-manager/native-build work (`uv sync` + `maturin`
  # for Python, `pnpm install` + NAPI build for TypeScript). Run the generated
  # setup guards first so CI exposes setup cost/failures as a separate step; the
  # full test step re-runs the setup scripts, but the warm path should be cheap.
  # Keep Python and TypeScript as separate matrix entries so setup/test timing
  # and failures are attributed to the specific SDK generator.
  sdk-tests:
    name: "sdk tests (${{ matrix.sdk-label }}, ${{ matrix.os-label }})"
    needs: sdk-test-matrix
    strategy:
      fail-fast: false
      # In the merge queue (`merge_group`) only the linux leg runs — the
      # macos/windows legs already ran on the PR. Keep these entries in sync
      # with the standalone cargo-test-macos/windows jobs above.
      matrix:
        include: ${{ fromJSON(needs.sdk-test-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    # EXPERIMENT HARNESS (build-caching/04): true only on a bare push to the
    # win-sdk-speedup branch. Gates the experiment-only cache tweaks below so
    # normal CI (workflow_call) keeps its existing cache semantics untouched.
    env:
      WIN_SDK_EXP: ${{ github.event_name == 'push' && github.ref == 'refs/heads/sam/win-sdk-speedup' }}
      # D (pnpm store caching) was tried and DROPPED: caching the ~hundreds-MB
      # store via rust-cache made restore cost (+40s to +190s) >= the ~79s cold
      # `pnpm install` it saved — a net wash/loss on Windows. See build-caching/04
      # exp 3a/4b. The cold `pnpm install` is left as-is.
      # B: resolve baml_core from the prebuilt wheelhouse (maturin build, see
      # python setup.{sh,ps1}) at BOTH setup and test time — the test step's
      # `uv run` is a separate process, so this must be a job-level env, not
      # just exported inside setup. Empty on normal CI (editable path source).
      UV_FIND_LINKS: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/sam/win-sdk-speedup') && format('{0}/baml_language/target/wheels', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - name: "Install sdk test tools"
        uses: ./.github/actions/setup-mise
        with:
          install_args: ${{ matrix.install-args }}

      - name: "Verify sccache"
        run: sccache --version

      # EXPERIMENT (build-caching/04, approach C): on the win-sdk-speedup
      # branch, persist `target/` (cache-targets:true + save) under a per-SDK
      # key so the cold cdylib/proc-macro link (which sccache structurally
      # cannot cache) comes back warm on the next run — maturin ~1m25→~20s,
      # napi ~1m39→~22s, the -p build step 44→14s. NOTE: needs one populating
      # run before the warm one. Per-SDK key (not shared windows-cargo) so the
      # python/ts targets don't clobber each other. Normal CI keeps
      # cache-targets:false / save-if:false.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: ${{ env.WIN_SDK_EXP == 'true' }}
          save-if: ${{ env.WIN_SDK_EXP == 'true' }}
          shared-key: ${{ env.WIN_SDK_EXP == 'true' && format('windows-sdk-exp-{0}', matrix.sdk-label) || matrix.rust-cache-key }}

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      # Windows-only: swap the .cmd RUSTC_WRAPPER for the native tools_sccache
      # .exe. See the matching step in `cargo-test-windows` for why.
      - name: "Build native sccache wrapper"
        if: matrix.os-label == 'windows'
        run: |
          set -euo pipefail
          cargo build -p tools_sccache
          echo "RUSTC_WRAPPER=$(pwd -W)/target/debug/baml-sccache.exe" >> "$GITHUB_ENV"
        working-directory: baml_language

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: "Build tests with --timings"
        run: cargo test --no-run -p ${{ matrix.package-name }} --all-features --timings
        working-directory: baml_language

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      # `-p` scopes *compilation* to this one package; the `-E` filter only
      # scopes *which tests run*. Without `-p`, nextest compiles the whole
      # workspace's ~145 test binaries (~4m48s on Windows) to run one. See
      # build-caching/04 approach A.
      - name: "Run sdk test setup"
        run: cargo nextest run -p ${{ matrix.package-name }} --all-features -E 'package(=${{ matrix.package-name }}) and test(setup_guard::ran)'
        working-directory: baml_language

      - name: "Run sdk tests"
        run: cargo nextest run -p ${{ matrix.package-name }} --all-features -E 'package(=${{ matrix.package-name }})'
        working-directory: baml_language

      - name: "Upload test results on failure"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-test-failures-${{ matrix.sdk-label }}-${{ matrix.os-label }}
          path: |
            baml_language/sdk_tests/crates/${{ matrix.sdk-path }}/*/generated/
            baml_language/target/nextest/
          if-no-files-found: ignore

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}
          path: sccache-stats-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}
          path: baml_language/target/cargo-timings/cargo-timing-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}.html
          if-no-files-found: ignore

  cargo-test-wasm:
    name: "cargo test (wasm)"
    # EXPERIMENT HARNESS (build-caching/04): skip on the win-sdk-speedup branch.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/sam/win-sdk-speedup') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false

      - name: "Install Rust toolchain"
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
        working-directory: baml_language

      - name: "Install sccache and direnv"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: "linux-wasm"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch --target wasm32-unknown-unknown
        working-directory: baml_language

      - name: "Build for WASM"
        run: |
          WASM_PACKAGES=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.source==null) | select(if .metadata.ci.wasm_support == null then true else .metadata.ci.wasm_support end) | "-p \(.name)"' | xargs)
          cargo build $WASM_PACKAGES --target wasm32-unknown-unknown --no-default-features --release --timings
        working-directory: baml_language

      - name: "List WASM artifacts"
        run: ls -lh target/wasm32-unknown-unknown/release/*.wasm || true
        working-directory: baml_language

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-test-wasm.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-test-wasm
          path: sccache-stats-test-wasm.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: |
          if [[ -f target/cargo-timings/cargo-timing.html ]]; then
            mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-wasm.html
          fi
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test-wasm
          path: baml_language/target/cargo-timings/cargo-timing-test-wasm.html
          if-no-files-found: ignore

  # Size-gate jobs live in size-gate.reusable.yaml — they are intentionally
  # decoupled from cargo-tests so a violation never blocks the test workflow.

  cargo-build-msrv:
    name: "cargo build (msrv)"
    # EXPERIMENT HARNESS (build-caching/04): skip on the win-sdk-speedup branch.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/sam/win-sdk-speedup') }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false

      - uses: SebRollen/toml-action@v1.2.0
        id: msrv
        with:
          file: "baml_language/Cargo.toml"
          field: "workspace.package.rust-version"

      - name: "Install Rust toolchain (MSRV)"
        env:
          MSRV: ${{ steps.msrv.outputs.value }}
        run: |
          rustup toolchain install "${MSRV}"
          rustup default "${MSRV}"
        working-directory: baml_language

      - name: "Install sccache and direnv"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: "linux-msrv"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        env:
          MSRV: ${{ steps.msrv.outputs.value }}
        run: cargo "+${MSRV}" fetch
        working-directory: baml_language

      - name: "Build with MSRV"
        env:
          MSRV: ${{ steps.msrv.outputs.value }}
        run: cargo "+${MSRV}" test --no-run --all-features --timings
        working-directory: baml_language

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-msrv.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-msrv
          path: sccache-stats-msrv.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-msrv.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-msrv
          path: baml_language/target/cargo-timings/cargo-timing-msrv.html
          if-no-files-found: ignore

  cargo-doc:
    name: "cargo doc"
    # EXPERIMENT HARNESS (build-caching/04): skip on the win-sdk-speedup branch.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/sam/win-sdk-speedup') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false

      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - name: "Install sccache and direnv"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: false
          shared-key: "linux-cargo"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      - name: "Generate documentation"
        run: cargo doc --all --no-deps --timings
        working-directory: baml_language
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-doc.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-doc
          path: sccache-stats-doc.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-doc.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-doc
          path: baml_language/target/cargo-timings/cargo-timing-doc.html
          if-no-files-found: ignore

  snapshot-tests:
    name: "snapshot tests"
    # EXPERIMENT HARNESS (build-caching/04): skip on the win-sdk-speedup branch.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/sam/win-sdk-speedup') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false

      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - name: "Install sccache, direnv, python, and uv"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv python uv"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: false
          shared-key: "linux-cargo"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      - name: "Install cargo insta and nextest"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-insta,cargo-nextest

      - name: "Build tests with --timings"
        run: cargo test --no-run -p baml_tests -p baml_cli -p baml_lsp2_actions --all-features --timings
        working-directory: baml_language

      - name: "Run snapshot tests"
        run: cargo insta test --test-runner nextest -p baml_tests -p baml_cli -p baml_lsp2_actions --all-features --unreferenced=reject
        working-directory: baml_language

      - name: "Check for snapshot changes"
        run: |
          pathspecs=(
            ':(glob)baml_language/**/*.snap'
            ':(glob)baml_language/**/*.snap.new'
          )
          if [ -n "$(git status --porcelain -- "${pathspecs[@]}")" ]; then
            echo "::error::Snapshot tests have uncommitted changes"
            git diff -- "${pathspecs[@]}"
            exit 1
          fi

      - name: "Upload snapshot failures"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failures
          path: |
            baml_language/**/*.snap
            baml_language/**/*.snap.new

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-snapshot.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-snapshot
          path: sccache-stats-snapshot.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-snapshot.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-snapshot
          path: baml_language/target/cargo-timings/cargo-timing-snapshot.html
          if-no-files-found: ignore

  cargo-timings:
    name: "cargo timings (merged)"
    # EXPERIMENT HARNESS (build-caching/04): skip on the win-sdk-speedup branch
    # (the gated-off jobs it needs are skipped there anyway).
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/sam/win-sdk-speedup') }}
    runs-on: ubuntu-latest
    needs:
      - cargo-test-linux
      - cargo-test-macos
      - cargo-test-windows
      - sdk-tests
      - cargo-test-wasm
      - cargo-build-msrv
      - cargo-doc
      - snapshot-tests
    steps:
      - name: "Merge cargo timings artifacts"
        uses: actions/upload-artifact/merge@v4
        with:
          name: cargo-timings
          pattern: cargo-timings-*
          delete-merged: true
  sccache-stats:
    name: "sccache stats (merged)"
    # EXPERIMENT HARNESS (build-caching/04): skip on the win-sdk-speedup branch.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/sam/win-sdk-speedup') }}
    runs-on: ubuntu-latest
    needs:
      - cargo-test-linux
      - cargo-test-macos
      - cargo-test-windows
      - sdk-tests
      - cargo-test-wasm
      - cargo-build-msrv
      - cargo-doc
      - snapshot-tests
    steps:
      - name: "Merge sccache stats artifacts"
        uses: actions/upload-artifact/merge@v4
        with:
          name: sccache-stats
          pattern: sccache-stats-*
          delete-merged: true
