    - name: Fetch cargo dependencies
      run: cargo fetch
      working-directory: baml_language
    - name: Generate documentation
      run: cargo doc --all --no-deps --timings
      env:
        RUSTDOCFLAGS: -D warnings
      working-directory: baml_language
    - name: Show sccache stats
      if: always()
      run: sccache --show-stats
    - name: Dump sccache stats (json)
      if: always()
      run: sccache --show-stats --stats-format json > sccache-stats-doc.json
    - name: Upload sccache stats
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sccache-stats-doc
        path: sccache-stats-doc.json
        if-no-files-found: ignore
    - name: Rename cargo timings
      if: always()
      run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-doc.html
      working-directory: baml_language
    - name: Upload cargo timings
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cargo-timings-doc
        path: baml_language/target/cargo-timings/cargo-timing-doc.html
        if-no-files-found: ignore
    timeout-minutes: 25
  snapshot-tests:
    name: snapshot tests
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
    - uses: useblacksmith/checkout@v1
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: rustup show
      working-directory: baml_language
    - name: Install tools (mise)
      uses: ./.github/actions/setup-mise
      with:
        install_args: sccache direnv python uv cargo:cargo-insta cargo:cargo-nextest
    - name: Verify sccache
