                "sdk-label": "swift",
                "sdk-dir": "swift",
                "package-name": "sdk_test_swift",
                "sdk-path": "swift",
                "install-args": "sccache direnv cargo:cargo-nextest",
                "os-label": "macos",
                "runs-on": "blacksmith-6vcpu-macos-latest",
                "rust-cache-key": "macos-cargo",
                "timeout": 40,
              },
              {
                "sdk-label": "go",
                "sdk-dir": "go",
                "package-name": "sdk_test_go",
                "sdk-path": "go",
                "install-args": "sccache direnv go cargo:cargo-nextest",
                "os-label": "windows",
                "runs-on": "blacksmith-8vcpu-windows-2025",
                "rust-cache-key": "windows-cargo",
                "timeout": 60,
              },
              {
                "sdk-label": "python-pydantic2",
                "sdk-dir": "python",
                "package-name": "sdk_test_python_pydantic2",
                "sdk-path": "python_pydantic2",
                "install-args": "sccache direnv python uv cargo:cargo-nextest",
                "os-label": "windows",
                "runs-on": "blacksmith-8vcpu-windows-2025",
                "rust-cache-key": "windows-cargo",
                "timeout": 60,
              },
              {
                "sdk-label": "typescript",
                "sdk-dir": "typescript",
                "package-name": "sdk_test_typescript",
                "sdk-path": "typescript",
                "install-args": "sccache direnv node npm:pnpm cargo:cargo-nextest",
                "os-label": "windows",
                "runs-on": "blacksmith-8vcpu-windows-2025",
                "rust-cache-key": "windows-cargo",
                "timeout": 60,
              },
              {
                "sdk-label": "typescript-web",
                "sdk-dir": "typescript",
                "package-name": "sdk_test_typescript_web",
                "sdk-path": "typescript_web",
                "install-args": "sccache direnv node npm:pnpm cargo:cargo-nextest github:rustwasm/wasm-pack",
                "os-label": "windows",
                "runs-on": "blacksmith-8vcpu-windows-2025",
                "rust-cache-key": "windows-cargo",
                "timeout": 60,
              },
              {
                "sdk-label": "csharp",
                "sdk-dir": "csharp",
                "package-name": "sdk_test_csharp",
                "sdk-path": "csharp",
                "install-args": "sccache direnv cargo:cargo-nextest",
                "os-label": "windows",
                "runs-on": "blacksmith-8vcpu-windows-2025",
                "rust-cache-key": "windows-cargo",
                "timeout": 60,
              },
              {
                "sdk-label": "rust",
                "sdk-dir": "rust",
                "package-name": "sdk_test_rust",
                "sdk-path": "rust",
                "install-args": "sccache direnv cargo:cargo-nextest",
                "os-label": "windows",
                "runs-on": "blacksmith-8vcpu-windows-2025",
                "rust-cache-key": "windows-cargo",
                "timeout": 60,
              },
              {
                "sdk-label": "java",
                "sdk-dir": "java",
                "package-name": "sdk_test_java",
                "sdk-path": "java",
                "install-args": "sccache direnv java gradle cargo:cargo-nextest",
                "os-label": "windows",
                "runs-on": "blacksmith-8vcpu-windows-2025",
                "rust-cache-key": "windows-cargo",
                "timeout": 60,
              },
            ];

            // TODO(B-1545): Re-enable macOS SDK tests after the SIGABRT flakiness is fixed: https://linear.app/boundaryml2/issue/B-1545/investigate-flakiness-in-cargo-test-aarch64-apple-darwin-ci-job
            const enabledMatrix = baseMatrix.filter((entry) => entry["os-label"] !== "macos");
            // Linux-only in the merge queue (mac/win already ran on the PR)
            // and on forks (no Blacksmith mac/win runners - jobs would queue
            // forever). GITHUB_REPOSITORY is always set by Actions and the
            // compare is case-insensitive, so an absent or differently-cased
            // payload cannot silently drop the mac/win legs upstream.
            const linuxOnly =
              context.eventName === "merge_group" ||
              process.env.GITHUB_REPOSITORY.toLowerCase() !== "boundaryml/baml";
            const matrix = linuxOnly
              ? enabledMatrix.filter((entry) => entry["os-label"] === "linux")
              : enabledMatrix;
            const enabledSdkDirs = new Set(enabledMatrix.map((entry) => entry["sdk-dir"]));
            const temporarilyDisabledSdkDirs = [...new Set(
              baseMatrix
                .map((entry) => entry["sdk-dir"])
                .filter((sdkDir) => !enabledSdkDirs.has(sdkDir)),
            )].sort();

            core.setOutput("matrix", JSON.stringify(matrix, null, 2));
            core.setOutput("sdk-dirs", JSON.stringify([...enabledSdkDirs].sort()));
            core.setOutput("temporarily-disabled-sdk-dirs", JSON.stringify(temporarilyDisabledSdkDirs));

  sdk-test-coverage:
    name: "sdk test coverage"
    runs-on: ubuntu-latest
    needs: sdk-test-matrix
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Persistent-runner warmth: keep IGNORED files (target/, node_modules)
          # across runs; tracked files still hard-reset to the new SHA. A no-op
          # on ephemeral runners; on the ix pool it is what lets a warm rebuild
          # skip relinking the world.
          clean: false

      - name: "Assert every SDK directory has a matrix entry"
        uses: actions/github-script@v8
        env:
          MATRIX_SDK_DIRS: ${{ needs.sdk-test-matrix.outputs.sdk-dirs }}
          TEMPORARILY_DISABLED_SDK_DIRS: ${{ needs.sdk-test-matrix.outputs.temporarily-disabled-sdk-dirs }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const sdkRoot = path.join(process.env.GITHUB_WORKSPACE, "baml_language", "sdks");
            const sdkDirs = fs.readdirSync(sdkRoot, { withFileTypes: true })
              .filter((entry) => entry.isDirectory())
              .map((entry) => entry.name)
              .filter((sdkDir) => sdkDir !== "agent-docs")
              .sort();
            const coveredSdkDirs = new Set(JSON.parse(process.env.MATRIX_SDK_DIRS));
            const temporarilyDisabledSdkDirs = new Set(JSON.parse(process.env.TEMPORARILY_DISABLED_SDK_DIRS));
            const missingSdkDirs = sdkDirs.filter(
              (sdkDir) => !coveredSdkDirs.has(sdkDir) && !temporarilyDisabledSdkDirs.has(sdkDir),
            );

            await core.summary
              .addHeading("SDK test matrix coverage")
              .addTable([
                [{ data: "SDK directory", header: true }, { data: "Matrix entry", header: true }],
                ...sdkDirs.map((sdkDir) => [
                  sdkDir,
                  coveredSdkDirs.has(sdkDir)
                    ? "yes"
                    : temporarilyDisabledSdkDirs.has(sdkDir)
                      ? "temporarily disabled (B-1545)"
                      : "no",
                ]),
              ])
              .write();

            if (missingSdkDirs.length > 0) {
              core.setFailed(`SDK directories without an sdk-test-matrix entry: ${missingSdkDirs.join(", ")}`);
            }

  # SDK tests (codegen end-to-end). The `sdk_test_*` generator crates emit
  # generated Go/Python/TypeScript projects from `.baml` sources via build.rs,
  # then run their language-specific checks under nextest. Their setup scripts
  # do the expensive package-manager/native-build work (`uv sync` + `maturin`
  # for Python, a NAPI build for Node TypeScript, and a Web/Wasm build plus
  # Chromium for Web TypeScript). Run the generated
  # setup guards first so CI exposes setup cost/failures as a separate step; the
  # full test step re-runs the setup scripts, but the warm path should be cheap.
  # Keep each SDK as a separate matrix entry so setup/test timing
  # and failures are attributed to the specific SDK generator.
  sdk-tests:
    name: "sdk tests (${{ matrix.sdk-label }}, ${{ matrix.os-label }})"
    needs: sdk-test-matrix
    strategy:
      fail-fast: false
      # In the merge queue (`merge_group`) only the linux leg runs — the
      # macos/windows legs already ran on the PR. Keep these entries in sync
      # with the standalone platform cargo-test jobs above.
      matrix:
        include: ${{ fromJSON(needs.sdk-test-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      # Raised from the runner unit's 16-pin (workflow env overrides unit env,
      # so this is deterministic per commit). 16 was tuned when the elastic
      # guests could be memory-deflated under a burst; with the fleet-side
      # working-set floor live, the honest ceiling is contention, not memory.
      # If the rust sdk init-race or loom soak flakes return, revert to 16 -
      # those were the reason for the original pin.
      NEXTEST_TEST_THREADS: "32"
      RUST_TEST_THREADS: "32"
      # Same honesty pin family as CARGO_BUILD_JOBS: the go fixture gates run
      # `go test ./...` on a 64-vCPU elastic guest shared with pool siblings.
      GOMAXPROCS: "16"
      # Skip DWARF generation on fixture test-binary links; the gates only
      # ever run the binaries, nothing debugs them. (-s too would be nicer,
      # but GOFLAGS cannot carry a flag value containing a space; -w alone is
      # most of the link-time win.)
      GOFLAGS: "-ldflags=-w"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Persistent-runner warmth: keep IGNORED files (target/, node_modules)
          # across runs; tracked files still hard-reset to the new SHA. A no-op
          # on ephemeral runners; on the ix pool it is what lets a warm rebuild
          # skip relinking the world.
          clean: false

      # Two arms (see the action): on the ix pool this enters devShells.ci-sdk
      # once (~seconds warm, closure substituted from the pool caches) instead
      # of re-provisioning language toolchains imperatively every visit -
      # measured 27s/job for mise on a warm persistent runner. On the
      # Blacksmith fork-PR fallback (and the macOS lanes, which have no nix)
      # the arm below is byte-identical to the two steps it replaces:
      # `rustup show` + setup-mise with this lane's install-args.
      - name: "Set up CI toolchains"
        uses: ./.github/actions/setup-ci-shell
        with:
          shell: ci-sdk
          mise-install-args: ${{ matrix.install-args }}

      - name: "Install .NET SDK"
        if: matrix.sdk-label == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301

      - name: "Test C# NuGet payload comparison"
        if: matrix.sdk-label == 'csharp'
        run: |
          dotnet run --project \
            baml_language/sdks/csharp/bridge_csharp/tools/Baml.NuGetNormalizer/Baml.NuGetNormalizer.csproj \
            -- --self-test

      - name: "Test nightly C# package version"
        if: matrix.sdk-label == 'csharp' && matrix.os-label == 'linux'
        env:
          BAML_LANGUAGE_RELEASED_AT: "2026-07-23T12:34:56Z"
          BAML_LANGUAGE_VERSION_DATE: "20260723"
          BAML_LANGUAGE_VERSION_NIGHTLY_LETTER: "h"
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          scripts/baml-language-version plan \
            --channel nightly \
            --out "$work/release-plan.json"
          canonical="$(jq -r .canonical_version "$work/release-plan.json")"
          nuget="$(jq -r .registry_versions.nuget "$work/release-plan.json")"
          test "$nuget" = "$canonical"

          scripts/baml-csharp-release-contract matrix \
            | jq -r '.include[]
              | "runtimes/\(.rid)/native/\(.canonical)"' \
            | while IFS= read -r runtime_path; do
                mkdir -p "$work/native/$(dirname "$runtime_path")"
                printf 'version-only fixture\n' \
                  > "$work/native/$runtime_path"
              done
          printf '<Project />\n' > "$work/baml-bridge.targets"
          expected_count="$(scripts/baml-csharp-release-contract matrix \
            | jq '.include | length')"
          project=baml_language/sdks/csharp/bridge_csharp/src/Baml.Bridge.csproj
          dotnet build "$project" --configuration Release --nologo \
            -p:NuGetAudit=false \
            -p:Version="$canonical" \
            -p:InformationalVersion="$canonical" \
            -p:PackageVersion="$nuget"
          dotnet pack "$project" --configuration Release --nologo \
            --no-build --no-restore \
            --output "$work/package" \
            -p:NuGetAudit=false \
            -p:Version="$canonical" \
            -p:InformationalVersion="$canonical" \
            -p:PackageVersion="$nuget" \
            -p:BamlExpectedNativeAssetCount="$expected_count" \
            -p:BamlNativeAssetRoot="$work/native" \
            -p:BamlGeneratedTargetsPath="$work/baml-bridge.targets"
          package="$work/package/baml-bridge.$nuget.nupkg"
          test -f "$package"
          test "$(unzip -p "$package" baml-bridge.nuspec \
            | sed -n 's#.*<version>\([^<]*\)</version>.*#\1#p')" = "$nuget"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: false
          shared-key: ${{ matrix.rust-cache-key }}

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      # Windows-only: swap the .cmd RUSTC_WRAPPER for the native tools_sccache
      # .exe. See the matching step in `cargo-test-windows` for why.
      - name: "Build native sccache wrapper"
        if: matrix.os-label == 'windows'
        run: |
          set -euo pipefail
          cargo build -p tools_sccache
          echo "RUSTC_WRAPPER=$(pwd -W)/target/debug/baml-sccache.exe" >> "$GITHUB_ENV"
          # CARGO_BUILD_JOBS oversubscription only matters for the Windows build.
          echo "CARGO_BUILD_JOBS=16" >> "$GITHUB_ENV"
        working-directory: baml_language

      # Windows Python only: setup.ps1 builds one baml_bridge wheel and strips
      # the editable source block from each fixture so `uv sync` installs that
      # prebuilt wheel instead of rebuilding baml_bridge per fixture. The later
      # test-time `uv run` processes also need this wheelhouse.
      - name: "Configure Python wheelhouse"
        if: matrix.os-label == 'windows' && matrix.sdk-label == 'python-pydantic2'
        run: echo "UV_FIND_LINKS=$(pwd -W)/target/wheels" >> "$GITHUB_ENV"
        working-directory: baml_language

      - name: "Build tests with --timings"
        run: cargo test --no-run -p ${{ matrix.package-name }} --all-features --timings
        working-directory: baml_language

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Run sdk test setup"
        # The C# crate uses nextest's setup-script hook directly and has no
        # generated setup_guard test. Its setup still runs before the full suite.
        if: matrix.sdk-label != 'csharp'
        run: cargo nextest run -p ${{ matrix.package-name }} --all-features -E 'package(=${{ matrix.package-name }}) and test(setup_guard::ran)'
        working-directory: baml_language

      - name: "Run sdk tests"
        if: matrix.sdk-label != 'csharp'
        run: cargo nextest run -p ${{ matrix.package-name }} --all-features -E 'package(=${{ matrix.package-name }})'
        working-directory: baml_language

      - name: "Run C# sdk tests"
        if: matrix.sdk-label == 'csharp'
        run: cargo nextest run -p ${{ matrix.package-name }} --all-features --no-fail-fast -E 'package(=${{ matrix.package-name }})'
        working-directory: baml_language

      # The Rust bridge runtime crate (baml_bridge). Its tests load the engine
      # cdylib at run time, and its lib test binary mixes pure (loader/encode)
      # with engine-dependent (completion, live-engine) tests, so the whole
      # package runs here — where sdk_test_rust's setup already built the engine
      # into the main target dir — instead of in the general cargo-test lane
      # (where the non-cacheable cdylib build ran as a silent nextest setup
      # script and stalled the Windows job).
      - name: "Run rust bridge tests"
        if: matrix.sdk-label == 'rust'
        run: cargo nextest run -p baml_bridge --all-features
        working-directory: baml_language

      - name: "Upload test results on failure"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-test-failures-${{ matrix.sdk-label }}-${{ matrix.os-label }}
          path: |
            baml_language/sdk_tests/crates/${{ matrix.sdk-path }}/*/generated/
            baml_language/target/nextest/
          if-no-files-found: ignore

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}
          path: sccache-stats-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}
          path: baml_language/target/cargo-timings/cargo-timing-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}.html
          if-no-files-found: ignore

  cargo-test-wasm:
    name: "cargo test (wasm32-unknown-unknown)"
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "ix-wasm"]')) || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Persistent-runner warmth: keep IGNORED files (target/, node_modules)
          # across runs; tracked files still hard-reset to the new SHA. A no-op
          # on ephemeral runners; on the ix pool it is what lets a warm rebuild
          # skip relinking the world.
          clean: false

      # nix arm: the CI shell's toolchain already carries the wasm32 target
      # (rust-toolchain.toml), so the stall-prone `rustup target add` download
      # only exists on the fallback arm.
      - name: "Set up toolchains"
        id: toolchains
        uses: ./.github/actions/setup-ci-shell
        with:
          mise-install-args: "sccache direnv"

      - name: "Add the wasm32 target (no-nix fallback)"
        if: steps.toolchains.outputs.nix == 'false'
        run: |
          set -euo pipefail
          # `rustup target add wasm32` fetches a small (~20MB) std component that
          # normally installs in seconds. A multi-minute duration means a stalled
          # download (rustup has no idle timeout), which otherwise burns the whole
          # job timeout and dequeues the PR from the merge queue. Cap each attempt
          # well above the normal time and retry on a fresh connection; surface a
          # genuine outage after 3 tries instead of hanging.
          for attempt in 1 2 3; do
            if timeout 300 rustup target add wasm32-unknown-unknown; then
              break
            fi
            echo "::warning::rustup target add wasm32 attempt $attempt stalled/failed; retrying" >&2
            [ "$attempt" = 3 ] && { echo "::error::rustup target add wasm32 failed after 3 attempts"; exit 1; }
            sleep 5
          done
        working-directory: baml_language

      - name: "Verify sccache"
        run: sccache --version

      # L2: same probe-then-choose contract as the msrv lane. Take the
      # per-unit nix graph only when cache.ix.dev (or this VM's own store)
      # already has this exact root; a unit-DAG miss costs the whole graph
      # and must route back to cargo.
      #
      # This lane carries one extra precondition the msrv lane does not.
      # The cargo arm discovers its package set at run time from
      # `cargo metadata`; the nix arm needs that set at EVALUATION time and
      # so re-derives it from the manifests. Those two derivations agree
      # today and are checked to agree on every run, because a silent
      # divergence would have the nix arm compiling a different set of
      # crates than the lane is supposed to build -- a green job that gated
      # nothing. Cheap to check: the list is its own IFD-free derivation.
      - name: "Probe the L2 unit cache"
        id: l2
        if: steps.toolchains.outputs.nix == 'true'
        env:
          L2_EVAL_TIMEOUT_SECONDS: "180"
          L2_PROBE_TIMEOUT_SECONDS: "10"
        run: |
          set -uo pipefail

          echo "hit=false" >> "$GITHUB_OUTPUT"

          if ! list_path="$(nix build --no-link --print-out-paths .#wasm-package-list 2>/dev/null)"; then
            echo "::notice title=L2::could not build the package list; taking the cargo arm"
            exit 0
          fi
          # mktemp, never a hardcoded /tmp path: the pool's runner unit is
          # ProtectSystem=strict with a per-slot TMPDIR, so /tmp is not
          # writable, and mktemp honors TMPDIR and so lands in the slot dir.
          from_cargo="$(mktemp)"
          cargo metadata --no-deps --format-version 1 --manifest-path baml_language/Cargo.toml \
            | jq -r '.packages[] | select(.source==null) | select(if .metadata.ci.wasm_support == null then true else .metadata.ci.wasm_support end) | .name' \
            | LC_ALL=C sort > "${from_cargo}"
          if [[ ! -s "${from_cargo}" ]]; then
            # Not drift: cargo metadata itself produced nothing. Distinguished
            # from a real mismatch so the warning does not send someone to
            # edit flake.nix over a transient.
            echo "::notice title=L2::cargo metadata returned no packages; taking the cargo arm"
            exit 0
          fi
          if [[ "$(cat "${list_path}")" != "$(cat "${from_cargo}")" ]]; then
            echo "::warning title=L2::the flake's wasm package selection has drifted from cargo metadata; taking the cargo arm. Fix wasmPackages in flake.nix."
            # comm, not diff: coreutils is on the job PATH, diffutils is not
            # guaranteed to be.
            comm -3 "${list_path}" "${from_cargo}" || true
            exit 0
          fi

          # Timeout vs broken flake, same distinction and deliberately the
          # same shape as the msrv probe below -- two probes in one file
          # reading differently is how one of them rots. `timeout` returns
          # 124 only when it actually fired, so that is the one code that
          # means "slow guest"; anything else is an eval bug that would
          # otherwise hide behind a green lane. Note the assignment form:
          # `if ! cmd; then rc=$?` would capture the status of `!`, not of
          # the command.
          eval_log="$(mktemp)"
          out_path="$(timeout "${L2_EVAL_TIMEOUT_SECONDS}" nix eval --raw .#wasm-check.outPath 2>"${eval_log}")" \
            && eval_rc=0 || eval_rc=$?
          if [ "${eval_rc}" -ne 0 ]; then
            if [ "${eval_rc}" -eq 124 ]; then
              echo "::notice title=L2::evaluation did not finish within ${L2_EVAL_TIMEOUT_SECONDS}s; taking the cargo arm"
            else
              echo "::warning title=L2::evaluation FAILED with exit ${eval_rc} (not a timeout); taking the cargo arm"
              sed -n '1,25p' "${eval_log}"
            fi
            exit 0
          fi

          # Local first: runners are persistent, so a VM that already built
          # this root has it on disk and should not be sent down the cargo
          # path over a remote cache eviction that costs it nothing.
          if nix path-info "${out_path}" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=L2::already in the local store: ${out_path}; taking the nix arm"
          # --narinfo-cache-negative-ttl 0, for the reason spelled out on the
          # msrv probe: nix caches a MISSING narinfo for 3600s by default, so
          # one probe that runs before the builder publishes would poison
          # this member for an hour and no rerun inside that window could
          # hit. Only "not found" is affected; the positive cache is
          # untouched.
          elif timeout "${L2_PROBE_TIMEOUT_SECONDS}" nix path-info --narinfo-cache-negative-ttl 0 --store https://cache.ix.dev "${out_path}" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=L2::cache hit for ${out_path}; taking the nix arm"
          else
            echo "::notice title=L2::cache miss for ${out_path}; taking the cargo arm"
          fi

      - uses: Swatinem/rust-cache@v2
        # Deliberately ungated by the probe: the cargo arm stays the
        # fallback, so its cache has to keep being warmed on canary or the
        # first L2 miss lands on a cold cargo build.
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: "linux-wasm"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        if: steps.l2.outputs.hit != 'true'
        run: cargo fetch --target wasm32-unknown-unknown
        working-directory: baml_language

      # The nix arm. Same work as the cargo arm below, expressed as one
      # derivation per rustc invocation, so the guest compiles only the units
      # this PR's diff perturbed.
      - name: "Build for WASM (nix unit graph)"
        if: steps.l2.outputs.hit == 'true'
        run: |
          set -euo pipefail
          echo "::notice title=L2::arm=nix"
          # --no-link: the runner keeps ignored files across checkouts
          # (`clean: false`) and `result` is not ignored, so a symlink left
          # in the tree would outlive the job.
          out_path="$(nix build --no-link --print-out-paths --print-build-logs .#wasm-check)"
          echo "L2_WASM_OUT=${out_path}" >> "$GITHUB_ENV"

      - name: "Build for WASM"
        if: steps.l2.outputs.hit != 'true'
        run: |
          set -euo pipefail
          echo "::notice title=L2::arm=cargo"
          readarray -t wasm_packages < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.source==null) | select(if .metadata.ci.wasm_support == null then true else .metadata.ci.wasm_support end) | .name')
          if [[ ${#wasm_packages[@]} -eq 0 ]]; then
            echo "Error: no WASM packages discovered; cargo metadata or jq may have failed" >&2
            exit 1
          fi
          package_args=()
          for package in "${wasm_packages[@]}"; do
            package_args+=(-p "$package")
          done
          cargo build "${package_args[@]}" --target wasm32-unknown-unknown --no-default-features --release --timings
        working-directory: baml_language

      - name: "List WASM artifacts"
        run: |
          if [[ "${{ steps.l2.outputs.hit }}" == "true" ]]; then
            ls -lh "${L2_WASM_OUT}"/wasm/*.wasm || true
          else
            ls -lh baml_language/target/wasm32-unknown-unknown/release/*.wasm || true
          fi

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-test-wasm.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-test-wasm
          path: sccache-stats-test-wasm.json
          if-no-files-found: ignore

      # --timings is a cargo flag, so these only exist on the cargo arm. The
      # existence guard below is not enough on its own: the runner keeps
      # ignored files across runs (`clean: false`), so on the nix arm the
      # file present is the PREVIOUS run's and would ship as this run's.
      - name: "Rename cargo timings"
        if: always() && steps.l2.outputs.hit != 'true'
        run: |
          if [[ -f target/cargo-timings/cargo-timing.html ]]; then
            mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-wasm.html
          fi
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always() && steps.l2.outputs.hit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test-wasm
          path: baml_language/target/cargo-timings/cargo-timing-test-wasm.html
          if-no-files-found: ignore

  # Size-gate jobs live in size-gate.reusable.yaml — they are intentionally
  # decoupled from cargo-tests so a violation never blocks the test workflow.

  cargo-build-msrv:
    name: "cargo build (msrv)"
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "ix-msrv"]')) || 'blacksmith-16vcpu-ubuntu-2404' }}
    # 40 (was 25): the MSRV toolchain is unique to this job, so its first run
    # on any given pool VM rebuilds with a cold compile cache and measured
    # 21-25+ min under wave contention (three straight 25-min timeouts on
    # cold members, 2026-08-15). Warm/steady-state runs are far inside the
    # old budget; the headroom only exists for cold landings.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Persistent-runner warmth: keep IGNORED files (target/, node_modules)
          # across runs; tracked files still hard-reset to the new SHA. A no-op
          # on ephemeral runners; on the ix pool it is what lets a warm rebuild
          # skip relinking the world.
          clean: false

      - uses: SebRollen/toml-action@v1.2.0
        id: msrv
        with:
          file: "baml_language/Cargo.toml"
          field: "workspace.package.rust-version"

      # nix arm: devShells.ci-msrv reads the same manifest field at eval time,
      # so the shell's toolchain and this gate cannot drift. The `+MSRV`
      # spelling is gone on purpose - the shell's cargo is not a rustup shim;
      # both arms make the MSRV toolchain the plain `cargo` and the assert
      # below keeps that honest.
      - name: "Set up toolchains"
        id: toolchains
        uses: ./.github/actions/setup-ci-shell
        with:
          shell: ci-msrv
          rustup: "false"
          mise-install-args: "sccache direnv"

      - name: "Install Rust toolchain (MSRV, no-nix fallback)"
        if: steps.toolchains.outputs.nix == 'false'
        env:
          MSRV: ${{ steps.msrv.outputs.value }}
        run: |
          rustup toolchain install "${MSRV}"
          rustup default "${MSRV}"
        working-directory: baml_language

      - name: "Assert the MSRV toolchain is active"
        env:
          MSRV: ${{ steps.msrv.outputs.value }}
        run: rustc --version | grep -F "${MSRV}"

      - name: "Verify sccache"
        run: sccache --version

      # L2: take the per-unit nix graph only when cache.ix.dev already has
      # this exact root, and fall back to cargo otherwise.
      #
      # The asymmetry is why this is a probe and not a switch. An sccache
      # miss costs one compile. A unit-DAG miss costs the whole graph with
      # no incremental compilation, one process and one sandbox per rustc
      # invocation, and no shared target/ - measurably WORSE than the cargo
      # path, not merely equal to it. So a miss must route back to cargo,
      # and every failure mode here (eval too slow, cache unreachable, nix
      # absent on the Blacksmith fork-PR arm) must fail open the same way.
      #
      # Probing at all is only possible because the graph is
      # input-addressed: a floating-CA output has no eval-time path to ask
      # the cache about.
      - name: "Probe the L2 unit cache"
        id: l2
        if: steps.toolchains.outputs.nix == 'true'
        env:
          # The eval runs the render IFD, so it is not free; bound it rather
          # than let a cold guest sit here. The network probe is the cheap
          # half and gets a tight budget of its own.
          L2_EVAL_TIMEOUT_SECONDS: "180"
          L2_PROBE_TIMEOUT_SECONDS: "10"
        run: |
          set -uo pipefail

          echo "hit=false" >> "$GITHUB_OUTPUT"

          # Both arms fail open to cargo, but they are not the same event and
          # must not read the same in the log. A timeout is a slow cold guest
          # and is expected; any other nonzero exit is a broken flake, and
          # reporting that as "did not finish within Ns" is how an eval bug
          # hides for weeks behind a green lane. `timeout` returns 124 only
          # when it actually fired, so that is the one code that means what
          # the old message claimed. Keep stderr: on the error arm it is the
          # only place the nix diagnostic survives.
          eval_log="$(mktemp)"
          out_path="$(timeout "${L2_EVAL_TIMEOUT_SECONDS}" nix eval --raw .#msrv-check.outPath 2>"${eval_log}")" \
            && eval_rc=0 || eval_rc=$?
          if [ "${eval_rc}" -ne 0 ]; then
            if [ "${eval_rc}" -eq 124 ]; then
              echo "::notice title=L2::evaluation did not finish within ${L2_EVAL_TIMEOUT_SECONDS}s; taking the cargo arm"
            else
              echo "::warning title=L2::evaluation FAILED with exit ${eval_rc} (not a timeout); taking the cargo arm"
              sed -n '1,25p' "${eval_log}"
            fi
            exit 0
          fi

          # Local first. Runners are persistent, so a VM that already built
          # this exact root has it on disk; asking only the remote would send
          # such a job down the cargo path over a cache eviction that costs
          # it nothing.
          if nix path-info "${out_path}" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=L2::already in the local store: ${out_path}; taking the nix arm"
          # --narinfo-cache-negative-ttl 0: nix caches negative narinfo
          # lookups for 3600s by default, so one probe that runs before the
          # builder publishes would poison this runner for an hour and no
          # rerun inside the window could ever hit (measured live). The
          # positive cache is untouched; only "not found" is never cached.
          elif timeout "${L2_PROBE_TIMEOUT_SECONDS}" nix path-info --narinfo-cache-negative-ttl 0 --store https://cache.ix.dev "${out_path}" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=L2::cache hit for ${out_path}; taking the nix arm"
          else
            echo "::notice title=L2::cache miss for ${out_path}; taking the cargo arm"
          fi

      - uses: Swatinem/rust-cache@v2
        # Deliberately ungated by the probe: the cargo arm stays the
        # fallback, so its cache has to keep being warmed on canary or the
        # first L2 miss lands on a cold cargo build.
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: "linux-msrv"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        if: steps.l2.outputs.hit != 'true'
        run: cargo fetch
        working-directory: baml_language

      # The nix arm. Same work as the cargo arm below (`cargo test --no-run
      # --all-features`), expressed as one derivation per rustc invocation,
      # so the guest compiles only the units this PR's diff perturbed.
      - name: "Build with MSRV (nix unit graph)"
        if: steps.l2.outputs.hit == 'true'
        run: |
          echo "::notice title=L2::arm=nix"
          # --no-link: this checkout is `clean: false`, so a bare build's
          # ./result symlink survives into the next run as an untracked file.
          # --print-out-paths keeps the built root in the log for triage.
          nix build --no-link --print-out-paths --print-build-logs .#msrv-check

      - name: "Build with MSRV"
        if: steps.l2.outputs.hit != 'true'
        run: |
          echo "::notice title=L2::arm=cargo"
          cargo test --no-run --all-features --timings
        working-directory: baml_language

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-msrv.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-msrv
          path: sccache-stats-msrv.json
          if-no-files-found: ignore

      # --timings is a cargo flag, so these only exist on the cargo arm. The
      # runner keeps ignored files across runs (`clean: false`), so an
      # unconditional `mv` here would fail the job on the nix arm, or worse,
      # ship the previous run's timings as this run's.
      - name: "Rename cargo timings"
        if: always() && steps.l2.outputs.hit != 'true'
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-msrv.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always() && steps.l2.outputs.hit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-msrv
          path: baml_language/target/cargo-timings/cargo-timing-msrv.html
          if-no-files-found: ignore

  cargo-doc:
    name: "cargo doc"
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "ix-gnu"]')) || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Persistent-runner warmth: keep IGNORED files (target/, node_modules)
          # across runs; tracked files still hard-reset to the new SHA. A no-op
          # on ephemeral runners; on the ix pool it is what lets a warm rebuild
          # skip relinking the world.
          clean: false

      - name: "Set up toolchains"
        uses: ./.github/actions/setup-ci-shell
        with:
          mise-install-args: "sccache direnv"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: false
          shared-key: "linux-cargo"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      - name: "Generate documentation"
        run: cargo doc --all --no-deps --timings
        working-directory: baml_language
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-doc.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-doc
          path: sccache-stats-doc.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-doc.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-doc
          path: baml_language/target/cargo-timings/cargo-timing-doc.html
          if-no-files-found: ignore

  snapshot-tests:
    name: "snapshot tests"
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "ix-gnu"]')) || 'blacksmith-16vcpu-ubuntu-2404' }}
    # 45, not 30: on the persistent pool this lane runs 7-16 min quiet but has
    # been measured at 30m+ when two full waves stack on the gnu family
    # (three timeout-cancels on 2026-08-16, all contention, all green on
    # rerun). 30m leaves zero headroom for the contended regime.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Persistent-runner warmth: keep IGNORED files (target/, node_modules)
          # across runs; tracked files still hard-reset to the new SHA. A no-op
          # on ephemeral runners; on the ix pool it is what lets a warm rebuild
          # skip relinking the world.
          clean: false

      - name: "Set up toolchains"
        uses: ./.github/actions/setup-ci-shell
        with:
          mise-install-args: "sccache direnv python uv cargo:cargo-insta cargo:cargo-nextest"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: false
          shared-key: "linux-cargo"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      - name: "Build tests with --timings"
        run: cargo test --no-run -p baml_tests -p baml_cli -p baml_lsp2_actions --all-features --timings
        working-directory: baml_language

      # This job provides glibc coverage of `baml_tests`, `baml_cli`, and
      # `baml_lsp2_actions`. The x86_64 GNU job excludes all three to avoid
      # running them twice; keep its `--exclude` list in sync with the package
      # list here. The musl job separately runs `baml_cli`, including
      # `pack_e2e`, so both Linux libc variants exercise the ELF pack path.
      - name: "Run snapshot tests"
        run: cargo insta test --test-runner nextest -p baml_tests -p baml_cli -p baml_lsp2_actions --all-features --unreferenced=reject
        working-directory: baml_language

      - name: "Check for snapshot changes"
        run: |
          pathspecs=(
            ':(glob)baml_language/**/*.snap'
            ':(glob)baml_language/**/*.snap.new'
          )
          if [ -n "$(git status --porcelain -- "${pathspecs[@]}")" ]; then
            echo "::error::Snapshot tests have uncommitted changes"
            git diff -- "${pathspecs[@]}"
            exit 1
          fi

      - name: "Upload snapshot failures"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failures
          path: |
            baml_language/**/*.snap
            baml_language/**/*.snap.new

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-snapshot.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-snapshot
          path: sccache-stats-snapshot.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-snapshot.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-snapshot
          path: baml_language/target/cargo-timings/cargo-timing-snapshot.html
          if-no-files-found: ignore

  cargo-timings:
    name: "cargo timings (merged)"
    runs-on: ubuntu-latest
    needs:
      - cargo-test-linux
      - cargo-test-linux-musl
      - cargo-test-windows
      - sdk-tests
      - cargo-test-wasm
      - cargo-build-msrv
      - cargo-doc
      - snapshot-tests
    steps:
      - name: "Merge cargo timings artifacts"
        uses: actions/upload-artifact/merge@v4
        with:
          name: cargo-timings
          pattern: cargo-timings-*
          delete-merged: true
  sccache-stats:
    name: "sccache stats (merged)"
    runs-on: ubuntu-latest
    needs:
      - cargo-test-linux
      - cargo-test-linux-musl
      - cargo-test-windows
      - sdk-tests
      - cargo-test-wasm
      - cargo-build-msrv
      - cargo-doc
      - snapshot-tests
    steps:
      - name: "Merge sccache stats artifacts"
        uses: actions/upload-artifact/merge@v4
        with:
          name: sccache-stats
          pattern: sccache-stats-*
          delete-merged: true
