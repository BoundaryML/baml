# Cache strategy
# ==============
#
# GHA caching has two quirks we have to dance around:
#
#   - an per-repo cache limit (ours is set to 30GiB) for *all* PRs, and
#   - a rule that only the default branch's cache can be shared by
#     different branches
#
# It's therefore important that we keep the `canary` cache populated, and
# because GHA caches are immutable, the daily `canary-cache-refresh.yml`
# workflow purges canary's rust-cache entries and then re-invokes this
# workflow so the savers below repopulate fresh content. (That purge lives
# in a separate workflow specifically so `actions: write` is never granted
# on the `workflow_call` path from `ci.yaml`, which would expose it to
# PR-controlled cargo build code. See the comment in
# `canary-cache-refresh.yml`.) The low storage limit means we also try to
# reuse `shared-key`s:
#
# 1. Only canary writes (`save-if: ${{ github.ref == 'refs/heads/canary' }}`).
#    PR / merge_group / feature-branch runs read from canary's cache
#    scope but don't save their own — keeps the 30 GiB budget from
#    fragmenting one entry per ref. `canary-cache-refresh.yml`'s daily
#    purge + repopulate cycle keeps canary's entries fresh past the 7-day
#    inactivity TTL during quiet periods.
#
# 2. One designated saver per `shared-key`. Every other job that uses
#    the same key passes `save-if: false` and is read-only. Two jobs
#    saving under the same key would overwrite each other with
#    different `target/` snapshots, burning budget without adding
#    coverage.
#
# Saver/reader map
# ----------------
#
# | shared-key      | saver (canary-only)   | readers (`save-if: false`)                      |
# | --------------- | --------------------- | ----------------------------------------------- |
# | `linux-cargo`   | `cargo-test-linux`    | `sdk-tests/linux`, `cargo-doc`,                 |
# |                 |                       | `snapshot-tests`, `ci.yaml::prek`,              |
# |                 |                       | `ci.yaml::proto-sync`, `size-gate::linux`,      |
# |                 |                       | `size-gate::report`                             |
# | `linux-wasm`    | `cargo-test-wasm`     | `size-gate::wasm`, `wasm-pack-tests`,           |
# |                 |                       | `webview-tests` (browser/unit/typecheck)        |
# | `linux-msrv`    | `cargo-build-msrv`    | —                                               |
# | `macos-cargo`   | `cargo-test-macos`    | `sdk-tests/macos`, `size-gate::macos`           |
# | `windows-cargo` | `cargo-test-windows`  | `sdk-tests/windows`, `size-gate::windows`       |
# | `linux-arm-bench` | `ci.yaml::benchmarks-build` | — (bench-only; see note)                  |
#
# Note: `linux-arm-bench` is bench-specific on purpose — its saver builds only
# `baml_tests` benches, so it's a thin seed not worth sharing with a general
# ARM job (which would still rebuild most of the workspace). It is also NOT
# touched by the daily purge in `canary-cache-refresh.yml` (that purge
# repopulates via this reusable workflow, which has no ARM job); it
# self-refreshes whenever `benchmarks-build` runs on canary, and only ages out
# after the 7-day TTL during fully ARM-idle periods.
#
# `cargo-test-linux` is the saver for `linux-cargo` because it builds
# the broadest target/ tree (`cargo test --no-run --all-features`
# across the whole workspace) — that's the most useful seed for the
# subcommand variants the readers run (`cargo doc`, narrower
# snapshot tests, the sdks/nodejs/bridge_nodejs build, prek's
# checks). Per-OS cargo-test jobs are the savers on macos/windows
# for the same reason.
#
# Every rust-cache invocation also passes `cache-all-crates: true`
# and `cache-workspace-crates: true`. By default rust-cache only
# caches registry-resolved deps and strips workspace-crate artifacts
# out of `target/` before saving. We override both: `cache-all-crates`
# pulls in `~/.cargo/git/` (most importantly our aws-sdk-rust fork,
# which is otherwise re-downloaded on every Windows run), and
# `cache-workspace-crates` keeps the compiled workspace `target/` so
# PRs reading from canary's cache restart with the workspace crates
# already built. Cache size grows accordingly; the daily refresh in
# `canary-cache-refresh.yml` bounds it.
#
# TODO: in our current setup, any PR that touches Cargo.lock — dependency bump,
# new crate, anything that re-resolves — will therefore be unable to restore
# from canary's build cache.  Swatinem/rust-cache@v2 hashes Cargo.lock (and
# Cargo.toml, rust-toolchain.toml) into every cache key, so any such PRs will
# have a new hash (and the action provides no mechanism to bypass this).
# rust-cache's `restore-keys` salvage a deps-only partial restore by prefix,
# but the entire workspace recompiles.
name: Cargo Tests (Reusable)

on:
  workflow_call: {}

# Read-only by design: the daily cache refresh runs in
# `canary-cache-refresh.yml`, which is the only place `actions: write`
# is granted. Keeping this workflow read-only means callers (ci.yaml,
# canary-cache-refresh.yml) never have to grant elevated scope to PR
# runs that go through the workflow_call path.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  cargo-test-linux:
    name: "cargo test (linux)"
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Install Rust toolchain BEFORE rust-cache so cache key uses correct Rust version
      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - uses: useblacksmith/rust-cache@v3
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          # See the cache strategy explanation at the top of this file.
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: "linux-cargo"

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: "Build tests with --timings"
        run: cargo test --no-run --all-features --timings
        working-directory: baml_language

      # Snapshot tests live in `baml_tests` and are exercised end-to-end by
      # the dedicated `snapshot-tests` job. The `sdk_test_*` crates need uv
      # and run in the dedicated `sdk-tests` matrix below. Skip both here.
      - name: "Run tests with nextest"
        run: cargo nextest run --all-features -E 'not package(baml_tests) and not package(/^sdk_test_/)'
        working-directory: baml_language

      - name: "Upload test results on failure"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failures-linux
          path: |
            baml_language/**/*.snap.new
            baml_language/**/target/nextest/

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-linux.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test-linux
          path: baml_language/target/cargo-timings/cargo-timing-test-linux.html
          if-no-files-found: ignore

  cargo-test-macos:
    name: "cargo test (macos)"
    # Skip in the merge queue: macos already ran on the PR. The merge_group
    # event is inherited from ci.yaml through the workflow_call boundary.
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Install Rust toolchain BEFORE rust-cache so cache key uses correct Rust version
      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-workspace-crates: true
          # See the cache strategy explanation at the top of this file.
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: "macos-cargo"

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: "Build tests with --timings"
        run: cargo test --no-run --all-features --timings
        working-directory: baml_language

      # Snapshot tests live in `baml_tests` and are covered by the dedicated
      # `snapshot-tests` job. The `sdk_test_*` crates need uv and run in the
      # dedicated `sdk-tests` matrix below. Skip both here.
      - name: "Run tests"
        run: cargo nextest run --all-features -E 'not package(baml_tests) and not package(/^sdk_test_/)'
        working-directory: baml_language

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-macos.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test-macos
          path: baml_language/target/cargo-timings/cargo-timing-test-macos.html
          if-no-files-found: ignore

  cargo-test-windows:
    name: "cargo test (windows)"
    # Skip in the merge queue: windows already ran on the PR. The merge_group
    # event is inherited from ci.yaml through the workflow_call boundary.
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: blacksmith-4vcpu-windows-2025
    # TODO: Reduce this once our changes to aws-sdk-rust are upstreamed
    # Right now it needs to download our repo every time which is very slow
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Install Rust toolchain BEFORE rust-cache so cache key uses correct Rust version
      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - uses: useblacksmith/rust-cache@v3
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          # See the cache strategy explanation at the top of this file.
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: "windows-cargo"

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: "Build tests with --timings"
        run: cargo test --no-run --all-features --timings
        working-directory: baml_language

      # Snapshot tests live in `baml_tests` and are covered by the dedicated
      # `snapshot-tests` job. The `sdk_test_*` crates need uv and run in the
      # dedicated `sdk-tests` matrix below. Skip both here.
      - name: "Run tests"
        run: cargo nextest run --all-features -E 'not package(baml_tests) and not package(/^sdk_test_/)'
        working-directory: baml_language

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-windows.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test-windows
          path: baml_language/target/cargo-timings/cargo-timing-test-windows.html
          if-no-files-found: ignore

  # SDK tests (codegen end-to-end). The `sdk_test_*` crates each emit a
  # generated Python project from `.baml` sources via build.rs and then
  # run ruff / pyright / pytest against it through `uv sync` + `uv run`.
  # They share a single editable install of `baml_core` (the local
  # Python SDK) anchored at `baml_language/target/uv-cache`, so multiple
  # tests racing on `uv sync` contend on uv's editable-build lock and
  # — on Windows — on wheel-extraction file locks. We pre-warm by
  # running the per-crate `sync_only` test serially (so the editable
  # build of `baml_core` and the wheel cache populate exactly once),
  # then fan out ruff/pyright/pytest in parallel against the warm
  # cache.
  sdk-tests:
    name: "sdk tests (${{ matrix.os-label }})"
    strategy:
      fail-fast: false
      # In the merge queue (`merge_group`) only the linux leg runs — the
      # macos/windows legs already ran on the PR. The matrix is built from a
      # `fromJSON` literal because matrix `include` entries can't carry their
      # own `if:`. The merge_group event is inherited from ci.yaml through the
      # workflow_call boundary. Keep these entries in sync with the standalone
      # cargo-test-macos/windows jobs above.
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'merge_group'
          && '[{"os-label":"linux","runs-on":"blacksmith-16vcpu-ubuntu-2404","rust-cache-key":"linux-cargo","timeout":30}]'
          || '[{"os-label":"linux","runs-on":"blacksmith-16vcpu-ubuntu-2404","rust-cache-key":"linux-cargo","timeout":30},{"os-label":"macos","runs-on":"macos-latest","rust-cache-key":"macos-cargo","timeout":40},{"os-label":"windows","runs-on":"blacksmith-4vcpu-windows-2025","rust-cache-key":"windows-cargo","timeout":60}]') }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Install Rust toolchain BEFORE rust-cache so cache key uses correct Rust version
      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      # This job's matrix spans Blacksmith (linux, windows) and a GitHub-hosted
      # macOS runner. Blacksmith's cache backend survives the runner's post-job
      # teardown; the macOS leg stays on Swatinem. `uses:` can't be an
      # expression, so gate two steps by matrix.os-label.
      - uses: useblacksmith/rust-cache@v3
        if: matrix.os-label != 'macos'
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          # See the cache strategy explanation at the top of this file.
          save-if: false
          shared-key: ${{ matrix.rust-cache-key }}
      - uses: Swatinem/rust-cache@v2
        if: matrix.os-label == 'macos'
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-workspace-crates: true
          save-if: false
          shared-key: ${{ matrix.rust-cache-key }}

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # sdk_test_* crates shell out to `uv sync` against the generated
      # Python project under target/uv-cache. python + uv are the only
      # mise tools the matrix needs.
      - name: "Install mise"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"

      - name: "Build tests with --timings"
        run: cargo test --no-run --all-features --timings
        working-directory: baml_language

      - name: "Run sdk tests"
        run: cargo nextest run --all-features -E 'package(/^sdk_test_/)'
        working-directory: baml_language

      - name: "Upload test results on failure"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-test-failures-${{ matrix.os-label }}
          path: |
            baml_language/sdk_tests/crates/*/generated/
            baml_language/target/nextest/
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-sdk-tests-${{ matrix.os-label }}.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-sdk-tests-${{ matrix.os-label }}
          path: baml_language/target/cargo-timings/cargo-timing-sdk-tests-${{ matrix.os-label }}.html
          if-no-files-found: ignore

  cargo-test-wasm:
    name: "cargo test (wasm)"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Install Rust toolchain BEFORE rust-cache so cache key uses correct Rust version
      - name: "Install Rust toolchain"
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
        working-directory: baml_language

      - uses: useblacksmith/rust-cache@v3
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          # See the cache strategy explanation at the top of this file.
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: "linux-wasm"

      - name: "Build for WASM"
        run: |
          WASM_PACKAGES=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.source==null) | select(if .metadata.ci.wasm_support == null then true else .metadata.ci.wasm_support end) | "-p \(.name)"' | xargs)
          cargo build $WASM_PACKAGES --target wasm32-unknown-unknown --no-default-features --release --timings
        working-directory: baml_language

      - name: "List WASM artifacts"
        run: ls -lh target/wasm32-unknown-unknown/release/*.wasm || true
        working-directory: baml_language

      - name: "Rename cargo timings"
        if: always()
        run: |
          if [[ -f target/cargo-timings/cargo-timing.html ]]; then
            mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-wasm.html
          fi
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test-wasm
          path: baml_language/target/cargo-timings/cargo-timing-test-wasm.html
          if-no-files-found: ignore

  # Size-gate jobs live in size-gate.reusable.yaml — they are intentionally
  # decoupled from cargo-tests so a violation never blocks the test workflow.

  cargo-build-msrv:
    name: "cargo build (msrv)"
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: SebRollen/toml-action@v1.2.0
        id: msrv
        with:
          file: "baml_language/Cargo.toml"
          field: "workspace.package.rust-version"

      # Install Rust toolchain BEFORE rust-cache so cache key uses correct Rust version
      - name: "Install Rust toolchain (MSRV)"
        env:
          MSRV: ${{ steps.msrv.outputs.value }}
        run: |
          rustup toolchain install "${MSRV}"
          rustup default "${MSRV}"
        working-directory: baml_language

      - uses: useblacksmith/rust-cache@v3
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          # See the cache strategy explanation at the top of this file.
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: "linux-msrv"

      - name: "Build with MSRV"
        env:
          MSRV: ${{ steps.msrv.outputs.value }}
        run: cargo "+${MSRV}" test --no-run --all-features --timings
        working-directory: baml_language

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-msrv.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-msrv
          path: baml_language/target/cargo-timings/cargo-timing-msrv.html
          if-no-files-found: ignore

  cargo-doc:
    name: "cargo doc"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - uses: useblacksmith/rust-cache@v3
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          # See the cache strategy explanation at the top of this file.
          save-if: false
          shared-key: "linux-cargo"

      - name: "Generate documentation"
        run: cargo doc --all --no-deps --timings
        working-directory: baml_language
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-doc.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-doc
          path: baml_language/target/cargo-timings/cargo-timing-doc.html
          if-no-files-found: ignore

  snapshot-tests:
    name: "snapshot tests"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Install Rust toolchain BEFORE rust-cache so cache key uses correct Rust version
      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - uses: useblacksmith/rust-cache@v3
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          # See the cache strategy explanation at the top of this file.
          save-if: false
          shared-key: "linux-cargo"

      - name: "Install cargo insta and nextest"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-insta,cargo-nextest

      # rig test scripts shell out to `uv run` (and bring their own
      # Python via uv), so the only mise tools snapshot-tests needs are
      # python + uv.
      - name: "Install mise"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "python uv"

      - name: "Build tests with --timings"
        run: cargo test --no-run -p baml_tests -p baml_cli -p baml_lsp2_actions --all-features --timings
        working-directory: baml_language

      - name: "Run snapshot tests"
        run: cargo insta test --test-runner nextest -p baml_tests -p baml_cli -p baml_lsp2_actions --all-features --unreferenced=reject
        working-directory: baml_language

      - name: "Check for snapshot changes"
        run: |
          pathspecs=(
            ':(glob)baml_language/**/*.snap'
            ':(glob)baml_language/**/*.snap.new'
          )
          if [ -n "$(git status --porcelain -- "${pathspecs[@]}")" ]; then
            echo "::error::Snapshot tests have uncommitted changes"
            git diff -- "${pathspecs[@]}"
            exit 1
          fi

      - name: "Upload snapshot failures"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failures
          path: |
            baml_language/**/*.snap
            baml_language/**/*.snap.new

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-snapshot.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-snapshot
          path: baml_language/target/cargo-timings/cargo-timing-snapshot.html
          if-no-files-found: ignore

  cargo-timings:
    name: "cargo timings (merged)"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - cargo-test-linux
      - cargo-test-macos
      - cargo-test-windows
      - sdk-tests
      - cargo-test-wasm
      - cargo-build-msrv
      - cargo-doc
      - snapshot-tests
    steps:
      - name: "Merge cargo timings artifacts"
        uses: actions/upload-artifact/merge@v4
        with:
          name: cargo-timings
          pattern: cargo-timings-*
          delete-merged: true
