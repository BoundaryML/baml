# sccache strategy
# ================
#
# This workflow uses sccache for Rust compilation artifacts and
# Swatinem/rust-cache for Cargo registry/git state — i.e. everything cargo
# downloads before it compiles: the crates.io index, the `.crate` tarballs, and
# the git checkouts of our forks (minijinja, aws-sdk-rust, google-cloud-rust).
# `cache-all-crates: true` keeps all of those (the git forks in particular,
# which are large and otherwise re-cloned on every runner); `cache-targets:
# false` leaves the compiled `target/` tree to sccache so the two caches don't
# compete.
#
# Because `target/` is excluded, rust-cache's payload is small (registry + git,
# no build output). As on canary, only canary writes the cache
# (`save-if: ${{ github.ref == 'refs/heads/canary' }}`); PR branches read the
# shared entry instead of each saving a fresh one, so cache usage doesn't blow
# out. rust-cache keys are content-addressed on Cargo.lock, so jobs sharing a
# `shared-key` reuse the same entry.
#
# mise installs sccache and direnv, then each cargo job loads .envrc via
# `direnv export gha` so CI uses the exact same sccache config as local shells:
# .envrc is the single source of truth. The R2 credentials are passed through
# GitHub Actions secrets using the same BAML_SCCACHE_R2_* names that the
# RUSTC_WRAPPER maps to AWS_* before exec'ing sccache — the `tools/baml-sccache`
# script on POSIX, and the native `tools_sccache` crate's binary on Windows
# (built per-job; see the "Build native sccache wrapper" step).
#
# Secretless runs (e.g. fork PRs) still install sccache, but .envrc sees no R2
# credentials and falls back to the runner-local cache.
name: Cargo Tests (Reusable)

on:
  workflow_call:
    secrets:
      BAML_SCCACHE_R2_ACCESS_KEY_ID:
        required: false
      BAML_SCCACHE_R2_SECRET_ACCESS_KEY:
        required: false

# Read-only by design: these jobs run PR-controlled cargo build/test code, so
# they should not need elevated repository permissions.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Inputs read by .envrc; everything else (RUSTC_WRAPPER, SCCACHE_*) is set by
  # .envrc itself so it stays the single source of truth across CI and local.
  # The R2 credentials .envrc maps to AWS_* for sccache (mapped to AWS_*).
  # Native Cargo linker overrides live in baml_language/.cargo/config.toml.
  BAML_SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.BAML_SCCACHE_R2_ACCESS_KEY_ID }}
  BAML_SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BAML_SCCACHE_R2_SECRET_ACCESS_KEY }}
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  # CI executes the compiler thousands of times per job — in-process in
  # `baml_tests`, and as a spawned debug `baml-cli` in the CLI e2e suites — so
  # test runtime dwarfs compile time here (opt-level 0 test execution was
  # ~55min of CPU per run across the linux jobs alone). opt-level 1 keeps
  # debug-assertions on and costs one sccache-cold rebuild after this change
  # lands; per-package overrides in Cargo.toml (e.g. salsa) still apply on
  # top. Pinned on both `dev` (dependencies) and `test` (the `--test`
  # binaries) so the setting is unambiguous, mirroring the DEBUG pins in the
  # windows job.
  CARGO_PROFILE_DEV_OPT_LEVEL: "1"
  CARGO_PROFILE_TEST_OPT_LEVEL: "1"
  # Workflow-level mirror of the runner image's CARGO_BUILD_JOBS pin: cargo
  # defaults -j to the guest's full 64 cores, and every concurrent pool member
  # doing that oversubscribes the host it shares (measured: the same cold
  # build was 317s at full-wave contention vs 120s alone). The image pin only
  # reaches VMs at the next pool roll; this makes it effective now and is a
  # no-op once the roll lands. Hosted fallback runners have <=16 vCPUs, so
  # this changes nothing there.
  CARGO_BUILD_JOBS: "16"
  # Workflow-level so it is deterministic on EVERY run regardless of which
  # image generation the pool member carries (workflow env overrides the
  # runner unit env; the image pin only reaches VMs at a pool roll, and a
  # roll cannot converge while CI keeps the members busy). vitest sizes its
  # pool off availableParallelism()-1 = 63 on the 64-vCPU guests and
  # vitest-pool-workers spawns one workerd per worker; 63 workers OOM-killed
  # the suite 2/2 on the elastic guests, 4 passed 2/2, measured by cgroup
  # oom_kill. 4 was tuned against the pre-2026-08-17 platform, where the
  # elastic guest could be deflated to ~6 GiB with nothing holding its
  # working set; the fleet now runs the working-set floor (a guest that ran
  # this suite keeps its learned peak plugged for ~an hour) plus the
  # post-boot inflation holdoff, which is what this raise banks on. 12 was
  # the marginal point of the old A/B (1 pass / 1 fail pre-floor); if this
  # lane goes red with "Worker exited unexpectedly" again, step down to 8
  # before reverting to 4. Pairs with the two-pool nextest group in
  # baml_language/.config/nextest.toml.
  VITEST_MAX_WORKERS: "12"
  RUSTUP_MAX_RETRIES: 10

jobs:

  cargo-test-linux:
    name: "cargo test (x86_64-unknown-linux-gnu)"
    # Fork PRs must never run on the persistent ix pool: the VMs are reused by
    # later trusted, secret-bearing jobs. Untrusted events fall back to the
    # GitHub-hosted runner this job used before the pool migration.
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "ix-gnu"]')) || 'blacksmith-16vcpu-ubuntu-2404' }}
    # 40, not 25: on the persistent pool a run that misses its warm member
    # recompiles from local sccache and has been measured at 1519s+ under
    # family contention (cancelled at the old 25m cap); warm runs are 92s.
    # The cap is a hang backstop, not a perf gate - the L2 conversion of this
    # lane (nextest binaries-metadata export) is what removes the recompiles.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Persistent-runner warmth: keep IGNORED files (target/, node_modules)
          # across runs; tracked files still hard-reset to the new SHA. A no-op
          # on ephemeral runners; on the ix pool it is what lets a warm rebuild
          # skip relinking the world.
          clean: false

      # nix arm: the flake CI shell provides the pinned toolchain, sccache,
      # direnv and cargo-nextest. Fallback arm (no nix): rustup + mise.
      - name: "Set up toolchains"
        uses: ./.github/actions/setup-ci-shell
        with:
          mise-install-args: "sccache direnv cargo:cargo-nextest"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: "linux-cargo"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      # `baml_tests`, `baml_cli`, and `baml_lsp2_actions` already run on linux
      # with `--all-features` in the dedicated `snapshot-tests` job, so this
      # job neither builds nor runs them — their test binaries are also the
      # heaviest links in the workspace. (A nextest `-E` filter would only
      # skip *running* them; the cargo-level `--exclude` skips building them
      # too.) The `sdk_test_*` crates need uv and run in the dedicated
      # `sdk-tests` matrix below.
      - name: "Build tests with --timings"
        run: cargo test --no-run --all-features --timings --workspace --exclude baml_tests --exclude baml_cli --exclude baml_lsp2_actions --exclude "sdk_test_*" --exclude baml_bridge
        working-directory: baml_language

      - name: "Run tests with nextest"
        run: cargo nextest run --all-features --workspace --exclude baml_tests --exclude baml_cli --exclude baml_lsp2_actions --exclude "sdk_test_*" --exclude baml_bridge
        working-directory: baml_language

      - name: "Upload test results on failure"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failures-linux
          path: |
            baml_language/**/*.snap.new
            baml_language/**/target/nextest/

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-test-linux.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-test-linux
          path: sccache-stats-test-linux.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-linux.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test-linux
          path: baml_language/target/cargo-timings/cargo-timing-test-linux.html
          if-no-files-found: ignore

  cargo-test-linux-musl:
    name: "cargo test (x86_64-unknown-linux-musl)"
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "ix-musl"]')) || 'blacksmith-16vcpu-ubuntu-2404' }}
    # 45, not 35: same reasoning as the gnu lane above; measured 1400s under
    # contention against the old 35m cap (23 of 35 minutes used).
    timeout-minutes: 45
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Persistent-runner warmth: keep IGNORED files (target/, node_modules)
          # across runs; tracked files still hard-reset to the new SHA. A no-op
          # on ephemeral runners; on the ix pool it is what lets a warm rebuild
          # skip relinking the world.
          clean: false

      # nix arm: the CI shell's toolchain already carries the musl target
      # (rust-toolchain.toml) and ships a static-PIE-capable musl-gcc.
      - name: "Set up toolchains"
        id: toolchains
        uses: ./.github/actions/setup-ci-shell
        with:
          mise-install-args: "sccache direnv cargo:cargo-nextest"

      - name: "Add the musl target (no-nix fallback)"
        if: steps.toolchains.outputs.nix == 'false'
        run: rustup target add x86_64-unknown-linux-musl
        working-directory: baml_language

      # Both arms: this wires CC_<target> + CARGO_TARGET_*_LINKER=musl-gcc,
      # without which cargo links the musl target with the default (glibc)
      # gcc and dies on `-ldl` (musl folds libdl into libc). The CI shell
      # provides musl-gcc, so the action's apt branch never runs on ix.
      - name: "Setup musl cross toolchain"
        uses: ./.github/actions/setup-musl-cross
        with:
          target: x86_64-unknown-linux-musl

      - name: "Verify sccache"
        run: sccache --version

      # Same probe as the msrv and wasm lanes, same shape on purpose (two
      # probes in one file reading differently is how one of them rots); the
      # full why-a-probe-not-a-switch reasoning lives above the msrv probe.
      # The root here is the nextest EXPORT: two JSON manifests whose
      # interpolated store paths pin every musl test binary into one
      # closure, so a hit substitutes the compile work and the job only
      # RUNS the tests. The tests execute in this runner environment on
      # both arms - the arm changes who compiled, never what runs where.
      - name: "Probe the L2 unit cache"
        id: l2
        if: steps.toolchains.outputs.nix == 'true'
        env:
          # The eval runs the render IFD, so it is not free; bound it rather
          # than let a cold guest sit here. The network probe is the cheap
          # half and gets a tight budget of its own.
          L2_EVAL_TIMEOUT_SECONDS: "180"
          L2_PROBE_TIMEOUT_SECONDS: "10"
        run: |
          set -uo pipefail

          echo "hit=false" >> "$GITHUB_OUTPUT"

          # Timeout (rc 124) is a slow cold guest and expected; any other
          # nonzero exit is a broken flake and must not hide behind a green
          # cargo arm. Keep stderr: on the error arm it is the only place
          # the nix diagnostic survives.
          eval_log="$(mktemp)"
          out_path="$(timeout "${L2_EVAL_TIMEOUT_SECONDS}" nix eval --raw .#musl-test-export.outPath 2>"${eval_log}")" \
            && eval_rc=0 || eval_rc=$?
          if [ "${eval_rc}" -ne 0 ]; then
            if [ "${eval_rc}" -eq 124 ]; then
              echo "::notice title=L2::evaluation did not finish within ${L2_EVAL_TIMEOUT_SECONDS}s; taking the cargo arm"
            else
              echo "::warning title=L2::evaluation FAILED with exit ${eval_rc} (not a timeout); taking the cargo arm"
              sed -n '1,25p' "${eval_log}"
            fi
            exit 0
          fi

          # Local first: runners are persistent, so a VM that already built
          # this exact root has it on disk.
          if nix path-info "${out_path}" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=L2::already in the local store: ${out_path}; taking the nix arm"
          # --narinfo-cache-negative-ttl 0: a probe that runs before the
          # builder publishes must not poison this runner for an hour.
          elif timeout "${L2_PROBE_TIMEOUT_SECONDS}" nix path-info --narinfo-cache-negative-ttl 0 --store https://cache.ix.dev "${out_path}" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=L2::cache hit for ${out_path}; taking the nix arm"
          else
            echo "::notice title=L2::cache miss for ${out_path}; taking the cargo arm"
          fi

      - uses: Swatinem/rust-cache@v2
        # Deliberately ungated by the probe: the cargo arm stays the
        # fallback, so its cache has to keep being warmed on canary or the
        # first L2 miss lands on a cold cargo build.
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: "linux-cargo"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      - name: "Fetch cargo dependencies"
        if: steps.l2.outputs.hit != 'true'
        run: cargo fetch
        working-directory: baml_language

      # Enabling every feature turns on the optional native-tls backend, which
      # needs a separate target-specific OpenSSL build. Default features match
      # the rustls-based musl artifacts we ship.
      - name: "Build tests with --timings"
        if: steps.l2.outputs.hit != 'true'
        run: cargo test --no-run --timings --workspace --exclude baml_tests --exclude "sdk_test_*" --exclude baml_bridge
        working-directory: baml_language

      # The nix arm: substitute the export (manifests + every test binary in
      # its closure), then run nextest against the prebuilt binaries in THIS
      # checkout. --workspace-remap makes nextest derive each test's cwd
      # from the real tree, so fixtures and runtime CARGO_MANIFEST_DIR reads
      # resolve here; INSTA_WORKSPACE_ROOT is insta's own hatch for
      # relocated builds (snapshot dirs are compile-time baked to the
      # unit's /build placeholder). The list phase executes each binary
      # once - static musl binaries, no loader env needed.
      - name: "Run tests with nextest (nix unit graph)"
        if: steps.l2.outputs.hit == 'true'
        run: |
          set -euo pipefail
          echo "::notice title=L2::arm=nix"
          # baml_cli's tests bake CARGO_TARGET_TMPDIR as a compile-time
          # literal (/tmp/baml-cli-target-tmp, see graphPackageBuildEnv) and
          # WRITE there at run time. Per-slot /tmp sandboxing means the dir
          # is not guaranteed to exist; if this mkdir fails it is the known
          # ix-runners /tmp class - let it fail the job loudly, never mask.
          mkdir -p /tmp/baml-cli-target-tmp
          export_dir="$(nix build --no-link --print-out-paths --print-build-logs .#musl-test-export)"
          cd baml_language
          INSTA_WORKSPACE_ROOT="$PWD" cargo nextest run \
            --binaries-metadata "$export_dir/binaries-metadata.json" \
            --cargo-metadata "$export_dir/cargo-metadata.json" \
            --workspace-remap "$PWD" \
            -E 'not binary(=pack_e2e)'

      - name: "Run tests with nextest"
        if: steps.l2.outputs.hit != 'true'
        run: |
          echo "::notice title=L2::arm=cargo"
          cargo nextest run --workspace --exclude baml_tests --exclude "sdk_test_*" --exclude baml_bridge -E 'not binary(=pack_e2e)'
        working-directory: baml_language

      # Unconditional on BOTH arms: pack_e2e needs baml-pack-host as a
      # sibling of the baml-cli binary in a writable directory, which a
      # read-only store path structurally cannot be. One test, kept on the
      # cargo path; the nix arm pays this one compile.
      - name: "Run pack end-to-end tests"
        run: cargo test -p baml_cli --test pack_e2e
        working-directory: baml_language

      - name: "Upload test results on failure"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failures-linux-musl
          path: |
            baml_language/**/*.snap.new
            baml_language/**/target/nextest/

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-test-linux-musl.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-test-linux-musl
          path: sccache-stats-test-linux-musl.json
          if-no-files-found: ignore

      # --timings only exists on the cargo arm; `clean: false` keeps stale
      # files across runs, so an unconditional mv would fail on the nix arm
      # or ship the previous run's timings as this run's (same gating as
      # the msrv job).
      - name: "Rename cargo timings"
        if: always() && steps.l2.outputs.hit != 'true'
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-linux-musl.html
        working-directory: baml_language

      - name: "Upload cargo timings"
        if: always() && steps.l2.outputs.hit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test-linux-musl
          path: baml_language/target/cargo-timings/cargo-timing-test-linux-musl.html
          if-no-files-found: ignore

  # TODO(B-1545): Temporarily disabled due to flakiness; re-enable via https://linear.app/boundaryml2/issue/B-1545/investigate-flakiness-in-cargo-test-aarch64-apple-darwin-ci-job
