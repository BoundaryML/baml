  cargo-test-windows:
    name: "cargo test (x86_64-pc-windows-msvc)"
    # Skip in the merge queue: windows already ran on the PR. The merge_group
    # event is inherited from ci.yaml through the workflow_call boundary.
    # Also skip outside the upstream repo (no Blacksmith Windows runners).
    if: ${{ github.event_name != 'merge_group' && github.repository == 'BoundaryML/baml' }}
    # 8-vCPU + CARGO_BUILD_JOBS=16 (2x cores) was the value sweet spot for the
    # native Windows Rust builds (build-caching/04 Exp 7/9).
    runs-on: blacksmith-8vcpu-windows-2025
    env:
      CARGO_BUILD_JOBS: "16"
      # Windows debug builds emit very large PDBs; full debuginfo across the
      # whole `--all-features` test build overruns the runner's ~130 GB disk
      # ("no space on device" during codegen, before any test runs).
      # `line-tables-only` keeps file:line backtraces for test failures while
      # dropping the bulk of the debug-info size (variable/type DIEs). Pinned on
      # both `dev` (dependencies) and `test` (the `--test` binaries, which
      # inherit `dev` but are pinned explicitly so the reduction is unambiguous).
      # Drop to "0" if this is still too tight.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    # TODO: Reduce this once our changes to aws-sdk-rust are upstreamed
    # Right now it needs to download our repo every time which is very slow
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Persistent-runner warmth: keep IGNORED files (target/, node_modules)
          # across runs; tracked files still hard-reset to the new SHA. A no-op
          # on ephemeral runners; on the ix pool it is what lets a warm rebuild
          # skip relinking the world.
          clean: false

      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - name: "Install sccache, direnv, and cargo-nextest"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv cargo:cargo-nextest"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: "windows-cargo"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      - name: "Build native sccache wrapper"
        run: |
          set -euo pipefail
          # The native RUSTC_WRAPPER (tools_sccache crate) maps the R2 creds and
          # execs sccache; cargo launches it via CreateProcess (32767-char
          # limit), avoiding cmd.exe's ~8191-char limit that windows-sys' huge
          # `--check-cfg cfg(feature, values(...))` line blows past. The binary
          # lives in the build tree, so build it first — .envrc leaves
          # RUSTC_WRAPPER unset until it exists, so this bootstrap compiles with
          # plain rustc — then point RUSTC_WRAPPER at it for the cargo steps
          # below.
          cargo build -p tools_sccache
          echo "RUSTC_WRAPPER=$(pwd -W)/target/debug/baml-sccache.exe" >> "$GITHUB_ENV"
        working-directory: baml_language

      # Snapshot tests live in `baml_tests` and are covered by the dedicated
      # `snapshot-tests` job. The `sdk_test_*` crates need uv and run in the
      # dedicated `sdk-tests` matrix below. Skip both here — at the cargo
      # level (`--exclude`), not a nextest `-E` filter, so their test binaries
      # (the heaviest links, and on Windows the largest PDBs) aren't built.
      - name: "Build tests with --timings"
        run: cargo test --no-run --all-features --timings --workspace --exclude baml_tests --exclude "sdk_test_*" --exclude baml_bridge
        working-directory: baml_language

      # Profiling-specific test binaries opt in explicitly; keeping
      # BAML_PROFILE off for the general suite avoids filling the Windows
      # runner with incidental `.bamlprof` files. Run the two binaries that
      # need `baml-pack-host` separately so their process-global OnceLocks
      # build and share it instead of relinking it for every nextest case.
      - name: "Run tests"
        run: cargo nextest run --all-features --workspace --exclude baml_tests --exclude "sdk_test_*" --exclude baml_bridge -E 'not binary(=pack_e2e) and not binary(=exit_code_e2e)'
        working-directory: baml_language
        env:
          BAML_PROFILE: "0"

      - name: "Free disk for CLI binary e2e tests"
        run: |
          set -euo pipefail
          mv target/cargo-timings/cargo-timing.html cargo-timing-test-windows.html
          cp target/debug/baml-sccache.exe baml-sccache.exe
          echo "RUSTC_WRAPPER=$(pwd -W)/baml-sccache.exe" >> "$GITHUB_ENV"
          cargo clean
        working-directory: baml_language

      - name: "Run CLI binary e2e tests (windows)"
        run: cargo test -p baml_cli --test pack_e2e --test exit_code_e2e --all-features
        working-directory: baml_language
        env:
          BAML_PROFILE: "0"

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-test-windows.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-test-windows
          path: sccache-stats-test-windows.json
          if-no-files-found: ignore

      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test-windows
          path: baml_language/cargo-timing-test-windows.html
          if-no-files-found: ignore

  sdk-test-matrix:
    name: "sdk test matrix"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      sdk-dirs: ${{ steps.matrix.outputs.sdk-dirs }}
      temporarily-disabled-sdk-dirs: ${{ steps.matrix.outputs.temporarily-disabled-sdk-dirs }}
    steps:
      - name: "Build matrix"
        id: matrix
        uses: actions/github-script@v8
        with:
          script: |
            // Fork PRs must never run on the persistent ix pool: the VMs are
            // reused by later trusted, secret-bearing jobs. Untrusted events
            // fall back to the GitHub-hosted runner these jobs used before the
            // pool migration. Read off `context` rather than interpolated by
            // the workflow templater, so no event data is spliced into this
            // script.
            // Same-repo test, not head.repo.fork: `fork` answers "is the head
            // repo a fork of anything", which is true for every PR on a fork
            // of upstream and would route same-repo PRs to runner labels that
            // do not exist there.
            const poolOk =
              (context.eventName !== 'pull_request' && context.eventName !== 'pull_request_target') ||
              context.payload.pull_request?.head?.repo?.full_name ===
                `${context.repo.owner}/${context.repo.repo}`;
            // One constant covers all eight linux SDK entries, so the whole
            // generated matrix lands in the sdk family: these jobs share the
            // gnu Rust build underneath and differ only in which language
            // toolchain each one leaves warm on the member.
            const LINUX_RUNNER = poolOk ? ["self-hosted", "ix-sdk"] : "blacksmith-16vcpu-ubuntu-2404";

            const baseMatrix = [
              {
                "sdk-label": "go",
                "sdk-dir": "go",
                "package-name": "sdk_test_go",
                "sdk-path": "go",
                "install-args": "sccache direnv go cargo:cargo-nextest",
                "os-label": "linux",
                "runs-on": LINUX_RUNNER,
                "rust-cache-key": "linux-cargo",
                "timeout": 30,
              },
              {
                "sdk-label": "python-pydantic2",
                "sdk-dir": "python",
                "package-name": "sdk_test_python_pydantic2",
                "sdk-path": "python_pydantic2",
                "install-args": "sccache direnv python uv cargo:cargo-nextest",
                "os-label": "linux",
                "runs-on": LINUX_RUNNER,
                "rust-cache-key": "linux-cargo",
                "timeout": 30,
              },
              {
                "sdk-label": "typescript",
                "sdk-dir": "typescript",
                "package-name": "sdk_test_typescript",
                "sdk-path": "typescript",
                "install-args": "sccache direnv node npm:pnpm cargo:cargo-nextest",
                "os-label": "linux",
                "runs-on": LINUX_RUNNER,
                "rust-cache-key": "linux-cargo",
                "timeout": 30,
              },
              {
                "sdk-label": "typescript-web",
                "sdk-dir": "typescript",
                "package-name": "sdk_test_typescript_web",
                "sdk-path": "typescript_web",
                "install-args": "sccache direnv node npm:pnpm cargo:cargo-nextest github:rustwasm/wasm-pack",
                "os-label": "linux",
                "runs-on": LINUX_RUNNER,
                "rust-cache-key": "linux-cargo",
                "timeout": 30,
              },
              {
                // The C++ sdk-test crate needs the host C++ toolchain and
                // CMake (preinstalled on the runners) plus nextest; its
                // setup.sh builds the bridge_cffi cdylib with cargo and
                // pre-clones the pinned protobuf sources. Windows joins
                // once the MSVC test driver lands (test.sh is bash).
                "sdk-label": "cpp",
                "sdk-dir": "cpp",
                "package-name": "sdk_test_cpp",
                "sdk-path": "cpp",
                "install-args": "sccache direnv cargo:cargo-nextest",
                "os-label": "linux",
                "runs-on": LINUX_RUNNER,
                "rust-cache-key": "linux-cargo",
                "timeout": 30,
              },
              {
                "sdk-label": "csharp",
                "sdk-dir": "csharp",
                "package-name": "sdk_test_csharp",
                "sdk-path": "csharp",
                "install-args": "sccache direnv cargo:cargo-nextest",
                "os-label": "linux",
                "runs-on": LINUX_RUNNER,
                "rust-cache-key": "linux-cargo",
                "timeout": 30,
              },
              {
                "sdk-label": "rust",
                "sdk-dir": "rust",
                "package-name": "sdk_test_rust",
                "sdk-path": "rust",
                "install-args": "sccache direnv cargo:cargo-nextest",
                "os-label": "linux",
                "runs-on": LINUX_RUNNER,
                "rust-cache-key": "linux-cargo",
                "timeout": 30,
              },
              {
                // The Java sdk-test crate needs the mise-pinned JDK and
                // Gradle (setup script builds the bridge_java cdylib and
                // the baml_bridge jar; test time spawns `gradle` from
                // PATH, so `java` + `gradle` must be in install-args).
                "sdk-label": "java",
                "sdk-dir": "java",
                "package-name": "sdk_test_java",
                "sdk-path": "java",
                "install-args": "sccache direnv java gradle cargo:cargo-nextest",
                "os-label": "linux",
                "runs-on": LINUX_RUNNER,
                "rust-cache-key": "linux-cargo",
                "timeout": 30,
              },
              {
                "sdk-label": "go",
                "sdk-dir": "go",
                "package-name": "sdk_test_go",
                "sdk-path": "go",
                "install-args": "sccache direnv go cargo:cargo-nextest",
                "os-label": "macos",
                "runs-on": "blacksmith-6vcpu-macos-latest",
                "rust-cache-key": "macos-cargo",
                "timeout": 40,
              },
              {
                "sdk-label": "python-pydantic2",
                "sdk-dir": "python",
                "package-name": "sdk_test_python_pydantic2",
                "sdk-path": "python_pydantic2",
                "install-args": "sccache direnv python uv cargo:cargo-nextest",
                "os-label": "macos",
                "runs-on": "blacksmith-6vcpu-macos-latest",
                "rust-cache-key": "macos-cargo",
                "timeout": 40,
              },
              {
                "sdk-label": "cpp",
                "sdk-dir": "cpp",
                "package-name": "sdk_test_cpp",
                "sdk-path": "cpp",
                "install-args": "sccache direnv cargo:cargo-nextest",
                "os-label": "macos",
                "runs-on": "blacksmith-6vcpu-macos-latest",
                "rust-cache-key": "macos-cargo",
                "timeout": 40,
              },
              {
                "sdk-label": "typescript",
