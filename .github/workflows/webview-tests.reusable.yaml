name: Webview Tests (Reusable)

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-webview-tests
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  typecheck:
    name: "Typecheck"
    # Fork PRs must never run on the persistent ix pool: the VMs are reused by
    # later trusted, secret-bearing jobs. Untrusted events fall back to the
    # GitHub-hosted runner this job used before the pool migration.
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "ix-web"]')) || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Persistent-runner warmth: keep IGNORED files (target/, node_modules)
          # across runs; tracked files still hard-reset to the new SHA. A no-op
          # on ephemeral runners; on the ix pool it is what lets a warm rebuild
          # skip relinking the world.
          clean: false

      - name: "Setup Node.js for typescript2"
        uses: ./.github/actions/setup-node2

      # Toolchain BEFORE rust-cache so the cache key uses the correct Rust
      # version. nix arm: the CI shell carries the wasm32 target and
      # wasm-pack. node + pnpm stay on setup-node2 above on both arms.
      - name: "Set up toolchains"
        id: toolchains
        uses: ./.github/actions/setup-ci-shell
        with:
          mise-install-args: "github:rustwasm/wasm-pack"

      - name: "Add the wasm32 target (no-nix fallback)"
        if: steps.toolchains.outputs.nix == 'false'
        run: rustup target add wasm32-unknown-unknown
        working-directory: baml_language

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          # Share cache across similar Linux WASM jobs for better hit rates
          shared-key: "linux-wasm"
          # Read-only consumer. The canary saver lives in
          # cargo-tests.reusable.yaml; see the cache strategy comment there.
          save-if: false

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch --target wasm32-unknown-unknown
        working-directory: baml_language

      # Path-mapped imports from app-vscode-webview resolve into pkg-playground/wasm
      # and pkg-proto/src/generated, so both must be present before tsc runs.
      - name: "Build WASM"
        run: pnpm --filter pkg-playground build:wasm
        working-directory: typescript2

      - name: "Generate proto types"
        run: pnpm --filter @b/pkg-proto generate
        working-directory: typescript2

      - name: "Typecheck pkg-proto"
        run: pnpm --filter @b/pkg-proto typecheck
        working-directory: typescript2

      - name: "Typecheck app-vscode-webview"
        run: pnpm --filter app-vscode-webview typecheck
        working-directory: typescript2

  unit-tests:
    name: "Unit Tests (jsdom)"
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "ix-web"]')) || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Persistent-runner warmth: keep IGNORED files (target/, node_modules)
          # across runs; tracked files still hard-reset to the new SHA. A no-op
          # on ephemeral runners; on the ix pool it is what lets a warm rebuild
          # skip relinking the world.
          clean: false

      - name: "Setup Node.js for typescript2"
        uses: ./.github/actions/setup-node2

      # Toolchain BEFORE rust-cache so the cache key uses the correct Rust
      # version. nix arm: the CI shell carries the wasm32 target and
      # wasm-pack. node + pnpm stay on setup-node2 above on both arms.
      - name: "Set up toolchains"
        id: toolchains
        uses: ./.github/actions/setup-ci-shell
        with:
          mise-install-args: "github:rustwasm/wasm-pack"

      - name: "Add the wasm32 target (no-nix fallback)"
        if: steps.toolchains.outputs.nix == 'false'
        run: rustup target add wasm32-unknown-unknown
        working-directory: baml_language

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          # Share cache across similar Linux WASM jobs for better hit rates
          shared-key: "linux-wasm"
          # Read-only consumer. The canary saver lives in
          # cargo-tests.reusable.yaml; see the cache strategy comment there.
          save-if: false

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch --target wasm32-unknown-unknown
        working-directory: baml_language

      - name: "Build WASM"
        run: pnpm --filter pkg-playground build:wasm
        working-directory: typescript2

      - name: "Run unit tests"
        run: pnpm --filter app-vscode-webview test:unit:run
        working-directory: typescript2

  browser-tests:
    name: "Browser Tests (Playwright)"
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "ix-web"]')) || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Persistent-runner warmth: keep IGNORED files (target/, node_modules)
          # across runs; tracked files still hard-reset to the new SHA. A no-op
          # on ephemeral runners; on the ix pool it is what lets a warm rebuild
          # skip relinking the world.
          clean: false

      - name: "Setup Node.js for typescript2"
        uses: ./.github/actions/setup-node2

      # Toolchain BEFORE rust-cache so the cache key uses the correct Rust
      # version. nix arm: the CI shell carries the wasm32 target and
      # wasm-pack. node + pnpm stay on setup-node2 above on both arms.
      - name: "Set up toolchains"
        id: toolchains
        uses: ./.github/actions/setup-ci-shell
        with:
          mise-install-args: "github:rustwasm/wasm-pack"

      - name: "Add the wasm32 target (no-nix fallback)"
        if: steps.toolchains.outputs.nix == 'false'
        run: rustup target add wasm32-unknown-unknown
        working-directory: baml_language

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          # Share cache across similar Linux WASM jobs for better hit rates
          shared-key: "linux-wasm"
          # Read-only consumer. The canary saver lives in
          # cargo-tests.reusable.yaml; see the cache strategy comment there.
          save-if: false

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch --target wasm32-unknown-unknown
        working-directory: baml_language

      - name: "Build WASM"
        run: pnpm --filter pkg-playground build:wasm
        working-directory: typescript2

      - name: "Install Playwright browsers"
        run: npx playwright install chromium
        working-directory: typescript2/app-vscode-webview

      - name: "Run browser tests"
        run: pnpm --filter app-vscode-webview test:browser:run
        working-directory: typescript2
