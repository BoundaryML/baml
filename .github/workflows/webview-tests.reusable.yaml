name: Webview Tests (Reusable)

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-webview-tests
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  typecheck:
    name: "Typecheck"
    runs-on: trunk=${{ github.run_id }}-${{ github.run_attempt }}..size=medium
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # A Trunk runner starts from a warm checkout of canary with a built
          # target/ tree. Keep the untracked build output so cargo reuses it.
          clean: false
          persist-credentials: false

      # baml_artifact's build script tracks HEAD and refs/heads/canary. The
      # checkout rewrites both, which makes cargo rebuild every crate that
      # depends on baml_artifact. Backdate the refs so the warm target/ tree
      # stays fresh, and stamp the SHA that the warm tree was built from.
      - name: "Backdate the git refs baml_artifact tracks"
        run: |
          echo "variant=$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-variant" 2>/dev/null || echo NONE)"
          basis="$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-basis-sha" 2>/dev/null || true)"
          git cat-file -e "${basis}^{commit}" 2>/dev/null || basis=""
          p=("$(git rev-parse --git-path HEAD)")
          if r="$(git symbolic-ref -q HEAD)"; then p+=("$(git rev-parse --git-path "${r}")"); fi
          if ! git show-ref --verify --quiet refs/heads/canary; then
            b="${basis:-$(git rev-parse HEAD)}"
            git update-ref refs/heads/canary "${b}"
            echo "recreated refs/heads/canary at ${b}"
          fi
          p+=("$(git rev-parse --git-path refs/heads/canary)")
          touch -t 197001010000 "${p[@]}"
          ls -l --time-style=+%Y-%m-%d\ %H:%M "${p[@]}"
          if [ -n "${basis}" ]; then
            echo "BAML_GIT_SHA=${basis}" >> "$GITHUB_ENV"
            echo "stamping BAML_GIT_SHA=${basis}"
          else
            echo "no warm template; build.rs reads HEAD, which matches a cold tree"
          fi

      - name: "Setup Node.js for typescript2"
        uses: ./.github/actions/setup-node2

      # Install Rust toolchain BEFORE rust-cache so cache key uses correct Rust version
      - name: "Install Rust toolchain"
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
        working-directory: baml_language

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch --target wasm32-unknown-unknown
        working-directory: baml_language

      # node + pnpm come from setup-node2 above; we only need mise for
      # wasm-pack here.
      - name: "Install mise"
        uses: ./.github/actions/setup-mise
        with:
          cache: "false"
          install_args: "github:rustwasm/wasm-pack"

      # Path-mapped imports from app-vscode-webview resolve into pkg-playground/wasm
      # and pkg-proto/src/generated, so both must be present before tsc runs.
      - name: "Build WASM"
        run: pnpm --filter pkg-playground build:wasm
        working-directory: typescript2

      - name: "Generate proto types"
        run: pnpm --filter @b/pkg-proto generate
        working-directory: typescript2

      - name: "Typecheck pkg-proto"
        run: pnpm --filter @b/pkg-proto typecheck
        working-directory: typescript2

      - name: "Typecheck app-vscode-webview"
        run: pnpm --filter app-vscode-webview typecheck
        working-directory: typescript2

  unit-tests:
    name: "Unit Tests (jsdom)"
    runs-on: trunk=${{ github.run_id }}-${{ github.run_attempt }}..size=medium
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # A Trunk runner starts from a warm checkout of canary with a built
          # target/ tree. Keep the untracked build output so cargo reuses it.
          clean: false
          persist-credentials: false

      # baml_artifact's build script tracks HEAD and refs/heads/canary. The
      # checkout rewrites both, which makes cargo rebuild every crate that
      # depends on baml_artifact. Backdate the refs so the warm target/ tree
      # stays fresh, and stamp the SHA that the warm tree was built from.
      - name: "Backdate the git refs baml_artifact tracks"
        run: |
          echo "variant=$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-variant" 2>/dev/null || echo NONE)"
          basis="$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-basis-sha" 2>/dev/null || true)"
          git cat-file -e "${basis}^{commit}" 2>/dev/null || basis=""
