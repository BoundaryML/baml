name: Webview Tests (Reusable)

on:
  workflow_call:
    secrets:
      BAML_SCCACHE_R2_ACCESS_KEY_ID:
        required: false
      BAML_SCCACHE_R2_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-webview-tests
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0

jobs:
  typecheck:
    name: "Typecheck"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      BAML_SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.BAML_SCCACHE_R2_ACCESS_KEY_ID }}
      BAML_SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BAML_SCCACHE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false

      - name: "Setup Node.js for typescript2"
        uses: ./.github/actions/setup-node2

      # Select the pinned Rust toolchain before configuring compilation caching.
      - name: "Install Rust toolchain"
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
        working-directory: baml_language

      - uses: ./.github/actions/setup-sccache

      - name: "Fetch cargo dependencies"
        run: cargo fetch --target wasm32-unknown-unknown
        working-directory: baml_language

      # node + pnpm come from setup-node2 above; we only need mise for
      # wasm-pack here.
      - name: "Install mise"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "github:rustwasm/wasm-pack"

      # Path-mapped imports from app-vscode-webview resolve into pkg-playground/wasm
      # and pkg-proto/src/generated, so both must be present before tsc runs.
      - name: "Build WASM"
        run: pnpm --filter pkg-playground build:wasm
        working-directory: typescript2

      - name: "Generate proto types"
        run: pnpm --filter @b/pkg-proto generate
        working-directory: typescript2

      - name: "Typecheck pkg-proto"
        run: pnpm --filter @b/pkg-proto typecheck
        working-directory: typescript2

      - name: "Typecheck app-vscode-webview"
        run: pnpm --filter app-vscode-webview typecheck
        working-directory: typescript2

  unit-tests:
    name: "Unit Tests (jsdom)"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      BAML_SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.BAML_SCCACHE_R2_ACCESS_KEY_ID }}
      BAML_SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BAML_SCCACHE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false

      - name: "Setup Node.js for typescript2"
        uses: ./.github/actions/setup-node2

      # Select the pinned Rust toolchain before configuring compilation caching.
      - name: "Install Rust toolchain"
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
        working-directory: baml_language

      - uses: ./.github/actions/setup-sccache

      - name: "Fetch cargo dependencies"
        run: cargo fetch --target wasm32-unknown-unknown
        working-directory: baml_language

      # node + pnpm come from setup-node2 above; we only need mise for
      # wasm-pack here.
      - name: "Install mise"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "github:rustwasm/wasm-pack"

      - name: "Build WASM"
        run: pnpm --filter pkg-playground build:wasm
        working-directory: typescript2

      - name: "Run unit tests"
        run: pnpm --filter app-vscode-webview test:unit:run
        working-directory: typescript2

  browser-tests:
    name: "Browser Tests (Playwright)"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      BAML_SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.BAML_SCCACHE_R2_ACCESS_KEY_ID }}
      BAML_SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BAML_SCCACHE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false

      - name: "Setup Node.js for typescript2"
        uses: ./.github/actions/setup-node2

      # Select the pinned Rust toolchain before configuring compilation caching.
      - name: "Install Rust toolchain"
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
        working-directory: baml_language

      - uses: ./.github/actions/setup-sccache

      - name: "Fetch cargo dependencies"
        run: cargo fetch --target wasm32-unknown-unknown
        working-directory: baml_language

      # node + pnpm come from setup-node2 above; we only need mise for
      # wasm-pack here.
      - name: "Install mise"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "github:rustwasm/wasm-pack"

      - name: "Build WASM"
        run: pnpm --filter pkg-playground build:wasm
        working-directory: typescript2

      - name: "Install Playwright browsers"
        run: npx playwright install chromium
        working-directory: typescript2/app-vscode-webview

      - name: "Run browser tests"
        run: pnpm --filter app-vscode-webview test:browser:run
        working-directory: typescript2
