name: Webview Tests (Reusable)

on:
  workflow_call:
    inputs:
      code_changed:
        required: true
        type: string
      run_all:
        required: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-webview-tests
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    name: "Unit Tests (jsdom)"
    runs-on: ubuntu-latest
    if: ${{ inputs.code_changed == 'true' || inputs.run_all }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: typescript2/pnpm-lock.yaml

      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile
        working-directory: typescript2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"

      - name: "Install Rust toolchain"
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
        working-directory: baml_language

      - name: "Install wasm-pack"
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: "Build WASM"
        run: pnpm --filter pkg-playground build:wasm
        working-directory: typescript2

      - name: "Run unit tests"
        run: pnpm --filter app-vscode-webview test:unit:run
        working-directory: typescript2

  browser-tests:
    name: "Browser Tests (Playwright)"
    runs-on: ubuntu-latest
    if: ${{ inputs.code_changed == 'true' || inputs.run_all }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: typescript2/pnpm-lock.yaml

      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile
        working-directory: typescript2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"

      - name: "Install Rust toolchain"
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
        working-directory: baml_language

      - name: "Install wasm-pack"
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: "Build WASM"
        run: pnpm --filter pkg-playground build:wasm
        working-directory: typescript2

      - name: "Install Playwright browsers"
        run: npx playwright install chromium
        working-directory: typescript2/app-vscode-webview

      - name: "Run browser tests"
        run: pnpm --filter app-vscode-webview test:browser:run
        working-directory: typescript2
