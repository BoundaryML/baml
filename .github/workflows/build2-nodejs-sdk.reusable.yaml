name: BAML SDK Release - Build Node.js

# Per-platform NAPI prebuild matrix for the Node.js SDK runtime package
# `@boundaryml/baml-bridge`. Mirrors `build2-python-sdk.reusable.yaml` (same
# 8-target set), with `napi-rs` standing in for `maturin`. Each job builds one
# `*.node` native addon, assembles it into its publishable per-platform sub-package
# (`@boundaryml/baml-bridge-<platform>`), and uploads that as `nodejs-sdk-<target>`.
# A fan-in job wires the umbrella metadata, packs all final tarballs, and a
# native matrix installs and smoke-tests those exact tarballs before publishing.
# Release builds must pass the frozen BAML language release plan so package.json
# and Rust version surfaces are stamped before any build reads them.

on:
  workflow_call:
    inputs:
      release_plan_json:
        description: "Frozen BAML language release-plan.json content"
        type: string
        required: true
      source_sha:
        description: "Exact repository commit to build"
        type: string
        required: true

concurrency:
  # suffix is important to prevent a concurrency deadlock with the calling workflow
  group: ${{ github.workflow }}-${{ github.ref }}-build-nodejs-sdk
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  platforms:
    name: Load release platforms
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      verify_matrix: ${{ steps.matrix.outputs.verify_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Validate and export platform matrices
        id: matrix
        run: |
          set -euo pipefail
          scripts/baml-release-platforms check
          echo "build_matrix=$(scripts/baml-release-platforms matrix node_build)" >> "$GITHUB_OUTPUT"
          echo "verify_matrix=$(scripts/baml-release-platforms matrix node_verify)" >> "$GITHUB_OUTPUT"

  build:
    needs: [platforms]
    strategy:
      fail-fast: false
      matrix:
        _: ${{ fromJSON(needs.platforms.outputs.build_matrix) }}

    name: ${{ matrix._.target }}
    runs-on: ${{ matrix._.host }}
    container: ${{ matrix._.container }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Stamp release plan
        env:
          RELEASE_PLAN_JSON: ${{ inputs.release_plan_json }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_PLAN_JSON" > release-plan.json
          scripts/baml-language-version stamp --plan release-plan.json

      - name: Check GLIBC version
        if: contains(matrix._.target, 'linux') && !contains(matrix._.target, 'musl')
        run: ldd --version

      - name: Align HOME with container root
        if: matrix._.container
        # The manylinux container runs as root (euid home /root), but GitHub sets
        # HOME=/github/home. mise/npm/rustup install under HOME yet npm resolves
        # against the euid home, so binaries land where PATH can't see them. Point
        # HOME at the real root home before any tool setup runs.
        run: echo "HOME=/root" >> "$GITHUB_ENV"

      - name: Setup tools (sccache, direnv, node, pnpm)
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv node npm:pnpm"

      - name: Set up Node.js (container)
        if: matrix._.container
        # The manylinux container has no system node/npm and mise doesn't expose
        # npm on PATH here, but pnpm/action-setup shells out to npm. Provide a real
        # node/npm first (this is what the setup-node composite did in the original
        # all-green run).
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm (container)
        if: matrix._.container
        # mise's npm backend doesn't expose pnpm inside the manylinux container
        # (it works on every hosted runner); install it with the official action.
        # No version here: the action reads packageManager from package.json (as
        # the setup-node composite did), avoiding a hardcoded/conflicting version.
        uses: pnpm/action-setup@v6

      - name: Setup Rust toolchain
        working-directory: baml_language
        run: |
          set -euo pipefail
          # Hosted runners ship rustup, but the manylinux cross container does not,
          # so bootstrap it there (setup-rust used to handle this case).
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # rust-toolchain.toml pins the channel; install it and add this job's
          # cross target (setup-rust used to do this via its `targets:` input).
          rustup show
          rustup target add ${{ matrix._.target }}

      - name: Build tools setup
        if: matrix._.before
        run: ${{ matrix._.before }}

      - name: Install dependencies
        working-directory: baml_language/sdks/nodejs/bridge_nodejs
        run: pnpm install --ignore-scripts

      - name: Build protobuf runtime
        working-directory: baml_language/sdks/nodejs/bridge_nodejs
        run: pnpm build:proto

      - name: Build native addon (${{ matrix._.target }})
        working-directory: baml_language/sdks/nodejs/bridge_nodejs
        # Build through the package.json script so CI and local dev share one napi
        # invocation (writes ./dist/native.js + ./dist/native.d.ts with --esm, which
        # the published umbrella's `files: ["dist"]` ships). build:clean recreates
        # dist/ first since clean-dist.js owns its creation; the appended
        # --target/--use-napi-cross flow through to `napi build` because it is the
        # final command in build:napi-release.
        run: |
          pnpm build:clean
          pnpm build:napi-release --target ${{ matrix._.target }} ${{ matrix._.napi_args }}

      - name: Assemble per-platform npm package
        working-directory: baml_language/sdks/nodejs/bridge_nodejs
        run: |
          set -euo pipefail
          # Build the publishable per-platform sub-package here, in the same job
          # that compiled the addon: create-npm-dirs stamps every npm/<platform>/
          # package.json from the (already stamped) umbrella version, and artifacts
          # drops this job's baml_node.<platform>.node into its matching dir. The
          # package.json version and the binary it wraps are therefore produced
          # atomically. The umbrella package (dist/ + optionalDependencies) is
          # assembled centrally by the publish-npm job, which downloads these.
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts --output-dir . --npm-dir npm
          # create-npm-dirs lays down all 8 target dirs; keep only the one that
          # received this job's addon so each artifact is exactly one sub-package.
          keep_dir="$(dirname "$(find npm -name 'baml_node.*.node' | head -1)")"
          test -n "$keep_dir"
          find npm -mindepth 1 -maxdepth 1 -type d ! -path "$keep_dir" -exec rm -rf {} +
          echo "Assembled $keep_dir:"
          ls -l "$keep_dir"

      - name: Upload per-platform npm package
        uses: actions/upload-artifact@v7
        with:
          # Each artifact contains a single npm/<platform>/ tree (package.json +
          # *.node); the publish job downloads them all with merge-multiple to
          # reconstruct the full npm/ directory.
          name: nodejs-sdk-${{ matrix._.target }}
          path: baml_language/sdks/nodejs/bridge_nodejs/npm
          if-no-files-found: error

      # The umbrella package ships `files: ["dist"]`, and that dist/ is
      # platform-agnostic: the napi loader (dist/native.js, already built above by
      # build:napi-release) plus the tsc output. Build it exactly once, on the
      # linux-gnu job, and hand it to the publish job; the per-target .node binaries
      # ship in the sub-packages, so strip any that copy-native-dts pulled into dist/
      # to keep the umbrella platform-independent. (If this target is ever dropped
      # from the matrix, move these two steps to another non-cross target.)
      - name: Build umbrella dist (platform-agnostic)
        if: matrix._.build_umbrella
        working-directory: baml_language/sdks/nodejs/bridge_nodejs
        run: |
          set -euo pipefail
          pnpm build:copy-native-dts
          pnpm build:ts_build
          pnpm build:copy-proto
          pnpm build:tag-generated-files
          rm -f dist/*.node
          echo "Assembled umbrella dist/:"
          ls -l dist
      - name: Upload umbrella dist
        if: matrix._.build_umbrella
        uses: actions/upload-artifact@v7
        with:
          # Named so it does NOT match the publish job's `nodejs-sdk-*` download
          # pattern (that one is merged into npm/); this is downloaded separately
          # into the umbrella's dist/.
          name: nodejs-umbrella-dist
          path: baml_language/sdks/nodejs/bridge_nodejs/dist
          if-no-files-found: error

  assemble:
    name: Assemble verified npm package set
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: nodejs-sdk-*
          path: baml_language/sdks/nodejs/bridge_nodejs/npm
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: nodejs-umbrella-dist
          path: baml_language/sdks/nodejs/bridge_nodejs/dist
      - uses: ./.github/actions/setup-node
        with:
          node-action-version: v6
          node-version: 22
          install-dependencies: false
      - name: Stamp and assemble final package metadata
        env:
          RELEASE_PLAN_JSON: ${{ inputs.release_plan_json }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_PLAN_JSON" > release-plan.json
          scripts/baml-language-version stamp --plan release-plan.json
          cd baml_language/sdks/nodejs/bridge_nodejs
          pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts
          pnpm exec napi pre-publish -t npm --no-gh-release --skip-optional-publish
      - name: Validate package layout and pack exact publish artifacts
        working-directory: baml_language/sdks/nodejs/bridge_nodejs
        run: |
          set -euo pipefail
          version="$(jq -r .canonical_version ../../../../release-plan.json)"
          mapfile -t expected_leaves < <(jq -r '.platforms[].npm_package' ../../../../release/platforms.json | sort)
          mapfile -t actual_leaves < <(find npm -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          if [[ "${expected_leaves[*]}" != "${actual_leaves[*]}" ]]; then
            printf 'expected leaves: %s\nactual leaves: %s\n' "${expected_leaves[*]}" "${actual_leaves[*]}" >&2
            exit 1
          fi
          mkdir -p verified-npm
          : > verified-npm/package-records.jsonl
          for dir in npm/*/; do
            test "$(find "$dir" -maxdepth 1 -type f -name '*.node' | wc -l | tr -d ' ')" = 1
            test "$(find "$dir" -maxdepth 1 -type f ! -name '*.node' ! -name package.json ! -name README.md | wc -l | tr -d ' ')" = 0
            npm pack "$dir" --pack-destination verified-npm --json | jq -c '.[0] | {name,version,filename,size,unpackedSize,integrity}' >> verified-npm/package-records.jsonl
          done
          npm pack . --pack-destination verified-npm --json | jq -c '.[0] | {name,version,filename,size,unpackedSize,integrity}' >> verified-npm/package-records.jsonl
          jq -s 'sort_by(.name)' verified-npm/package-records.jsonl > verified-npm/packages.json
          rm verified-npm/package-records.jsonl
          ../../../../scripts/baml-release-platforms check-node-packages verified-npm/packages.json --version "$version"
          umbrella_filename="$(jq -r '.[] | select(.name == "@boundaryml/baml-bridge") | .filename' verified-npm/packages.json)"
          ../../../../scripts/baml-release-platforms check-node-umbrella "verified-npm/$umbrella_filename" --version "$version"
          pnpm exec attw "verified-npm/$umbrella_filename" --profile esm-only
          (cd verified-npm && for file in *.tgz; do sha256sum "$file"; done > SHA256SUMS)
          jq -r '.[] | [.name, .version, .size, .unpackedSize, .integrity] | @tsv' verified-npm/packages.json
      - uses: actions/upload-artifact@v7
        with:
          name: nodejs-verified-packages
          path: baml_language/sdks/nodejs/bridge_nodejs/verified-npm
          if-no-files-found: error

  verify:
    name: Verify npm package / ${{ matrix._.target }}
    needs: [platforms, assemble]
    strategy:
      fail-fast: false
      matrix:
        _: ${{ fromJSON(needs.platforms.outputs.verify_matrix) }}
    runs-on: ${{ matrix._.host }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nodejs-verified-packages
          path: verified-npm
      - uses: actions/setup-node@v6
        if: ${{ !matrix._.docker_image }}
        with:
          node-version: 22
      - name: Verify checksums and package identity
        env:
          RELEASE_PLAN_JSON: ${{ inputs.release_plan_json }}
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            (cd verified-npm && sha256sum -c SHA256SUMS)
          else
            (cd verified-npm && shasum -a 256 --check SHA256SUMS)
          fi
          version="$(printf '%s\n' "$RELEASE_PLAN_JSON" | jq -r .canonical_version)"
          jq -e --arg version "$version" 'length == 9 and all(.version == $version)' verified-npm/packages.json >/dev/null
          test "$(jq -r --arg name '@boundaryml/baml-bridge-${{ matrix._.npm_package }}' '.[] | select(.name == $name) | .filename' verified-npm/packages.json | wc -l | tr -d ' ')" = 1
      - name: Install and smoke-test exact tarballs
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_ENGINE_STRICT: "true"
          NPM_CONFIG_FUND: "false"
        run: |
          set -euo pipefail
          umbrella="$(find verified-npm -maxdepth 1 -name 'boundaryml-baml-bridge-[0-9]*.tgz' -print -quit)"
          leaf="$(jq -r --arg name '@boundaryml/baml-bridge-${{ matrix._.npm_package }}' '.[] | select(.name == $name) | .filename' verified-npm/packages.json)"
          version="$(jq -r '.[] | select(.name == "@boundaryml/baml-bridge") | .version' verified-npm/packages.json)"
          cold_import_max_ms="$(jq -r .node_budgets.cold_import_max_ms release/platforms.json)"
          version_calls_max_ms="$(jq -r .node_budgets.version_calls_10000_max_ms release/platforms.json)"
          mkdir consumer-smoke
          cp scripts/verify-node-release-package.mjs consumer-smoke/
          if [[ -n '${{ matrix._.docker_image }}' ]]; then
            cp "$umbrella" "verified-npm/$leaf" consumer-smoke/
            docker run --rm -v "$PWD/consumer-smoke:/app" -w /app \
              --env EXPECTED_VERSION="$version" \
              --env COLD_IMPORT_MAX_MS="$cold_import_max_ms" \
              --env VERSION_CALLS_MAX_MS="$version_calls_max_ms" \
              --env NPM_CONFIG_ENGINE_STRICT=true \
              '${{ matrix._.docker_image }}' sh -eu -c '
              npm init -y >/dev/null
              npm install --ignore-scripts ./*.tgz >/dev/null
              node verify-node-release-package.mjs
            '
          else
            cd consumer-smoke
            npm init -y >/dev/null
            npm install --ignore-scripts "../$umbrella" "../verified-npm/$leaf" >/dev/null
            EXPECTED_VERSION="$version" \
              COLD_IMPORT_MAX_MS="$cold_import_max_ms" \
              VERSION_CALLS_MAX_MS="$version_calls_max_ms" \
              node verify-node-release-package.mjs
          fi
