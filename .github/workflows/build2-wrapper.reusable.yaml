name: BAML Release - Build wrapper

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Exact repository commit to build"
        type: string
        required: true
      wrapper_version:
        description: "Wrapper version used in archive names"
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  BAML_AUTH_CLIENT_ID: ${{ vars.BAML_WORKOS_CLIENT_ID }}

jobs:
  matrix:
    name: Compute wrapper matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Generate wrapper matrix from the platform contract
        id: gen
        run: |
          set -euo pipefail
          include="$(scripts/baml-release-platforms wrapper-matrix)"
          echo "include=$include" >> "$GITHUB_OUTPUT"
          jq . <<<"$include"

  build:
    name: Build wrapper (${{ matrix.target }})
    needs: matrix
    runs-on: ${{ matrix.os }}
    env:
      CARGO: cargo
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          workspace: baml_language
          prefix-key: v5-rust-baml-wrapper-${{ matrix.target }}
          cache-on-failure: true
          enable-cross: false
          skip-protoc: true
      - name: Setup musl cross toolchain
        if: ${{ matrix.libc == 'musl' }}
        uses: ./.github/actions/setup-musl-cross
        with:
          target: ${{ matrix.target }}
      - name: Setup cross for backward-compatible GNU wrapper
        if: ${{ matrix.libc == 'gnu' }}
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache cargo:cross"
      - name: Configure cross for GNU wrapper
        if: ${{ matrix.libc == 'gnu' }}
        env:
          CROSS_IMAGE: ${{ matrix.cross_image }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # CROSS_CONFIG makes the plan's image control linking; the image's
          # host ldd does not determine the wrapper's compatibility floor.
          cross_config="$RUNNER_TEMP/baml-wrapper-cross.toml"
          passthrough='"BAML_GIT_SHA", "BAML_AUTH_CLIENT_ID"'
          if [[ "$TARGET" == "x86_64-unknown-linux-gnu" ]]; then
            # The glibc-2.17 image's target GCC is 4.8 and cannot compile
            # mimalloc v3's warning flags. Its host GCC is current; point that
            # compiler at the image's 2.17 sysroot so C dependencies retain the
            # same compatibility floor as the Rust linker. Cross sets TARGET_CC
            # and TARGET_CXX to the old compilers, and native build scripts give
            # those variables precedence over the target-specific overrides.
            passthrough+=', "TARGET_CC=gcc", "TARGET_CXX=g++"'
            passthrough+=', "CC_x86_64_unknown_linux_gnu=gcc"'
            passthrough+=', "CXX_x86_64_unknown_linux_gnu=g++"'
            passthrough+=', "CFLAGS_x86_64_unknown_linux_gnu=--sysroot=/usr/x86_64-unknown-linux-gnu/x86_64-unknown-linux-gnu/sysroot"'
            passthrough+=', "CXXFLAGS_x86_64_unknown_linux_gnu=--sysroot=/usr/x86_64-unknown-linux-gnu/x86_64-unknown-linux-gnu/sysroot"'
          fi
          printf '[target.%s]\nimage = "%s"\n[target.%s.env]\npassthrough = [%s]\n' \
            "$TARGET" "$CROSS_IMAGE" "$TARGET" "$passthrough" > "$cross_config"
          {
            echo 'CARGO=cross'
            echo "CROSS_CONFIG=$cross_config"
          } >> "$GITHUB_ENV"
      - name: Build native pack compiler
        run: cargo build --manifest-path baml_language/Cargo.toml --release --bin baml-cli
      - name: Build pack host
        env:
          TARGET: ${{ matrix.target }}
        run: ${CARGO} build --manifest-path baml_language/Cargo.toml --release --bin baml-pack-host --target "$TARGET"
      - name: Prepare wrapper project
        env:
          WRAPPER_VERSION: ${{ inputs.wrapper_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baml-wrapper-project"
          cp baml_language/crates/baml/baml_src/*.baml "$RUNNER_TEMP/baml-wrapper-project/"
          cp baml_language/crates/baml/baml_src/baml.toml "$RUNNER_TEMP/baml-wrapper-project/"
          printf 'function WrapperVersion() -> string throws never { "%s" }\n' "$WRAPPER_VERSION" \
            > "$RUNNER_TEMP/baml-wrapper-project/version.baml"
      - name: Pack wrapper
        env:
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p staging/bin
          "baml_language/target/release/baml-cli$EXECUTABLE_SUFFIX" pack Main \
            --project "$RUNNER_TEMP/baml-wrapper-project" \
            --host "baml_language/target/$TARGET/release/baml-pack-host$EXECUTABLE_SUFFIX" \
            --target "$TARGET" --output "staging/bin/baml$EXECUTABLE_SUFFIX"
      - name: Pack no-self-update wrapper
        if: ${{ matrix.no_self_update }}
        env:
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p staging-no-self-update/bin
          "baml_language/target/release/baml-cli$EXECUTABLE_SUFFIX" pack NoSelfUpdateMain \
            --project "$RUNNER_TEMP/baml-wrapper-project" \
            --host "baml_language/target/$TARGET/release/baml-pack-host$EXECUTABLE_SUFFIX" \
            --target "$TARGET" --output "staging-no-self-update/bin/baml$EXECUTABLE_SUFFIX"
      - name: Archive wrapper
        env:
          ARCHIVE_SUFFIX: ${{ matrix.archive_suffix }}
          NO_SELF_UPDATE: ${{ matrix.no_self_update }}
          TARGET: ${{ matrix.target }}
          WRAPPER_VERSION: ${{ inputs.wrapper_version }}
        run: |
          set -euo pipefail
          archive() {
            local staging="$1"
            local product="$2"
            local destination="$product-$WRAPPER_VERSION-$TARGET$ARCHIVE_SUFFIX"
            case "$ARCHIVE_SUFFIX" in
              .zip) (cd "$staging" && 7z a "../$destination" .) ;;
              .tar.gz) tar -C "$staging" -czf "$destination" . ;;
              *) echo "unsupported archive suffix: $ARCHIVE_SUFFIX" >&2; exit 1 ;;
            esac
          }
          archive staging baml-wrapper
          if [[ "$NO_SELF_UPDATE" == "true" ]]; then
            archive staging-no-self-update baml-wrapper-no-self-update
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: wrapper-${{ matrix.target }}
          path: |
            baml-wrapper-${{ inputs.wrapper_version }}-${{ matrix.target }}.*
            baml-wrapper-no-self-update-${{ inputs.wrapper_version }}-${{ matrix.target }}.*
