name: Publish Python PyPI

# Focused PyPI publisher for Python `baml_core`. The BAML language release
# graph owns version planning/stamping and calls this path after its build gate.
# Before production publishing with this renamed workflow, update or validate
# PyPI's trusted-publisher binding for project `baml-core`.

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish to PyPI after building"
        type: boolean
        default: false
        required: false
      release_plan_json:
        description: "Frozen BAML language release-plan.json content"
        type: string
        default: ""
        required: false
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI after building (false = build-only rehearsal)"
        type: boolean
        default: false
        required: false

concurrency:
  group: publish-python-pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Version comes from the stamped checkout prepared by the release graph.
  build-python-sdk:
    uses: ./.github/workflows/build-python-sdk.reusable.yaml
    with:
      release_plan_json: ${{ inputs.release_plan_json }}

  all-builds:
    name: Assert all builds passed
    runs-on: ubuntu-latest
    needs:
      - build-python-sdk
    steps:
      - run: echo "::do-nothing::" >/dev/null

  publish-to-pypi:
    needs: [all-builds]
    if: ${{ inputs.publish }}
    # Must use GitHub-hosted runner due to permissions issues with GitHub OIDC trusted publishing
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-sdk-*
          path: dist
          merge-multiple: true
      - name: Verify wheel count
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -print
          wheel_count=$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')
          if [ "$wheel_count" -lt 8 ]; then
            echo "::error::Expected at least 8 wheels, found $wheel_count"
            exit 1
          fi
          echo "Found $wheel_count wheels"
      - name: Publish package to PyPI
        # OIDC trusted publisher binding configured at
        # https://pypi.org/manage/project/baml-core/settings/publishing/
        # — workflow filename and environment must match this file.
        # No password / token in the repo.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
