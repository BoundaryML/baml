name: Trunk Kiln shadow

on:
  pull_request:
  push:
    branches: ["canary"]
  workflow_dispatch:

concurrency:
  group: kiln-shadow-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:

  determine_changes:
    name: "KILN: Determine changes"
    runs-on: trunk-kiln=${{ github.run_id }}-${{ github.run_attempt }}..size=medium
    continue-on-error: true
    outputs:
      # Flag that is raised when any code in baml_language is changed
      code: ${{ steps.check_code.outputs.changed }}
      # Flag for lexer changes
      lexer: ${{ steps.check_lexer.outputs.changed }}
      # Flag for parser changes
      parser: ${{ steps.check_parser.outputs.changed }}
      # Flag for HIR changes
      hir: ${{ steps.check_hir.outputs.changed }}
      # Flag for THIR changes
      thir: ${{ steps.check_thir.outputs.changed }}
      # Flag for codegen changes
      codegen: ${{ steps.check_codegen.outputs.changed }}
      # Docs example changes need the CLI, but not the full platform/SDK matrix.
      documentation_snippets: ${{ steps.check_documentation_snippets.outputs.changed }}
      # Flag for docs/frontend changes
      docs: ${{ steps.check_docs.outputs.changed }}
      # Flag for typescript2/webview changes
      webview: ${{ steps.check_webview.outputs.changed }}
      # Flag for typescript2 grammar changes
      grammar: ${{ steps.check_grammar.outputs.changed }}
      # Flag for unsafe code changes (bex_heap) - triggers Miri tests
      unsafe: ${{ steps.check_unsafe.outputs.changed }}
      # Flag for proto codegen changes - triggers generated file sync check
      proto: ${{ steps.check_proto.outputs.changed }}
      # Flag for inputs that can change the shipping bridge_cffi binaries
      bridge_cffi_release: ${{ steps.check_bridge_cffi_release.outputs.changed }}
      # Flag for SDK test changes - triggers the SDK parity analysis pipeline
      sdk_tests: ${{ steps.check_sdk_tests.outputs.changed }}
      # Flag that is raised when perf benchmarks (CodSpeed) should run: always
      # after merge (push to main/canary) and on manual dispatch; on PRs only
      # when the PR title/body or a commit message opts in.
      run_perf: ${{ steps.check_perf.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
          fetch-depth: 0
          persist-credentials: false
      - name: "Backdate the git refs baml_artifact tracks"
        run: |
          echo "variant=$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-variant" 2>/dev/null || echo NONE)"
          basis="$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-basis-sha" 2>/dev/null || true)"
          git cat-file -e "${basis}^{commit}" 2>/dev/null || basis=""
          p=("$(git rev-parse --git-path HEAD)")
          if r="$(git symbolic-ref -q HEAD)"; then p+=("$(git rev-parse --git-path "${r}")"); fi
          if ! git show-ref --verify --quiet refs/heads/canary; then
            b="${basis:-$(git rev-parse HEAD)}"
            git update-ref refs/heads/canary "${b}"
            echo "recreated refs/heads/canary at ${b}"
          fi
          p+=("$(git rev-parse --git-path refs/heads/canary)")
          touch -t 197001010000 "${p[@]}"
          ls -l --time-style=+%Y-%m-%d\ %H:%M "${p[@]}"
          if [ -n "${basis}" ]; then
            echo "BAML_GIT_SHA=${basis}" >> "$GITHUB_ENV"
            echo "stamping BAML_GIT_SHA=${basis}"
          else
            echo "no warm template; build.rs reads HEAD, which matches a cold tree"
          fi

      - name: Determine merge base
        id: merge_base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'canary' }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          sha=${MERGE_GROUP_BASE_SHA:-$(git merge-base HEAD "origin/${BASE_REF}")}
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Check if code changed
        id: check_code
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
        run: |
          if git diff --quiet "${MERGE_BASE}...HEAD" -- \
            ':baml_language/**' \
            ':typescript2/app-promptfiddle/src/playground/default.baml' \
            ':scripts/baml-language-version' \
            ':scripts/baml-wrapper-version' \
            ':scripts/baml-release-manifests' \
            ':scripts/baml-package-manager-artifacts' \
            ':scripts/baml-release-platforms' \
            ':scripts/baml_release_platforms.py' \
            ':tools/baml_nightly_select.py' \
            ':scripts/baml-bridge-cffi-hygiene' \
            ':scripts/tests/**' \
            ':release/platforms.json' \
            ':scripts/install.sh' \
            ':scripts/install.ps1' \
            ':packaging/aur/**' \
            ':tools/pkg_boundaryml_com/**' \
            ':.github/workflows/ci.yaml' \
            ':.github/workflows/release-baml-language.yml' \
            ':.github/workflows/nightly-release.yml' \
            ':.github/workflows/build2-bridge-cffi.reusable.yaml' \
            ':.github/workflows/build2-python-sdk.reusable.yaml' \
            ':.github/workflows/build2-nodejs-sdk.reusable.yaml' \
            ':.github/workflows/build2-web-sdk.reusable.yaml' \
            ':.github/workflows/publish2-nodejs-sdk.yaml' \
            ':.github/workflows/publish2-web-sdk.yaml' \
            ':.github/workflows/cargo-tests.reusable.yaml' \
            ':.github/workflows/compiler-tests.reusable.yaml' \
            ':.github/workflows/size-gate.reusable.yaml' \
            ':.github/workflows/wasm-pack-tests.reusable.yaml' \
          ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if lexer code changed
        id: check_lexer
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
        run: |
          if git diff --quiet "${MERGE_BASE}...HEAD" -- \
            ':baml_language/crates/baml_compiler_lexer/**' \
            ':baml_language/crates/baml_base/**' \
            ':baml_language/Cargo.toml' \
            ':baml_language/Cargo.lock' \
          ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if parser code changed
        id: check_parser
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
        run: |
          if git diff --quiet "${MERGE_BASE}...HEAD" -- \
            ':baml_language/crates/baml_compiler_parser/**' \
            ':baml_language/crates/baml_compiler_syntax/**' \
            ':baml_language/crates/baml_compiler_lexer/**' \
            ':baml_language/crates/baml_base/**' \
          ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if HIR code changed
        id: check_hir
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
        run: |
          if git diff --quiet "${MERGE_BASE}...HEAD" -- \
            ':baml_language/crates/baml_compiler_hir/**' \
            ':baml_language/crates/baml_compiler_parser/**' \
            ':baml_language/crates/baml_base/**' \
          ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if THIR code changed
        id: check_thir
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
        run: |
          if git diff --quiet "${MERGE_BASE}...HEAD" -- \
            ':baml_language/crates/baml_thir/**' \
            ':baml_language/crates/baml_compiler_hir/**' \
            ':baml_language/crates/baml_base/**' \
          ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if codegen code changed
        id: check_codegen
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
        run: |
          if git diff --quiet "${MERGE_BASE}...HEAD" -- \
            ':baml_language/crates/baml_compiler_emit/**' \
            ':baml_language/crates/baml_thir/**' \
            ':baml_language/crates/baml_base/**' \
          ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if documentation examples changed
        id: check_documentation_snippets
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Content includes expected inferred signatures in MDX, as well as
          # canonical code. CSS/components do not require a Rust build.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || ! git diff --quiet "${MERGE_BASE}...HEAD" -- \
            ':typescript2/app-developer-docs/content/**' \
            ':typescript2/app-developer-docs/lib/snippets/**' \
            ':typescript2/app-developer-docs/scripts/validate-snippets.ts' \
            ':typescript2/app-developer-docs/scripts/validate-book-behavior.ts' \
            ':typescript2/app-developer-docs/scripts/operator-arguments.ts' \
            ':typescript2/app-developer-docs/package.json' \
            ':typescript2/package.json' \
            ':typescript2/pnpm-lock.yaml' \
            ':typescript2/pnpm-workspace.yaml' \
            ':.envrc' \
            ':mise.toml' \
            ':tools/baml-sccache' \
            ':.github/actions/setup-mise/**' \
            ':.github/actions/setup-node2/**' \
          ; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if docs changed
        id: check_docs
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
        run: |
          if git diff --quiet "${MERGE_BASE}...HEAD" -- \
            ':fern/**' \
            ':.github/workflows/docs.reusable.yaml' \
          ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if webview changed
        id: check_webview
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
        run: |
          if git diff --quiet "${MERGE_BASE}...HEAD" -- \
            ':typescript2/app-vscode-webview/**' \
            ':typescript2/pkg-playground/**' \
            ':typescript2/pkg-proto/**' \
            ':baml_language/crates/bridge_ctypes/types/**' \
            ':baml_language/crates/bridge_wasm/**' \
            ':.github/workflows/webview-tests.reusable.yaml' \
          ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if grammar changed
        id: check_grammar
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
        run: |
          if git diff --quiet "${MERGE_BASE}...HEAD" -- \
            ':typescript2/pkg-grammar/**' \
            ':typescript2/pkg-grammar-hljs/**' \
            ':typescript2/pkg-grammar-treesitter/**' \
            ':typescript2/pnpm-workspace.yaml' \
            ':typescript2/app-vscode-ext/syntaxes/**' \
            ':typescript2/app-vscode-ext/language-configuration.json' \
            ':typescript2/app-vscode-ext/package.json' \
            ':typescript2/pnpm-lock.yaml' \
            ':.github/actions/setup-node2/**' \
            ':.github/workflows/ci.yaml' \
          ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if unsafe code changed
        id: check_unsafe
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
        run: |
          if git diff --quiet "${MERGE_BASE}...HEAD" -- \
            ':baml_language/crates/bex_heap/**' \
          ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if proto sources changed
        id: check_proto
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
        run: |
          if git diff --quiet "${MERGE_BASE}...HEAD" -- \
            ':baml_language/crates/bridge_ctypes/**/*.proto' \
            ':baml_language/crates/bridge_cffi/include/**' \
            ':baml_language/sdks/swift/Sources/BamlBridge/Proto/**' \
            ':baml_language/sdks/swift/Sources/CBamlBridge/include/**' \
          ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if bridge_cffi release inputs changed
        id: check_bridge_cffi_release
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
        run: |
          if git diff --quiet "${MERGE_BASE}...HEAD" -- \
            ':.github/workflows/ci.yaml' \
            ':.github/workflows/build2-bridge-cffi.reusable.yaml' \
            ':.github/actions/setup-rust/**' \
            ':scripts/baml-bridge-cffi-hygiene' \
            ':scripts/tests/**' \
            ':release/platforms.json' \
            ':baml_language/Cargo.toml' \
            ':baml_language/Cargo.lock' \
            ':baml_language/Cross.toml' \
            ':baml_language/rust-toolchain.toml' \
            ':baml_language/crates/**' \
          ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if SDK tests changed
        id: check_sdk_tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          paths=(
            'baml_language/sdk_tests/**'
            'baml_language/sdks/README.md'
            'tools/sdk-parity-lint/**'
            'mise.toml'
            '.github/workflows/ci.yaml'
          )

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            elif git diff --quiet "$PUSH_BEFORE" "$PUSH_AFTER" -- "${paths[@]}"; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if git diff --quiet "${MERGE_BASE}...HEAD" -- "${paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Decide whether perf benchmarks (CodSpeed) should run for this event.
      # Policy: benchmarks run AFTER MERGE (push to main/canary) only when the
      # merge actually touched baml_language/, and on manual dispatch. On PRs
      # they are OPT-IN — they no longer run on every code change. A PR opts in
      # by mentioning one of the perf markers in its title, body, OR any of its
      # commit messages. merge_group is always skipped (the PR already had its
      # chance to run).
      - name: Check perf benchmark opt-in
        id: check_perf
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # Any of these, case-insensitive, in the PR title/body or a commit
          # message opts a PR into a perf run. Keep in sync with the instructions
          # posted by the "Perf benchmarks (PR notice)" job below.
          PATTERN='RUN_CODSPEED=1|run-perf|/perf'

          # After merge (push to canary/main): only run when the merge actually
          # touched baml_language/. NOTE: we diff the pushed range (before..after)
          # directly rather than reuse determine_changes' `code` flag — on a push
          # the merge-base of HEAD and origin/<branch> collapses to HEAD, so that
          # diff is always empty here. The push payload's before/after are the
          # real merged range.
          if [ "$EVENT_NAME" = "push" ]; then
            if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # Branch creation / unknown previous tip — nothing to diff against,
              # so run to be safe rather than silently skip.
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git diff --quiet "$PUSH_BEFORE" "$PUSH_AFTER" -- ':baml_language/**'; then
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Manual dispatch always runs.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never run in the merge queue — it already ran (or was opted out) on
          # the PR.
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # On PRs: opt in via the PR title/body or any commit message in the PR.
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -qiE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$MERGE_BASE" ] && git log --format='%B' "${MERGE_BASE}..HEAD" | grep -qiE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=false" >> "$GITHUB_OUTPUT"

  prek:
    name: "KILN: Pre-commit Checks"
    runs-on: trunk-kiln=${{ github.run_id }}-${{ github.run_attempt }}..size=xlarge
    needs: determine_changes
    if: needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary'
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@v7
        with:
          clean: false
          persist-credentials: false
      - name: "Backdate the git refs baml_artifact tracks"
        run: |
          echo "variant=$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-variant" 2>/dev/null || echo NONE)"
          basis="$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-basis-sha" 2>/dev/null || true)"
          git cat-file -e "${basis}^{commit}" 2>/dev/null || basis=""
          p=("$(git rev-parse --git-path HEAD)")
          if r="$(git symbolic-ref -q HEAD)"; then p+=("$(git rev-parse --git-path "${r}")"); fi
          if ! git show-ref --verify --quiet refs/heads/canary; then
            b="${basis:-$(git rev-parse HEAD)}"
            git update-ref refs/heads/canary "${b}"
            echo "recreated refs/heads/canary at ${b}"
          fi
          p+=("$(git rev-parse --git-path refs/heads/canary)")
          touch -t 197001010000 "${p[@]}"
          ls -l --time-style=+%Y-%m-%d\ %H:%M "${p[@]}"
          if [ -n "${basis}" ]; then
            echo "BAML_GIT_SHA=${basis}" >> "$GITHUB_ENV"
            echo "stamping BAML_GIT_SHA=${basis}"
          else
            echo "no warm template; build.rs reads HEAD, which matches a cold tree"
          fi

      # Install Rust toolchain BEFORE rust-cache so cache key uses correct Rust version
      - name: "Install Rust toolchain"
        run: |
          rustup toolchain install
          rustup toolchain install 1.97.1 --profile minimal --component rustc-dev
        working-directory: baml_language

      # prek hooks invoke cargo (from rustup), mise tasks that shell out
      # to cargo, and python scripts that begin with `#!/usr/bin/env -S
      # uv run --script` (e.g. validate-markdown). We don't
      # need go/ruby/etc here, just the prek binary, a python/uv pair
      # for hook scripts, node for the grammar check, and clang-format.
      - name: "Install mise"
        uses: ./.github/actions/setup-mise
        with:
          # Temporarily omit Hawk while its CI check is disabled.
          # install_args: "cargo:prek cargo:https://github.com/astral-sh/hawk python uv node clang-format"
          install_args: "sccache cargo:prek python uv node clang-format"

      - name: "Cache prek"
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      - name: "Run prek"
        run: |
          echo '```console' > "$GITHUB_STEP_SUMMARY"
          # Enable color output for prek and remove it for the summary
          # Use --hook-stage=manual to enable slower hooks that are skipped by default
          SKIP=no-commit-to-branch prek run --all-files --show-diff-on-failure --color always --hook-stage manual | \
            tee >(sed -E 's/\x1B\[([0-9]{1,2}(;[0-9]{1,2})*)?[mGK]//g' >> "$GITHUB_STEP_SUMMARY") >&1
          exit_code="${PIPESTATUS[0]}"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"

  release-metadata:
    name: "KILN: Release Metadata"
    runs-on: trunk-kiln=${{ github.run_id }}-${{ github.run_attempt }}..size=medium
    needs: determine_changes
    if: needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary'
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          clean: false
          fetch-depth: 0
          persist-credentials: false
      - name: "Backdate the git refs baml_artifact tracks"
        run: |
          echo "variant=$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-variant" 2>/dev/null || echo NONE)"
          basis="$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-basis-sha" 2>/dev/null || true)"
          git cat-file -e "${basis}^{commit}" 2>/dev/null || basis=""
          p=("$(git rev-parse --git-path HEAD)")
          if r="$(git symbolic-ref -q HEAD)"; then p+=("$(git rev-parse --git-path "${r}")"); fi
          if ! git show-ref --verify --quiet refs/heads/canary; then
            b="${basis:-$(git rev-parse HEAD)}"
            git update-ref refs/heads/canary "${b}"
            echo "recreated refs/heads/canary at ${b}"
          fi
          p+=("$(git rev-parse --git-path refs/heads/canary)")
          touch -t 197001010000 "${p[@]}"
          ls -l --time-style=+%Y-%m-%d\ %H:%M "${p[@]}"
          if [ -n "${basis}" ]; then
            echo "BAML_GIT_SHA=${basis}" >> "$GITHUB_ENV"
            echo "stamping BAML_GIT_SHA=${basis}"
          else
            echo "no warm template; build.rs reads HEAD, which matches a cold tree"
          fi

      - name: "Validate baml_language release metadata"
        run: scripts/baml-language-version check

      - name: "Test release contracts and workflow graph"
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: "Validate canary/nightly version computation"
        env:
          BAML_LANGUAGE_VERSION_DATE: "20260522"
        run: |
          set -euo pipefail
          canary="$(scripts/baml-language-version show)"
          test "$(scripts/baml-language-version compute --channel canary)" = "$canary"
          test "$(scripts/baml-language-version compute --channel canary --pypi)" = "$canary"

          nightly="$(scripts/baml-language-version compute --channel nightly)"
          pypi="$(scripts/baml-language-version compute --channel nightly --pypi)"
          python3 - "$canary" "$nightly" "$pypi" <<'PY'
          import re
          import sys

          canary, nightly, pypi = sys.argv[1:]
          major, minor, patch = [int(part) for part in canary.split(".")]
          base = f"{major}.{minor}.{patch + 1}"
          match = re.fullmatch(rf"{re.escape(base)}-nightly\.20260522\.([a-z])", nightly)
          if not match:
              raise SystemExit(f"unexpected nightly version: {nightly}")

          index = ord(match.group(1)) - ord("a")
          expected_pypi = f"{base}.dev20260522{index:02d}"
          if pypi != expected_pypi:
              raise SystemExit(f"unexpected nightly PyPI version: {pypi} != {expected_pypi}")
          PY

          scripts/baml-language-version plan --channel nightly --out nightly-release-plan.json
          scripts/baml-language-version stamp --plan nightly-release-plan.json
          nuget="$(jq -r .registry_versions.nuget nightly-release-plan.json)"
          maven="$(jq -r .registry_versions.maven nightly-release-plan.json)"
          gradle_plugin="$(jq -r \
            .registry_versions.gradle_plugin nightly-release-plan.json)"
          swiftpm="$(jq -r .registry_versions.swiftpm nightly-release-plan.json)"
          node_npm="$(jq -r .version baml_language/sdks/typescript/bridge_typescript/package.json)"
          web_npm="$(jq -r .version baml_language/sdks/typescript/bridge_typescript_web/package.json)"
          csharp_nuget="$(sed -n \
            's#^    <Version>\([^<]*\)</Version>$#\1#p' \
            baml_language/sdks/csharp/bridge_csharp/src/Baml.Bridge.csproj)"
          rust_crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' \
            baml_language/sdks/rust/bridge_rust/Cargo.toml)"
          go_toolchain="$(sed -n \
            's/^const ToolchainVersion = "\(.*\)"$/\1/p' \
            baml_language/sdks/go/baml_go/version.go)"
          go_runtime="$(sed -n \
            's/^const BridgeRuntimeVersion = "\(.*\)"$/\1/p' \
            baml_language/sdks/go/baml_go/version.go)"
          vsix="$(jq -r .version typescript2/app-vscode-ext/package.json)"
          test "$node_npm" = "$nightly"
          test "$web_npm" = "$node_npm"
          test "$nuget" = "$nightly"
          test "$csharp_nuget" = "$nuget"
          test "$maven" = "$nightly"
          test "$gradle_plugin" = "$nightly"
          test "$swiftpm" = "$nightly"
          test "$rust_crate" = "$nightly"
          test "$go_toolchain" = "$nightly"
          test "$go_runtime" = "v$nightly"
          test "$vsix" = "$nightly"
          for shipping_version in \
            "$node_npm" "$web_npm" "$csharp_nuget" "$maven" \
            "$gradle_plugin" "$swiftpm" "$rust_crate" "$go_toolchain" "$vsix"; do
            test "$shipping_version" != "$canary"
          done
          test "$go_runtime" != "v$canary"

  grammar-tests:
    name: "KILN: Grammar Tests"
    runs-on: trunk-kiln=${{ github.run_id }}-${{ github.run_attempt }}..size=medium
    needs: determine_changes
    if: needs.determine_changes.outputs.grammar == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary'
    continue-on-error: true
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@v7
        with:
          clean: false
          persist-credentials: false
      - name: "Backdate the git refs baml_artifact tracks"
        run: |
          echo "variant=$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-variant" 2>/dev/null || echo NONE)"
          basis="$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-basis-sha" 2>/dev/null || true)"
          git cat-file -e "${basis}^{commit}" 2>/dev/null || basis=""
          p=("$(git rev-parse --git-path HEAD)")
          if r="$(git symbolic-ref -q HEAD)"; then p+=("$(git rev-parse --git-path "${r}")"); fi
          if ! git show-ref --verify --quiet refs/heads/canary; then
            b="${basis:-$(git rev-parse HEAD)}"
            git update-ref refs/heads/canary "${b}"
            echo "recreated refs/heads/canary at ${b}"
          fi
          p+=("$(git rev-parse --git-path refs/heads/canary)")
          touch -t 197001010000 "${p[@]}"
          ls -l --time-style=+%Y-%m-%d\ %H:%M "${p[@]}"
          if [ -n "${basis}" ]; then
            echo "BAML_GIT_SHA=${basis}" >> "$GITHUB_ENV"
            echo "stamping BAML_GIT_SHA=${basis}"
          else
            echo "no warm template; build.rs reads HEAD, which matches a cold tree"
          fi

      - name: "Setup Node.js for typescript2"
        uses: ./.github/actions/setup-node2

      - name: "Build grammar artifacts"
        run: pnpm --filter @b/pkg-grammar build
        working-directory: typescript2

      - name: "Committed artifacts must match src/"
        # build regenerates baml.tmLanguage.json (+ the app-vscode-ext copies
        # via sync.mjs); any diff means someone edited src/ without committing
        # the regenerated artifacts, or edited an artifact by hand.
        run: git diff --exit-code -- typescript2/pkg-grammar typescript2/app-vscode-ext

      - name: "Run grammar tests"
        id: grammar-tests
        run: pnpm --filter @b/pkg-grammar test
        working-directory: typescript2

      - name: "Run highlight.js grammar tests"
        # The hljs port validates against pkg-grammar's fixtures, so a grammar
        # change that the port doesn't handle fails here (conformance gate).
        id: hljs-tests
        run: pnpm --filter @b/pkg-grammar-hljs test
        working-directory: typescript2

      - name: "Run tree-sitter grammar tests"
        # Generates the parser and runs the corpus + fixture parse gate.
        run: pnpm --filter @b/pkg-grammar-treesitter test
        working-directory: typescript2

  proto-sync:
    name: "KILN: proto generated files sync"
    runs-on: trunk-kiln=${{ github.run_id }}-${{ github.run_attempt }}..size=medium
    needs: determine_changes
    if: needs.determine_changes.outputs.proto == 'true'
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          clean: false
          persist-credentials: false
      - name: "Backdate the git refs baml_artifact tracks"
        run: |
          echo "variant=$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-variant" 2>/dev/null || echo NONE)"
          basis="$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-basis-sha" 2>/dev/null || true)"
          git cat-file -e "${basis}^{commit}" 2>/dev/null || basis=""
          p=("$(git rev-parse --git-path HEAD)")
          if r="$(git symbolic-ref -q HEAD)"; then p+=("$(git rev-parse --git-path "${r}")"); fi
          if ! git show-ref --verify --quiet refs/heads/canary; then
            b="${basis:-$(git rev-parse HEAD)}"
            git update-ref refs/heads/canary "${b}"
            echo "recreated refs/heads/canary at ${b}"
          fi
          p+=("$(git rev-parse --git-path refs/heads/canary)")
          touch -t 197001010000 "${p[@]}"
          ls -l --time-style=+%Y-%m-%d\ %H:%M "${p[@]}"
          if [ -n "${basis}" ]; then
            echo "BAML_GIT_SHA=${basis}" >> "$GITHUB_ENV"
            echo "stamping BAML_GIT_SHA=${basis}"
          else
            echo "no warm template; build.rs reads HEAD, which matches a cold tree"
          fi

      # Install Rust toolchain BEFORE rust-cache so cache key uses correct Rust version.
      - name: "Install Rust toolchain"
        run: rustup toolchain install
        working-directory: baml_language

      # bridge_ctypes/build.rs needs `protoc`; bridge_go/build.sh needs
      # `protoc` + `protoc-gen-go`; bridge_typescript needs node + pnpm.
      # The `cargo build -p bridge_ctypes` step uses cargo from rustup
      # (not mise), so we don't need `go` itself here either.
      - name: "Install mise"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "node npm:pnpm protoc protoc-gen-go"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      # Rust (prost) + Python (protoc) — both driven by bridge_ctypes/build.rs.
      # Writes Python pb2/pyi into baml_language/sdks/python/src/baml_bridge/cffi/v1/.
      - name: "Generate Rust + Python proto bindings (bridge_ctypes)"
        run: cargo build -p bridge_ctypes
        working-directory: baml_language

      # Go (protoc-gen-go) — writes into sdks/go/bridge_go/cffi/proto/baml_bridge/cffi/v1/.
      - name: "Generate Go proto bindings (sdks/go/bridge_go)"
        run: ./build.sh
        working-directory: baml_language/sdks/go/bridge_go

      # --ignore-workspace: install from bridge_typescript's own pnpm-lock.yaml
      # rather than the root workspace lockfile. The two resolve different
      # protobufjs-cli versions, and pbjs codegen output (committed under
      # typescript_src/proto/) must come from the version this package pins.
      # --ignore-scripts: skip dependency build scripts (esbuild's binary
      # fetch, protobufjs postinstall) — none are needed for pbjs/tsc/napi
      # codegen, and pnpm errors on unapproved build scripts otherwise.
      # Same flags as sdk_tests/crates/typescript/setup.sh.
      - name: "Install Node SDK dependencies"
        run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts
        working-directory: baml_language/sdks/typescript/bridge_typescript

      # Node / TypeScript (protobufjs) — writes into sdks/typescript/bridge_typescript/typescript_src/proto/.
      # build:debug also regenerates typescript2/pkg-proto/src/generated/ (ts-proto / buf).
      - name: "Generate Node/TypeScript proto bindings (sdks/typescript/bridge_typescript)"
        run: pnpm build:debug
        working-directory: baml_language/sdks/typescript/bridge_typescript

      # Swift (protoc-gen-swift) — the plugin needs a Swift toolchain,
      # which this Linux job doesn't have. The generated .pb.swift files
      # are instead checked via the input-hash manifest that
      # sdks/swift/scripts/generate-protos.sh writes alongside them:
      # recompute the source protos' hashes here; if they differ from
      # the committed manifest, the Swift bindings were not regenerated.
      # The bundled ABI header is a verbatim copy of the canonical one
      # (itself byte-enforced by bridge_cffi's header_generation test),
      # so re-copy it and let the dirty-tree check below catch drift.
      - name: "Sync-check Swift proto bindings + ABI header (sdks/swift)"
        run: |
          (cd baml_language/crates/bridge_ctypes/types \
            && sha256sum baml_bridge/cffi/v1/*.proto) \
            > baml_language/sdks/swift/Sources/BamlBridge/Proto/.generated-from
          cp baml_language/crates/bridge_cffi/include/baml_cffi.h \
             baml_language/sdks/swift/Sources/CBamlBridge/include/baml_cffi.h

      - name: "Check generated proto files are in sync"
        run: |
          # Check for both modified tracked files and untracked files across every
          # codegen output documented in baml_language/crates/bridge_ctypes/README.md.
          PATHS=(
            baml_language/sdks/typescript/bridge_typescript
            baml_language/crates/bridge_ctypes
            baml_language/sdks/go/bridge_go
            baml_language/sdks/python/src/baml_bridge/cffi
            baml_language/sdks/rust/bridge_rust/src/wire
            baml_language/sdks/swift/Sources/BamlBridge/Proto
            baml_language/sdks/swift/Sources/CBamlBridge/include
            typescript2/pkg-proto
          )
          README="baml_language/crates/bridge_ctypes/README.md"
          STATUS=$(git status --porcelain -- "${PATHS[@]}")
          if [ -n "$STATUS" ]; then
            echo "::error::proto generated files are out of sync — consult ${README} for the regeneration commands and commit the resulting changes."
            echo ""
            echo "The following files are out of sync:"
            echo "$STATUS"
            echo ""
            echo "===== ${README} ====="
            cat "${README}"
            echo "===== end of ${README} ====="
            echo ""
            git diff -- "${PATHS[@]}"
            exit 1
          fi
          echo "All generated proto files are in sync."

