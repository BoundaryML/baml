name: Trunk Kiln shadow

on:
  workflow_dispatch:
    inputs:
      template:
        description: "Template label suffix, empty for the live template"
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prune-test:
    runs-on: trunk-kiln=${{ github.run_id }}-${{ github.run_attempt }}..size=small..memory=low${{ inputs.template }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
          persist-credentials: false
      - name: Install mise
        uses: ./.github/actions/setup-mise
        with:
          cache: "false"
          install_args: "sccache cargo:prek python uv node clang-format"
      - name: Prune the mise cache, then check the bin folders
        run: |
          cat /cache/trunk-template-variant || true
          echo "MISE_DATA_DIR=${MISE_DATA_DIR:-} MISE_CACHE_DIR=${MISE_CACHE_DIR:-} XDG_CACHE_HOME=${XDG_CACHE_HOME:-}"
          mise cache path || true
          check() {
            missing=()
            for v in /cache/mise/installs/cargo-*/*.*; do
              [[ -L $v ]] && continue
              [[ -d $v/bin ]] || missing+=("$v/bin")
            done
            if [[ ${#missing[@]} -eq 0 ]]; then echo "$1: all cargo bin folders present"; else printf "$1: MISSING %s\n" "${missing[@]}"; fi
          }
          check "before prune"
          mise cache prune --verbose 2>&1 | grep -c -E 'installs/' | sed 's/^/install files named by the prune: /' || true
          check "after prune"
          [[ ${#missing[@]} -eq 0 ]]
