  size-gate-wasm:
    name: "KILN: measure-baml-size (wasm)"
    runs-on: trunk-kiln=${{ github.run_id }}-${{ github.run_attempt }}..size=medium
    needs: determine_changes
    if: needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary'
    timeout-minutes: 50
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
          persist-credentials: false
      - name: "Backdate the git refs baml_artifact tracks"
        run: |
          echo "variant=$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-variant" 2>/dev/null || echo NONE)"
          basis="$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-basis-sha" 2>/dev/null || true)"
          git cat-file -e "${basis}^{commit}" 2>/dev/null || basis=""
          p=("$(git rev-parse --git-path HEAD)")
          if r="$(git symbolic-ref -q HEAD)"; then p+=("$(git rev-parse --git-path "${r}")"); fi
          if ! git show-ref --verify --quiet refs/heads/canary; then
            b="${basis:-$(git rev-parse HEAD)}"
            git update-ref refs/heads/canary "${b}"
            echo "recreated refs/heads/canary at ${b}"
          fi
          p+=("$(git rev-parse --git-path refs/heads/canary)")
          touch -t 197001010000 "${p[@]}"
          ls -l --time-style=+%Y-%m-%d\ %H:%M "${p[@]}"
          if [ -n "${basis}" ]; then
            echo "BAML_GIT_SHA=${basis}" >> "$GITHUB_ENV"
            echo "stamping BAML_GIT_SHA=${basis}"
          else
            echo "no warm template; build.rs reads HEAD, which matches a cold tree"
          fi

      - name: "Install Rust toolchain"
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
        working-directory: baml_language

      - name: "Install sccache and direnv"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv"

      - name: "Verify sccache"
        run: sccache --version

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch --target wasm32-unknown-unknown
        working-directory: baml_language

      - name: "Run size-gate check"
        id: check
        working-directory: baml_language
        run: |
          cargo run --timings -p cargo-size-gate -- size-gate check \
            --only bridge_wasm \
            --format json > size-gate-wasm.json 2> size-gate-stderr.txt || exit_code=$?
          cat size-gate-stderr.txt >&2
          echo "exit_code=${exit_code:-0}" >> "$GITHUB_OUTPUT"

      - name: "Upload size-gate report"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: size-gate-wasm
          path: baml_language/size-gate-wasm.json
          if-no-files-found: ignore

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-size-gate-wasm.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-size-gate-wasm
          path: sccache-stats-size-gate-wasm.json
          if-no-files-found: ignore

      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-size-gate-wasm
          path: baml_language/target/cargo-timings/
          if-no-files-found: ignore

  wasm-pack-test:
    name: "KILN: wasm-pack test"
    runs-on: trunk-kiln=${{ github.run_id }}-${{ github.run_attempt }}..size=medium..memory=high
    needs: determine_changes
    if: needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary'
    timeout-minutes: 40
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
          persist-credentials: false
      - name: "Backdate the git refs baml_artifact tracks"
        run: |
          echo "variant=$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-variant" 2>/dev/null || echo NONE)"
          basis="$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-basis-sha" 2>/dev/null || true)"
          git cat-file -e "${basis}^{commit}" 2>/dev/null || basis=""
          p=("$(git rev-parse --git-path HEAD)")
          if r="$(git symbolic-ref -q HEAD)"; then p+=("$(git rev-parse --git-path "${r}")"); fi
          if ! git show-ref --verify --quiet refs/heads/canary; then
            b="${basis:-$(git rev-parse HEAD)}"
            git update-ref refs/heads/canary "${b}"
            echo "recreated refs/heads/canary at ${b}"
          fi
          p+=("$(git rev-parse --git-path refs/heads/canary)")
          touch -t 197001010000 "${p[@]}"
          ls -l --time-style=+%Y-%m-%d\ %H:%M "${p[@]}"
          if [ -n "${basis}" ]; then
            echo "BAML_GIT_SHA=${basis}" >> "$GITHUB_ENV"
            echo "stamping BAML_GIT_SHA=${basis}"
          else
            echo "no warm template; build.rs reads HEAD, which matches a cold tree"
          fi

      # Install Rust toolchain BEFORE rust-cache so cache key uses correct Rust version
      - name: "Install Rust toolchain"
        run: |
          set -euo pipefail
          rustup show
          # `rustup target add wasm32` fetches a small (~20MB) std component that
          # normally installs in seconds. A multi-minute duration means a stalled
          # download (rustup has no idle timeout), which otherwise burns the whole
          # 20-min job timeout and dequeues the PR from the merge queue. Cap each
          # attempt well above the normal time and retry on a fresh connection;
          # surface a genuine outage after 3 tries instead of hanging.
          for attempt in 1 2 3; do
            if timeout 300 rustup target add wasm32-unknown-unknown; then
              break
            fi
            echo "::warning::rustup target add wasm32 attempt $attempt stalled/failed; retrying" >&2
            [ "$attempt" = 3 ] && { echo "::error::rustup target add wasm32 failed after 3 attempts"; exit 1; }
            sleep 5
          done
        working-directory: baml_language

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch --target wasm32-unknown-unknown
        working-directory: baml_language

      # Compiling for wasm is necessary but far from sufficient: the target
      # accepts code that traps on first call (`std::time::Instant::now` is
      # "not implemented on this platform" there). The check catches wasm-only
      # dependency breakage (e.g. a missing `getrandom/js` feature); the test
      # run is the only place the browser language server actually executes.
      - name: "Check wasm build (bridge_wasm)"
        run: cargo check -p bridge_wasm --target wasm32-unknown-unknown
        working-directory: baml_language

      - name: "Setup Node.js and wasm-pack"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "node github:rustwasm/wasm-pack"

      - name: "Run wasm tests (bridge_wasm)"
        run: wasm-pack test --node
        working-directory: baml_language/crates/bridge_wasm

