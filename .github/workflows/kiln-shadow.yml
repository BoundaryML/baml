  documentation-snippets:
    name: "KILN: Documentation examples / Compiler and documentation tests"
    runs-on: trunk-kiln=${{ github.run_id }}-${{ github.run_attempt }}..size=xlarge
    needs: determine_changes
    if: >-
      needs.determine_changes.outputs.documentation_snippets == 'true' &&
      needs.determine_changes.outputs.code != 'true' &&
      github.ref != 'refs/heads/main' && github.ref != 'refs/heads/canary'
    timeout-minutes: 60
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      # Match Cargo CI: these binaries repeatedly execute the compiler, so opt-level
      # 1 matters for runtime as well as sharing compiled dependencies in sccache.
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      RUSTUP_MAX_RETRIES: 10
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
          persist-credentials: false
      - name: "Backdate the git refs baml_artifact tracks"
        run: |
          echo "variant=$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-variant" 2>/dev/null || echo NONE)"
          basis="$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-basis-sha" 2>/dev/null || true)"
          git cat-file -e "${basis}^{commit}" 2>/dev/null || basis=""
          p=("$(git rev-parse --git-path HEAD)")
          if r="$(git symbolic-ref -q HEAD)"; then p+=("$(git rev-parse --git-path "${r}")"); fi
          if ! git show-ref --verify --quiet refs/heads/canary; then
            b="${basis:-$(git rev-parse HEAD)}"
            git update-ref refs/heads/canary "${b}"
            echo "recreated refs/heads/canary at ${b}"
          fi
          p+=("$(git rev-parse --git-path refs/heads/canary)")
          touch -t 197001010000 "${p[@]}"
          ls -l --time-style=+%Y-%m-%d\ %H:%M "${p[@]}"
          if [ -n "${basis}" ]; then
            echo "BAML_GIT_SHA=${basis}" >> "$GITHUB_ENV"
            echo "stamping BAML_GIT_SHA=${basis}"
          else
            echo "no warm template; build.rs reads HEAD, which matches a cold tree"
          fi

      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - name: "Install tools (mise)"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv"

      - name: "Verify sccache"
        run: sccache --version

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      - name: "Build the CLI for documentation-only changes"
        run: cargo build -p baml_cli --bin baml-cli --all-features --timings
        working-directory: baml_language

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node2
      - name: Compile canonical documentation snippets
        env:
          # Require full diagnostics for both valid and intentionally invalid
          # examples. Do not seed disposable projects during the check pass.
          BAML_NO_BYTECODE_CACHE: "1"
          BAML_BINARY: ${{ github.workspace }}/baml_language/target/debug/baml-cli
        run: pnpm --filter app-developer-docs docs:snippets:validate
        working-directory: typescript2
      - name: Execute documentation behavior and inferred-signature assertions
        env:
          BAML_BINARY: ${{ github.workspace }}/baml_language/target/debug/baml-cli
          # Content-addressed keys include the compiler fingerprint and project
          # inputs. Reuse the stdlib across examples without writing into source.
          BAML_CACHE_DIR: ${{ runner.temp }}/baml-documentation-cache
        run: pnpm --filter app-developer-docs docs:book:validate
        working-directory: typescript2
      # The full baml_cli::baml_corpus test above already executes
      # root.compiler.mounted_interface_diagnostics. Do not compile the corpus
      # again just to select those three package-boundary assertions.

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-snapshot.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-snapshot
          path: sccache-stats-snapshot.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-snapshot.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-snapshot
          path: baml_language/target/cargo-timings/cargo-timing-snapshot.html
          if-no-files-found: ignore

  cargo-test-linux:
    name: "KILN: cargo test (x86_64-unknown-linux-gnu)"
    runs-on: trunk-kiln=${{ github.run_id }}-${{ github.run_attempt }}..size=xlarge
    needs: determine_changes
    if: needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary'
    timeout-minutes: 50
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      # CI executes the compiler thousands of times per job — in-process in
      # `baml_tests`, and as a spawned debug `baml-cli` in the CLI e2e suites — so
      # test runtime dwarfs compile time here (opt-level 0 test execution was
      # ~55min of CPU per run across the linux jobs alone). opt-level 1 keeps
      # debug-assertions on and costs one sccache-cold rebuild after this change
      # lands; per-package overrides in Cargo.toml (e.g. salsa) still apply on
      # top. Pinned on both `dev` (dependencies) and `test` (the `--test`
      # binaries) so the setting is unambiguous, mirroring the DEBUG pins in the
      # windows job.
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      RUSTUP_MAX_RETRIES: 10
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
          persist-credentials: false
      - name: "Backdate the git refs baml_artifact tracks"
        run: |
          echo "variant=$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-variant" 2>/dev/null || echo NONE)"
          basis="$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-basis-sha" 2>/dev/null || true)"
          git cat-file -e "${basis}^{commit}" 2>/dev/null || basis=""
          p=("$(git rev-parse --git-path HEAD)")
          if r="$(git symbolic-ref -q HEAD)"; then p+=("$(git rev-parse --git-path "${r}")"); fi
          if ! git show-ref --verify --quiet refs/heads/canary; then
            b="${basis:-$(git rev-parse HEAD)}"
            git update-ref refs/heads/canary "${b}"
            echo "recreated refs/heads/canary at ${b}"
          fi
          p+=("$(git rev-parse --git-path refs/heads/canary)")
          touch -t 197001010000 "${p[@]}"
          ls -l --time-style=+%Y-%m-%d\ %H:%M "${p[@]}"
          if [ -n "${basis}" ]; then
            echo "BAML_GIT_SHA=${basis}" >> "$GITHUB_ENV"
            echo "stamping BAML_GIT_SHA=${basis}"
          else
            echo "no warm template; build.rs reads HEAD, which matches a cold tree"
          fi

      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      # mise installs sccache/direnv AND cargo-nextest (cargo: backend ->
      # cargo-binstall prebuilt), replacing taiki-e/install-action.
      - name: "Install tools (mise)"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv cargo:cargo-nextest"

      - name: "Verify sccache"
        run: sccache --version

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      # `baml_tests`, `baml_cli`, and `baml_pack_host` already run on linux
      # with `--all-features` in the dedicated `snapshot-tests` job, so this
      # job neither builds nor runs them — their test binaries are also the
      # heaviest links in the workspace. (A nextest `-E` filter would only
      # skip *running* them; the cargo-level `--exclude` skips building them
      # too.) The `sdk_test_*` crates each need their own language toolchain,
      # and their suites only pass behind the setup script that generates the
      # SDK under test — both of which the dedicated `sdk-tests` matrix below
      # provides.
      - name: "Build tests with --timings"
        run: cargo nextest run --no-run --all-features --timings --workspace --exclude baml_tests --exclude baml_cli --exclude baml_pack_host --exclude "sdk_test_*" --exclude baml_bridge
        working-directory: baml_language

      - name: "Run tests with nextest"
        id: cargo-test
        run: cargo nextest run --profile ci --all-features --workspace --exclude baml_tests --exclude baml_cli --exclude baml_pack_host --exclude "sdk_test_*" --exclude baml_bridge
        working-directory: baml_language

      # Release leg: structured-log value copying carries `debug_assert`-adjacent
      # logic whose behavior must not change when debug assertions are
      # compiled out (PR #4548 review A.1). Narrow on purpose — this module,
      # not the workspace.
      - name: "Run structured-log value-copy tests in release mode"
        run: cargo test --release -p bex_engine --lib trace_heap
        working-directory: baml_language

      - name: "Upload test results on failure"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failures-linux
          path: |
            baml_language/**/*.snap.new
            baml_language/**/target/nextest/

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-test-linux.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-test-linux
          path: sccache-stats-test-linux.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-linux.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test-linux
          path: baml_language/target/cargo-timings/cargo-timing-test-linux.html
          if-no-files-found: ignore

  cargo-test-linux-musl:
    name: "KILN: cargo test (x86_64-unknown-linux-musl)"
    runs-on: trunk-kiln=${{ github.run_id }}-${{ github.run_attempt }}..size=xlarge..memory=high
    needs: determine_changes
    if: needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary'
    timeout-minutes: 70
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      # CI executes the compiler thousands of times per job — in-process in
      # `baml_tests`, and as a spawned debug `baml-cli` in the CLI e2e suites — so
      # test runtime dwarfs compile time here (opt-level 0 test execution was
      # ~55min of CPU per run across the linux jobs alone). opt-level 1 keeps
      # debug-assertions on and costs one sccache-cold rebuild after this change
      # lands; per-package overrides in Cargo.toml (e.g. salsa) still apply on
      # top. Pinned on both `dev` (dependencies) and `test` (the `--test`
      # binaries) so the setting is unambiguous, mirroring the DEBUG pins in the
      # windows job.
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      RUSTUP_MAX_RETRIES: 10
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
          persist-credentials: false
      - name: "Backdate the git refs baml_artifact tracks"
        run: |
          echo "variant=$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-variant" 2>/dev/null || echo NONE)"
          basis="$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-basis-sha" 2>/dev/null || true)"
          git cat-file -e "${basis}^{commit}" 2>/dev/null || basis=""
          p=("$(git rev-parse --git-path HEAD)")
          if r="$(git symbolic-ref -q HEAD)"; then p+=("$(git rev-parse --git-path "${r}")"); fi
          if ! git show-ref --verify --quiet refs/heads/canary; then
            b="${basis:-$(git rev-parse HEAD)}"
            git update-ref refs/heads/canary "${b}"
            echo "recreated refs/heads/canary at ${b}"
          fi
          p+=("$(git rev-parse --git-path refs/heads/canary)")
          touch -t 197001010000 "${p[@]}"
          ls -l --time-style=+%Y-%m-%d\ %H:%M "${p[@]}"
          if [ -n "${basis}" ]; then
            echo "BAML_GIT_SHA=${basis}" >> "$GITHUB_ENV"
            echo "stamping BAML_GIT_SHA=${basis}"
          else
            echo "no warm template; build.rs reads HEAD, which matches a cold tree"
          fi

      - name: "Install Rust toolchain"
        run: |
          set -euo pipefail
          rustup show
          rustup target add x86_64-unknown-linux-musl
        working-directory: baml_language
      - name: "Work around the stale HashiCorp apt key"
        run: sudo rm -f /etc/apt/sources.list.d/hashicorp.list

      - name: "Setup musl cross toolchain"
        uses: ./.github/actions/setup-musl-cross
        with:
          target: x86_64-unknown-linux-musl

      - name: "Install tools (mise)"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv cargo:cargo-nextest"

      - name: "Verify sccache"
        run: sccache --version

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      # Enabling every feature turns on the optional native-tls backend, which
      # needs a separate target-specific OpenSSL build. Default features match
      # the rustls-based musl artifacts we ship.
      - name: "Build tests with --timings"
        run: cargo build --tests --bin baml-cli --bin baml-pack-host --timings --workspace --exclude baml_tests --exclude "sdk_test_*" --exclude baml_bridge
        working-directory: baml_language

      - name: "Run tests with nextest"
        # The runtime corpus moved from the excluded baml_tests package into
        # baml_cli; keep its existing ownership in the snapshot job.
        id: cargo-test
        run: cargo nextest run --profile ci --workspace --exclude baml_tests --exclude "sdk_test_*" --exclude baml_bridge -E 'not binary(=baml_corpus)'
        working-directory: baml_language
        env:
          BAML_PACK_HOST_PREBUILT: "1"

      - name: "Upload test results on failure"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failures-linux-musl
          path: |
            baml_language/**/*.snap.new
            baml_language/**/target/nextest/

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-test-linux-musl.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-test-linux-musl
          path: sccache-stats-test-linux-musl.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-linux-musl.html
        working-directory: baml_language

      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test-linux-musl
          path: baml_language/target/cargo-timings/cargo-timing-test-linux-musl.html
          if-no-files-found: ignore

  cargo-test-wasm:
    name: "KILN: cargo test (wasm32-unknown-unknown)"
    runs-on: trunk-kiln=${{ github.run_id }}-${{ github.run_attempt }}..size=medium
    needs: determine_changes
    if: needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary'
    timeout-minutes: 90
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      # CI executes the compiler thousands of times per job — in-process in
      # `baml_tests`, and as a spawned debug `baml-cli` in the CLI e2e suites — so
      # test runtime dwarfs compile time here (opt-level 0 test execution was
      # ~55min of CPU per run across the linux jobs alone). opt-level 1 keeps
      # debug-assertions on and costs one sccache-cold rebuild after this change
      # lands; per-package overrides in Cargo.toml (e.g. salsa) still apply on
      # top. Pinned on both `dev` (dependencies) and `test` (the `--test`
      # binaries) so the setting is unambiguous, mirroring the DEBUG pins in the
      # windows job.
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      RUSTUP_MAX_RETRIES: 10
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
          persist-credentials: false
      - name: "Backdate the git refs baml_artifact tracks"
        run: |
          echo "variant=$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-variant" 2>/dev/null || echo NONE)"
          basis="$(cat "${XDG_CACHE_HOME:-/cache}/trunk-template-basis-sha" 2>/dev/null || true)"
          git cat-file -e "${basis}^{commit}" 2>/dev/null || basis=""
          p=("$(git rev-parse --git-path HEAD)")
          if r="$(git symbolic-ref -q HEAD)"; then p+=("$(git rev-parse --git-path "${r}")"); fi
          if ! git show-ref --verify --quiet refs/heads/canary; then
            b="${basis:-$(git rev-parse HEAD)}"
            git update-ref refs/heads/canary "${b}"
            echo "recreated refs/heads/canary at ${b}"
          fi
          p+=("$(git rev-parse --git-path refs/heads/canary)")
          touch -t 197001010000 "${p[@]}"
          ls -l --time-style=+%Y-%m-%d\ %H:%M "${p[@]}"
          if [ -n "${basis}" ]; then
            echo "BAML_GIT_SHA=${basis}" >> "$GITHUB_ENV"
            echo "stamping BAML_GIT_SHA=${basis}"
          else
            echo "no warm template; build.rs reads HEAD, which matches a cold tree"
          fi

      - name: "Install Rust toolchain"
        run: |
          set -euo pipefail
          rustup show
          # `rustup target add wasm32` fetches a small (~20MB) std component that
          # normally installs in seconds. A multi-minute duration means a stalled
          # download (rustup has no idle timeout), which otherwise burns the whole
          # job timeout and dequeues the PR from the merge queue. Cap each attempt
          # well above the normal time and retry on a fresh connection; surface a
          # genuine outage after 3 tries instead of hanging.
          for attempt in 1 2 3; do
            if timeout 300 rustup target add wasm32-unknown-unknown; then
              break
            fi
            echo "::warning::rustup target add wasm32 attempt $attempt stalled/failed; retrying" >&2
            [ "$attempt" = 3 ] && { echo "::error::rustup target add wasm32 failed after 3 attempts"; exit 1; }
            sleep 5
          done
        working-directory: baml_language

      - name: "Install sccache and direnv"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv"

      - name: "Verify sccache"
        run: sccache --version

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch --target wasm32-unknown-unknown
        working-directory: baml_language

      - name: "Build for WASM"
        run: |
          set -euo pipefail
          readarray -t wasm_packages < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.source==null) | select(if .metadata.ci.wasm_support == null then true else .metadata.ci.wasm_support end) | .name')
          if [[ ${#wasm_packages[@]} -eq 0 ]]; then
            echo "Error: no WASM packages discovered; cargo metadata or jq may have failed" >&2
            exit 1
          fi
          package_args=()
          for package in "${wasm_packages[@]}"; do
            package_args+=(-p "$package")
          done
          cargo build "${package_args[@]}" --target wasm32-unknown-unknown --no-default-features --release --timings
        working-directory: baml_language

      - name: "List WASM artifacts"
        run: ls -lh target/wasm32-unknown-unknown/release/*.wasm || true
        working-directory: baml_language

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-test-wasm.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-test-wasm
          path: sccache-stats-test-wasm.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: |
          if [[ -f target/cargo-timings/cargo-timing.html ]]; then
            mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-wasm.html
          fi
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test-wasm
          path: baml_language/target/cargo-timings/cargo-timing-test-wasm.html
          if-no-files-found: ignore

