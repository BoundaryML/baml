name: Developer Docs

on:
  pull_request:
    paths:
      - "typescript2/app-developer-docs/**"
      - "typescript2/pkg-grammar/**"
      - "typescript2/package.json"
      - "typescript2/pnpm-lock.yaml"
      - "typescript2/pnpm-workspace.yaml"
      - "baml_language/**"
      - ".github/actions/setup-node2/**"
      - ".github/workflows/developer-docs.yml"
      - ".github/workflows/release-baml-language.yml"
  push:
    branches: [main, canary]
    paths:
      - "typescript2/app-developer-docs/**"
      - "typescript2/pkg-grammar/**"
      - "typescript2/package.json"
      - "typescript2/pnpm-lock.yaml"
      - "typescript2/pnpm-workspace.yaml"
      - "baml_language/**"
      - ".github/actions/setup-node2/**"
      - ".github/workflows/developer-docs.yml"
      - ".github/workflows/release-baml-language.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests, type-check, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node2
      - name: Lint
        run: pnpm --filter app-developer-docs lint
        working-directory: typescript2
      - name: Test
        run: pnpm --filter app-developer-docs test
        working-directory: typescript2
      - name: Type-check
        run: pnpm --filter app-developer-docs typecheck
        working-directory: typescript2
      - name: Build the SSR application
        run: pnpm --filter app-developer-docs build
        working-directory: typescript2

  authored-content:
    name: Authored content and routes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node2
      - name: Validate authored content
        run: pnpm --filter app-developer-docs docs:authored:validate
        working-directory: typescript2
      - name: Validate route and contextual 404 contracts
        run: pnpm --filter app-developer-docs docs:routes:validate
        working-directory: typescript2

  snippets:
    name: BAML snippets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        working-directory: baml_language
        run: rustup show
      - name: Cache compiler build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: developer-docs-snippets-${{ hashFiles('typescript2/app-developer-docs/lib/snippets/**/*.ts', 'typescript2/app-developer-docs/scripts/validate-snippets.ts', 'typescript2/app-developer-docs/content/code/**') }}
          workspaces: "baml_language -> target"
      - name: Build the selected BAML CLI
        run: cargo build -p baml_cli --bin baml-cli
        working-directory: baml_language
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node2
      - name: Compile canonical documentation snippets
        env:
          BAML_BINARY: ${{ github.workspace }}/baml_language/target/debug/baml-cli
        run: pnpm --filter app-developer-docs docs:snippets:validate
        working-directory: typescript2

  database-integration:
    name: Immutable document-store integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: developer_docs_test
          POSTGRES_PASSWORD: developer_docs
          POSTGRES_USER: developer_docs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U developer_docs -d developer_docs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node2
      - name: Exercise migrations, publication, deduplication, rollback, and SSR lookup
        env:
          DEVELOPER_DOCS_TEST_DATABASE_URL: postgres://developer_docs:developer_docs@127.0.0.1:5432/developer_docs_test
        run: pnpm exec tsx --test tests/document-store.integration.test.ts
        working-directory: typescript2/app-developer-docs

  production-path:
    name: DB-backed SSR and HTTP contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GENERATED_CONTENT_VERSION: ${{ vars.DEVELOPER_DOCS_GENERATED_CONTENT_VERSION || '0.18.1-nightly.20260901.a' }}
      VERCEL_ENV: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node2
      - name: Require the protected read-only runtime credential
        env:
          GENERATED_CONTENT_DATABASE_URL: ${{ secrets.GENERATED_CONTENT_DATABASE_URL }}
        run: test -n "$GENERATED_CONTENT_DATABASE_URL" || { echo "::error::GENERATED_CONTENT_DATABASE_URL is not configured"; exit 1; }
      - name: Verify the immutable release through the runtime reader
        env:
          GENERATED_CONTENT_DATABASE_URL: ${{ secrets.GENERATED_CONTENT_DATABASE_URL }}
        run: pnpm --filter app-developer-docs docs:db:verify --version "$GENERATED_CONTENT_VERSION"
        working-directory: typescript2
      - name: Build the SSR application
        run: pnpm --filter app-developer-docs build
        working-directory: typescript2
      - name: Start the application
        env:
          GENERATED_CONTENT_DATABASE_URL: ${{ secrets.GENERATED_CONTENT_DATABASE_URL }}
          PORT: 4173
        run: pnpm start > "$RUNNER_TEMP/developer-docs.log" 2>&1 &
        working-directory: typescript2/app-developer-docs
      - name: Verify representative exact-version pages, metadata, and 404s over HTTP
        env:
          VERSION: v${{ env.GENERATED_CONTENT_VERSION }}
        run: |
          set -euo pipefail
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "::error::developer docs server did not become ready"
            exit 1
          fi
          curl --fail --silent --dump-header "$RUNNER_TEMP/package.headers" \
            --output "$RUNNER_TEMP/package.html" \
            "http://127.0.0.1:4173/baml/packages/$VERSION/boundary/id"
          grep -q "boundary.id" "$RUNNER_TEMP/package.html"
          grep -qi '^cache-control:.*no-store' "$RUNNER_TEMP/package.headers"
          curl --fail --silent --output "$RUNNER_TEMP/package-child.html" \
            "http://127.0.0.1:4173/baml/packages/$VERSION/boundary/id/current"
          grep -q "boundary.id.current" "$RUNNER_TEMP/package-child.html"
          curl --fail --silent --output "$RUNNER_TEMP/cli.html" \
            "http://127.0.0.1:4173/cli/$VERSION/commands/generate/add"
          grep -q "baml generate add" "$RUNNER_TEMP/cli.html"
          grep -q "noindex" "$RUNNER_TEMP/cli.html"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:4173/cli/$VERSION/commands/not-a-command")" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4173/cli/v0.0.0-missing)" = "404"
