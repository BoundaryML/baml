name: BAML SDK Release - Publish Node.js npm

# Reusable publisher for the Node.js SDK. It publishes only the exact tarballs
# assembled, installed, and smoke-tested by build2-nodejs-sdk.reusable.yaml.
# Called by release-baml-language.yml (real releases), which owns the needs/if
# gating and passes the frozen release plan.
#
# npm OIDC trusted publishing matches the *calling* (entry-point) workflow's
# filename, not this reusable file, so the npm trusted-publisher config on each
# package must name release-baml-language.yml (org/repo casing is exact, no
# environment). See https://docs.npmjs.com/trusted-publishers.
# Trusted publishing authenticates each `npm publish`. Native leaf packages are
# published under an internal tag and integrity-verified before the user-facing
# umbrella package atomically advances the public channel tag.

on:
  workflow_call:
    inputs:
      release_plan_json:
        description: "Frozen BAML language release-plan.json content"
        type: string
        required: true
      source_sha:
        description: "Exact repository commit to publish from"
        type: string
        required: true
      channel:
        description: "Release channel (nightly|canary); selects the npm dist-tag"
        type: string
        required: true

defaults:
  run:
    shell: bash

jobs:
  platforms:
    name: Load release platforms
    runs-on: ubuntu-latest
    outputs:
      verify_matrix: ${{ steps.matrix.outputs.verify_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Validate and export registry verification matrix
        id: matrix
        run: |
          set -euo pipefail
          scripts/baml-release-platforms check
          echo "verify_matrix=$(scripts/baml-release-platforms matrix node_verify)" >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish Node.js npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Download verified npm package set
        uses: actions/download-artifact@v4
        with:
          name: nodejs-verified-packages
          path: verified-npm
      - name: Setup Node.js
        # Mirror legacy release.yml publish-to-npm: the composite sets registry-url
        # (writes the .npmrc that npm/pnpm OIDC trusted publishing keys off of) and
        # provides pnpm. latest ships an npm new enough for OIDC (checked below).
        uses: ./.github/actions/setup-node
        with:
          node-action-version: v6
          node-version: latest
          install-dependencies: false
      - name: Ensure npm CLI supports trusted publishing
        run: |
          set -euo pipefail
          required_version="11.5.1"
          current_version="$(npm --version)"
          if [ "$(printf '%s\n' "$required_version" "$current_version" | sort -V | head -n1)" != "$required_version" ]; then
            echo "npm $current_version is lower than required $required_version" >&2
            echo "npm 11.5.1+ is required for trusted publishing because it is the earliest version that can use OIDC auth" >&2
            exit 1
          fi
          echo "npm $current_version satisfies >= $required_version"
          # OIDC keyless publishing needs the id-token request endpoint, which GitHub
          # only injects when `id-token: write` reaches this job. If it's missing,
          # npm can't do trusted publishing and falls back to ENEEDAUTH.
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC id-token endpoint is available (id-token: write is in effect)."
          else
            echo "::error::OIDC id-token endpoint is NOT available in this job; npm cannot use trusted publishing. Check id-token: write on the calling job."
            exit 1
          fi
      - name: Validate verified inputs
        env:
          RELEASE_PLAN_JSON: ${{ inputs.release_plan_json }}
        run: |
          set -euo pipefail
          (cd verified-npm && sha256sum -c SHA256SUMS)
          version="$(printf '%s\n' "$RELEASE_PLAN_JSON" | jq -r .canonical_version)"
          test "$(printf '%s\n' "$RELEASE_PLAN_JSON" | jq -r .source_sha)" = '${{ inputs.source_sha }}'
          test "$(printf '%s\n' "$RELEASE_PLAN_JSON" | jq -r .channel)" = '${{ inputs.channel }}'
          scripts/baml-release-platforms check-node-packages verified-npm/packages.json --version "$version"
      - name: Publish native leaves, then commit the umbrella channel
        env:
          CHANNEL: ${{ inputs.channel }}
          INTERNAL_TAG: baml-internal
        run: |
          set -euo pipefail
          # --- OIDC diagnostics: show the auth state npm sees before publishing ---
          echo "=== auth / OIDC environment ==="
          echo "OIDC id-token endpoint set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "NODE_AUTH_TOKEN set:        ${NODE_AUTH_TOKEN:+yes}"
          echo "npm registry:               $(npm config get registry)"
          echo "--- npmrc (auth lines, token redacted) ---"
          npm config ls -l 2>/dev/null | grep -iE "registry|_authtoken|provenance|userconfig" | sed -E 's/(_authToken=).*/\1<redacted>/I' || true
          echo "==============================="
          publish_if_needed() {
            local record="$1"
            local tag="$2"
            local name version filename expected_integrity existing_integrity
            name="$(jq -r .name <<<"$record")"
            version="$(jq -r .version <<<"$record")"
            filename="$(jq -r .filename <<<"$record")"
            expected_integrity="$(jq -r .integrity <<<"$record")"
            existing_integrity="$(npm view "${name}@${version}" dist.integrity 2>/dev/null || true)"
            if [[ -n "$existing_integrity" ]]; then
              if [[ "$existing_integrity" != "$expected_integrity" ]]; then
                echo "::error::${name}@${version} exists with integrity ${existing_integrity}; expected ${expected_integrity}"
                exit 1
              fi
              echo "Skipping ${name}@${version} (identical integrity ${expected_integrity})"
              return 0
            fi
            echo "Publishing ${name}@${version} from verified-npm/${filename} with tag '$tag'"
            npm publish "verified-npm/${filename}" --access public --tag "$tag" --loglevel verbose
          }

          retry_delay() {
            local attempt="$1"
            local delay=$((1 << attempt))
            if (( delay > 20 )); then delay=20; fi
            printf '%s\n' "$delay"
          }

          verify_integrity_with_retry() {
            local name="$1"
            local version="$2"
            local expected="$3"
            local attempt actual delay
            for attempt in 1 2 3 4 5 6; do
              actual="$(npm view "${name}@${version}" dist.integrity 2>/dev/null || true)"
              if [[ "$actual" == "$expected" ]]; then
                echo "Verified registry integrity for ${name}@${version}"
                return 0
              fi
              if [[ -n "$actual" ]]; then
                echo "::error::${name}@${version} has registry integrity ${actual}; expected ${expected}"
                return 1
              fi
              if (( attempt == 6 )); then break; fi
              delay="$(retry_delay "$attempt")"
              echo "${name}@${version} is not visible yet; retrying in ${delay}s (${attempt}/6)"
              sleep "$delay"
            done
            echo "::error::${name}@${version} did not become visible with its expected integrity"
            return 1
          }

          verify_tag_with_retry() {
            local name="$1"
            local tag="$2"
            local expected_version="$3"
            local attempt actual delay
            for attempt in 1 2 3 4 5 6; do
              actual="$(npm view "$name" dist-tags --json 2>/dev/null | jq -r --arg tag "$tag" '.[$tag] // empty' || true)"
              if [[ "$actual" == "$expected_version" ]]; then
                echo "Verified ${name}@${tag} -> ${expected_version}"
                return 0
              fi
              if (( attempt == 6 )); then break; fi
              delay="$(retry_delay "$attempt")"
              echo "${name}@${tag} currently resolves to ${actual:-<missing>}; retrying in ${delay}s (${attempt}/6)"
              sleep "$delay"
            done
            echo "::error::${name} dist-tag '${tag}' points to '${actual:-<missing>}', expected '${expected_version}'"
            echo "::error::Trusted publishing cannot mutate dist-tags independently; investigate before retrying or repairing manually."
            return 1
          }

          # Leaf packages are implementation details. Publish them first under a
          # non-user-facing tag, then prove that every exact version in the
          # umbrella's optionalDependencies exists with the expected integrity.
          while IFS= read -r record; do publish_if_needed "$record" "$INTERNAL_TAG"; done < <(
            jq -c '.[] | select(.name != "@boundaryml/baml-bridge")' verified-npm/packages.json
          )
          while IFS= read -r record; do
            name="$(jq -r .name <<<"$record")"
            version="$(jq -r .version <<<"$record")"
            expected="$(jq -r .integrity <<<"$record")"
            verify_integrity_with_retry "$name" "$version" "$expected"
          done < <(jq -c '.[] | select(.name != "@boundaryml/baml-bridge")' verified-npm/packages.json)

          if [[ "$CHANNEL" == "canary" ]]; then public_tag="latest"; else public_tag="$CHANNEL"; fi
          umbrella_record="$(jq -c '.[] | select(.name == "@boundaryml/baml-bridge")' verified-npm/packages.json)"
          publish_if_needed "$umbrella_record" "$public_tag"

          # A fresh publish attaches the channel tag atomically. On a rerun, verify
          # both immutable integrity and the already-committed public tag; OIDC
          # intentionally cannot repair tags independently with `npm dist-tag`.
          umbrella_name="$(jq -r .name <<<"$umbrella_record")"
          umbrella_version="$(jq -r .version <<<"$umbrella_record")"
          umbrella_integrity="$(jq -r .integrity <<<"$umbrella_record")"
          verify_integrity_with_retry "$umbrella_name" "$umbrella_version" "$umbrella_integrity"
          verify_tag_with_retry "$umbrella_name" "$public_tag" "$umbrella_version"

  verify-registry:
    name: Verify npm registry install / ${{ matrix._.target }}
    needs: [platforms, publish-npm]
    strategy:
      fail-fast: false
      matrix:
        _: ${{ fromJSON(needs.platforms.outputs.verify_matrix) }}
    runs-on: ${{ matrix._.host }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: ${{ !matrix._.docker_image }}
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install the umbrella alone from npm and run BAML
        env:
          EXPECTED_VERSION: ${{ fromJSON(inputs.release_plan_json).canonical_version }}
          PUBLIC_TAG: ${{ inputs.channel == 'canary' && 'latest' || inputs.channel }}
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_ENGINE_STRICT: "true"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_FETCH_RETRIES: "5"
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "2000"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "10000"
        run: |
          set -euo pipefail
          cold_import_max_ms="$(jq -r .node_budgets.cold_import_max_ms release/platforms.json)"
          version_calls_max_ms="$(jq -r .node_budgets.version_calls_10000_max_ms release/platforms.json)"
          exact_spec="@boundaryml/baml-bridge@${EXPECTED_VERSION}"

          if [[ -n '${{ matrix._.docker_image }}' ]]; then
            mkdir registry-exact
            cp scripts/verify-node-release-package.mjs registry-exact/
            docker run --rm -v "$PWD/registry-exact:/app" -w /app \
              --env PACKAGE_SPEC="$exact_spec" \
              --env EXPECTED_NATIVE_PACKAGE='@boundaryml/baml-bridge-${{ matrix._.npm_package }}' \
              --env EXPECTED_VERSION \
              --env COLD_IMPORT_MAX_MS="$cold_import_max_ms" \
              --env VERSION_CALLS_MAX_MS="$version_calls_max_ms" \
              --env NPM_CONFIG_AUDIT=false \
              --env NPM_CONFIG_ENGINE_STRICT=true \
              --env NPM_CONFIG_FUND=false \
              '${{ matrix._.docker_image }}' sh -eu -c '
                npm init -y >/dev/null
                attempt=1
                until npm install --package-lock=false --prefer-online "$PACKAGE_SPEC"; do
                  rm -rf node_modules package-lock.json
                  if [ "$attempt" -ge 6 ]; then exit 1; fi
                  delay=$((1 << attempt))
                  if [ "$delay" -gt 20 ]; then delay=20; fi
                  echo "$PACKAGE_SPEC is not installable yet; retrying in ${delay}s (${attempt}/6)"
                  sleep "$delay"
                  attempt=$((attempt + 1))
                done
                npm ls "$EXPECTED_NATIVE_PACKAGE"
                node verify-node-release-package.mjs
              '
          else
            install_and_verify() {
              local spec="$1"
              local directory="$2"
              local attempt delay
              rm -rf "$directory"
              mkdir "$directory"
              cp scripts/verify-node-release-package.mjs "$directory/"
              pushd "$directory" >/dev/null
              npm init -y >/dev/null
              for attempt in 1 2 3 4 5 6; do
                rm -rf node_modules package-lock.json
                if npm install --package-lock=false --prefer-online "$spec"; then
                  npm ls '@boundaryml/baml-bridge-${{ matrix._.npm_package }}'
                  EXPECTED_VERSION="$EXPECTED_VERSION" \
                    COLD_IMPORT_MAX_MS="$cold_import_max_ms" \
                    VERSION_CALLS_MAX_MS="$version_calls_max_ms" \
                    node verify-node-release-package.mjs
                  popd >/dev/null
                  return 0
                fi
                if (( attempt == 6 )); then break; fi
                delay=$((1 << attempt))
                if (( delay > 20 )); then delay=20; fi
                echo "$spec is not installable yet; retrying in ${delay}s (${attempt}/6)"
                sleep "$delay"
              done
              popd >/dev/null
              echo "::error::Failed to install $spec after 6 attempts"
              return 1
            }

            install_and_verify "$exact_spec" registry-exact
            if [[ '${{ matrix._.verify_public_tag }}' == 'true' ]]; then
              install_and_verify "@boundaryml/baml-bridge@${PUBLIC_TAG}" registry-public-tag
            fi
          fi
