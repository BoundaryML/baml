name: BAML Release - Build VSCode Extension

on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Name of the uploaded VSIX artifact'
        type: string
        default: 'baml.vsix'
      is_release_build:
        description: 'Whether this is a release build (affects artifact naming)'
        type: boolean
        default: true
      version:
        description: 'Version string to use for the build'
        type: string
        required: true

jobs:
  build-vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: baml-cli-*
          path: cli-artifacts
          merge-multiple: true
      - run: ls -R cli-artifacts
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: "0.2.92"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Extract and copy binaries
        shell: bash
        run: |
          # Setup server directories
          rm -rf typescript/vscode-ext/packages/vscode/server
          mkdir -p typescript/vscode-ext/packages/vscode/server/{linux-x64,linux-arm64,darwin-x64,darwin-arm64,windows}
          
          # Define platform configurations
          declare -A platforms=(
            ["x86_64-unknown-linux-gnu"]="linux-x64/baml-cli"
            ["aarch64-unknown-linux-gnu"]="linux-arm64/baml-cli"
            ["x86_64-unknown-linux-musl"]="linux-x64/baml-cli"
            ["aarch64-unknown-linux-musl"]="linux-arm64/baml-cli"
            ["x86_64-apple-darwin"]="darwin-x64/baml-cli"
            ["aarch64-apple-darwin"]="darwin-arm64/baml-cli"
            ["x86_64-pc-windows-msvc"]="windows/baml-cli.exe"
          )
          
          # Process each platform
          for target in "${!platforms[@]}"; do
            echo "Processing $target..."
            
            # Verify artifact directory exists
            if [ ! -d "cli-artifacts/baml-cli-$target" ]; then
              echo "Error: Missing artifact directory for $target"
              exit 1
            fi
            
            pushd "cli-artifacts/baml-cli-$target" > /dev/null
            
            # Extract archive
            if [[ $target == *"windows"* ]]; then
              unzip -o baml-cli-*.zip
            else
              tar xzf baml-cli-*.tar.gz
            fi
            
            # Find and copy binary
            if [[ $target == *"windows"* ]]; then
              binary_path=$(find . -type f -name "baml-cli.exe" -not -path "*/\.*")
            else
              binary_path=$(find . -type f -name "baml-cli" -not -path "*/\.*")
            fi
            
            # Update the path to look inside the versioned directory
            if [ -z "$binary_path" ] && [ -d "baml-cli-"*"-$target" ]; then
              if [[ $target == *"windows"* ]]; then
                binary_path=$(find "baml-cli-"*"-$target" -type f -name "baml-cli.exe")
              else
                binary_path=$(find "baml-cli-"*"-$target" -type f -name "baml-cli")
              fi
            fi
            
            if [ -z "$binary_path" ]; then
              echo "Error: Could not find binary for $target"
              popd > /dev/null
              exit 1
            fi
            
            # Define destination path
            dest_path="../../typescript/vscode-ext/packages/vscode/server/${platforms[$target]}"
            
            echo "Copying $binary_path to $dest_path"
            cp "$binary_path" "$dest_path"
            chmod +x "$dest_path"
            
            popd > /dev/null
          done
          
          # Verify all binaries are present and executable
          echo "Verifying all binaries..."
          for target in "${!platforms[@]}"; do
            binary_path="typescript/vscode-ext/packages/vscode/server/${platforms[$target]}"
            if [ ! -f "$binary_path" ]; then
              echo "Error: Missing binary at $binary_path"
              exit 1
            fi
            if [ ! -x "$binary_path" ]; then
              echo "Error: Binary not executable at $binary_path"
              exit 1
            fi
            echo "✓ Verified $binary_path"
          done

      - name: Install dependencies
        run: pnpm install && pnpm build
        working-directory: typescript

      - name: Build VSCode extension
        run: pnpm build
        working-directory: typescript/vscode-ext/packages/vscode

      - name: Prepackage VSIX
        run: pnpm vscode:prepublish
        working-directory: typescript/vscode-ext/packages/vscode

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies
        working-directory: typescript/vscode-ext/packages/vscode

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: typescript/vscode-ext/packages/vscode/*.vsix

