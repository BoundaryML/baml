name: BAML Release - Build VSCode Extension

on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Name of the uploaded VSIX artifact'
        type: string
        default: 'baml.vsix'
      is_release_build:
        description: 'Whether this is a release build (affects artifact naming)'
        type: boolean
        default: true

jobs:
  build-vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: "0.2.92"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v3
        with:
          version: 9.12.0
      - name: Download all CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: baml-cli-*
          path: cli-artifacts
      - name: Copy binaries to language server
        run: |
          rm -r typescript/vscode-ext/packages/vscode/server || true
          mkdir -p typescript/vscode-ext/packages/vscode/server
          mkdir -p typescript/vscode-ext/packages/vscode/server/linux
          mkdir -p typescript/vscode-ext/packages/vscode/server/darwin
          mkdir -p typescript/vscode-ext/packages/vscode/server/windows
          cp cli-artifacts/baml-cli-x86_64-unknown-linux-musl/baml-cli typescript/vscode-ext/packages/vscode/server/linux/baml-cli
          cp cli-artifacts/baml-cli-x86_64-apple-darwin/baml-cli typescript/vscode-ext/packages/vscode/server/darwin/baml-cli
          cp cli-artifacts/baml-cli-x86_64-pc-windows-msvc/baml-cli.exe typescript/vscode-ext/packages/vscode/server/windows/baml-cli.exe
          chmod +x typescript/vscode-ext/packages/vscode/server/linux/baml-cli*
          chmod +x typescript/vscode-ext/packages/vscode/server/darwin/baml-cli*
          chmod +x typescript/vscode-ext/packages/vscode/server/windows/baml-cli.exe
      - name: Install dependencies
        run: pnpm install && pnpm build
        working-directory: typescript
      - name: Build VSCode extension
        run: pnpm build
        working-directory: typescript/vscode-ext/packages/vscode
      - name: Prepackage VSIX
        run: pnpm vscode:prepublish
        working-directory: typescript/vscode-ext/packages/vscode
      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies
        working-directory: typescript/vscode-ext/packages
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: typescript/vscode-ext/packages/baml*.vsix

