name: BAML SDK Release

# Release orchestrator for the BAML SDKs (currently: `baml_core` Python
# wheel via PyPI). Mirrors the shape of `release.yml`: determine-version
# → build → all-builds gate → publish-* jobs.
#
# TODO: tag-driven release. The convention isn't decided yet, so this
# workflow is `workflow_dispatch`-only for now. Once the tag scheme is
# locked in, add a `push: tags:` trigger and revive the tag-parsing
# branch in `determine-version`.
#
# TODO: merge the Homebrew formula dispatch from
# `release-baml-language-alpha.yml` into this workflow so a single
# release tag also bumps the tap. That means adding a `dispatch_homebrew`
# input, threading the homebrew payload through the build outputs, and
# adding a `dispatch-homebrew` job that fires `repository_dispatch` to
# `BoundaryML/homebrew-baml`. See the `Validate tap version before
# dispatch` and `Dispatch Homebrew update` steps in
# `release-baml-language-alpha.yml` for the existing implementation.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI after building (false = build-only rehearsal)"
        type: boolean
        default: false
        required: false
      publish_npm:
        description: "Publish @boundaryml/baml-core-node to npm after building (false = build-only rehearsal)"
        type: boolean
        default: false
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-release-sdk
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # Version comes from `baml_language/sdks/python/pyproject.toml`
  # as-is — bump the file there and merge before tagging a release run.
  build-python-sdk:
    uses: ./.github/workflows/build-python-sdk.reusable.yaml

  # Version comes from `baml_language/sdks/nodejs/bridge_nodejs/package.json`
  # as-is — bump the file there and merge before a release run.
  build-nodejs-sdk:
    uses: ./.github/workflows/build-nodejs-sdk.reusable.yaml

  all-builds:
    name: Assert all builds passed
    runs-on: ubuntu-latest
    needs:
      - build-python-sdk
      - build-nodejs-sdk
    steps:
      - run: echo "::do-nothing::" >/dev/null

  publish-to-pypi:
    needs: [all-builds]
    if: ${{ inputs.publish }}
    # Must use GitHub-hosted runner due to permissions issues with GitHub OIDC trusted publishing
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-sdk-*
          path: dist
          merge-multiple: true
      - name: Verify wheel count
        run: |
          set -euo pipefail
          ls -la dist/
          wheel_count=$(ls dist/*.whl 2>/dev/null | wc -l)
          if [ "$wheel_count" -lt 8 ]; then
            echo "::error::Expected at least 8 wheels, found $wheel_count"
            exit 1
          fi
          echo "Found $wheel_count wheels"
      - name: Publish package to PyPI
        # OIDC trusted publisher binding configured at
        # https://pypi.org/manage/project/baml-core/settings/publishing/
        # — workflow filename and environment must match this file.
        # No password / token in the repo.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-to-npm:
    needs: [all-builds]
    if: ${{ inputs.publish_npm }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      BRIDGE_DIR: baml_language/sdks/nodejs/bridge_nodejs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Download native addons
        uses: actions/download-artifact@v8
        with:
          pattern: nodejs-sdk-*
          path: ${{ env.BRIDGE_DIR }}/artifacts
          merge-multiple: true
      - name: Verify native-addon count
        working-directory: ${{ env.BRIDGE_DIR }}
        run: |
          set -euo pipefail
          ls -la artifacts/
          node_count=$(ls artifacts/*.node 2>/dev/null | wc -l)
          if [ "$node_count" -lt 8 ]; then
            echo "::error::Expected at least 8 native addons, found $node_count"
            exit 1
          fi
          echo "Found $node_count native addons"
      - name: Install dependencies + build TS
        working-directory: ${{ env.BRIDGE_DIR }}
        run: |
          pnpm install --ignore-scripts
          pnpm build:proto
          pnpm build:ts_build
          pnpm build:copy-proto
      - name: Assemble per-platform npm packages
        working-directory: ${{ env.BRIDGE_DIR }}
        # `napi prepublish` (from @napi-rs/cli) reads `napi.targets` +
        # the downloaded `artifacts/*.node`, writes the per-platform
        # `@boundaryml/baml-core-node-<triple>` sub-packages, and wires the
        # umbrella package's `optionalDependencies` to them.
        run: pnpm exec napi create-npm-dirs && pnpm exec napi artifacts --output-dir ./artifacts
      - name: Publish to npm
        working-directory: ${{ env.BRIDGE_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm exec napi prepublish -t npm --skip-gh-release
