name: Wrapper tests (Reusable)
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''
      release_candidates:
        type: boolean
        default: false
      wrapper_version:
        type: string
        default: ''
      enabled:
        # Skips the test steps, so the calling job still succeeds and
        # does not skip release jobs that need it with the implicit success().
        type: boolean
        default: true
    secrets:
      BAML_SCCACHE_R2_ACCESS_KEY_ID:
        required: false
      BAML_SCCACHE_R2_SECRET_ACCESS_KEY:
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash

env:
  BAML_SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.BAML_SCCACHE_R2_ACCESS_KEY_ID }}
  BAML_SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BAML_SCCACHE_R2_SECRET_ACCESS_KEY }}
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_OPT_LEVEL: "1"
  CARGO_PROFILE_TEST_OPT_LEVEL: "1"
  RUSTUP_MAX_RETRIES: 10

jobs:
  # One native Linux target exercises wrapper behavior without repeating it per OS/ABI.
  tests:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    env:
      TARGET: x86_64-unknown-linux-gnu
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@v1
        if: inputs.enabled
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        if: inputs.enabled
        with:
          workspace: baml_language
          targets: ${{ env.TARGET }}
          enable-cache: false
          enable-cross: false
      - name: Install CI cache tools
        if: inputs.enabled
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv"
      - uses: Swatinem/rust-cache@v2
        if: inputs.enabled
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/canary' }}
          shared-key: linux-cargo
      - name: Load CI compiler cache configuration
        if: inputs.enabled
        run: |
          set -euo pipefail
          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        if: inputs.enabled
        with:
          python-version: '3.12'
      - name: Check installer bootstrap compatibility
        if: inputs.enabled
        run: python -m unittest discover -s scripts/tests -p 'test_installer_bootstrap.py' -v
      - uses: actions/download-artifact@v8
        if: inputs.enabled && inputs.release_candidates
        with:
          name: baml-wrapper-candidates
          path: release-candidates/baml
      - uses: actions/download-artifact@v8
        if: inputs.enabled && inputs.release_candidates
        with:
          name: wrapper-${{ env.TARGET }}
          path: release-candidates/rust
      - name: Run high-value wrapper tests against both implementations and variants
        if: inputs.enabled
        shell: bash
        env:
          RELEASE_CANDIDATES: ${{ inputs.release_candidates }}
          WRAPPER_VERSION: ${{ inputs.wrapper_version }}
        run: |
          set -euo pipefail
          options=(--target "$TARGET" --profile ci)
          if [[ "$RELEASE_CANDIDATES" == 'true' ]]; then
            options+=(--release-artifacts "$PWD/release-candidates" --wrapper-version "$WRAPPER_VERSION")
          fi
          python baml_language/wrapper_tests/run "${options[@]}" 2>&1 | tee wrapper-tests.log
      - name: Show sccache stats
        if: always() && inputs.enabled
        run: sccache --show-stats
      - uses: actions/upload-artifact@v7
        if: always() && inputs.enabled
        with:
          name: baml-wrapper-tests-${{ env.TARGET }}
          path: wrapper-tests.log
