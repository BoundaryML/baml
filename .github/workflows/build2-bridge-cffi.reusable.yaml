name: BAML Release - Build bridge_cffi

# Builds the standalone `bridge_cffi` engine cdylib, one per target. This is a
# LANGUAGE-NEUTRAL artifact: every dylib-loader SDK dlopens the same library at
# runtime (the Rust `baml_bridge` crate today; the Go bridge when it migrates),
# so it is built once here rather than inside any one language's SDK workflow.
#
# Adapts the legacy `libbaml-cffi` job shape (build -> rename to the loader's
# expected asset name -> `.sha256` sidecar) but repointed at
# `baml_language/crates/bridge_cffi`, stamped from the frozen plan, and built
# with `release-bridge-cffi` (`panic = "unwind"` — the dylib loads into the
# user's process, so `bridge_cffi`'s catch_unwind boundary must be able to
# unwind). Unlike the legacy engine's `baml_cffi`, `bridge_cffi` vendors protoc
# and has no Go bindings, so no protoc/protoc-gen-go/Go setup is needed.
#
# The smoke is language-neutral too: strict C11 and C++17 programs include only
# the checked-in public header, load the artifact, resolve `baml_get_api_v1`,
# validate the append-only table prefix, and call/free `version()` while also
# asserting the product version stamped into the release plan.
#
# Consumer contract (for other bridges): one artifact per target named
# `bridge-cffi-<target>`, each containing the cdylib, its `.sha256`, and the
# current source/run/attempt/release identity record. The cdylib filename
# matches `baml_bridge::loader::target_lib_filename`
# (`libbaml_cffi-<triple>.{so,dylib}` on Unix, `baml_cffi-<triple>.dll` on
# Windows); its C ABI `version()` returns the plan's canonical version. A Go
# (or any) dylib-loader SDK consumes these the same way.
#
# The producer artifact retains the legacy `baml_cffi` filename declared by
# the central platform/release contract. The C# package assembler maps that
# immutable producer input to its canonical RID-local `bridge_cffi` filename.
# A future producer rename is a coordinated loader/release-contract change,
# not an open C# implementation decision.
#
# Cross-compilation status (validate the full matrix with a `workflow_dispatch`
# dry-run before other bridges depend on this):
#   - darwin x86_64/aarch64: native cargo, aws-lc-sys cross-compile confirmed.
#   - linux gnu x86_64/aarch64: `cross` with prebuilt aws-lc-sys bindings.
#   - linux musl x86_64/aarch64: `cross`, aws-lc-sys builds fine. musl defaults
#     to `+crt-static`, which cannot emit a cdylib, so the build disables
#     `crt-static` (RUSTFLAGS in the build step + `Cross.toml` passthrough) to
#     produce a musl `.so` dynamically linked against musl libc. Experimental
#     until an Alpine (or other real musl) dlopen smoke proves a consumer loads
#     it.
#   - windows aarch64: experimental until a native arm64 smoke runner exists.
#   - windows x86_64: `AWS_LC_SYS_PREBUILT_NASM=1` (below) lets aws-lc-sys use
#     its prebuilt NASM objects if the runner has no NASM.

on:
  workflow_call:
    inputs:
      release_plan_json:
        description: "Frozen BAML language release-plan.json content"
        type: string
        default: ""
        required: false
      source_sha:
        description: "Exact repository commit to build"
        type: string
        default: ""
        required: false
      include_csharp_entry_diagnostics:
        description: "Also build and upload debug-enabled, unstripped native diagnostics for the manual C# feasibility gate"
        type: boolean
        default: false
        required: false
  # Manual-only standalone trigger for testing this reusable workflow before it
  # is wired into the release graph (with no inputs it builds a canary-stamped
  # artifact). It is otherwise invoked via `workflow_call`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # suffix is important to prevent a concurrency deadlock with the calling workflow
  group: ${{ github.workflow }}-${{ github.ref }}-build-bridge-cffi
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The cffi build matrix is generated from the repository's platform contract
  # (`release/platforms.json`) so the target set + per-target build config live
  # in one machine-readable place, not a hand-copied YAML list. The experimental
  # musl + arm64-Windows targets carry `experimental: true` in the contract,
  # which drives `continue-on-error` on the build job below.
  matrix:
    name: Compute target matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Generate the cffi build matrix from the platform contract
        id: gen
        run: |
          set -euo pipefail
          # One entry per target whose `cffi` artifact is present (a missing
          # `cffi` means unsupported → excluded). Each entry is the fields the
          # build job reads: target + runner (as `os`) + the true-valued
          # use_cross / smoke / experimental flags.
          include="$(jq -c '[.targets[]
            | select(.artifacts.cffi != null)
            | .artifacts.cffi as $c
            | {target: .triple, os: $c.runner}
              + ({use_cross: $c.use_cross, smoke: $c.smoke, experimental: $c.experimental}
                 | with_entries(select(.value == true)))]' release/platforms.json)"
          echo "include=$include" >> "$GITHUB_OUTPUT"
          jq . <<<"$include"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        _: ${{ fromJson(needs.matrix.outputs.include) }}

    name: ${{ matrix._.target }}
    runs-on: ${{ matrix._.os }}
    timeout-minutes: 180
    # Experimental targets are built when possible but never block the release.
    continue-on-error: ${{ matrix._.experimental || false }}
    env:
      CARGO: cargo
      # Let aws-lc-sys use its prebuilt NASM objects on Windows x86-64 if the
      # runner has no NASM installed (consulted only there; harmless elsewhere).
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Stamp release plan
        env:
          RELEASE_PLAN_JSON: ${{ inputs.release_plan_json }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_PLAN_JSON:-}" ]]; then
            printf '%s\n' "$RELEASE_PLAN_JSON" > release-plan.json
          else
            scripts/baml-language-version plan --channel canary --out release-plan.json
          fi
          scripts/baml-language-version stamp --plan release-plan.json

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix._.target }}
          enable-cache: false
          enable-cross: false
          skip-protoc: true

      - name: Install cross (Linux targets)
        if: matrix._.use_cross
        run: |
          set -euo pipefail
          cargo install cross --locked --version 0.2.5
          echo 'CARGO=cross' >> "$GITHUB_ENV"

      - name: Build bridge_cffi cdylib
        working-directory: baml_language
        env:
          TARGET: ${{ matrix._.target }}
        run: |
          set -euo pipefail
          # `bridge_cffi` is `crate-type = ["cdylib", "lib"]`; the cdylib is the
          # release artifact. `release-bridge-cffi` = release + panic = "unwind".
          #
          # musl targets default to `+crt-static`, and rustc cannot emit a
          # cdylib under a static CRT — it silently drops the crate type and
          # produces only the `.rlib`. Disable `crt-static` so the build yields
          # a real musl `.so`, dynamically linked against musl libc and
          # dlopen-loadable on a musl consumer (e.g. Alpine). Scoped to musl so
          # the other targets keep their `.cargo/config.toml` rustflags (the
          # Windows `/STACK` link-arg), which a blanket RUSTFLAGS would clobber.
          # `cross` forwards RUSTFLAGS into the build container via `Cross.toml`.
          if [[ "$TARGET" == *-musl ]]; then
            export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-C target-feature=-crt-static"
          fi
          ${CARGO} build -p bridge_cffi --profile release-bridge-cffi --target "$TARGET"

      - name: Rename and checksum artifact
        id: artifact
        working-directory: baml_language
        run: |
          set -euo pipefail
          target="${{ matrix._.target }}"
          outdir="target/${target}/release-bridge-cffi"
          case "$target" in
            *windows*) base="bridge_cffi.dll";    asset="baml_cffi-${target}.dll" ;;
            *apple*)   base="libbridge_cffi.dylib"; asset="libbaml_cffi-${target}.dylib" ;;
            *)         base="libbridge_cffi.so";    asset="libbaml_cffi-${target}.so" ;;
          esac

          if [[ ! -f "${outdir}/${base}" ]]; then
            echo "::error::expected cdylib ${outdir}/${base} not found"
            ls -la "${outdir}" || true
            exit 1
          fi
          mv "${outdir}/${base}" "${outdir}/${asset}"

          # sha256 sidecar in `sha256sum` format (`<hash>  <name>`), which the
          # loader's checksum parser reads.
          (
            cd "${outdir}"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${asset}"
            else
              shasum -a 256 "${asset}"
            fi
          ) > "${outdir}/${asset}.sha256"
          {
            echo "source_sha=${{ inputs.source_sha || github.sha }}"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_attempt=${{ github.run_attempt }}"
            echo "release_version=$(jq -r .canonical_version ../release-plan.json)"
            echo "target=$target"
            echo "asset=$asset"
          } > "${outdir}/artifact-identity.txt"

          echo "dir=${outdir}" >> "$GITHUB_OUTPUT"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          echo "Built ${asset}"
          cat "${outdir}/${asset}.sha256"

      - name: Smoke test the public C and C++ ABI (Unix)
        if: ${{ matrix._.smoke && !contains(matrix._.target, 'windows') }}
        working-directory: baml_language
        env:
          ARTIFACT_DIR: ${{ steps.artifact.outputs.dir }}
          ARTIFACT_ASSET: ${{ steps.artifact.outputs.asset }}
        run: |
          set -euo pipefail
          expected="$(jq -r .canonical_version ../release-plan.json)"
          python3 crates/bridge_cffi/tests/run_abi_smoke.py \
            "${ARTIFACT_DIR}/${ARTIFACT_ASSET}" \
            "$expected"

      - name: Smoke test the public C and C++ ABI (Windows)
        if: ${{ matrix._.smoke && contains(matrix._.target, 'windows') }}
        shell: powershell
        working-directory: baml_language
        env:
          MSVC_ARCH: ${{ startsWith(matrix._.target, 'aarch64-') && 'arm64' || 'x64' }}
          ARTIFACT_DIR: ${{ steps.artifact.outputs.dir }}
          ARTIFACT_ASSET: ${{ steps.artifact.outputs.asset }}
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * -property installationPath
          if (-not $vsInstall) {
            throw "Visual Studio installation not found"
          }
          $vcvars = Join-Path $vsInstall "VC\Auxiliary\Build\vcvarsall.bat"
          $expected = jq -r .canonical_version ..\release-plan.json
          $library = "$env:ARTIFACT_DIR/$env:ARTIFACT_ASSET"
          & cmd.exe /d /s /c "call `"$vcvars`" $env:MSVC_ARCH && python3 crates/bridge_cffi/tests/run_abi_smoke.py `"$library`" `"$expected`""
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload cdylib artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-cffi-${{ matrix._.target }}
          path: |
            baml_language/${{ steps.artifact.outputs.dir }}/${{ steps.artifact.outputs.asset }}
            baml_language/${{ steps.artifact.outputs.dir }}/${{ steps.artifact.outputs.asset }}.sha256
            baml_language/${{ steps.artifact.outputs.dir }}/artifact-identity.txt
          if-no-files-found: error
          overwrite: true

      - name: Build unstripped C# entry-gate diagnostic
        if: inputs.include_csharp_entry_diagnostics
        working-directory: baml_language
        env:
          TARGET: ${{ matrix._.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == *-musl ]]; then
            export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-C target-feature=-crt-static"
          fi
          split_debug_config=()
          if [[ "$TARGET" == *-apple-darwin ]]; then
            split_debug_config=(
              --config
              'profile.release-bridge-cffi.split-debuginfo="packed"'
            )
          fi
          # Use Cargo CLI controls rather than environment variables: `cross`
          # forwards only its configured environment allowlist into Linux
          # build containers. Apple diagnostics use packed split debug so the
          # immutable bundle retains one UUID-matched dSYM instead of referring
          # to unpacked intermediate object files.
          ${CARGO} build \
            -p bridge_cffi \
            --profile release-bridge-cffi \
            --target "$TARGET" \
            --target-dir target/csharp-entry-unstripped \
            --config profile.release-bridge-cffi.strip=false \
            --config profile.release-bridge-cffi.debug=2 \
            "${split_debug_config[@]}"

      - name: Verify Unix diagnostic contains debug information and symbols
        if: inputs.include_csharp_entry_diagnostics && !contains(matrix._.target, 'windows')
        working-directory: baml_language
        env:
          TARGET: ${{ matrix._.target }}
        run: |
          set -euo pipefail
          outdir="target/csharp-entry-unstripped/${TARGET}/release-bridge-cffi"
          case "$TARGET" in
            *apple*)
              primary="libbridge_cffi.dylib"
              format="mach-o"
              file "$outdir/$primary" > "$outdir/diagnostic-inspection.txt"
              case "$TARGET" in
                aarch64-*) expected_arch="arm64" ;;
                x86_64-*) expected_arch="x86_64" ;;
                *)
                  echo "unsupported diagnostic Mach-O target: $TARGET" >&2
                  exit 1
                  ;;
              esac
              actual_arch="$(lipo -archs "$outdir/$primary")"
              test "$actual_arch" = "$expected_arch"
              echo "architecture=$actual_arch" \
                >> "$outdir/diagnostic-inspection.txt"
              # Cargo uplifts the cdylib dSYM through a top-level symlink while
              # retaining its physical output under deps/. Materialize that
              # canonical path so the manifest and uploaded artifact use the
              # same stable name after GitHub strips symlink metadata.
              dsym_bundle="$outdir/${primary}.dSYM"
              if [[ -L "$dsym_bundle" ]]; then
                materialized_dsym="${dsym_bundle}.materialized"
                rm -rf "$materialized_dsym"
                cp -R -L "$dsym_bundle" "$materialized_dsym"
                rm "$dsym_bundle"
                mv "$materialized_dsym" "$dsym_bundle"
              fi
              if [[ ! -d "$dsym_bundle" ]]; then
                echo "missing packed dSYM bundle: $dsym_bundle" >&2
                find "$outdir" -maxdepth 3 -name '*.dSYM' -print >&2
                exit 1
              fi
              dsym_dwarf_root="$dsym_bundle/Contents/Resources/DWARF"
              dsym_dwarf_count="$(find "$dsym_dwarf_root" \
                -type f -print |
                wc -l |
                tr -d ' ')"
              if [[ "$dsym_dwarf_count" -ne 1 ]]; then
                echo \
                  "expected exactly one packed dSYM DWARF file for $TARGET; found $dsym_dwarf_count" \
                  >&2
                find "$dsym_dwarf_root" -type f -print >&2
                exit 1
              fi
              dsym_dwarf="$(find "$dsym_dwarf_root" -type f -print |
                sed -n '1p')"
              dwarf_source="$dsym_dwarf"
              dylib_uuid="$(dwarfdump --uuid "$outdir/$primary" |
                awk '
                  /^UUID:/ {
                    arch = $3
                    gsub(/[()]/, "", arch)
                    print tolower($2) " " arch
                  }
                ')"
              dsym_uuid="$(dwarfdump --uuid "$dsym_dwarf" |
                awk '
                  /^UUID:/ {
                    arch = $3
                    gsub(/[()]/, "", arch)
                    print tolower($2) " " arch
                  }
                ')"
              test -n "$dylib_uuid"
              test "$dylib_uuid" = "$dsym_uuid"
              {
                echo "dylib_uuid_arch=$dylib_uuid"
                echo "dsym_uuid_arch=$dsym_uuid"
              } >> "$outdir/diagnostic-inspection.txt"
              dwarfdump --debug-info "$dwarf_source" |
                awk '
                  !found && /DW_TAG_compile_unit/ {
                    print "debug_compile_unit=" $0
                    found = 1
                  }
                  END { exit !found }
                ' >> "$outdir/diagnostic-inspection.txt"
              all_symbol_count="$(nm -U "$outdir/$primary" |
                awk 'NF { count++ } END { print count + 0 }')"
              exported_symbol_count="$(nm -gU "$outdir/$primary" |
                awk 'NF { count++ } END { print count + 0 }')"
              test "$all_symbol_count" -gt "$exported_symbol_count"
              local_symbol_count="$((all_symbol_count - exported_symbol_count))"
              symbol_count="$all_symbol_count"
              ;;
            *)
              primary="libbridge_cffi.so"
              format="elf"
              {
                file "$outdir/$primary"
                readelf --file-header --sections --wide "$outdir/$primary"
              } > "$outdir/diagnostic-inspection.txt"
              case "$TARGET" in
                aarch64-*)
                  expected_arch="aarch64"
                  grep -Eq 'Machine:[[:space:]]+AArch64' \
                    "$outdir/diagnostic-inspection.txt"
                  ;;
                x86_64-*)
                  expected_arch="x86_64"
                  grep -Eq \
                    'Machine:[[:space:]]+Advanced Micro Devices X86-64' \
                    "$outdir/diagnostic-inspection.txt"
                  ;;
                *)
                  echo "unsupported diagnostic ELF target: $TARGET" >&2
                  exit 1
                  ;;
              esac
              grep -Fq 'not stripped' "$outdir/diagnostic-inspection.txt"
              grep -Fq '.debug_info' "$outdir/diagnostic-inspection.txt"
              grep -Fq '.debug_line' "$outdir/diagnostic-inspection.txt"
              grep -Fq '.symtab' "$outdir/diagnostic-inspection.txt"
              symbol_count="$(nm --defined-only "$outdir/$primary" |
                awk 'END { print NR }')"
              test "$symbol_count" -gt 0
              ;;
          esac
          {
            echo "target=$TARGET"
            echo "source_sha=${{ inputs.source_sha || github.sha }}"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_attempt=${{ github.run_attempt }}"
            echo "release_version=$(jq -r .canonical_version ../release-plan.json)"
            echo "format=$format"
            echo "architecture=$expected_arch"
            echo "debug_info=present"
            echo "symbol_table=present"
            echo "unstripped=true"
            echo "symbol_count=$symbol_count"
            if [[ "$format" == "mach-o" ]]; then
              echo "exported_symbol_count=$exported_symbol_count"
              echo "local_symbol_count=$local_symbol_count"
            fi
          } > "$outdir/diagnostic-verification.txt"
          (
            cd "$outdir"
            {
              printf '%s\n' \
                "$primary" \
                diagnostic-inspection.txt \
                diagnostic-verification.txt
              if [[ "$format" == "mach-o" ]]; then
                find "./${primary}.dSYM" -type f -print
              fi
              find . -maxdepth 1 -type f -name '*.dwp' -print
            } |
              sed 's#^\./##' |
              LC_ALL=C sort -u |
              while IFS= read -r file; do
                if command -v sha256sum >/dev/null 2>&1; then
                  sha256sum "$file"
                else
                  shasum -a 256 "$file"
                fi
              done
          ) > "$outdir/diagnostic-manifest.sha256"

      - name: Verify Windows diagnostic contains debug information and symbols
        if: inputs.include_csharp_entry_diagnostics && contains(matrix._.target, 'windows')
        shell: pwsh
        working-directory: baml_language
        env:
          TARGET: ${{ matrix._.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $outdir = "target/csharp-entry-unstripped/$env:TARGET/release-bridge-cffi"
          $primary = Join-Path $outdir "bridge_cffi.dll"
          if (-not (Test-Path $primary -PathType Leaf)) {
            throw "missing diagnostic DLL: $primary"
          }
          $pdbs = @(Get-ChildItem $outdir -Filter "*.pdb" -File)
          if ($pdbs.Count -ne 1) {
            throw "expected exactly one diagnostic PDB, found $($pdbs.Count)"
          }
          $pdb = $pdbs[0]
          $pdbMagicBytes = [byte[]]::new(32)
          $pdbStream = [System.IO.File]::OpenRead($pdb.FullName)
          try {
            if ($pdbStream.Length -lt $pdbMagicBytes.Length) {
              throw "diagnostic PDB is truncated"
            }
            $pdbMagicRead = $pdbStream.Read(
              $pdbMagicBytes,
              0,
              $pdbMagicBytes.Length)
            if ($pdbMagicRead -ne $pdbMagicBytes.Length) {
              throw "diagnostic PDB signature could not be read"
            }
          } finally {
            $pdbStream.Dispose()
          }
          $pdbMagic = [System.Text.Encoding]::ASCII.GetString($pdbMagicBytes)
          if (-not $pdbMagic.StartsWith("Microsoft C/C++ MSF 7.00")) {
            throw "diagnostic PDB has an unexpected container signature"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * -property installationPath
          if (-not $vsInstall) {
            throw "Visual Studio installation not found"
          }
          Import-Module (Join-Path $vsInstall `
            "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          $arch = if ($env:TARGET.StartsWith("aarch64-")) { "arm64" } else { "amd64" }
          Enter-VsDevShell -VsInstallPath $vsInstall -SkipAutomaticLocation `
            -DevCmdArguments "-arch=$arch -host_arch=$arch"
          $inspection = & dumpbin /headers $primary
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin failed for diagnostic DLL"
          }
          $inspectionText = $inspection -join [Environment]::NewLine
          $expectedMachine = if ($env:TARGET.StartsWith("aarch64-")) {
            "AA64 machine \(ARM64\)"
          } else {
            "8664 machine \(x64\)"
          }
          if ($inspectionText -notmatch $expectedMachine) {
            throw "diagnostic DLL machine does not match $env:TARGET"
          }
          if ($inspectionText -notmatch "Debug Directories") {
            throw "diagnostic DLL has no PE debug directory"
          }
          if ($inspectionText -notmatch `
              'Format:\s+RSDS,\s+\{(?<Guid>[0-9A-Fa-f-]{36})\},\s+(?<Age>[0-9]+),') {
            throw "diagnostic DLL has no parseable RSDS GUID and age"
          }
          $peGuid = $Matches["Guid"].ToLowerInvariant()
          $peAge = [int]$Matches["Age"]

          $pdbUtil = (Get-Command llvm-pdbutil.exe -ErrorAction Stop).Source
          $pdbSummary = & $pdbUtil dump -summary $pdb.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "llvm-pdbutil failed to inspect the diagnostic PDB"
          }
          $pdbSummaryText = $pdbSummary -join [Environment]::NewLine
          if ($pdbSummaryText -notmatch `
              '(?m)^\s*Guid:\s+\{?(?<Guid>[0-9A-Fa-f-]{36})\}?\s*$') {
            throw "diagnostic PDB summary has no parseable GUID"
          }
          $pdbGuid = $Matches["Guid"].ToLowerInvariant()
          if ($pdbSummaryText -notmatch '(?m)^\s*Age:\s+(?<Age>[0-9]+)\s*$') {
            throw "diagnostic PDB summary has no parseable age"
          }
          $pdbAge = [int]$Matches["Age"]
          if ($peGuid -ne $pdbGuid -or $peAge -ne $pdbAge) {
            throw "diagnostic DLL RSDS identity does not match the PDB"
          }

          [long]$procedureSymbolCount = 0
          & $pdbUtil dump -symbols $pdb.FullName |
            ForEach-Object {
              if ($_ -match 'S_(G|L)PROC32') {
                $procedureSymbolCount++
              }
            }
          if ($LASTEXITCODE -ne 0) {
            throw "llvm-pdbutil failed to inspect diagnostic PDB symbols"
          }
          if ($procedureSymbolCount -le 0) {
            throw "diagnostic PDB contains no procedure symbol records"
          }
          $inspectionText | Out-File `
            (Join-Path $outdir "diagnostic-inspection.txt") -Encoding utf8
          @(
            "pe_rsds_guid=$peGuid"
            "pe_rsds_age=$peAge"
            "pdb_guid=$pdbGuid"
            "pdb_age=$pdbAge"
            "pdb_procedure_symbol_count=$procedureSymbolCount"
          ) | Add-Content `
            (Join-Path $outdir "diagnostic-inspection.txt") -Encoding ascii
          $verificationLines = @(
            "target=$env:TARGET"
            "source_sha=${{ inputs.source_sha || github.sha }}"
            "workflow_run_id=${{ github.run_id }}"
            "workflow_run_attempt=${{ github.run_attempt }}"
            "release_version=$(jq -r .canonical_version ..\release-plan.json)"
            "format=pe"
            "architecture=$arch"
            "debug_info=present"
            "symbol_table=present"
            "unstripped=true"
            "pdb=present"
            "pdb_bytes=$($pdb.Length)"
          )
          # This identity file is consumed with exact whole-line matching on
          # Linux. Write canonical BOM-free LF text instead of PowerShell's
          # platform-default CRLF so the immutable bytes are portable.
          $verificationPath = Join-Path $outdir "diagnostic-verification.txt"
          $verificationText = ($verificationLines -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            $verificationPath,
            $verificationText,
            [System.Text.UTF8Encoding]::new($false))

          $manifestFiles = @(
            (Get-Item $primary)
            $pdb
            (Get-Item (Join-Path $outdir "diagnostic-inspection.txt"))
            (Get-Item $verificationPath)
          )
          $manifest = foreach ($file in $manifestFiles) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $manifest | Set-Content `
            (Join-Path $outdir "diagnostic-manifest.sha256") -Encoding ascii

      - name: Upload unstripped C# entry-gate diagnostic
        if: inputs.include_csharp_entry_diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-cffi-diagnostics-${{ matrix._.target }}
          path: |
            baml_language/target/csharp-entry-unstripped/${{ matrix._.target }}/release-bridge-cffi/bridge_cffi.dll
            baml_language/target/csharp-entry-unstripped/${{ matrix._.target }}/release-bridge-cffi/libbridge_cffi.dylib
            baml_language/target/csharp-entry-unstripped/${{ matrix._.target }}/release-bridge-cffi/libbridge_cffi.so
            baml_language/target/csharp-entry-unstripped/${{ matrix._.target }}/release-bridge-cffi/*.pdb
            baml_language/target/csharp-entry-unstripped/${{ matrix._.target }}/release-bridge-cffi/*.dSYM/**
            baml_language/target/csharp-entry-unstripped/${{ matrix._.target }}/release-bridge-cffi/*.dwp
            baml_language/target/csharp-entry-unstripped/${{ matrix._.target }}/release-bridge-cffi/diagnostic-inspection.txt
            baml_language/target/csharp-entry-unstripped/${{ matrix._.target }}/release-bridge-cffi/diagnostic-verification.txt
            baml_language/target/csharp-entry-unstripped/${{ matrix._.target }}/release-bridge-cffi/diagnostic-manifest.sha256
          if-no-files-found: error
          overwrite: true
