name: BAML SDK Release - Build Node.js

# Per-platform NAPI prebuild matrix for the Node.js SDK runtime package
# `@boundaryml/baml-core-node`. Mirrors `build-python-sdk.reusable.yaml` (same
# 8-target set), with `napi-rs` standing in for `maturin`. Each job builds
# one `*.node` native addon and uploads it as `nodejs-sdk-<target>`; the
# future npm publisher can download them all, run `napi prepublish` to assemble
# per-platform npm sub-packages, and publish the umbrella package + sub-packages.
# Release builds must pass the frozen BAML language release plan so package.json
# and Rust version surfaces are stamped before any build reads them.

on:
  workflow_call:
    inputs:
      release_plan_json:
        description: "Frozen BAML language release-plan.json content"
        type: string
        default: ""
        required: false
  push:
    branches:
      # Mirror the Python reusable workflow's rehearsal-branch trigger so the
      # Node build matrix can be exercised on a branch before release.
      - sam/publish-nodejs

concurrency:
  # suffix is important to prevent a concurrency deadlock with the calling workflow
  group: ${{ github.workflow }}-${{ github.ref }}-build-nodejs-sdk
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BRIDGE_DIR: baml_language/sdks/nodejs/bridge_nodejs
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        _:
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-24.04-arm
            # Target glibc 2.28 for aarch64 using the available rust-cross image.
            # This is newer than the ideal glibc floor; our users still need the oldest
            # practical compatible baseline we can support for this target.
            # See https://github.com/BoundaryML/baml/issues/2736
            container: ghcr.io/rust-cross/manylinux_2_28-cross:aarch64
            before: |
              echo "CFLAGS_aarch64_unknown_linux_gnu=-D__ARM_ARCH=8" >> "$GITHUB_ENV"
          - target: aarch64-apple-darwin
            host: macos-14
          - target: x86_64-apple-darwin
            host: macos-14
          - target: x86_64-pc-windows-msvc
            host: windows-latest
          - target: aarch64-pc-windows-msvc
            host: windows-11-arm
          - target: x86_64-unknown-linux-gnu
            # Do not use -latest, since it uses a newer glibc version.
            host: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            host: ubuntu-22.04
            before: |
              sudo apt-get update
              sudo apt-get install -y musl-tools
              cat >>$GITHUB_ENV <<EOF
              CC_x86_64_unknown_linux_musl=musl-gcc
              RUSTFLAGS=-C target-feature=-crt-static --cfg tracing_unstable
              EOF
          - target: aarch64-unknown-linux-musl
            host: ubuntu-24.04-arm
            before: |
              sudo apt-get update
              sudo apt-get install -y musl-tools
              cat >>$GITHUB_ENV <<EOF
              CC_aarch64_unknown_linux_musl=musl-gcc
              RUSTFLAGS=-C target-feature=-crt-static --cfg tracing_unstable
              EOF

    name: ${{ matrix._.target }}
    runs-on: ${{ matrix._.host }}
    container: ${{ matrix._.container }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Stamp release plan
        env:
          RELEASE_PLAN_JSON: ${{ inputs.release_plan_json }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_PLAN_JSON:-}" ]]; then
            printf '%s\n' "$RELEASE_PLAN_JSON" > release-plan.json
          else
            scripts/baml-language-version plan --channel canary --out release-plan.json
          fi
          scripts/baml-language-version stamp --plan release-plan.json

      - name: Check GLIBC version
        if: contains(matrix._.target, 'linux') && !contains(matrix._.target, 'musl')
        run: ldd --version

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-action-version: v6
          install-dependencies: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix._.target }}
          workspace: baml_language
          prefix-key: v5-rust-nodejs-sdk-${{ matrix._.target }}
          cache-on-failure: true
          enable-cross: false
          skip-protoc: true

      - name: Build tools setup
        if: matrix._.before
        run: ${{ matrix._.before }}

      - name: Install dependencies
        working-directory: ${{ env.BRIDGE_DIR }}
        run: pnpm install --ignore-scripts

      - name: Build protobuf runtime
        working-directory: ${{ env.BRIDGE_DIR }}
        run: pnpm build:proto

      - name: Build native addon (${{ matrix._.target }})
        working-directory: ${{ env.BRIDGE_DIR }}
        run: pnpm exec napi build --platform --release --target ${{ matrix._.target }} --js native.js --dts native.d.ts

      - name: Upload native addon
        uses: actions/upload-artifact@v7
        with:
          name: nodejs-sdk-${{ matrix._.target }}
          path: ${{ env.BRIDGE_DIR }}/*.node
          if-no-files-found: error
