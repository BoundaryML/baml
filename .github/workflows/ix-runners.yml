# Reconciles the ix runner fleet serving the ix-* preview lanes.
#
# Setup (the whole of it): set IX_TOKEN in the repo's Actions secrets,
# install the ix-runners GitHub App, and merge. Machines exist per job:
# each queued ix-labeled job gets a fresh runner forked from a per-lane
# seed, and seeds are minted from green canary runs. The pool definition
# (lanes, sizes, region, every dial) lives in the ix-runners repo,
# versioned by the action pin below - nothing in this repo configures it,
# so the reconcile needs no checkout of this repo at all.
#
# `schedule` and `workflow_run` triggers register from the default branch
# only; until this file is on canary, reconcile by hand (workflow_dispatch,
# likewise default-branch only).
name: ix runners

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: ["CI on ix (preview)"]
    types: [requested]

# Overlapping ticks can double-spawn; this group is the lock.
# cancel-in-progress: false also coalesces a burst: GitHub keeps at most
# one run pending per group, so many workflow_run wakes arriving together
# become one reconcile after the current one.
concurrency:
  group: ix-runners
  cancel-in-progress: false

# Every GitHub mutation goes through a token ix vends for this run: the
# reconcile proves which repository it is with the run's OIDC identity and
# gets back an installation token scoped to this repo (the ix-runners
# GitHub App must stay installed here). GITHUB_TOKEN reads the job queue
# for the demand signal and nothing else.
permissions:
  contents: read
  actions: read
  # How ix knows which repository is asking for a runner token.
  id-token: write

jobs:
  reconcile:
    name: Reconcile runners
    # Control plane is hosted-only; secrets never reach the fleet.
    runs-on: ubuntu-latest
    # IX_TOKEN lives in this environment's secrets.
    environment: boundary-tools-dev
    steps:
      # Repos without IX_TOKEN configured (forks, and this repo until the
      # secret is set) skip quietly instead of failing every wave.
      - name: Check opt-in
        id: optin
        env:
          IX_TOKEN: ${{ secrets.IX_TOKEN }}
        run: |
          if [ -z "$IX_TOKEN" ]; then
            echo "IX_TOKEN not configured; skipping"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconcile
        if: steps.optin.outputs.ok == 'true'
        uses: indexable-inc/ix-runners@2b432e5b609ec2418277ce10dd5f593d288bd2ca
        with:
          ix-token: ${{ secrets.IX_TOKEN }}
          token-source: ix
          pool: baml
