            const enabledMatrix = baseMatrix.filter((entry) => entry["os-label"] !== "macos");
            // The preview covers the Linux lanes only; the gating
            // workflow keeps sole ownership of the mac/win legs.
            const linuxOnly = true;
            const matrix = linuxOnly
              ? enabledMatrix.filter((entry) => entry["os-label"] === "linux")
              : enabledMatrix;
            const enabledSdkDirs = new Set(enabledMatrix.map((entry) => entry["sdk-dir"]));
            const temporarilyDisabledSdkDirs = [...new Set(
              baseMatrix
                .map((entry) => entry["sdk-dir"])
                .filter((sdkDir) => !enabledSdkDirs.has(sdkDir)),
            )].sort();

            core.setOutput("matrix", JSON.stringify(matrix, null, 2));
            core.setOutput("sdk-dirs", JSON.stringify([...enabledSdkDirs].sort()));
            core.setOutput("temporarily-disabled-sdk-dirs", JSON.stringify(temporarilyDisabledSdkDirs));

  sdk-test-coverage:
    name: "sdk test coverage"
    runs-on: ubuntu-latest
    needs: sdk-test-matrix
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "Assert every SDK directory has a matrix entry"
        uses: actions/github-script@v8
        env:
          MATRIX_SDK_DIRS: ${{ needs.sdk-test-matrix.outputs.sdk-dirs }}
          TEMPORARILY_DISABLED_SDK_DIRS: ${{ needs.sdk-test-matrix.outputs.temporarily-disabled-sdk-dirs }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const sdkRoot = path.join(process.env.GITHUB_WORKSPACE, "baml_language", "sdks");
            const sdkDirs = fs.readdirSync(sdkRoot, { withFileTypes: true })
              .filter((entry) => entry.isDirectory())
              .map((entry) => entry.name)
              .filter((sdkDir) => sdkDir !== "agent-docs")
              .sort();
            const coveredSdkDirs = new Set(JSON.parse(process.env.MATRIX_SDK_DIRS));
            const temporarilyDisabledSdkDirs = new Set(JSON.parse(process.env.TEMPORARILY_DISABLED_SDK_DIRS));
            const missingSdkDirs = sdkDirs.filter(
              (sdkDir) => !coveredSdkDirs.has(sdkDir) && !temporarilyDisabledSdkDirs.has(sdkDir),
            );

            await core.summary
              .addHeading("SDK test matrix coverage")
              .addTable([
                [{ data: "SDK directory", header: true }, { data: "Matrix entry", header: true }],
                ...sdkDirs.map((sdkDir) => [
                  sdkDir,
                  coveredSdkDirs.has(sdkDir)
                    ? "yes"
                    : temporarilyDisabledSdkDirs.has(sdkDir)
                      ? "temporarily disabled (B-1545)"
                      : "no",
                ]),
              ])
              .write();

            if (missingSdkDirs.length > 0) {
              core.setFailed(`SDK directories without an sdk-test-matrix entry: ${missingSdkDirs.join(", ")}`);
            }

  # SDK tests (codegen end-to-end). The `sdk_test_*` crates run bridge and
  # generated-language checks under nextest. Most emit fixture projects from
  # `.baml` sources via build.rs; the initial Ruby/Sorbet entry exercises its
  # loader directly until its generator lands. Their setup scripts do the
  # expensive package-manager/native-build work (`uv sync` + `maturin` for
  # Python, Bundler + bridge_cffi for Ruby, a NAPI build for Node TypeScript,
  # and a Web/Wasm build plus Chromium for Web TypeScript). Run the generated
  # setup guards first so CI exposes setup cost/failures as a separate step; the
  # full test step re-runs the setup scripts, but the warm path should be cheap.
  # Keep each SDK as a separate matrix entry so setup/test timing
  # and failures are attributed to the specific SDK generator.
  sdk-tests:
    name: "sdk tests (${{ matrix.sdk-label }}, ${{ matrix.os-label }})"
    needs: sdk-test-matrix
    strategy:
      fail-fast: false
      # In the merge queue (`merge_group`) only the linux leg runs — the
      # macos/windows legs already ran on the PR. Keep these entries in sync
      # with the standalone platform cargo-test jobs above.
      matrix:
        include: ${{ fromJSON(needs.sdk-test-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runs-on }}
    environment: infisical-github-ci
    timeout-minutes: ${{ matrix.timeout }}
    env:
      BAML_SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.BAML_SCCACHE_R2_ACCESS_KEY_ID }}
      BAML_SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BAML_SCCACHE_R2_SECRET_ACCESS_KEY }}
      # The machine image defaults these to 16; 32 runs clean on the
      # 64-vCPU machines.
      NEXTEST_TEST_THREADS: "32"
      RUST_TEST_THREADS: "32"
      # Same reasoning as CARGO_BUILD_JOBS: the go fixture gates run
      # `go test ./...` on a machine shared with concurrent runners.
      GOMAXPROCS: "16"
      # The fixture test binaries are only ever run, never debugged; skip
      # DWARF on their links (GOFLAGS cannot carry a value containing a
      # space, so -w alone, not -s -w).
      GOFLAGS: "-ldflags=-w"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Keep the warm seed's ignored files (target/, node_modules);
          # tracked files still hard-reset to the SHA. No-op on hosted runners.
          clean: false

      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - name: "Install sdk test tools"
        uses: ./.github/actions/setup-mise
        with:
          install_args: ${{ matrix.install-args }}

      - name: "Install Ruby"
        # setup-ruby refuses self-hosted non-Ubuntu-image runners by design;
        # the ix machine image ships ruby. Hosted fallback still installs it.
        if: matrix.sdk-label == 'ruby-sorbet' && runner.environment != 'self-hosted'
        uses: ./.github/actions/setup-ruby
        with:
          ruby-version: "3.2.2"

      - name: "Install .NET SDK"
        if: matrix.sdk-label == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301

      - name: "Test C# NuGet payload comparison"
        if: matrix.sdk-label == 'csharp'
        run: |
          dotnet run --project \
            baml_language/sdks/csharp/bridge_csharp/tools/Baml.NuGetNormalizer/Baml.NuGetNormalizer.csproj \
            -- --self-test

      - name: "Test nightly C# package version"
        if: matrix.sdk-label == 'csharp' && matrix.os-label == 'linux'
        env:
          BAML_LANGUAGE_RELEASED_AT: "2026-07-23T12:34:56Z"
          BAML_LANGUAGE_VERSION_DATE: "20260723"
          BAML_LANGUAGE_VERSION_NIGHTLY_LETTER: "h"
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          scripts/baml-language-version plan \
            --channel nightly \
            --out "$work/release-plan.json"
          canonical="$(jq -r .canonical_version "$work/release-plan.json")"
          nuget="$(jq -r .registry_versions.nuget "$work/release-plan.json")"
          test "$nuget" = "$canonical"

          scripts/baml-csharp-release-contract matrix \
            | jq -r '.include[]
              | "runtimes/\(.rid)/native/\(.canonical)"' \
            | while IFS= read -r runtime_path; do
                mkdir -p "$work/native/$(dirname "$runtime_path")"
                printf 'version-only fixture\n' \
                  > "$work/native/$runtime_path"
              done
          printf '<Project />\n' > "$work/baml-bridge.targets"
          expected_count="$(scripts/baml-csharp-release-contract matrix \
            | jq '.include | length')"
          project=baml_language/sdks/csharp/bridge_csharp/src/Baml.Bridge.csproj
          dotnet build "$project" --configuration Release --nologo \
            -p:NuGetAudit=false \
            -p:Version="$canonical" \
            -p:InformationalVersion="$canonical" \
            -p:PackageVersion="$nuget"
          dotnet pack "$project" --configuration Release --nologo \
            --no-build --no-restore \
            --output "$work/package" \
            -p:NuGetAudit=false \
            -p:Version="$canonical" \
            -p:InformationalVersion="$canonical" \
            -p:PackageVersion="$nuget" \
            -p:BamlExpectedNativeAssetCount="$expected_count" \
            -p:BamlNativeAssetRoot="$work/native" \
            -p:BamlGeneratedTargetsPath="$work/baml-bridge.targets"
          package="$work/package/baml-bridge.$nuget.nupkg"
          test -f "$package"
          test "$(unzip -p "$package" baml-bridge.nuspec \
            | sed -n 's#.*<version>\([^<]*\)</version>.*#\1#p')" = "$nuget"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: false
          shared-key: ${{ matrix.rust-cache-key }}

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      # Windows-only: swap the .cmd RUSTC_WRAPPER for the native tools_sccache
      # .exe. See the matching step in the gating cargo-tests.reusable.yaml
      # for why.
      - name: "Build native sccache wrapper"
        if: matrix.os-label == 'windows'
        run: |
          set -euo pipefail
          cargo build -p tools_sccache
          echo "RUSTC_WRAPPER=$(pwd -W)/target/debug/baml-sccache.exe" >> "$GITHUB_ENV"
          # CARGO_BUILD_JOBS oversubscription only matters for the Windows build.
          echo "CARGO_BUILD_JOBS=16" >> "$GITHUB_ENV"
        working-directory: baml_language

      # Windows Python only: setup.ps1 builds one baml_bridge wheel and strips
      # the editable source block from each fixture so `uv sync` installs that
      # prebuilt wheel instead of rebuilding baml_bridge per fixture. The later
      # test-time `uv run` processes also need this wheelhouse.
      - name: "Configure Python wheelhouse"
        if: matrix.os-label == 'windows' && matrix.sdk-label == 'python-pydantic2'
        run: echo "UV_FIND_LINKS=$(pwd -W)/target/wheels" >> "$GITHUB_ENV"
        working-directory: baml_language

      - name: "Build tests with --timings"
        run: cargo test --no-run -p ${{ matrix.package-name }} --all-features --timings
        working-directory: baml_language

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Run sdk test setup"
        # The C# crate uses nextest's setup-script hook directly and has no
        # generated setup_guard test. Its setup still runs before the full suite.
        if: matrix.sdk-label != 'csharp'
        run: cargo nextest run -p ${{ matrix.package-name }} --all-features -E 'package(=${{ matrix.package-name }}) and test(setup_guard::ran)'
        working-directory: baml_language

      - name: "Run sdk tests"
        if: matrix.sdk-label != 'csharp'
        run: cargo nextest run -p ${{ matrix.package-name }} --all-features -E 'package(=${{ matrix.package-name }})'
        working-directory: baml_language

      - name: "Run C# sdk tests"
        if: matrix.sdk-label == 'csharp'
        run: cargo nextest run -p ${{ matrix.package-name }} --all-features --no-fail-fast -E 'package(=${{ matrix.package-name }})'
        working-directory: baml_language

      # The Rust bridge runtime crate (baml_bridge). Its tests load the engine
      # cdylib at run time, and its lib test binary mixes pure (loader/encode)
      # with engine-dependent (completion, live-engine) tests, so the whole
      # package runs here — where sdk_test_rust's setup already built the engine
      # into the main target dir — instead of in the general cargo-test lane
      # (where the non-cacheable cdylib build ran as a silent nextest setup
      # script and stalled the Windows job).
      - name: "Run rust bridge tests"
        if: matrix.sdk-label == 'rust'
        run: cargo nextest run -p baml_bridge --all-features
        working-directory: baml_language

      - name: "Upload test results on failure"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-test-failures-${{ matrix.sdk-label }}-${{ matrix.os-label }}
          path: |
            baml_language/sdk_tests/crates/${{ matrix.sdk-path }}/*/generated/
            baml_language/target/nextest/
          if-no-files-found: ignore

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}
          path: sccache-stats-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}
          path: baml_language/target/cargo-timings/cargo-timing-sdk-tests-${{ matrix.sdk-label }}-${{ matrix.os-label }}.html
          if-no-files-found: ignore

  cargo-test-wasm:
    name: "cargo test (wasm32-unknown-unknown)"
    # Fork PRs stay on the hosted runner; untrusted code never lands on ix.
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["ix", "ix-wasm"]')) || 'blacksmith-4vcpu-ubuntu-2404' }}
    environment: infisical-github-ci
    timeout-minutes: 45
    env:
      BAML_SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.BAML_SCCACHE_R2_ACCESS_KEY_ID }}
      BAML_SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BAML_SCCACHE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Keep the warm seed's ignored files (target/, node_modules);
          # tracked files still hard-reset to the SHA. No-op on hosted runners.
          clean: false

      - name: "Install Rust toolchain"
        run: |
          set -euo pipefail
          rustup show
          # `rustup target add wasm32` fetches a small (~20MB) std component that
          # normally installs in seconds. A multi-minute duration means a stalled
          # download (rustup has no idle timeout), which otherwise burns the whole
          # job timeout and dequeues the PR from the merge queue. Cap each attempt
          # well above the normal time and retry on a fresh connection; surface a
          # genuine outage after 3 tries instead of hanging.
          for attempt in 1 2 3; do
            if timeout 300 rustup target add wasm32-unknown-unknown; then
              break
            fi
            echo "::warning::rustup target add wasm32 attempt $attempt stalled/failed; retrying" >&2
            [ "$attempt" = 3 ] && { echo "::error::rustup target add wasm32 failed after 3 attempts"; exit 1; }
            sleep 5
          done
        working-directory: baml_language

      - name: "Install sccache and direnv"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: false
          shared-key: "linux-wasm"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch --target wasm32-unknown-unknown
        working-directory: baml_language

      - name: "Build for WASM"
        run: |
          set -euo pipefail
          readarray -t wasm_packages < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.source==null) | select(if .metadata.ci.wasm_support == null then true else .metadata.ci.wasm_support end) | .name')
          if [[ ${#wasm_packages[@]} -eq 0 ]]; then
            echo "Error: no WASM packages discovered; cargo metadata or jq may have failed" >&2
            exit 1
          fi
          package_args=()
          for package in "${wasm_packages[@]}"; do
            package_args+=(-p "$package")
          done
          cargo build "${package_args[@]}" --target wasm32-unknown-unknown --no-default-features --release --timings
        working-directory: baml_language

      - name: "List WASM artifacts"
        run: ls -lh target/wasm32-unknown-unknown/release/*.wasm || true
        working-directory: baml_language

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-test-wasm.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-test-wasm
          path: sccache-stats-test-wasm.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: |
          if [[ -f target/cargo-timings/cargo-timing.html ]]; then
            mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-test-wasm.html
          fi
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test-wasm
          path: baml_language/target/cargo-timings/cargo-timing-test-wasm.html
          if-no-files-found: ignore

  # Size-gate jobs live in size-gate.reusable.yaml — they are intentionally
  # decoupled from cargo-tests so a violation never blocks the test workflow.

  cargo-build-msrv:
    name: "cargo build (msrv)"
    # Fork PRs stay on the hosted runner; untrusted code never lands on ix.
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["ix", "ix-msrv"]')) || 'blacksmith-16vcpu-ubuntu-2404' }}
    environment: infisical-github-ci
    # 40, not 25: the MSRV toolchain is unique to this job, so a machine
    # without a warm seed rebuilds everything from cold and can exceed 25
    # minutes. Warm runs sit far inside the old budget.
    timeout-minutes: 40
    env:
      BAML_SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.BAML_SCCACHE_R2_ACCESS_KEY_ID }}
      BAML_SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BAML_SCCACHE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Keep the warm seed's ignored files (target/, node_modules);
          # tracked files still hard-reset to the SHA. No-op on hosted runners.
          clean: false

      - uses: SebRollen/toml-action@v1.2.0
        id: msrv
        with:
          file: "baml_language/Cargo.toml"
          field: "workspace.package.rust-version"

      - name: "Install Rust toolchain (MSRV)"
        env:
          MSRV: ${{ steps.msrv.outputs.value }}
        run: |
          rustup toolchain install "${MSRV}"
          rustup default "${MSRV}"
        working-directory: baml_language

      - name: "Install sccache and direnv"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: false
          shared-key: "linux-msrv"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        env:
          MSRV: ${{ steps.msrv.outputs.value }}
        run: cargo "+${MSRV}" fetch
        working-directory: baml_language

      - name: "Build with MSRV"
        env:
          MSRV: ${{ steps.msrv.outputs.value }}
        run: cargo "+${MSRV}" test --no-run --all-features --timings
        working-directory: baml_language

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-msrv.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-msrv
          path: sccache-stats-msrv.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-msrv.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-msrv
          path: baml_language/target/cargo-timings/cargo-timing-msrv.html
          if-no-files-found: ignore

  cargo-doc:
    name: "cargo doc"
    # Fork PRs stay on the hosted runner; untrusted code never lands on ix.
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["ix", "ix-gnu"]')) || 'blacksmith-4vcpu-ubuntu-2404' }}
    environment: infisical-github-ci
    timeout-minutes: 25
    env:
      BAML_SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.BAML_SCCACHE_R2_ACCESS_KEY_ID }}
      BAML_SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BAML_SCCACHE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Keep the warm seed's ignored files (target/, node_modules);
          # tracked files still hard-reset to the SHA. No-op on hosted runners.
          clean: false

      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - name: "Install sccache and direnv"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: false
          shared-key: "linux-cargo"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      - name: "Generate documentation"
        run: cargo doc --all --no-deps --timings
        working-directory: baml_language
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-doc.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-doc
          path: sccache-stats-doc.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-doc.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-doc
          path: baml_language/target/cargo-timings/cargo-timing-doc.html
          if-no-files-found: ignore

  snapshot-tests:
    name: "snapshot tests"
    # Fork PRs stay on the hosted runner; untrusted code never lands on ix.
    runs-on: ${{ (((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["ix", "ix-gnu"]')) || 'blacksmith-16vcpu-ubuntu-2404' }}
    environment: infisical-github-ci
    # 45, not 30: cold headroom, same reasoning as the gnu lane above.
    timeout-minutes: 45
    env:
      BAML_SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.BAML_SCCACHE_R2_ACCESS_KEY_ID }}
      BAML_SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BAML_SCCACHE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Keep the warm seed's ignored files (target/, node_modules);
          # tracked files still hard-reset to the SHA. No-op on hosted runners.
          clean: false

      - name: "Install Rust toolchain"
        run: rustup show
        working-directory: baml_language

      - name: "Install tools (mise)"
        uses: ./.github/actions/setup-mise
        with:
          install_args: "sccache direnv python uv cargo:cargo-insta cargo:cargo-nextest"

      - name: "Verify sccache"
        run: sccache --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "baml_language -> target"
          cache-all-crates: true
          cache-targets: false
          save-if: false
          shared-key: "linux-cargo"

      - name: "Load .envrc with direnv"
        run: |
          set -euo pipefail

          direnv allow .envrc
          direnv export gha >> "$GITHUB_ENV"

      # Separate step so if fetch is slow, build is fast.
      - name: "Fetch cargo dependencies"
        run: cargo fetch
        working-directory: baml_language

      - name: "Build tests with --timings"
        run: cargo test --no-run -p baml_tests -p baml_cli --all-features --timings
        working-directory: baml_language

      # This job provides glibc coverage of `baml_tests` and `baml_cli`. The
      # x86_64 GNU job excludes both to avoid running them twice; keep its
      # `--exclude` list in sync with the package list here. The musl job separately runs `baml_cli`, including
      # `pack_e2e`, so both Linux libc variants exercise the ELF pack path.
      - name: "Run snapshot tests"
        run: cargo insta test --test-runner nextest -p baml_tests -p baml_cli --all-features --unreferenced=reject
        working-directory: baml_language

      - name: "Check for snapshot changes"
        run: |
          pathspecs=(
            ':(glob)baml_language/**/*.snap'
            ':(glob)baml_language/**/*.snap.new'
          )
          if [ -n "$(git status --porcelain -- "${pathspecs[@]}")" ]; then
            echo "::error::Snapshot tests have uncommitted changes"
            git diff -- "${pathspecs[@]}"
            exit 1
          fi

      - name: "Upload snapshot failures"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failures
          path: |
            baml_language/**/*.snap
            baml_language/**/*.snap.new

      - name: "Show sccache stats"
        if: always()
        run: sccache --show-stats

      - name: "Dump sccache stats (json)"
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats-snapshot.json

      - name: "Upload sccache stats"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-stats-snapshot
          path: sccache-stats-snapshot.json
          if-no-files-found: ignore

      - name: "Rename cargo timings"
        if: always()
        run: mv target/cargo-timings/cargo-timing.html target/cargo-timings/cargo-timing-snapshot.html
        working-directory: baml_language
      - name: "Upload cargo timings"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-snapshot
          path: baml_language/target/cargo-timings/cargo-timing-snapshot.html
          if-no-files-found: ignore

  cargo-timings:
    name: "cargo timings (merged)"
    runs-on: ubuntu-latest
    needs:
      - cargo-test-linux
      - cargo-test-linux-musl
      - sdk-tests
      - cargo-test-wasm
      - cargo-build-msrv
      - cargo-doc
      - snapshot-tests
    steps:
      - name: "Merge cargo timings artifacts"
        uses: actions/upload-artifact/merge@v4
        with:
          name: cargo-timings
          pattern: cargo-timings-*
          delete-merged: true
  sccache-stats:
    name: "sccache stats (merged)"
    runs-on: ubuntu-latest
    needs:
      - cargo-test-linux
      - cargo-test-linux-musl
      - sdk-tests
      - cargo-test-wasm
      - cargo-build-msrv
      - cargo-doc
      - snapshot-tests
    steps:
      - name: "Merge sccache stats artifacts"
        uses: actions/upload-artifact/merge@v4
        with:
          name: sccache-stats
          pattern: sccache-stats-*
          delete-merged: true
