# Publishes @boundaryml/baml-grammar to npm on every push to main.
#
# This file is generated from typescript2/pkg-grammar/mirror/publish.yml in
# BoundaryML/baml and synced here by that repo's sync-grammar-mirror workflow.
# Do not edit it in this repository.
#
# Auth is npm OIDC trusted publishing: the npm package settings must list this
# repo (BoundaryML/textMate-baml) and this workflow filename (publish.yml) as a
# trusted publisher. No token secrets are involved. The first-ever publish of
# the package cannot use OIDC and must be done once by hand (npm publish from a
# checkout of this repo); after that, configure the trusted publisher and this
# workflow takes over.

name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org

      - name: Ensure npm CLI supports trusted publishing
        run: |
          set -euo pipefail
          required_version="11.5.1"
          current_version="$(npm --version)"
          if [ "$(printf '%s\n' "$required_version" "$current_version" | sort -V | head -n1)" != "$required_version" ]; then
            echo "npm $current_version is lower than required $required_version (needed for OIDC trusted publishing)" >&2
            exit 1
          fi

      - name: Smoke-test the artifact
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const grammar = (await import("./dist/index.js")).default;
            assert.equal(grammar.scopeName, "source.baml");
            assert.equal(grammar.name, "baml");
            const raw = JSON.parse(readFileSync("grammars/baml.tmLanguage.json", "utf8"));
            assert.deepEqual(grammar, raw, "dist/index.js drifted from grammars/baml.tmLanguage.json");
            const config = JSON.parse(readFileSync("language-configuration.json", "utf8"));
            assert.ok(config.brackets.length > 0);
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            assert.equal(pkg.name, "@boundaryml/baml-grammar");
            assert.notEqual(pkg.version, "0.0.0-dev", "package.json version was never stamped");
            console.log("smoke ok:", pkg.name, pkg.version);
          '

      - name: Publish
        run: |
          set -euo pipefail
          name="$(jq -r '.name' package.json)"
          version="$(jq -r '.version' package.json)"
          # Reruns and no-op pushes must not fail on "version already exists":
          # skip when this exact version is already on the registry. (`npm view`
          # exits non-zero when the package has never been published; treat
          # that as "not published yet".)
          existing="$(npm view "${name}@${version}" version 2>/dev/null || true)"
          if [ "$existing" = "$version" ]; then
            echo "${name}@${version} is already published; nothing to do."
            exit 0
          fi
          npm publish --access public
