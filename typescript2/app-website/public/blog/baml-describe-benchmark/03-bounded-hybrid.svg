<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#444"/></marker><style>.t{font-family:Arial,sans-serif;font-size:38px;font-weight:700;fill:#181a20}.st{font-family:Arial,sans-serif;font-size:20px;font-weight:500;fill:#555b65}.h{font-family:Arial,sans-serif;font-size:21px;font-weight:700;fill:#282b32}.b{font-family:Arial,sans-serif;font-size:17px;font-weight:500;fill:#3a3e46}.m{font-family:Menlo,monospace;font-size:16px;font-weight:700;fill:#252830}.box{stroke-width:2.5;rx:20;filter:url(#s)}.ar{stroke:#444;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="760" fill="#fffdf8"/><text x="700" y="58" text-anchor="middle" class="t">The bounded hybrid path</text><text x="700" y="92" text-anchor="middle" class="st">One semantic call where it replaces several lexical searches.</text>
  <rect x="55" y="220" width="210" height="150" fill="#e8f3ff" stroke="#2878bd" class="box"/><text x="160" y="270" text-anchor="middle" class="h">Developer question</text><text x="160" y="315" text-anchor="middle" class="b">intent + known terms</text>
  <path d="M265 295 H345" class="ar"/>
  <rect x="345" y="175" width="310" height="240" fill="#f1e9ff" stroke="#7652c8" class="box"/><text x="500" y="222" text-anchor="middle" class="h">1. Semantic discovery</text><text x="500" y="270" text-anchor="middle" class="m">baml describe --grep</text><text x="500" y="315" text-anchor="middle" class="b">symbols · files · relationships</text><text x="500" y="355" text-anchor="middle" class="b">hard limit + output budget</text>
  <path d="M655 295 H735" class="ar"/>
  <rect x="735" y="175" width="280" height="240" fill="#fff0e5" stroke="#d46b2c" class="box"/><text x="875" y="222" text-anchor="middle" class="h">2. Expand once</text><text x="875" y="270" text-anchor="middle" class="m">describe A B C</text><text x="875" y="315" text-anchor="middle" class="b">batched definitions</text><text x="875" y="355" text-anchor="middle" class="b">compact agent mode</text>
  <path d="M1015 295 H1095" class="ar"/>
  <rect x="1095" y="220" width="250" height="150" fill="#e6f7ea" stroke="#2f8f46" class="box"/><text x="1220" y="270" text-anchor="middle" class="h">3. Verify</text><text x="1220" y="315" text-anchor="middle" class="b">one targeted file read</text>
  <rect x="165" y="520" width="1070" height="120" rx="24" fill="#fff3bf" stroke="#d79b00" stroke-width="2.5"/>
  <text x="700" y="566" text-anchor="middle" class="h">Constraint: ≤ 3 shell commands and only the context needed for the answer</text><text x="700" y="605" text-anchor="middle" class="st">`describe` is a navigation primitive, not a replacement for source verification.</text>
</svg>
