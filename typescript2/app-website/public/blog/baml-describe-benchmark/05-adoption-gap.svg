<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#444"/></marker><style>.t{font-family:Arial,sans-serif;font-size:38px;font-weight:700;fill:#181a20}.st{font-family:Arial,sans-serif;font-size:20px;font-weight:500;fill:#555b65}.h{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#292c33}.b{font-family:Arial,sans-serif;font-size:18px;font-weight:500;fill:#383c45}.m{font-family:Menlo,monospace;font-size:17px;font-weight:700;fill:#252830}.box{stroke:#343941;stroke-width:2.5;rx:20;filter:url(#s)}.ar{stroke:#444;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#9b6bd3;stroke-width:3;fill:none;stroke-dasharray:9 9;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="720" fill="#fffdf8"/><text x="700" y="58" text-anchor="middle" class="t">The adoption gap</text><text x="700" y="92" text-anchor="middle" class="st">A tool can be available, documented, and still absent from agent behavior.</text>
  <rect x="65" y="225" width="240" height="170" fill="#e8f3ff" class="box"/><text x="185" y="280" text-anchor="middle" class="h">Coding agent</text><text x="185" y="330" text-anchor="middle" class="b">needs code context</text>
  <rect x="465" y="120" width="300" height="145" fill="#f2ecff" class="box"/><text x="615" y="170" text-anchor="middle" class="h">Describe docs loaded</text><text x="615" y="215" text-anchor="middle" class="m">canary verified</text>
  <rect x="465" y="355" width="300" height="145" fill="#f2ecff" class="box"/><text x="615" y="405" text-anchor="middle" class="h">Navigator available</text><text x="615" y="450" text-anchor="middle" class="m">ready to delegate</text>
  <path d="M305 275 C365 230 400 205 465 195" class="dash"/><path d="M305 345 C365 395 400 420 465 430" class="dash"/>
  <text x="380" y="332" text-anchor="middle" class="b">ignored</text>
  <path d="M305 310 C520 310 720 310 930 310" class="ar"/>
  <rect x="930" y="225" width="405" height="170" fill="#fff0e5" class="box"/><text x="1132" y="278" text-anchor="middle" class="h">Familiar built-in path</text><text x="1132" y="325" text-anchor="middle" class="m">Explore agent → grep → reads</text><text x="1132" y="365" text-anchor="middle" class="b">Chosen without confusion or failure</text>
  <rect x="210" y="570" width="980" height="92" rx="22" fill="#fff3bf" stroke="#d79b00" stroke-width="2.5"/><text x="700" y="608" text-anchor="middle" class="h">Documentation exposes a capability. Wiring changes behavior.</text><text x="700" y="640" text-anchor="middle" class="b">If the tool matters, make it part of the path—not merely an option beside the path.</text>
</svg>
