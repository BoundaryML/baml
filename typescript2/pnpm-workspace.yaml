packages:
  - "pkg-*"
  - "app-*"

# pnpm 11 promotes un-approved postinstall builds to errors. Approve the
# transitive build-script dependencies the lockfile currently pulls in.
allowBuilds:
  '@bufbuild/buf': true
  '@mongodb-js/zstd': true
  '@posthog/cli': true
  '@scarf/scarf': true
  '@tailwindcss/oxide': true
  '@vercel/speed-insights': true
  core-js: true
  esbuild: true
  msw: true
  # node-liblzma's native (gyp) build fails and isn't needed at runtime;
  # disable it explicitly to keep installs clean.
  node-liblzma: false
  sharp: true
  unrs-resolver: true

catalog:
  jotai: ^2.10.0

# Force all packages to use the same version of @types/react to avoid
# JSX component type incompatibility errors (e.g., "cannot be used as JSX component")
overrides:
  '@types/react': 18.3.26
  '@types/react-dom': 18.3.7
