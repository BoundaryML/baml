[[production]]
package = "baml_cli"
bin = "baml-cli"
reason = "shipped BAML language CLI"

[[production]]
package = "baml_pack_host"
bin = "baml-pack-host"
reason = "shipped host for packed BAML programs"

[[exclude]]
crate = "bex_events"
module = "prof::pb"
reason = "prost-generated profiling wire types"

[[exclude]]
crate = "bex_events"
module = "value::pb"
reason = "prost-generated value wire types"

[[exclude]]
crate = "bridge_ctypes"
module = "baml_bridge::cffi"
reason = "prost-generated C FFI wire types"

[[exclude]]
crate = "bex_vm"
module = "package_baml::generated"
reason = "build-generated native function implementations"

[[exclude]]
crate = "bex_vm"
module = "package_ai::generated"
reason = "build-generated native function implementations"

[[exclude]]
crate = "bex_vm"
module = "package_reflect::generated"
reason = "build-generated native function implementations"

[[exclude]]
crate = "bex_vm"
module = "package_testing::generated"
reason = "build-generated native function implementations"

[[exclude]]
crate = "bex_vm"
module = "package_trace::generated"
reason = "build-generated native function implementations"

[[exclude]]
crate = "bex_vm_types"
module = "resource"
reason = "build-generated resource traits and their plain data"

[[exclude]]
crate = "bex_vm"
module = "vm::compiled_rt"
reason = "runtime operations called by the Rust that baml_compiler2_rust emits"

[[exclude]]
crate = "bex_vm"
file = "crates/bex_vm/src/debug.rs"
reason = "developer-facing bytecode disassembly and VM debugging utilities"

