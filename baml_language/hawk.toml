[[production]]
package = "baml"
bin = "baml"
reason = "shipped BAML toolchain wrapper"

[[production]]
package = "baml_cli"
bin = "baml-cli"
reason = "shipped BAML language CLI"

[[production]]
package = "baml_pack_host"
bin = "baml-pack-host"
reason = "shipped host for packed BAML programs"

[[exclude]]
crate = "bex_events"
module = "prof::pb"
reason = "prost-generated profiling wire types"

[[exclude]]
crate = "bex_events"
module = "value::pb"
reason = "prost-generated value wire types"

[[exclude]]
crate = "bridge_ctypes"
module = "baml_bridge::cffi"
reason = "prost-generated C FFI wire types"

[[exclude]]
crate = "bex_vm"
module = "package_baml::generated"
reason = "build-generated native function implementations"

[[exclude]]
crate = "bex_vm"
file = "crates/bex_vm/src/debug.rs"
reason = "developer-facing bytecode disassembly and VM debugging utilities"

