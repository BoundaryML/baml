[workspace]
members = [
  "crates/*",
  "forks/*",
  "sdks/cpp/sdkgen_cpp",
  "sdks/csharp/sdkgen_csharp",
  "sdks/go/sdkgen_go",
  "sdks/java/bridge_java",
  "sdks/java/sdkgen_java",
  "sdks/typescript/bridge_typescript",
  "sdks/typescript/bridge_typescript_web",
  "sdks/typescript/sdkgen_typescript_shared",
  "sdks/python/rust/*",
  "sdks/swift/rust/*",
  "sdks/rust/*",
  "sdk_tests/harness_setup",
  "sdk_tests/harness_runner",
  "sdk_tests/harness/llm_recordings",
  # `sdk_tests/crates/java` follows typescript_node's soft-fail model
  # (see below); its per-fixture tests are `#[ignore]`d while
  # `sdkgen_java` is a stub.
  "sdk_tests/crates/java",
  "sdk_tests/crates/cpp",
  "sdk_tests/crates/csharp",
  "sdk_tests/crates/python_pydantic2",
  "sdk_tests/crates/ruby_sorbet",
  # Swift sdk-tests: build.rs codegen soft-fails into build_diagnostics
  # (sdkgen_swift is early); the swift toolchain tests themselves are
  # macOS-only and setup.sh (xcframework assembly) is bound in
  # .config/nextest.toml for macOS hosts.
  "sdk_tests/crates/swift",
  "sdk_tests/crates/go",
  # `sdk_tests/crates/typescript`'s build.rs runs codegen +
  # `pnpm install` but soft-fails into `$OUT_DIR/build_diagnostics.txt`
  # if pnpm is missing or install fails (see
  # `sdk_tests/harness_setup/src/lib.rs::BuildDiagnostics` —
  # package name `sdk_test_harness_setup`), so a workspace
  # `cargo build` / `cargo doc` succeeds without pnpm installed.
  # The failures surface via `cargo test`'s
  # `build_diagnostics::no_build_failures` test.
  "sdk_tests/crates/typescript",
  "sdk_tests/crates/typescript_web",
  "sdk_tests/crates/rust",
  # Native RUSTC_WRAPPER shim (see tools_sccache/src/main.rs); the Windows
  # counterpart to the tools/baml-sccache POSIX script, built explicitly in CI.
  "tools_sccache",
]
exclude = [
  # Live system-test harnesses are intentionally outside the workspace. They
  # enable native-only tokio/reqwest features such as `fs` and `rt-multi-thread`;
  # keeping them out prevents workspace wasm builds from inheriting those
  # unsupported features through resolver feature unification.
  "forks/aws-config-systest",
  "forks/google-cloud-auth-systest",
  # Rust SDK release-verification fixtures (a `baml.toml` BAML project + a
  # consumer smoke, not a crate); the `sdks/rust/*` members glob would
  # otherwise try to load it as a workspace member.
  "sdks/rust/verify",
]
resolver = "2"

[workspace.package]
# Please update rustfmt.toml when bumping the Rust edition
edition = "2024"
# This is the MSRV (Minimum Supported Rust Version) for the workspace
rust-version = "1.91.1"
authors = [ "Vaibhav Gupta <vbv@boundaryml.com>" ]
homepage = "https://github.com/BoundaryML/baml"
documentation = "https://docs.boundaryml.com"
repository = "https://github.com/BoundaryML/baml"
license = "Apache-2.0"
# This needs to be updated manually when bumping the version
version = "0.0.0-beta"

[workspace.dependencies]
#  Internal dependencies (baml_*)
bex_str = { path = "crates/bex_str" }
baml_base = { path = "crates/baml_base" }
baml_artifact = { path = "crates/baml_artifact" }
baml_type = { path = "crates/baml_type" }
baml_type_runtime = { path = "crates/baml_type_runtime" }
baml_type_macros = { path = "crates/baml_type_macros" }
baml_builtins2 = { path = "crates/baml_builtins2" }
baml_builtins2_codegen = { path = "crates/baml_builtins2_codegen" }
sdkgen_cpp = { path = "sdks/cpp/sdkgen_cpp" }
sdkgen_csharp = { path = "sdks/csharp/sdkgen_csharp" }
sdkgen_typescript_shared = { path = "sdks/typescript/sdkgen_typescript_shared" }
sdkgen_python_pydantic2 = { path = "sdks/python/rust/sdkgen_python_pydantic2" }
sdkgen_java = { path = "sdks/java/sdkgen_java" }
