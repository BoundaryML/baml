# Stow Configuration
# ==================
#
# Stow validates crate naming conventions and dependency rules in the workspace.
# Install: cargo install --path crates/tools_stow
# Usage:   cargo stow --check    (validate)
#          cargo stow --fix      (auto-fix sorting issues)
#
# Namespaces ([[namespaces]]):
#   name                 - Crate prefix (e.g., "baml" for baml_* crates)
#   approved_prefixes    - Valid sub-prefixes (e.g., "compiler" allows baml_compiler_*)
#   approved_suffixes    - Full tails accepted verbatim (e.g., "python_pydantic2"
#                          allows sdkgen_python_pydantic2; validated as a unit)
#   test_crate_exceptions - Test crates exempt from "must have prefix crate" rule
#   dependency_rules     - Rules that only apply to crates in this namespace
#   link_crates          - Cross-namespace deps shown as proxy nodes in this cluster
#   embed_crates         - Crates from other namespaces placed inside this cluster
#                          (shown with dashed border; reduces cross-cluster noise)
#
# Dependency Rules ([[dependency_rules]] or [[namespaces.dependency_rules]]):
#   pattern              - Simple glob: "foo*", "*bar", or exact match
#   pattern.select       - Glob pattern to match
#   pattern.exclude      - List of patterns to exclude from the match
#   allowed_prefixes     - Crate prefixes allowed to use this dependency
#   allowed_crates       - Specific crates/patterns allowed (e.g., "*_cli")
#   regular_deps_only    - If true, rule only applies to [dependencies], not dev/build
#   reason               - Error message shown when rule is violated
#
# Graph visualization ([graph]):
#   external_deps        - External deps to show as nodes in the graph
#   [graph.implied_deps] - When a crate depends on both the key and a value,
#                          the edge to the value is hidden (implied by the key)
#                          Example: baml_builtins = ["baml_builtins_macros"]
#
# Auto-allowed naming suffixes: _types, _test, _tests (no prefix needed)
# Auto-allowed dependency access: _test/_tests crates
# Ignore crates by name pattern (glob)
# ignore_crates = ["sdk_test_*"]
#
# ===========================================================================

# Ignore crates that don't follow the namespace convention
# - sdk_test_*: SDK test crates
ignore_crates = ["sdk_test_*"]

# Graph visualization settings
# Run: cargo stow --graph /tmp/deps.svg
[graph]
external_deps = ["serde_json", "tokio", "clap", "anyhow", "salsa", "rowan", "reqwest"]

# Implied dependencies: if a crate depends on both the key and a value,
# the edge to the value is hidden (it's visually implied by the key).
[graph.implied_deps]
baml_type = ["baml_base"]
bex_heap = ["bex_external_types"]
bex_external_types = ["bex_vm_types"]
bex_vm_types = ["bex_resource_types"]

# Global dependency rules (apply to ALL crate namespaces)
[[dependency_rules]]
pattern = "anyhow"
allowed_crates = [
    "*_cli",
    "tools_*",
    "cargo-*",
    "baml_lsp_*",
    # `baml_exec` and `baml_pack_host` are surface-area crates per
    # BEP-027: the shared `baml run` / `baml pack` executor and the
    # runtime host binary embedded in packed executables. They sit at
    # the application boundary (same as `baml_cli`) and use anyhow for
    # the same reason — top-level error surfacing.
    "baml_exec",
    "baml_pack_host",
    # `baml` is the wrapper binary users install. `baml_release` is
    # shared release-boundary fetch/install code used by the wrapper
    # and pack; it exposes typed fetch errors but uses anyhow for
    # validation helpers and caller-facing context.
    "baml",
    "baml_release",
]
regular_deps_only = true
reason = "Use thiserror for proper error types in library crates."

# ---------------------------------------------------------------------------
# Crypto: everything that protects something runs on the one rustls
# CryptoProvider `baml_tls` picks, so an `external-crypto` build (e.g. FIPS)
# runs it all in the host's module. These rules keep new code from reaching
# around it. Which provider a build links is feature-level and checked by
# `scripts/check-crypto-backends.sh`, not here.
# ---------------------------------------------------------------------------

[[dependency_rules]]
pattern = "rustls"
# `sys_native` builds the HTTPS server's `ServerConfig`; `baml_bridge` is
# published to crates.io and can't depend on the unpublished `baml_tls`.
allowed_crates = ["baml_tls", "baml_crypto_provider", "sys_native", "baml_bridge"]
regular_deps_only = true
reason = "Get crypto from baml_tls (ensure_crypto_provider, sha256, hmac_sha256, sign_rs256, fill_random), not rustls directly."

[[dependency_rules]]
pattern = "tokio-rustls"
allowed_crates = ["sys_native"]
regular_deps_only = true
reason = "TLS server/client configs are built in sys_native after baml_tls::ensure_crypto_provider."

# Every TLS client panics without a provider in an `external-crypto` build,
# so each user must call `baml_tls::ensure_crypto_provider()` before building
# one. Adding a crate here means adding that call.
[[dependency_rules]]
pattern = "reqwest"
allowed_crates = ["baml", "baml_cli", "baml_lsp_server", "baml_release", "bex_cache", "bridge_wasm", "btel_bcs", "sys_native"]
regular_deps_only = true
reason = "HTTP clients need baml_tls::ensure_crypto_provider() first; route new HTTP through sys_native or add the call and list the crate here."

[[dependency_rules]]
pattern = "tokio-tungstenite"
allowed_crates = ["baml_lsp_server", "sys_native"]
regular_deps_only = true
reason = "WebSocket clients need baml_tls::ensure_crypto_provider() first."

[[dependency_rules]]
pattern = "ureq"
allowed_crates = ["baml_bridge"]
regular_deps_only = true
reason = "HTTP clients need a crypto provider first; use reqwest after baml_tls::ensure_crypto_provider()."

# Crypto implementations that would bypass the provider.
[[dependency_rules]]
pattern = "ring"
allowed_crates = []
reason = "Use baml_tls: ring is selected only through the ring-crypto feature."

[[dependency_rules]]
pattern = "aws-lc-*"
allowed_crates = []
reason = "Use baml_tls: AWS-LC is selected only through the aws-crypto feature."

[[dependency_rules]]
pattern = "hmac"
allowed_crates = []
reason = "Use baml_tls::hmac_sha256 so HMAC runs on the crypto provider."

[[dependency_rules]]
pattern = "rsa"
allowed_crates = []
reason = "Use baml_tls::sign_rs256 so signing runs on the crypto provider."

[[dependency_rules]]
pattern = "openssl*"
allowed_crates = []
reason = "Crypto comes from the rustls provider (baml_tls); bring OpenSSL in through a baml_crypto_provider crate."

[[dependency_rules]]
pattern = "native-tls"
allowed_crates = []
reason = "TLS goes through rustls and the baml_tls provider."

[[dependency_rules]]
pattern = "getrandom"
# `bex_vm` seeds non-cryptographic PRNGs; `sys_native` falls back to OS
# entropy only in builds with no provider; `bridge_wasm` has no provider.
allowed_crates = ["bex_vm", "sys_native", "bridge_wasm"]
regular_deps_only = true
reason = "Secure randomness comes from baml_tls::fill_random (the provider's secure random source)."

# Fingerprint hashing: SHA-256 that protects nothing (cache keys, program
# identity, file signatures) stays on `sha2` because these crates also build
# for wasm. A security use (checksums, signing, anything an attacker could
# exploit) must use baml_tls::sha256 instead.
[[dependency_rules]]
pattern = "sha2"
allowed_crates = ["baml_artifact", "baml_cli", "baml_codegen_types", "bex_cache", "bex_events", "bex_project", "bex_vm", "bex_vm_types", "sdkgen_csharp"]
regular_deps_only = true
reason = "Security-relevant hashing must use baml_tls::sha256 (the crypto provider); sha2 is only for non-security fingerprints."

[[dependency_rules]]
pattern = "sha1"
# Names the AWS SSO token-cache file the AWS CLI writes; not a security use.
allowed_crates = ["forked_aws_config"]
regular_deps_only = true
reason = "SHA-1 is only for matching external file-naming conventions."

# `baml.crypto`'s ciphers; an `external-crypto` build refuses to create them.
[[dependency_rules]]
pattern.select = "*poly1305"
allowed_crates = ["bex_vm"]
regular_deps_only = true
reason = "Only baml.crypto's ciphers (bex_vm) may use these; they're unavailable in external-crypto builds."

[[dependency_rules]]
pattern = "aes-gcm-siv"
allowed_crates = ["bex_vm"]
regular_deps_only = true
reason = "Only baml.crypto's ciphers (bex_vm) may use these; they're unavailable in external-crypto builds."

# baml namespace configuration
[[namespaces]]
name = "baml"
# `fmt` is the formatter, `baml_fmt`, and its browser build, `baml_fmt_wasm`.
approved_prefixes = ["compiler", "builtins", "builtins2", "compiler2", "type", "query", "fmt"]
# The type provider crate: `hir_ty` is one name (rust-analyzer's crate of
# the same shape), not a prefix + word. `crypto_provider` is the crate an
# `external-crypto` build swaps out to supply its TLS crypto.
approved_suffixes = ["artifact", "compiler2_hir_ty", "crypto_provider"]
test_crate_exceptions = ["baml_tests"]
embed_crates = ["bex_project"]
# The Rust SDK runtime crate keeps the `bridge_rust` folder (mirroring
# `bridge_python`/`bridge_nodejs`) while the published crate is `baml_bridge`.
name_exceptions = { "bridge_rust" = "baml_bridge" }

# baml-specific dependency rules
[[namespaces.dependency_rules]]
pattern = "baml_compiler*"
allowed_prefixes = ["compiler", "compiler2"]
# `baml_ide` is the IDE/analysis layer over the compiler (rust-analyzer's
# `ide` shape); it wraps compiler queries so downstream consumers don't
# have to be on this list.
allowed_crates = ["baml_db", "baml_ide", "bridge_cffi", "baml_type", "baml_builtins2_codegen"]
reason = "Use baml_db or baml_ide to access compiler interfaces."

[[namespaces.dependency_rules]]
pattern.select = "bex_*"
pattern.exclude = ["bex_vm_types"]
# `baml_exec` and `baml_pack_host` are BEP-027 surface-area crates
# (shared executor + packed-binary runtime host) and sit at the same
# application boundary as `baml_cli` — they need direct access to the
# engine, events, and VM types.
allowed_crates = ["bridge_cffi", "baml_cli", "baml_exec", "baml_pack_host"]
reason = "baml_* crates should not depend on bex_* crates."

[[namespaces.dependency_rules]]
pattern.select = "bex_vm_types"
allowed_crates = ["baml_compiler_emit", "baml_compiler2_emit", "baml_db", "baml_cli", "baml_exec", "baml_pack_host"]
reason = "Only compiler_emit and baml_db crates should depend on bex_vm_types (pure data layer)."


# tools namespace configuration
[[namespaces]]
name = "tools"
# Allow tools_stow folder to have package name "cargo-stow" for cargo subcommand convention
name_exceptions = { "tools_stow" = "cargo-stow", "tools_size_gate" = "cargo-size-gate" }

# forked AWS crates retain the upstream folder names while publishing
# package names that cannot collide with the real crates.
[[namespaces]]
name = "forked_aws"
name_exceptions = { "aws-config" = "forked_aws_config", "aws-sigv4" = "forked_aws_sigv4" }

# forked Google crates follow the same package-name convention.
[[namespaces]]
name = "forked_google"
approved_prefixes = ["cloud"]
name_exceptions = { "google-cloud-auth" = "forked_google_cloud_auth" }

# bex namespace configuration
[[namespaces]]
name = "bex"
approved_prefixes = ["events", "prof"]
link_crates = ["baml_type", "sys_types"]

# Btel telemetry pipeline crates. The producer starts with `btel_types`;
# transport, processing, and publication crates will join this family later.
[[namespaces]]
name = "btel"

# lsp namespace configuration
[[namespaces]]
name = "baml_lsp"
link_crates = ["baml_db", "baml_ide"]

# bridge namespace configuration
[[namespaces]]
name = "bridge"
approved_suffixes = ["typescript_web"]
link_crates = ["bex_project", "sys_native", "sys_types"]

# Bridge crates should go through bex_project for runtime access, not depend on bex internals directly.
# bridge_wasm needs bex_heap and bex_resource_types for low-level sys ops.
# bridge_python and bridge_cffi need bex_events for event handling.
[[namespaces.dependency_rules]]
pattern.select = "bex_*"
pattern.exclude = ["bex_project", "bex_events", "bex_events_native", "bex_heap", "bex_resource_types"]
allowed_crates = []
reason = "Bridge crates must use bex_project re-exports, not bex internals directly."

# sys namespace configuration
[[namespaces]]
name = "sys"
link_crates = ["baml_type",  "bex_heap", "bex_vm_types"]

[[namespaces]]
name = "sdkgen"
# Each SDK generator has a meaningful language-specific tail that is validated
# as a unit rather than by sub-prefix.
approved_suffixes = ["python_pydantic2", "typescript_shared"]

[[namespaces]]
name = "surface"
# Surface-area crates that don't fit the prefix-based namespaces — they
# sit at the application boundary and depend on bex_* internals
# directly (where `baml_*` crates normally cannot). `baml_exec` is the
# BEP-027 shared executor used by `baml run` and the packed host;
# `baml_pack_host` is the runtime binary embedded in packed
# executables. Listed here so they're exempt from the baml-namespace
# rules forbidding bex_* deps.
name_exceptions = {"baml" = "baml", "baml_cli" = "baml_cli", "baml_exec" = "baml_exec", "baml_pack_host" = "baml_pack_host" }
