# A slim AWS event stream (`application/vnd.amazon.eventstream`) codec, plus
# the typed Bedrock `ConverseStream` events carried over it.
#
# Replaces `aws-smithy-eventstream` (and the `aws-smithy-types` tree it pulls
# in) and the `ConverseStreamOutput` model of `aws-sdk-bedrockruntime` for
# BAML's use case: decoding Bedrock ConverseStream responses. No Smithy, no
# async runtime, no signing.
[package]
name = "forked_aws_eventstream"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "aws_eventstream"

[dependencies]
base64 = { workspace = true }
crc32fast = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
