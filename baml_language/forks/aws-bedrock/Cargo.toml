# A slim, serde-based model of the AWS Bedrock Converse API wire format.
#
# Replaces `aws-sdk-bedrockruntime` (and its `aws-smithy-*` dependency tree)
# for BAML's only use case: serializing a Converse request body and building
# the request URL path. No Smithy, no client, no async runtime — just the JSON
# shapes the Bedrock Converse endpoint expects.
[package]
name = "forked_aws_bedrock"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "aws_bedrock"

[dependencies]
base64 = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
