# A slim, pure-Rust Google Cloud OAuth2 token resolver.
#
# Replaces the `google-cloud-auth` crate (from the boundaryml/google-cloud-rust
# fork) for BAML's only use case: minting Google Cloud access tokens for Vertex
# AI from service-account JSON, Application Default Credentials (authorized-user
# refresh tokens), and the GCE metadata server. All IO is routed through the
# `TokenIo` trait so the host can sandbox it, and JWT signing is pure Rust
# (`rsa` + `sha2`) so the same code path works on native and wasm.
[package]
name = "forked_google_cloud_auth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
percent-encoding = { workspace = true }
rsa = { workspace = true, features = [ "sha2" ] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [ "rt", "macros" ] }

[lints]
workspace = true
