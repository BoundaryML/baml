# A slim, pure-Rust Google Cloud OAuth2 token resolver.
#
# Replaces the `google-cloud-auth` crate (from the boundaryml/google-cloud-rust
# fork) for BAML's only use case: minting Google Cloud access tokens for Vertex
# AI. Mirrors google-auth's Application Default Credentials: service-account
# JSON (RS256 JWT bearer), authorized-user refresh tokens, workload identity
# federation (file/url-sourced), impersonated service accounts, and the GCE
# metadata server — plus google-auth-style token caching and project / quota
# project resolution. All IO is routed through the `TokenIo` trait so the host
# can sandbox it. JWT signing and hashing run on the selected BAML crypto
# provider (`baml_crypto`), so this is native-only, like `sys_native`, its only
# user.
[package]
name = "forked_google_cloud_auth"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
baml_crypto = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
baml_crypto = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [ "rt", "macros" ] }

[lints]
workspace = true

[package.metadata.ci]
wasm_support = false
