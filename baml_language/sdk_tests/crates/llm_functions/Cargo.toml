# Hand-written sdk-test crate; drives codegen from real `.baml` source
# under `baml_src/` through the full `baml_project::build_symbol_pool`
# pipeline (parse → HIR → TIR → `SymbolPool` → emitter), mirroring the
# path `baml-cli generate` takes end-to-end.
#
# Scope: the user-side slice of `09a-codegen-example-scenario.md`
# covering LLM function emission — lorem.Resume + StreamingDoc +
# ipsum.Sentiment + their companion-bearing functions. StreamingDoc
# pins the always-different `$stream` companion branch. Vendor /
# `baml.*` / handle-backed class scenarios from 09a are out of scope
# here per 11h §12.5.
[package]
name = "sdk_test_llm_functions"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
sdk_test_build = { path = "../../build" }

[dev-dependencies]
sdk_test_build = { path = "../../build" }

[package.metadata.ci]
wasm_support = false
