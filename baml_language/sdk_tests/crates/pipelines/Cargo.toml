# Sdk-test crate for the pipeline-style codegen surface — non-LLM
# functions whose bodies call LLM functions (and other non-LLM
# helpers) in sequence, plus `testset` / `test` blocks that exercise
# them. Complements `sdk_test_llm_functions`, which only covers raw
# LLM-function emission.
[package]
name = "sdk_test_pipelines"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
codegen_python = { path = "../../../sdks/python/rust/codegen_python" }
baml_codegen_types = { path = "../../../crates/baml_codegen_types" }
baml_db = { path = "../../../crates/baml_db" }
baml_project = { path = "../../../crates/baml_project" }
baml_workspace = { path = "../../../crates/baml_workspace" }

[dev-dependencies]
sdk_test_build = { path = "../../build" }

[package.metadata.ci]
wasm_support = false
