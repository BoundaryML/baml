# Source, manifest and LICENSE are the crates.io package of cranelift-codegen 0.130.2,
# unchanged. Packaging omits Cargo.lock and Cargo.toml.orig.
#
# Changes from upstream, one entry per patch:
#
# Pinned register as an address base, behind `fold_pinned_reg_reads`:
#   src/prelude_lower.isle, src/machinst/isle.rs: expose the setting to ISLE.
#   src/isa/aarch64/inst.isle: `amode_no_more_iconst` of `get_pinned_reg` plus
#     an offset builds the address mode on x21 itself (`amode_pinned_reg`).
#   src/isa/x64/inst.isle: `to_amode` of `get_pinned_reg` uses r15 as the base.
#     Not built or run: written on an arm64 host.
#
# Stack pointer compared in place (no setting; sp is fixed in a function body):
#   src/isa/aarch64/inst.isle: `lower_icmp_into_flags` with `get_stack_pointer`
#     on the left emits `subs xzr, sp, y, uxtx`.
#   src/isa/x64/inst.isle: `emit_cmp` with `get_stack_pointer` on the left
#     compares rsp. Not built or run.
#
# `sdiv_unchecked` and `srem_unchecked` (defined in cranelift-codegen-meta):
#   src/isa/aarch64/lower.isle: the bare `sdiv` (and `msub`), with none of the
#     zero and overflow checks `sdiv`/`srem` emit.
#   src/isa/x64/lower.isle: `sdiv_unchecked` is `idiv` without the zero test
#     in front; `srem_unchecked` is the `srem` sequence (which keeps its -1
#     fix-up). `idiv` faults in hardware on the excluded divisors, so here the
#     guarantee is that the frontend never reaches it with them. Built for
#     x86-64 but not run.
#   No lowering on the riscv64, s390x and pulley backends.
#
# Wide integer constants built once:
#   src/opts.rs: `remat` leaves an `iconst` outside -0x10000..0x10000 alone, so
#     elaboration hoists it out of the innermost loop instead of rebuilding it
#     in every block that uses it.
#   src/isa/aarch64/inst.isle: `lower_icmp_32_64_const` applies only when the
#     constant encodes as a compare immediate (`icmp_const_is_imm`); any other
#     is compared from the register that already holds it.
