[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
# The compiler recurses deeply (parser -> TIR -> MIR) — even a bare `baml check`
# compiles the stdlib — enough to overflow Windows' ~1 MiB default main-thread
# stack, while Linux/macOS get ~8 MiB for free. Reserve 64 MiB on the main
# thread (virtual only, committed lazily); spawned threads use RUST_MIN_STACK.
rustflags = ["-C", "link-arg=/STACK:67108864"]

[target.wasm32-unknown-unknown]
rustflags = [ "--cfg", 'getrandom_backend="wasm_js"' ]

# Give every cargo-spawned thread (libtest's per-test threads especially) the
# stack the shipped CLI gives its compile workers (`baml_cli::main` builds
# rayon's pool with 16 MiB), so in-process compiler tests overflow exactly
# where the CLI would, on Windows too. Virtual reserve only.
[env]
RUST_MIN_STACK = "16777216"
