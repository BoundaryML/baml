# Dev aliases: native-tls by default (fast compile), rustls for release (portable).
#
#   cargo b   →  build with native-tls  (dev)
#   cargo br  →  build with rustls      (release)
#   cargo t   →  test  with native-tls  (dev)
#   cargo tr  →  test  with rustls      (release)
[alias]
b  = "build -p baml_cli"
br = "build -p baml_cli --release --no-default-features --features rustls"
t  = "test -p baml_cli"
tr = "test -p baml_cli --release --no-default-features --features rustls"
