baseline_dir = ".ci/size-gate"

# The size gate tracks the three artifacts users actually ship:
#   1. baml-cli       — the CLI binary (measured on every native platform)
#   2. packed-program — a trivial program built with `baml pack`, i.e. the
#                       pack-host binary + bytecode envelope a user ships
#                       (measured on every native platform)
#   3. bridge_wasm    — the WASM build
#
# The gate is on ACTUAL on-disk size (`max_file_bytes` / `max_delta_pct`).
# Gzip is still measured and shown in the report for visibility, but it is
# not what we benchmark against. Two gates, both kept tight as we drive
# size down:
#   * max_delta_pct — per-platform regression guard vs the committed
#     baseline in `baseline_dir`, on file size. 3% absorbs normal
#     build-to-build LTO jitter while still catching accidental growth.
#   * max_file_bytes — an absolute hard ceiling on file size. Set PER
#     PLATFORM (binaries differ across OSes) so each platform is capped
#     ~150–200 KB above its own recorded baseline, not loosely to the
#     largest platform. Bump a ceiling only as a deliberate, reviewed
#     commit when a real size increase lands.
#
# When recording a new platform (`mise run size-gate-record`), commit the
# baseline it writes and add the matching `max_file_bytes` ceiling here,
# tight (~150–200 KB) above that file size.

[artifacts.baml-cli]
kind = "bin"
package = "baml_cli"
bin = "baml-cli"
policy.max_delta_pct = 3.0

# macOS arm64: re-baselined from CI (see .ci/size-gate stub). Ceiling
# added once CI records the authoritative file size:
# [artifacts.baml-cli.platform.aarch64-apple-darwin]
# max_file_bytes = <recorded file_bytes + ~200 KB>
# Linux x86_64: baseline 19.40 MB file.
[artifacts.baml-cli.platform.x86_64-unknown-linux-gnu]
max_file_bytes = 19_600_000
# Windows x86_64: baseline 15.76 MB file.
[artifacts.baml-cli.platform.x86_64-pc-windows-msvc]
max_file_bytes = 15_950_000

[artifacts.packed-program]
kind = "pack"
policy.max_delta_pct = 3.0

# macOS arm64: re-baselined from CI. Ceiling added once CI records it:
# [artifacts.packed-program.platform.aarch64-apple-darwin]
# max_file_bytes = <recorded file_bytes + ~200 KB>
# Linux x86_64: baseline 14.69 MB file.
[artifacts.packed-program.platform.x86_64-unknown-linux-gnu]
max_file_bytes = 14_900_000
# Windows x86_64: baseline 11.85 MB file.
[artifacts.packed-program.platform.x86_64-pc-windows-msvc]
max_file_bytes = 12_050_000

[artifacts.packed-program.pack]
cli_package = "baml_cli"
cli_bin = "baml-cli"
host_package = "baml_pack_host"
host_bin = "baml-pack-host"
fixture = "crates/tools_size_gate/fixtures/minimal.baml"
function = "Identity"

[artifacts.bridge_wasm]
package = "bridge_wasm"
target = "wasm32-unknown-unknown"
no_default_features = true
wasm = true
policy.max_delta_pct = 3.0

# WASM is a single platform; baseline 12.82 MB file.
[artifacts.bridge_wasm.platform.wasm32-unknown-unknown]
max_file_bytes = 13_020_000
