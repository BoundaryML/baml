[project]
name = "baml-integ-tests"
version = "0.1.0"
description = "Integration tests for baml_language Python codegen"
requires-python = ">=3.9"
dependencies = [
    "baml-py",
    "pydantic>=2.0",
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "python-dotenv",
]

[tool.uv.sources]
baml-py = { path = "../../crates/bridge_python", editable = true }

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
