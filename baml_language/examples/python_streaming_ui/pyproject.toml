[project]
name = "python-streaming-ui"
version = "0.0.0"
description = "Streamlit app comparing structured-output streaming through baml_sdk and native provider SDKs"
requires-python = ">=3.10"
dependencies = [
    "baml_bridge",
    "streamlit>=1.64",
    "openai>=3.22",
    "anthropic[bedrock]>=1.10",
    "google-genai>=1.0",
    "google-auth>=2.0",
    "pydantic>=2",
    "jiter>=0.8",
    "pandas>=2",
]

[tool.uv]
package = false

[tool.uv.sources]
# Built from this checkout (release profile) so the numbers reflect the repo's runtime.
baml_bridge = { path = "../../sdks/python" }

[tool.ruff]
line-length = 120
extend-exclude = ["baml_sdk"]
