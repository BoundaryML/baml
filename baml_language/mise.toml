# Mise tasks for baml_language
# Ordering between tasks is enforced by .pre-commit-config.yaml priorities, not here

[tasks.validate-markdown]
description = "Validate markdown files"
run = "scripts/validate_markdown.py"
sources = ["**/*.md", ".markdown-whitelist"]

[tasks.fmt]
description = "Run cargo fmt"
run = "cargo fmt --all -- --config imports_granularity=Crate --config group_imports=StdExternalCrate"
sources = ["**/*.rs"]

# Note that clippy-fix and clippy are separate tasks because clippy-fix is substantially slower.
[tasks.clippy-fix]
description = "Auto-fix clippy warnings"
run = "cargo clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged --allow-no-vcs -- -D warnings"
sources = ["**/*.rs", "**/Cargo.toml"]

[tasks.clippy]
description = "Run cargo clippy"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
sources = ["**/*.rs", "**/Cargo.toml"]

[tasks.wasm-excluded]
description = "List crates excluded from WASM builds (metadata.ci.wasm_support = false)"
run = "cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.source==null) | select(if .metadata.ci.wasm_support == null then false else (.metadata.ci.wasm_support | not) end) | .name' | sort"

[tasks.clippy-wasm]
description = "Run cargo clippy for wasm target (bans std::time::{SystemTime,Instant})"
run = """
#!/usr/bin/env bash
set -euo pipefail

# Use checked-in clippy-wasm/clippy.toml via CLIPPY_CONF_DIR so we never overwrite workspace config.
WASM_PKGS=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.source==null) | select(if .metadata.ci.wasm_support == null then true else .metadata.ci.wasm_support end) | "-p \\(.name)"' | xargs)
if [ -z "$WASM_PKGS" ]; then
  echo "No WASM-enabled packages found; nothing to check." >&2
  exit 0
fi
CLIPPY_CONF_DIR="$MISE_CONFIG_ROOT/clippy-wasm" cargo clippy $WASM_PKGS --target wasm32-unknown-unknown --all-features --locked -- -D warnings -W clippy::disallowed-types

"""
sources = ["**/*.rs", "**/Cargo.toml", "clippy-wasm/clippy.toml"]

[tasks.stow]
description = "Run cargo stow"
run = "cargo run -p cargo-stow -- stow --fix"
sources = ["**/*.rs", "**/Cargo.toml"]

[tasks.size-gate]
description = "Check artifact sizes against baseline"
run = "cargo run -p cargo-size-gate -- size-gate check"

[tasks.size-gate-update]
description = "Adopt the latest CI-measured sizes from canary as the baseline (no rebuild)"
run = "cargo run -p cargo-size-gate -- size-gate bake --branch canary"

[tasks.size-gate-record]
description = "Record a new size baseline by building locally (bootstrap a brand-new platform)"
run = "cargo run -p cargo-size-gate -- size-gate record"

[tasks.fmt-cpp]
description = "Run clang-format over the hand-written C++ SDK sources"
run = "scripts/fmt_cpp.sh"
sources = ["sdks/cpp/**/*.h", "sdks/cpp/**/*.cc", "sdk_tests/crates/cpp/**/*.h", "sdk_tests/crates/cpp/**/*.cc"]

[tasks.insta-update]
description = "Run all snapshot tests with INSTA_UPDATE=always"
env = { INSTA_UPDATE = "always" }
run = "cargo test --workspace"
sources = ["**/*.rs", "**/Cargo.toml"]

[tasks.fmt-stdlib]
description = "Run the BAML formatter on the standard library packages"
run = "cargo run -p baml_cli -- fmt"
dir = "crates/baml_builtins2/baml_std"
sources = ["crates/baml_builtins2/baml_std/**/*.baml"]

[tasks.type-quiz-lint]
description = "Check the structural invariants of tools/type_quiz (layering, banned APIs)"
run = "tools/type_quiz/lint.sh"
sources = ["tools/type_quiz/**/*.baml", "tools/type_quiz/lint.sh"]

[tasks.type-quiz-test]
description = "Run the type-quiz conformance suite (offline profile)"
# Deliberately no `sources`: the suite's real inputs include the whole
# compiler, because its job is to notice when a compiler change makes the quiz
# stale. Listing only the package's own files would let an up-to-date check
# skip exactly the run that matters.
run = '''
set -euo pipefail
# The CLI writes its home, cache and profile streams beside the package unless
# told otherwise, which leaves a few hundred megabytes under tools/type_quiz.
# Keep all three under target/, as crates/baml_tests/tests/type_quiz.rs does.
home="$PWD/target/baml-type-quiz-home"
mkdir -p "$home"
printf '[update]\nauto_check = false\n' > "$home/config.toml"
BAML_CLI_ALLOW_DIRECT=1 \
BAML_HOME="$home" \
BAML_CACHE_DIR="$PWD/target/baml-type-quiz-cache" \
BAML_PROFILE_DIR="$PWD/target/baml-type-quiz-profiles" \
    cargo run -p baml_cli -- test --from tools/type_quiz
'''

[tasks.fmt-type-quiz]
description = "Run the BAML formatter on tools/type_quiz"
run = "cargo run -p baml_cli -- fmt --project tools/type_quiz"
sources = ["tools/type_quiz/**/*.baml"]
