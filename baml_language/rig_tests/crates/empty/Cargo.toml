# Hand-written rig crate; pins the degenerate-input contract. Drives
# codegen from an empty `baml_src/` directory through the full
# `baml_project::build_symbol_pool` pipeline and asserts that the
# generated `baml_sdk` tree is still importable.
[package]
name = "rig_empty"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
baml_codegen_python = { path = "../../../crates/baml_codegen_python" }
baml_codegen_types = { path = "../../../crates/baml_codegen_types" }
baml_db = { path = "../../../crates/baml_db" }
baml_project = { path = "../../../crates/baml_project" }
baml_workspace = { path = "../../../crates/baml_workspace" }

[package.metadata.ci]
wasm_support = false
