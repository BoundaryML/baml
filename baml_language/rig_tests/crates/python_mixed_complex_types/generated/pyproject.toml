[project]
name = "baml-test-mixed_complex_types"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
line-length = 120
# Exclude .pyi stub files from linting
extend-exclude = ["*.pyi"]

[tool.ruff.lint]
# Ignore unused imports and undefined names in generated code
# F401: unused imports, F821: undefined name (forward references)
ignore = ["F401", "F821"]
