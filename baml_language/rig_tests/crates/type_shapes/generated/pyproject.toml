[project]
name = "baml-test-type-shapes"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "baml",
    "pydantic>=2",
    "typing-extensions",
    "pytest>=7",
    "ruff",
    "pyright>=1.1",
]

[dependency-groups]
dev = []

[tool.uv]
package = false

[tool.uv.sources]
baml = { path = "../../../../languages/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
line-length = 120
extend-exclude = ["*.pyi"]

[tool.ruff.lint]
ignore = ["F401", "F821", "E402"]
