# Hand-written rig crate (NOT generated by tools_rig).
#
# Unlike the `python_<fixture>` crates that drive `to_source_code` from
# an in-memory `SymbolPool` built by `rig_fixtures`, this crate starts
# from real `.baml` source under `baml_src/` and goes through the full
# `baml_project::build_symbol_pool` pipeline — i.e. parse → HIR → TIR →
# `SymbolPool` → emitter, mirroring the path `baml-cli generate` takes
# end-to-end. Scope: the user-side slice of
# `09a-codegen-example-scenario.md` (lorem.Resume + ipsum.Sentiment +
# their companion-bearing functions). Vendor / `baml.*` / handle-backed
# class scenarios from 09a are out of scope here per 11h §12.5.
[package]
name = "rig_python_example_09a"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
baml_codegen_python = { path = "../../../crates/baml_codegen_python" }
baml_codegen_types = { path = "../../../crates/baml_codegen_types" }
baml_db = { path = "../../../crates/baml_db" }
baml_project = { path = "../../../crates/baml_project" }
baml_workspace = { path = "../../../crates/baml_workspace" }

[package.metadata.ci]
wasm_support = false
