nextest-version = "0.9.98"

experimental = ["setup-scripts"]

# The rust sdk-test fixture tests each spawn a `cargo` subprocess into one
# shared CARGO_TARGET_DIR, whose build lock serializes them anyway — running
# them concurrently only multiplies waiting cargo processes and their rustc
# swarms. Cap the package at 2 in-flight tests (rustfmt is lock-free, so one
# fmt check can overlap one cargo build); the setup-script pre-warm absorbs
# the cold build of the shared stack before tests fan out.
[test-groups]
rust-sdk-fixture = { max-threads = 2 }
# Java: every fixture's javac+junit gate invokes `gradle` against the SAME
# shared GRADLE_USER_HOME (target/gradle-home). Gradle's daemon registry and
# file-lock port reservation live under that home, so two concurrent `gradle`
# launches race on it even when their project dirs differ. On Windows that race
# is fatal ("Timeout waiting to connect to the Gradle daemon" / "Cannot start
# managing file contention because this handler has been closed"); POSIX is more
# forgiving but not immune under CI load. Funnel the whole package through one
# in-flight gradle at a time (see the package-wide override below).
java-gradle-serial = { max-threads = 1 }
# C# fixtures share the bridge project's MSBuild obj directory.
csharp-sdk-fixture = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(=sdk_test_rust)'
test-group = 'rust-sdk-fixture'

[[profile.default.overrides]]
filter = 'package(=sdk_test_csharp)'
test-group = 'csharp-sdk-fixture'

# Node TypeScript tests build only the native bridge and Node fixture packages.
[scripts.setup.typescript_pnpm_unix]
command = './sdk_tests/crates/typescript/setup.sh'
capture-stdout = true
capture-stderr = true

[scripts.setup.typescript_pnpm_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/typescript/setup.ps1']
capture-stdout = true
capture-stderr = true

[[profile.default.scripts]]
filter = 'package(=sdk_test_typescript)'
platform = { host = 'cfg(unix)' }
setup = 'typescript_pnpm_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_typescript)'
platform = { host = 'cfg(windows)' }
setup = 'typescript_pnpm_win'

# Browser and Workers tests share the Web/Wasm bridge build and Chromium install.
[scripts.setup.typescript_web_pnpm_unix]
command = './sdk_tests/crates/typescript_web/setup.sh'
capture-stdout = true
capture-stderr = true

[scripts.setup.typescript_web_pnpm_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/typescript_web/setup.ps1']
capture-stdout = true
capture-stderr = true

[[profile.default.scripts]]
filter = 'package(=sdk_test_typescript_web)'
platform = { host = 'cfg(unix)' }
setup = 'typescript_web_pnpm_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_typescript_web)'
platform = { host = 'cfg(windows)' }
setup = 'typescript_web_pnpm_win'

# rust tests need each fixture's generated crate pre-built into the shared
# CARGO_TARGET_DIR so the parallel test-time cargo invocations hit a warm
# cache. fire only when a rust sdk-test is selected.
[scripts.setup.rust_cargo_unix]
command = './sdk_tests/crates/rust/setup.sh'

[scripts.setup.rust_cargo_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/rust/setup.ps1']

[[profile.default.scripts]]
filter = 'package(=sdk_test_rust)'
platform = { host = 'cfg(unix)' }
setup = 'rust_cargo_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_rust)'
platform = { host = 'cfg(windows)' }
setup = 'rust_cargo_win'

# baml_bridge is dylib-only: its tests load the engine cdylib at run time
# (located next to the test binary in <target>/<profile>/). Build it before
# any baml_bridge test runs — the lib test binary mixes pure loader/encode
# tests with engine-dependent ones (completion, live_engine, conversions),
# so this fires for the whole package. The general cargo-test jobs exclude
# baml_bridge entirely (the non-cacheable cdylib build is too heavy there);
# it runs in the rust sdk-tests leg, reusing sdk_test_rust's engine build.
[scripts.setup.rust_bridge_engine_unix]
command = './sdks/rust/bridge_rust/build-engine.sh'

[scripts.setup.rust_bridge_engine_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdks/rust/bridge_rust/build-engine.ps1']

[[profile.default.scripts]]
filter = 'package(=baml_bridge)'
platform = { host = 'cfg(unix)' }
setup = 'rust_bridge_engine_unix'

[[profile.default.scripts]]
filter = 'package(=baml_bridge)'
platform = { host = 'cfg(windows)' }
setup = 'rust_bridge_engine_win'

# `pack_e2e` needs the `baml-pack-host` executable from another Cargo package.
# Build it once before nextest fans the individual cases out into separate
# processes. The setup scripts mark matching tests through NEXTEST_ENV, so the
# test helper validates the prebuilt sibling instead of recursively invoking
# Cargo once per case. Plain `cargo test` retains its one-process fallback.
[scripts.setup.baml_pack_host_unix]
command = './crates/baml_cli/tests/build-pack-host.sh'

[scripts.setup.baml_pack_host_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './crates/baml_cli/tests/build-pack-host.ps1']

[[profile.default.scripts]]
filter = 'binary(=pack_e2e)'
platform = { host = 'cfg(unix)' }
setup = 'baml_pack_host_unix'

[[profile.default.scripts]]
filter = 'binary(=pack_e2e)'
platform = { host = 'cfg(windows)' }
setup = 'baml_pack_host_win'

# java tests need the shared Gradle home staged (and, once the Java
# bridge lands, the native bridge library built + per-fixture Gradle
# dependency resolution warmed). fire only when a java sdk-test is
# selected. setup.sh / setup.ps1 are equivalent — same steps in the
# host shell of each platform.
[scripts.setup.java_gradle_unix]
command = './sdk_tests/crates/java/setup.sh'

[scripts.setup.java_gradle_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/java/setup.ps1']

[[profile.default.scripts]]
filter = 'package(=sdk_test_java)'
platform = { host = 'cfg(unix)' }
setup = 'java_gradle_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_java)'
platform = { host = 'cfg(windows)' }
setup = 'java_gradle_win'

# The java sdk-test emits two gates per green fixture — `javac`
# (compileTestJava) and `junit` (test) — and every one shells out to `gradle`
# against the shared GRADLE_USER_HOME. Two gates race two ways: within a fixture
# on the project lock, and across fixtures on the shared daemon registry (the
# latter is what broke the Windows leg — 4 concurrent gradle launches, one timed
# out connecting to its forked daemon). A single package-wide override funnels
# the entire sdk_test_java suite through the one-slot `java-gradle-serial` group,
# which closes both races; it subsumes the old per-fixture groups. The two
# non-gradle gates (`build_diagnostics`, `setup_guard`) ride along harmlessly.
[[profile.default.overrides]]
filter = 'package(=sdk_test_java)'
test-group = 'java-gradle-serial'
# swift tests need the host-arch bridge_swift staticlib assembled into
# sdks/swift/Binaries/BamlBridgeFFI.xcframework (the fixtures' path dep
# links it). macOS only — there is no Swift toolchain on the other CI
# hosts, and the fixture tests are #[ignore]d off-macOS to match.
[scripts.setup.swift_xcframework_macos]
command = './sdk_tests/crates/swift/setup.sh'

[[profile.default.scripts]]
filter = 'package(=sdk_test_swift)'
platform = { host = 'cfg(target_os = "macos")' }
setup = 'swift_xcframework_macos'

# python tests need each fixture's venv synced with freshly-built baml_bridge.
# fire only when a python sdk-test is selected. Unix uses `uv sync` per
# fixture plus one incremental `maturin develop`; Windows builds one wheel
# first, then fixture `uv sync` installs that wheel to avoid duplicate
# editable baml_bridge builds.
[scripts.setup.python_pydantic2_uv_unix]
command = './sdk_tests/crates/python_pydantic2/setup.sh'

[scripts.setup.python_pydantic2_uv_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/python_pydantic2/setup.ps1']

[[profile.default.scripts]]
filter = 'package(=sdk_test_python_pydantic2)'
platform = { host = 'cfg(unix)' }
setup = 'python_pydantic2_uv_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_python_pydantic2)'
platform = { host = 'cfg(windows)' }
setup = 'python_pydantic2_uv_win'

[scripts.setup.go_bridge_unix]
command = './sdk_tests/crates/go/setup.sh'

[scripts.setup.go_bridge_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/go/setup.ps1']

[[profile.default.scripts]]
filter = 'package(=sdk_test_go)'
platform = { host = 'cfg(unix)' }
setup = 'go_bridge_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_go)'
platform = { host = 'cfg(windows)' }
setup = 'go_bridge_win'

# cpp tests link the dev-profile bridge_cffi cdylib; build it once. fire only
# when a cpp sdk-test is selected. setup.sh / setup.ps1 are byte-for-byte
# equivalent — same cargo build in the host shell of each platform.
[scripts.setup.cpp_cdylib_unix]
command = './sdk_tests/crates/cpp/setup.sh'

[scripts.setup.cpp_cdylib_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/cpp/setup.ps1']

[[profile.default.scripts]]
