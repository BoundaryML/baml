nextest-version = "0.9.98"

experimental = ["setup-scripts"]

# TypeScript tests need the native bridge and fixture packages. Fire only
# when a typescript_node test is selected. setup.sh / setup.ps1 are
# byte-for-byte equivalent — same pnpm steps in the host shell of each
# platform.
[scripts.setup.typescript_node_pnpm_unix]
command = './sdk_tests/crates/typescript/setup.sh'
capture-stdout = true
capture-stderr = true

[scripts.setup.typescript_node_pnpm_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/typescript/setup.ps1']
capture-stdout = true
capture-stderr = true

[[profile.default.scripts]]
filter = 'package(=sdk_test_typescript_node)'
platform = { host = 'cfg(unix)' }
setup = 'typescript_node_pnpm_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_typescript_node)'
platform = { host = 'cfg(windows)' }
setup = 'typescript_node_pnpm_win'

# java tests need the shared Gradle home staged (and, once the Java
# bridge lands, the native bridge library built + per-fixture Gradle
# dependency resolution warmed). fire only when a java sdk-test is
# selected. setup.sh / setup.ps1 are equivalent — same steps in the
# host shell of each platform.
[scripts.setup.java_gradle_unix]
command = './sdk_tests/crates/java/setup.sh'

[scripts.setup.java_gradle_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/java/setup.ps1']

[[profile.default.scripts]]
filter = 'package(=sdk_test_java)'
platform = { host = 'cfg(unix)' }
setup = 'java_gradle_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_java)'
platform = { host = 'cfg(windows)' }
setup = 'java_gradle_win'

# The java sdk-test emits two gates per green fixture — `javac`
# (compileTestJava) and `junit` (test) — and BOTH invoke `gradle` in the
# same `<fixture>/generated/` project dir. Gradle takes an exclusive
# project lock, so running a fixture's two gates concurrently would race
# (one blocks on the lock and can time out). Serialize each fixture's
# gates into a per-fixture test group with max-threads = 1; distinct
# fixtures still run in parallel (different dirs — already proven safe by
# the two javac gates). Add a group + override here when a fixture joins
# GREEN_JUNIT_FIXTURES in sdk_tests/harness_setup/src/java.rs.
[test-groups]
java-fixture-type-shapes = { max-threads = 1 }
java-fixture-function-calls = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(=sdk_test_java) & test(/^type_shapes::/)'
test-group = 'java-fixture-type-shapes'

[[profile.default.overrides]]
filter = 'package(=sdk_test_java) & test(/^function_calls::/)'
test-group = 'java-fixture-function-calls'

# python tests need each fixture's venv synced with freshly-built baml_bridge.
# fire only when a python sdk-test is selected. Unix uses `uv sync` per
# fixture plus one incremental `maturin develop`; Windows builds one wheel
# first, then fixture `uv sync` installs that wheel to avoid duplicate
# editable baml_bridge builds.
[scripts.setup.python_pydantic2_uv_unix]
command = './sdk_tests/crates/python_pydantic2/setup.sh'

[scripts.setup.python_pydantic2_uv_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/python_pydantic2/setup.ps1']

[[profile.default.scripts]]
filter = 'package(=sdk_test_python_pydantic2)'
platform = { host = 'cfg(unix)' }
setup = 'python_pydantic2_uv_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_python_pydantic2)'
platform = { host = 'cfg(windows)' }
setup = 'python_pydantic2_uv_win'
