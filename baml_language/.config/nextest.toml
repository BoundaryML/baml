nextest-version = "0.9.98"

experimental = ["setup-scripts"]

# The rust sdk-test fixture tests each spawn a `cargo` subprocess into one
# shared CARGO_TARGET_DIR, whose build lock serializes them anyway — running
# them concurrently only multiplies waiting cargo processes and their rustc
# swarms. Cap the package at 2 in-flight tests (rustfmt is lock-free, so one
# fmt check can overlap one cargo build); the setup-script pre-warm absorbs
# the cold build of the shared stack before tests fan out.
[test-groups]
rust-sdk-fixture = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'package(=sdk_test_rust)'
test-group = 'rust-sdk-fixture'

# TypeScript matrix tests need both bridges, fixture packages, and Chromium. Fire only
# when a TypeScript test is selected. setup.sh / setup.ps1 are
# byte-for-byte equivalent — same pnpm steps in the host shell of each
# platform.
[scripts.setup.typescript_pnpm_unix]
command = './sdk_tests/crates/typescript/setup.sh'
capture-stdout = true
capture-stderr = true

[scripts.setup.typescript_pnpm_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/typescript/setup.ps1']
capture-stdout = true
capture-stderr = true

[[profile.default.scripts]]
filter = 'package(=sdk_test_typescript)'
platform = { host = 'cfg(unix)' }
setup = 'typescript_pnpm_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_typescript)'
platform = { host = 'cfg(windows)' }
setup = 'typescript_pnpm_win'

# rust tests need each fixture's generated crate pre-built into the shared
# CARGO_TARGET_DIR so the parallel test-time cargo invocations hit a warm
# cache. fire only when a rust sdk-test is selected.
[scripts.setup.rust_cargo_unix]
command = './sdk_tests/crates/rust/setup.sh'

[scripts.setup.rust_cargo_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/rust/setup.ps1']

[[profile.default.scripts]]
filter = 'package(=sdk_test_rust)'
platform = { host = 'cfg(unix)' }
setup = 'rust_cargo_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_rust)'
platform = { host = 'cfg(windows)' }
setup = 'rust_cargo_win'

# baml_bridge is dylib-only: its tests load the engine cdylib at run time
# (located next to the test binary in <target>/<profile>/). Build it before
# any of its tests run. fire only when a baml_bridge test is selected.
[scripts.setup.rust_bridge_engine_unix]
command = './sdks/rust/bridge_rust/build-engine.sh'

[scripts.setup.rust_bridge_engine_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdks/rust/bridge_rust/build-engine.ps1']

[[profile.default.scripts]]
filter = 'package(=baml_bridge)'
platform = { host = 'cfg(unix)' }
setup = 'rust_bridge_engine_unix'

[[profile.default.scripts]]
filter = 'package(=baml_bridge)'
platform = { host = 'cfg(windows)' }
setup = 'rust_bridge_engine_win'

# python tests need each fixture's venv synced with freshly-built baml_bridge.
# fire only when a python sdk-test is selected. Unix uses `uv sync` per
# fixture plus one incremental `maturin develop`; Windows builds one wheel
# first, then fixture `uv sync` installs that wheel to avoid duplicate
# editable baml_bridge builds.
[scripts.setup.python_pydantic2_uv_unix]
command = './sdk_tests/crates/python_pydantic2/setup.sh'

[scripts.setup.python_pydantic2_uv_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/python_pydantic2/setup.ps1']

[[profile.default.scripts]]
filter = 'package(=sdk_test_python_pydantic2)'
platform = { host = 'cfg(unix)' }
setup = 'python_pydantic2_uv_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_python_pydantic2)'
platform = { host = 'cfg(windows)' }
setup = 'python_pydantic2_uv_win'
