nextest-version = "0.9.98"

experimental = ["setup-scripts"]

# Node TypeScript tests build only the native bridge and Node fixture packages.
[scripts.setup.typescript_pnpm_unix]
command = './sdk_tests/crates/typescript/setup.sh'
capture-stdout = true
capture-stderr = true

[scripts.setup.typescript_pnpm_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/typescript/setup.ps1']
capture-stdout = true
capture-stderr = true

[[profile.default.scripts]]
filter = 'package(=sdk_test_typescript)'
platform = { host = 'cfg(unix)' }
setup = 'typescript_pnpm_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_typescript)'
platform = { host = 'cfg(windows)' }
setup = 'typescript_pnpm_win'

# Browser and Workers tests share the Web/Wasm bridge build and Chromium install.
[scripts.setup.typescript_web_pnpm_unix]
command = './sdk_tests/crates/typescript_web/setup.sh'
capture-stdout = true
capture-stderr = true

[scripts.setup.typescript_web_pnpm_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/typescript_web/setup.ps1']
capture-stdout = true
capture-stderr = true

[[profile.default.scripts]]
filter = 'package(=sdk_test_typescript_web)'
platform = { host = 'cfg(unix)' }
setup = 'typescript_web_pnpm_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_typescript_web)'
platform = { host = 'cfg(windows)' }
setup = 'typescript_web_pnpm_win'

# python tests need each fixture's venv synced with freshly-built baml_bridge.
# fire only when a python sdk-test is selected. Unix uses `uv sync` per
# fixture plus one incremental `maturin develop`; Windows builds one wheel
# first, then fixture `uv sync` installs that wheel to avoid duplicate
# editable baml_bridge builds.
[scripts.setup.python_pydantic2_uv_unix]
command = './sdk_tests/crates/python_pydantic2/setup.sh'

[scripts.setup.python_pydantic2_uv_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/python_pydantic2/setup.ps1']

[[profile.default.scripts]]
filter = 'package(=sdk_test_python_pydantic2)'
platform = { host = 'cfg(unix)' }
setup = 'python_pydantic2_uv_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_python_pydantic2)'
platform = { host = 'cfg(windows)' }
setup = 'python_pydantic2_uv_win'

# cpp tests link the dev-profile bridge_cffi cdylib; build it once. fire only
# when a cpp sdk-test is selected. setup.sh / setup.ps1 are byte-for-byte
# equivalent — same cargo build in the host shell of each platform.
[scripts.setup.cpp_cdylib_unix]
command = './sdk_tests/crates/cpp/setup.sh'

[scripts.setup.cpp_cdylib_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/cpp/setup.ps1']

[[profile.default.scripts]]
filter = 'package(=sdk_test_cpp)'
platform = { host = 'cfg(unix)' }
setup = 'cpp_cdylib_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_cpp)'
platform = { host = 'cfg(windows)' }
setup = 'cpp_cdylib_win'
