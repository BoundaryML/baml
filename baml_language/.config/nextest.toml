platform = { host = 'cfg(unix)' }
setup = 'cpp_cdylib_unix'

[[profile.default.scripts]]
filter = 'package(=sdk_test_cpp)'
platform = { host = 'cfg(windows)' }
setup = 'cpp_cdylib_win'

[scripts.setup.csharp_cdylib_unix]
command = './sdk_tests/crates/csharp/setup.sh'

[scripts.setup.csharp_cdylib_win]
command = ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './sdk_tests/crates/csharp/setup.ps1']

[[profile.default.scripts]]
