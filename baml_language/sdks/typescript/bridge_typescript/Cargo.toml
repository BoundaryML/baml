[package]
name = "bridge_typescript"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "baml_node"
crate-type = [ "cdylib" ]
# Rust unit/doc tests cannot link standalone: the test binary references the
# napi C-API symbols, which are provided by Node at addon-load time and are
# undefined at link time (`cargo test` would fail with unresolved `napi_*`).
# All testing is done via jest (`pnpm test`). Mirrors bridge_python.
test = false
doctest = false

[features]
baml-defaults = [ "bridge_cffi/baml-defaults" ]
default = [ "bundle-http", "baml-defaults" ]
bundle-http = [ "bridge_cffi/bundle-http" ]
# BAML never contacts anything on its own (see VENDOR.md).
no-phone-home = [ "bridge_cffi/no-phone-home", "sys_native/no-phone-home" ]

[dependencies]
baml_version = { workspace = true }
bex_events = { workspace = true }
bex_project = { workspace = true }
bridge_cffi = { workspace = true }
bridge_ctypes = { workspace = true }
sys_native = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
napi = { workspace = true, features = [ "anyhow", "async", "napi5", "serde-json", "tokio_rt" ] }
napi-derive = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

[package.metadata.ci]
wasm_support = false
