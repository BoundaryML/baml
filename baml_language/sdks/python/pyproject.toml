[project]
name = "baml_bridge"
version = "0.17.0"
description = "BAML python bindings (new system, bex_engine)"
authors = [{ "name" = "Boundary", "email" = "contact@boundaryml.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "protobuf>=6.31.1",
    # `UNSET` is built with `typing_extensions.Sentinel` (PEP 661).
    "typing-extensions>=4.14.0",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "pytest-xdist>=3",
    "maturin>=1.9.4,<2.0",
    "grpcio-tools>=1.50",
    "pydantic>=2",
    "pyright>=1.1.410",
    "ruff",
    "ty",
]

[build-system]
# >= 1.10 for `tool.maturin.editable-profile` below; an older maturin ignores
# the key and silently builds editables with the release profile again.
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"


[tool.maturin]
python-source = "src"
manifest-path = "rust/bridge_python/Cargo.toml"
module-name = "baml_bridge.baml_py"
include = [{ path = "src/baml_bridge/py.typed", format = ["sdist", "wheel"] }]
# Editable (PEP 660) installs otherwise inherit `profile`, i.e. `release` —
# fat LTO, codegen-units = 1, opt-level = "s" (baml_language/Cargo.toml) — so
# `uv sync` compiles the whole engine graph from scratch. Nothing consumes
# that artifact: `maturin develop` is itself an editable build, and it
# replaces the extension with a dev-profile one immediately afterwards (see
# sdk_tests/crates/python_pydantic2/setup.sh). Pinning editables to `dev`
# leaves the two steps sharing one set of cargo artifacts.
# `editable-profile` affects only PEP 660 editable builds such as `uv sync`;
# it does not affect `maturin build` or the release workflow.
editable-profile = "dev"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-n auto"

[tool.ruff]
extend-exclude = ["src/baml_bridge/cffi/v1/*_pb2.py"]

[tool.ty.environment]
extra-paths = ["tests/sim"]

[tool.ty.rules]
# Protobuf generated stubs use metaclass patterns ty can't handle.
conflicting-metaclass = "ignore"
# proto.py constructs types dynamically at runtime (List[fn()], Literal[var]).
invalid-type-form = "ignore"
# Collector subclass returns a Python FunctionLog wrapper instead of the
# Rust FunctionLog — nominally different types that are functionally identical.
invalid-method-override = "warn"
