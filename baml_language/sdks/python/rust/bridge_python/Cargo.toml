[package]
name = "bridge_python"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "baml_py"
crate-type = [ "cdylib", "rlib" ]
# Rust unit/doc tests cannot run — the test binary references Python C API
# symbols at startup (via #[pyclass]) and there's no libpython to load.
# All testing is done via `uv run pytest tests/`.
doc = false
test = false
doctest = false

[features]
baml-defaults = [ "bridge_cffi/baml-defaults", "dep:pyo3-stub-gen" ]
default = [ "bundle-http", "baml-defaults" ]
bundle-http = [ "bridge_cffi/bundle-http" ]
# Do not add a Cargo `extension-module` feature here. PyO3 0.28 expects
# maturin to set PYO3_BUILD_EXTENSION_MODULE only while packaging; making it a
# normal feature lets `cargo test --all-features` disable libpython linking.
# BAML never contacts anything on its own (see VENDOR.md).
no-phone-home = [ "bridge_cffi/no-phone-home", "sys_native/no-phone-home" ]

[dependencies]
baml_version = { workspace = true }
bex_events = { workspace = true }
bex_project = { workspace = true }
bridge_cffi = { workspace = true }
bridge_ctypes = { workspace = true }
sys_native = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
prost = { workspace = true }
pyo3 = { workspace = true, features = [ "abi3-py310", "indexmap", "multiple-pymethods" ] }
pyo3-async-runtimes = { workspace = true, features = [ "tokio-runtime" ] }
pyo3-stub-gen = { workspace = true, optional = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [ "rt", "rt-multi-thread" ] }

[build-dependencies]
pyo3-build-config = { workspace = true }

[[bin]]
name = "stub_gen"
required-features = [ "baml-defaults" ]
path = "src/bin/stub_gen.rs"
doc = false
test = false

[package.metadata.ci]
wasm_support = false
