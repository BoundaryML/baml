[package]
name = "baml_bridge"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
description = "BAML runtime bridge for Rust: embeds the BAML engine behind generated, typed SDKs"
readme = "README.md"
keywords = [ "baml", "llm", "ai", "sdk" ]
categories = [ "api-bindings", "development-tools" ]

[lib]
name = "baml_bridge"
doc = false
doctest = false

[features]
default = [ "bundle-http", "aws-crypto" ]
bundle-http = [ "bridge_cffi/bundle-http" ]
aws-crypto = [ "bundle-http", "bex_project/aws-crypto", "bridge_cffi/aws-crypto" ]
ring-crypto = [ "bundle-http", "bex_project/ring-crypto", "bridge_cffi/ring-crypto" ]

[dependencies]
baml_version = { workspace = true }
bex_events = { workspace = true }
bex_project = { workspace = true }
bridge_cffi = { workspace = true }
bridge_ctypes = { workspace = true }
sys_native = { workspace = true }
sys_types = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
num-bigint = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [ "rt", "rt-multi-thread" ] }

[dev-dependencies]
tokio = { workspace = true, features = [ "rt", "rt-multi-thread", "macros" ] }

[lints]
workspace = true

[package.metadata.ci]
wasm_support = false
