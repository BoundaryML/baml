[package]
name = "baml_bridge"
edition.workspace = true
# Advertise the crate's minimum supported Rust to crates.io consumers; the
# verify workflow's MSRV leg proves the packaged crate + generated SDK compile
# on it.
rust-version.workspace = true
# A literal version, NOT the workspace `0.0.0-beta`: this crate publishes to
# crates.io, so its version must be the canonical BAML language version.
# `scripts/baml-language-version` keeps this equal to the canary version and
# stamps it to the release version at packaging time (`check` guards it).
version = "0.23.0"
authors.workspace = true
license.workspace = true
license-file = "LICENSE"
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
description = "BAML runtime bridge for Rust: embeds the BAML engine behind generated, typed SDKs"
readme = "README.md"
keywords = [ "baml", "llm", "ai", "sdk" ]
categories = [ "api-bindings", "development-tools" ]

[lib]
name = "baml_bridge"
doc = false
doctest = false

# The engine is never linked into this crate: like the other dylib-loader
# clients, every call goes through the C ABI of a `bridge_cffi` shared
# library resolved at runtime by `baml_bridge::loader` — one call path in
# development and in production. Engine capabilities (HTTP stack, crypto)
# are baked into the shared library when *it* is built.
[dependencies]
hex = { workspace = true }
indexmap = { workspace = true, features = [ "serde" ] }
libc = { workspace = true }
libloading = { workspace = true }
num-bigint = { workspace = true }
prost = { workspace = true }
# Not the workspace spec: that one turns on `arbitrary_precision` and
# `preserve_order` for the engine crates, and cargo would turn them on for
# every crate in a consumer's build, changing how all of their JSON parses
# and prints. The bridge needs neither (`Json` works with or without them);
# an app that wants them enables them on its own `serde_json` dependency.
serde_json = { version = "1.0.113" }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [ "rt", "rt-multi-thread" ] }
ureq = { workspace = true }

[dev-dependencies]
# The unit tests cover the opt-in path: an app that enables both features on
# its own `serde_json` (the default path is covered by the generated SDK
# crates in `sdk_tests`, which see only what the bridge asks for).
serde_json = { version = "1.0.113", features = [ "arbitrary_precision", "preserve_order" ] }
tokio = { workspace = true, features = [ "rt", "rt-multi-thread", "macros" ] }

[lints]
workspace = true

[package.metadata.ci]
wasm_support = false
