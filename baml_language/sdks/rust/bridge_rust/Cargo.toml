[package]
name = "baml_bridge"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
description = "BAML runtime bridge for Rust: embeds the BAML engine behind generated, typed SDKs"
readme = "README.md"
keywords = [ "baml", "llm", "ai", "sdk" ]
categories = [ "api-bindings", "development-tools" ]

[lib]
name = "baml_bridge"
doc = false
doctest = false

# The engine is never linked into this crate: like the other dylib-loader
# clients, every call goes through the C ABI of a `bridge_cffi` shared
# library resolved at runtime by `baml_bridge::loader` — one call path in
# development and in production. Engine capabilities (HTTP stack, crypto)
# are baked into the shared library when *it* is built.
[dependencies]
baml_version = { workspace = true }
bridge_ctypes = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true }
libloading = { workspace = true }
num-bigint = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# rt-multi-thread is for `block_in_place`: a first-call engine download
# must never stall a multi-threaded async executor thread.
tokio = { workspace = true, features = [ "rt", "rt-multi-thread" ] }
ureq = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = [ "rt", "rt-multi-thread", "macros" ] }

[lints]
workspace = true

[package.metadata.ci]
wasm_support = false
