[package]
name = "baml_bridge"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
description = "BAML runtime bridge for Rust: embeds the BAML engine behind generated, typed SDKs"
readme = "README.md"
keywords = [ "baml", "llm", "ai", "sdk" ]
categories = [ "api-bindings", "development-tools" ]

[lib]
name = "baml_bridge"
doc = false
doctest = false

[features]
default = [ "static", "bundle-http", "aws-crypto" ]
# Link the engine (`bridge_cffi`) into the host binary and resolve its C ABI
# at link time. The published alternative — loading the prebuilt shared
# library at runtime — lands as the `dylib` backend.
static = [ "dep:bridge_cffi" ]
bundle-http = [ "bridge_cffi?/bundle-http" ]
aws-crypto = [ "bundle-http", "bridge_cffi?/aws-crypto" ]
ring-crypto = [ "bundle-http", "bridge_cffi?/ring-crypto" ]

[dependencies]
baml_version = { workspace = true }
bridge_cffi = { workspace = true, optional = true }
bridge_ctypes = { workspace = true }
indexmap = { workspace = true }
num-bigint = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [ "rt" ] }

[dev-dependencies]
tokio = { workspace = true, features = [ "rt", "rt-multi-thread", "macros" ] }

[lints]
workspace = true

[package.metadata.ci]
wasm_support = false
