[project]
name = "baml-bridge-python-e2e-demo"
version = "0.0.0"
description = "End-to-end smoke demo: BAML → baml-cli generate → baml_sdk → bridge_python runtime"
requires-python = ">=3.9"
dependencies = [
    "baml",
    "pydantic>=2.0",
]

[tool.uv.sources]
baml = { path = "../../../crates/bridge_python", editable = true }

[tool.uv]
package = true
