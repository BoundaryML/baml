[package]
name = "bex_events"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "Event types for BAML runtime observability (spans, function traces)"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
bex_external_types = { workspace = true }
bex_prof_store = { workspace = true }
bex_vm_types = { workspace = true }
sys_types = { workspace = true }
base64 = { workspace = true }
crossbeam-channel = { workspace = true }
crossbeam-utils = { workspace = true }
hex = { workspace = true }
prost = { workspace = true }
rustc-hash = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
uuid = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = [ "js" ] }
web-time = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# The profiling clock (prof::clock) reads raw hardware ticks in-tree (rdtsc /
# CNTVCT_EL0 / Instant fallback) — no external time-source dependency, and
# crucially no pre-main ctor. wasm32 uses the web-time clock for cooperative
# drains; miri gets the stub because it cannot execute `rdtsc`/`mrs`.

# Protobuf generation remains only for mixed host lifecycle/log history.

[build-dependencies]
prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

# Only active under `RUSTFLAGS="--cfg baml_loom"` (the prof ring's model-checking
# builds); a plain `cargo build` never compiles loom.
[target.'cfg(baml_loom)'.dependencies]
loom = { workspace = true }

[[bench]]
name = "prof_clock"
harness = false
