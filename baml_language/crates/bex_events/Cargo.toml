[package]
name = "bex_events"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "Event types for BAML runtime observability (spans, function traces)"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
bex_external_types = { workspace = true }
# §7.4 canonical value CIDs (store::canon) — target-neutral (pure Rust on
# wasm; the io-bearing store submodules are native-only per §7.3).
blake3 = { workspace = true }
bex_vm_types = { workspace = true }
sys_types = { workspace = true }
base64 = { workspace = true }
crossbeam-utils = { workspace = true }
prost = { workspace = true }
# CCT node interning (prof::cct): integer-keyed FxHash maps on the consumer
# path (observability design §4.6/§5.1).
rustc-hash = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = [ "js" ] }
web-time = { workspace = true }

# Consumer self-reporting (prof::stats) reads per-thread CPU time via
# clock_gettime(CLOCK_THREAD_CPUTIME_ID); unix-only, never on a hot path.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The profiling clock (prof::clock) reads raw hardware ticks in-tree (rdtsc /
# CNTVCT_EL0 / Instant fallback) — no external time-source dependency, and
# crucially no pre-main ctor. wasm32 uses the web-time clock for cooperative
# drains; miri gets the stub because it cannot execute `rdtsc`/`mrs`.

# The .bamlprof consumer (thread + file writer + path persistence) is
# native-only; wasm32 still needs the generated protobuf structs for the
# shared structural artifact contract.

[build-dependencies]
prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

# Only active under `RUSTFLAGS="--cfg baml_loom"` (the prof ring's model-checking
# builds); a plain `cargo build` never compiles loom.
[target.'cfg(baml_loom)'.dependencies]
loom = { workspace = true }

[dev-dependencies]
# dict tests build Function/Program fixtures, which name baml_type/baml_base
# leaf types directly.
baml_base = { workspace = true }
baml_type = { workspace = true }

[[bench]]
name = "prof_clock"
harness = false

[[bench]]
name = "cct_update"
harness = false

[[bench]]
name = "cct_engine"
harness = false
