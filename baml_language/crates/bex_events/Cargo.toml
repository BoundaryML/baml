[package]
name = "bex_events"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "Event types for BAML runtime observability (spans, function traces)"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
baml_builtins2 = { workspace = true }
bex_external_types = { workspace = true }
bex_vm_types = { workspace = true }
sys_types = { workspace = true }
crossbeam-utils = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
web-time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = [ "js" ] }

# The profiling clock (prof::clock) needs a TSC-calibrated time source; wasm32
# compiles a stub instead (profiling is forced off there — plan §2.2).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minstant = { workspace = true }

# Only active under `RUSTFLAGS="--cfg loom"` (the prof ring's model-checking
# builds); a plain `cargo build` never compiles loom.
[target.'cfg(loom)'.dependencies]
loom = { workspace = true }

[[bench]]
name = "prof_clock"
harness = false
