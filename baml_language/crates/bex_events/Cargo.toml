[package]
name = "bex_events"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "Runtime identities, metadata, and structured logs for BAML"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
bex_vm_types = { workspace = true }
btel_types = { workspace = true }
sys_types = { workspace = true }
base64 = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true, features = [ "v7" ] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = [ "js" ] }
web-time = { workspace = true }

# Protobuf generation remains only for mixed host lifecycle/log history.

[build-dependencies]
prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

# Reserved for future concurrency model checking; inactive in normal builds.
[target.'cfg(baml_loom)'.dependencies]
loom = { workspace = true }
