// The .bamlprof on-disk/wire contract (BEX event-stream design v2 §4).
//
// File framing: one length-delimited EventFileHeaderV1, then a stream of
// length-delimited DiskEventV1 messages. One file per engine per process:
// <process_id>-<started_at>-<engine>.bamlprof under the profiles directory.
//
// Content mirrors the raw ring records exactly (transcoding is a pure
// encoding change, no enrichment); `0 = none` ring conventions become
// optional fields here.
syntax = "proto3";

package baml.prof.v1;

message DiskEventV1 {
  oneof event {
    StartThread start_thread = 1;
    EndThread end_thread = 2;
    CallFunction call_function = 3;
    SetFunctionId set_function_id = 4;
    EndFunction end_function = 5;
    Heartbeat heartbeat = 6;
  }
}

message StartThread {
  uint64 thread_id = 1;
  // Spawning thread; absent = engine-root thread.
  optional uint64 parent_thread_id = 2;
  // Spawning call in the parent thread; absent = none.
  optional uint64 parent_call_id = 3;
  // User-defined, runtime value, length-capped at capture (<= 256 bytes).
  optional string name = 4;
  uint64 timestamp_ns = 5;
}

message EndThread {
  uint64 thread_id = 1;
  ThreadEndStatus status = 2;
  uint64 timestamp_ns = 3;
}

message CallFunction {
  uint64 thread_id = 1;
  uint64 call_id = 2;
  // Intra-thread caller; absent = thread-root call.
  optional uint64 parent_call_id = 3;
  // Per-run runtime metadata id (see the header's function_table); the FQN
  // is the cross-run key.
  uint32 function_id = 4;
  uint64 timestamp_ns = 5;
}

// Reserved at M2-M4; the M1 `$id` language surface emits it. Sets the call's
// $id - unrelated to function_id (u32 metadata).
message SetFunctionId {
  uint64 thread_id = 1;
  uint64 call_id = 2;
  // The override UUID bytes (baml.id.new()); absent => $id = CallRef.
  bytes id = 3;
  uint64 timestamp_ns = 4;
}

message EndFunction {
  uint64 thread_id = 1;
  uint64 call_id = 2;
  FunctionEndStatus status = 3;
  uint64 timestamp_ns = 4;
}

// Process-level liveness; stamped by the consumer on a timer (MVP
// simplification of "uploader emits it").
message Heartbeat {
  uint64 timestamp_ns = 1;
}

// Minimal by design; protobuf-compatible extension point.
enum FunctionEndStatus {
  FUNCTION_END_STATUS_OK = 0;
  FUNCTION_END_STATUS_ERROR = 1;
}

// Minimal by design; protobuf-compatible extension point.
enum ThreadEndStatus {
  THREAD_END_STATUS_COMPLETED = 0;
  THREAD_END_STATUS_CANCELLED = 1;
  THREAD_END_STATUS_ERRORED = 2;
}

message EventFileHeaderV1 {
  // UUID, minted once per process.
  bytes process_id = 1;
  uint64 engine_id = 2;
  // What identifies a Program is still open (M0 coordination); empty for now.
  string program_id = 3;
  // Wall anchor as 16 little-endian bytes (u128 nanoseconds since the Unix
  // epoch): wall(event) = started_at_epoch_ns + event.timestamp_ns.
  bytes started_at_epoch_ns = 4;
  // Per-run runtime metadata, not stable across recompiles; the FQN is the
  // cross-run key.
  FunctionMetadataTable function_table = 5;
}

message FunctionMetadataTable {
  repeated FunctionMetadata functions = 1;
}

message FunctionMetadata {
  uint32 function_id = 1;
  string fqn = 2;
  string source_file = 3;
  uint32 span_start = 4;
  uint32 span_end = 5;
  // "bytecode" | "sysop" | "native" (interim provider; M0 finalizes).
  string kind = 6;
}
