// See crates/bridge_ctypes/README.md for the list of consumers and the
// commands used to regenerate each language's proto client.
syntax = "proto3";
package baml_bridge.cffi.v1;

// BamlHandle / BamlHandleType are shared with the outbound side; they live in
// their own file so baml_outbound.proto can import them without depending on
// this inbound file.
import "baml_bridge/cffi/v1/baml_handle.proto";
import "baml_bridge/cffi/v1/baml_type.proto";
import "baml_bridge/cffi/v1/baml_outbound.proto";

option go_package = "./cffi";
// C++ generates against the lite runtime (no descriptors/reflection);
// ignored by every other generator in this repo (prost, protoc-gen-go).
option optimize_for = LITE_RUNTIME;

// -----------------------------------------------------------------------------
// Inbound values — host language to engine
// -----------------------------------------------------------------------------

// Core value type. `value_type` is a sparse exact-type annotation for this
// node, never a copy of the enclosing union. Most values omit it and are
// decoded from the declared contextual type plus payload shape. Hosts set it
// only when shape/context cannot preserve their choice (for example an empty
// container, an overlapping union arm, or a literal-vs-primitive selection).
message InboundValue {
  BamlTy value_type = 1;
  oneof value {
    string string_value = 2;
    int64 int_value = 3;
    double float_value = 4;
    bool bool_value = 5;
    InboundListValue list_value = 6;
    InboundMapValue map_value = 7;
    InboundClassValue class_value = 8;
    InboundEnumValue enum_value = 9;
    BamlHandle handle = 10;
    bytes uint8array_value = 11;
    string bigint_value = 12;
    // A reflected BAML type passed as a value (mirrors a `reflect.Type` BAML
    // value, e.g. the result of `reflect.Type.of<T>()`). Accepted as an
    // argument value so the host can pass types as data.
    BamlTy ty_value = 13;
    // Definition-carrying reflected type. New hosts use this for values that
    // must retain runtime-created class/enum schemas; tag 13 remains for
    // rollout compatibility with structural/static type senders.
    BamlTyDef ty_def_value = 14;
    // Rust-backed values cross as portable data, never as capability handles.
    // These message shapes are shared with the outbound side so host-created
    // and engine-created values have one canonical representation.
    BamlValueMedia media_value = 15;
    BamlValuePromptAst prompt_ast_value = 16;
  }
  // Absent oneof = null value.
}

message InboundListValue {
  repeated InboundValue values = 1;
}

message InboundMapValue {
  repeated InboundMapEntry entries = 1;
}

message InboundMapEntry {
  oneof key {
    string string_key = 1;
    int64 int_key = 2;
    bool bool_key = 3;
    InboundEnumValue enum_key = 5;
  }
  InboundValue value = 6;
}

message InboundClassValue {
  reserved 1;
  repeated InboundMapEntry fields = 2;
}

message InboundEnumValue {
  string name = 1;
  string value = 2;
}

// -----------------------------------------------------------------------------
// Function call protocol
// -----------------------------------------------------------------------------

// One explicit `TypeVar` binding for a generic function/method call: the
// TypeVar name paired with the concrete type it is bound to.
message BamlTyArg {
  string type_var = 1; // TypeVar name, e.g. "T", "A"
  BamlTy type_value = 2; // the concrete binding
  // Explicit portable definition: importing it creates fresh runtime types.
  BamlTyDef type_definition = 3;
  // Borrowed session reference to an engine-owned reflected type. Exactly one
  // of type_value, type_definition or type_reference must be present.
  optional uint64 type_reference = 4;
}

// Type arguments for a method are ordered by its checked declaration. Live
// references preserve identity; definitions explicitly create fresh types.
// Each BamlTyArg.type_var must be empty on this positional path.
message InterfaceMethodTarget {
  uint64 view = 1;
  string member = 2;
  repeated BamlTyArg type_args = 3;
}

// A compiler-selected method on a concrete class.
// The receiver is borrowed and pinned during preparation. Class variables in
// interface_pattern index the receiver's stored class arguments, never the
// host's method arguments. The engine checks the exact class declaration and
// complete obligation before invoking the concrete implementation contract.
message ConcreteMethodTarget {
  uint64 receiver = 1;
  string class_name = 2;
  oneof dispatch {
    BamlTy interface_pattern = 3;
    // Must be true when selected; a missing dispatch is an invalid request.
    bool inherent = 6;
  }
  string member = 4;
  repeated BamlTyArg type_args = 5;
}

message CallFunctionArgs {
  repeated InboundMapEntry kwargs = 1;
  uint64 call_id = 2;
  // Explicit TypeVar bindings for a generic function/method call. Named and
  // order-preserving: each entry self-describes its TypeVar, and entries are
  // sent in De Bruijn order (enclosing class params first — recovered from a
  // generic receiver's type args — then the callee's own `<...>` params,
  // `_types=` in Python). The engine maps each named binding onto the entry
  // frame's `type_args` slot by matching the TypeVar name against the callee's
  // generic params (see `set_entry_point_with_type_args`). Empty for
  // non-generic calls.
  repeated BamlTyArg type_args = 3;
  oneof call_target {
    string function_name = 4;
    uint64 function_handle = 5;
    InterfaceMethodTarget interface_method = 6;
    ConcreteMethodTarget concrete_method = 7;
  }
}

// CallAck is the engine's acknowledgment of an inbound call. It flows
// engine->host, but is defined in the inbound proto because it completes
// the inbound call contract (CallFunctionArgs request + CallAck response).
message CallAck {
  oneof response {
    string error = 1;
  }
}

// Host adapter registration. No host callbacks are acquired at this stage.
// Template type-var index 0 denotes Self. Index n+1 selects type_args[n].
// Type arguments are positional and shared across the whole registration;
// definitions are materialized once, references retain their issuing identity.
message RegisterHostAdapterRequest {
  string name = 1;
  repeated HostAdapterImplementation implementations = 2;
  repeated BamlTyArg type_args = 3;
}
message HostAdapterImplementation {
  BamlTy interface_template = 1;
  repeated string methods = 2;
}
message RegisteredHostAdapter {
  BamlOutboundHandle adapter_type = 1;
  BamlOutboundHandle class_type = 2;
  repeated HostAdapterCallbackSlot callbacks = 3;
  // Exact checked interface types in request implementation order, including
  // interfaces with no callbacks. Borrow these when projecting a new instance;
  // importing a portable type definition again would create different types.
  repeated BamlOutboundHandle interface_types = 4;
}
message HostAdapterCallbackSlot {
  // Index into RegisterHostAdapterRequest.implementations. The pair of this
  // index and method identifies an operation even when obligations share names.
  uint32 implementation_index = 3;
  string method = 1;
  reserved 2; // interface type is owned once in interface_types above
}
// adapter_type is borrowed and pinned by synchronous preparation. Receiver
// and callbacks transfer their occurrences as one batch, including on failure.
message CreateHostAdapterRequest {
  uint64 adapter_type = 1;
  InboundValue receiver = 2;
  repeated InboundValue callbacks = 3;
}
// The receiver is borrowed and retained during preparation. Type evidence has
// the same named/definition/reference semantics as method type arguments.
message ProjectInterfaceRequest {
  uint64 receiver = 1;
  BamlTyArg interface_type = 2;
}

// Private SDK administrative channel. Each request selects exactly one
// operation; preparation consumes create-input transfers before admission.
message HostOperationRequest {
  oneof operation {
    RegisterHostAdapterRequest register = 1;
    CreateHostAdapterRequest create = 2;
    ProjectInterfaceRequest project = 3;
  }
}

// Carried by the same owned delivery/receipt as ordinary call results.
// Registration metadata is not a BAML value. Failure reuses the ordinary
// structured error/panic envelope (its ok arm is never produced here).
message HostOperationResult {
  oneof result {
    RegisteredHostAdapter registered = 1;
    BamlOutboundValue value = 2;
    BamlOutboundResult failure = 3;
  }
}
