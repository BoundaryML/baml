// See crates/bridge_ctypes/README.md for the list of consumers and the
// commands used to regenerate each language's proto client.
syntax = "proto3";
package baml_bridge.cffi.v1;

option go_package = "./cffi";
// C++ generates against the lite runtime (no descriptors/reflection);
// ignored by every other generator in this repo (prost, protoc-gen-go).
option optimize_for = LITE_RUNTIME;

// -----------------------------------------------------------------------------
// Handle types — shared between inbound and outbound
// -----------------------------------------------------------------------------

// Tag for the host-language side to discriminate opaque handle entries.
//
// Stdlib symbols with special host-side decoding rules today:
//   - baml.media.{Image,Audio,Video,Pdf}     -> ADT_MEDIA_*
//   - ai.Prompt                              -> ADT_PROMPT_AST
//   - ai.stream.Stream                       -> ADT_TAGGED_HEAP_HANDLE
//   - ai.FunctionSpec                        -> ADT_FUNCTION_SPEC
//   - `@@rust_type` and run-time instances  -> ADT_RUNTIME_VALUE
//
// `ADT_TAGGED_HEAP_HANDLE` signals "the on-the-wire payload is a
// `BamlOutboundHandle` (outbound) / `BamlHandle` (inbound) whose
// engine-side `BexExternalAdt` is a `TaggedHeapHandle { ty, heap_handle }`."
// The outbound `BamlOutboundHandle.name` field carries the underlying
// class + concrete generic args.
enum BamlHandleType {
  HANDLE_UNSPECIFIED = 0;
  // Formerly UNTAGGED_RUST_DATA: no value crosses as untyped Rust data.
  reserved 1;
  reserved "UNTAGGED_RUST_DATA";
  UNTAGGED_BEX_HEAP = 2;    // CffiHandleTableEntry::BexHeapHandle(_)
  reserved 3, 4;            // formerly RESOURCE_SOCKET, RESOURCE_HTTP_RESPONSE
  FUNCTION_REF = 5;
  ADT_MEDIA_IMAGE = 6;
  ADT_MEDIA_AUDIO = 7;
  ADT_MEDIA_VIDEO = 8;
  ADT_MEDIA_PDF = 9;
  // Formerly ADT_MEDIA_GENERIC: a media value always has one of the kinds above.
  reserved 10;
  reserved "ADT_MEDIA_GENERIC";
  ADT_PROMPT_AST = 11;
  // Formerly ADT_TYPE: a type crosses as itself, a `ty_value`.
  reserved 13;
  reserved "ADT_TYPE";
  ADT_TAGGED_HEAP_HANDLE = 14;
  // Host-owned callable referenced via per-bridge HostValueRegistry.
  // Lifetime: Rust drop notifies host via HostReleaseFn (not via
  // HANDLE_TABLE). See bex_external_types::host_value.
  HOST_VALUE_CALLABLE = 15;
  // Host-owned opaque value: an arbitrary host object with no BAML
  // representation, referenced via the per-bridge HostValueRegistry and
  // released via HostReleaseFn (not via HANDLE_TABLE), same as
  // HOST_VALUE_CALLABLE. A host-thrown native exception is one consumer:
  // the bridge registers it as an opaque value and wraps the handle in a
  // baml.errors.HostCallable instance for throw semantics. See
  // bex_external_types::host_value.
  HOST_VALUE_OPAQUE = 16;
  // Live, engine-owned ai.FunctionSpec capability. Its optional `ty` payload
  // is annotation-only; method generic substitution comes from the resolved
  // heap object.
  ADT_FUNCTION_SPEC = 17;
  // A live instance the engine alone builds: an instance of a `@@rust_type`
  // class, a standard-library capability whose fields are the runtime's
  // internals (reflect.Package, reflect.Session, reflect.CompileArtifact), or
  // a runtime-created class or enum value. Its `ty` names the class with its
  // type arguments, and a host may pick a compiled class's wrapper by it; a
  // runtime declaration's name is display text no generated typemap resolves.
  // A handle sent back carries no statement: the engine judges the live object.
  ADT_RUNTIME_VALUE = 18;
  // Internal BEP-81 capabilities. They belong to their issuing runtime and
  // cannot be supplied as ordinary application values.
  INVOCATION_STATE = 19;
  TRACE_RESERVATION = 20;
  // The engine's hold on a host value it sent the host: the `pin` of a
  // `BamlOutboundHandle`, released with the result that carried it. Never a
  // value.
  HOST_VALUE_PIN = 21;
}

message BamlHandle {
  uint64 key = 1;
  BamlHandleType handle_type = 2;
}
