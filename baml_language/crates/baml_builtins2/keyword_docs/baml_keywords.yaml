class:
  summary: "Defines a structured data type with named fields."
  syntax: |
    class MyClass {
      field1 string
      field2: int
      implements Printable {}
    }
  details: "Class fields can be written as `field Type` or `field: Type`. Fields can have default values, docstrings, attributes, methods, and `implements` blocks for interface contracts. Interface fields use the colon form."

field:
  summary: "Declares data members on classes and required data members on interfaces."
  syntax: |
    interface HasId {
      id: string
    }

    class User {
      id string
      display_name: string
      implements HasId {}
    }
  details: "Class fields may use `name Type` or `name: Type`. Interface fields use `name: Type` and are satisfied by same-named class fields or by field mappings inside an `implements` block, such as `id as user_id`. A class value is constructed with an object literal like `User { id: \"u1\", display_name: \"Ada\" }`; BAML does not use `new` constructors."

fields:
  summary: "Alias topic for fields."
  syntax: |
    class User {
      id string
      name: string
    }
  details: "See `baml describe field` for class fields, interface fields, and object literal construction."

interface:
  summary: "Defines a structural contract of fields, methods, and associated types."
  syntax: |
    interface Named {
      type Key = string
      id: Self.Key
      name: string
      function label(self) -> string
      function display(self) -> string {
        return self.name
      }
    }

    class Dog {
      id: string
      name: string
      implements Named {
        function label(self) -> string {
          return self.name
        }
      }
    }
  details: "Interface fields use `name: Type` syntax. Interfaces can declare associated types with `type Name`, optionally with `extends Bound` and/or `= Default`; use `Self.Name` inside the interface body to refer to the implementing type's binding. A method without a body is required; a method with a body is a default method that implementors inherit unless they override it. Interfaces compose with `requires`, not `extends`."

interfaces:
  summary: "Concept page for BAML interfaces and interface-related syntax."
  syntax: |
    interface Iterator {
      type Item
      function next(self) -> Self.Item?
    }

    class IntIterator {
      implements Iterator {
        type Item = int
        function next(self) -> Self.Item? {
          return null
        }
      }
    }

    function take_one<I extends Iterator<Item = int>>(it: I) -> I.Item? {
      return it.next()
    }
  details: "Interfaces are contracts implemented by classes or concrete types. Declare associated types in the interface, bind them inside `implements` blocks with `type Name = Concrete`, constrain them in type positions with `Interface<Name = Type>`, and project them with `T.Name`, `Self.Name`, or `(Concrete as Interface).Name`. Useful related lookups: `baml describe implements`, `baml describe associated`, `baml describe type`, `baml describe Self`, `baml describe generics`, `baml describe projection`, `baml describe as`, `baml describe extends`, and `baml describe default`."

enum:
  summary: "Defines a type with a fixed set of named variants."
  syntax: |
    enum Color {
      Red,
      Green,
      Blue,
    }

function:
  summary: "Declares a named callable with typed parameters and a return type."
  syntax: |
    function greet(name: string) -> string {
      "Hello, " + name
    }

method:
  summary: "Declares a function member on a class or interface."
  syntax: |
    interface Named {
      function label(self) -> string
      function display(self) -> string {
        return self.label()
      }
    }

    class User {
      name: string

      implements Named {}

      function label(self) -> string {
        return self.name
      }
    }
  details: "Methods are written with `function` inside a class, interface, or `implements` block. The receiver parameter is `self`; method calls use `value.method(args)`. In interfaces, a method without a body is required and a method with a body is a default method. A same-named class method can satisfy an empty `implements I {}` block when its signature matches the interface method."

methods:
  summary: "Alias topic for methods."
  syntax: |
    class Counter {
      value: int
      function next(self) -> int {
        return self.value + 1
      }
    }
  details: "See `baml describe method` for class methods, interface methods, default methods, and `self`."

client:
  summary: "Configures an LLM client with a provider, model, and options."
  syntax: |
    client MyClient {
      provider openai
      options {
        model "gpt-4o"
        temperature 0.7
      }
    }

generator:
  summary: "Configures code generation for a target language."
  syntax: |
    generator python {
      output_type python/pydantic
      output_dir "../generated"
    }

test:
  summary: "Defines a test case for a BAML function."
  syntax: |
    test MyTest {
      functions [ExtractResume]
      args {
        text "John Doe, Software Engineer"
      }
    }

testset:
  summary: "Defines a set of test cases that share configuration."
  syntax: |
    testset MySuite {
      functions [ExtractResume]
      cases [
        { args { text "case 1" } },
        { args { text "case 2" } },
      ]
    }

template_string:
  summary: "Defines a reusable prompt template with Jinja2 syntax."
  syntax: |
    template_string Greeting(name: string) #"
      Hello, {{ name }}! How can I help you?
    "#

retry_policy:
  summary: "Configures automatic retry behavior for LLM calls."
  syntax: |
    retry_policy MyPolicy {
      max_retries 3
      strategy {
        type exponential_backoff
      }
    }

type:
  summary: "Creates a type alias, and declares associated type members inside interfaces."
  syntax: |
    type UserId = string
    type Result = string | int
    type MaybeInt = int?
    interface Iterator {
      type Item
      type Error extends string = string
    }
    class IntIterator {
      implements Iterator {
        type Item = int
      }
    }
  details: "At top level, `type Name = ...` creates an alias. Inside an interface, `type Item`, `type Item extends Bound`, `type Item = Default`, and `type Item extends Bound = Default` declare associated types. Inside an `implements` block, bind associated types with `type Item = Concrete`."

types:
  summary: "Concept page for BAML type syntax, aliases, generic bounds, and associated type bindings."
  syntax: |
    type UserId = string
    class Box<T extends Named> {
      value: T
    }
    type NamedIterator = Iterator<Item = string>
    type Item = (TextCursor as Iterator).Item
  details: "Use `type` for aliases, `T extends Bound` for generic bounds, `Interface<Assoc = Type>` to constrain an associated type in a type position, and `(Concrete as Interface).Assoc` when a concrete type implements multiple interface instantiations."

generic:
  summary: "Explains generic type parameters, bounds, and inference."
  syntax: |
    interface Slot<T> {
      value: T
    }

    class Box<T extends Named> {
      value: T
    }

    function first<I extends Iterator<Item = int>>(it: I) -> I.Item? {
      return it.next()
    }
  details: "Declare generic parameters with `<T>` on interfaces, classes, functions, and out-of-body `implements` blocks. Add bounds with `T extends Bound`; the bound can be an interface, a concrete type expression, a union, a function type, or an interface with associated type bindings such as `Iterator<Item = int>`. Function calls usually infer generic arguments from the arguments, so `first(iter)` is normally enough; explicit type arguments are only needed when inference cannot choose. BAML does not use `T: Bound` for generic bounds."

generics:
  summary: "Concept page for generic type parameters and bounds."
  syntax: |
    interface Slot<T> {
      value: T
    }

    class Box<T extends Named> {
      value: T
    }

    implements<T extends Named> Printable for Box<T> {
      function display(self) -> string {
        return self.value.name
      }
    }
  details: "Generics are declared where the parameter is introduced: `class Box<T>`, `interface Slot<T>`, `function get<T>(value: T) -> T`, and top-level `implements<T extends Bound> Interface for Wrapper<T> { ... }`. In an `implements<T>` block, the binder goes immediately after `implements`, before the interface target; each bound parameter must be used in the `for` type so the implementation can be matched. Use `T extends Interface<Assoc = Type>` for bounds with associated type constraints."

bounds:
  summary: "Explains type bounds written with `extends`."
  syntax: |
    class Box<T extends Named> {
      value: T
    }

    class PairBox<T extends int | string> {
      value: T
    }

    function read<I extends Iterator<Item = string>>(it: I) -> I.Item? {
      return it.next()
    }
  details: "A bound constrains what type arguments are allowed and exposes members from the bound inside the generic body. Use `requires` for interface-to-interface prerequisites; use `extends` for generic parameter bounds and associated type bounds."

if:
  summary: "Conditional branching — executes a block if the condition is true."
  syntax: |
    if x > 0 {
      "positive"
    } else if x == 0 {
      "zero"
    } else {
      "negative"
    }

else:
  summary: "The alternative branch of an `if` expression."
  syntax: |
    if condition {
      // true branch
    } else {
      // false branch
    }

for:
  summary: "Iterates over elements of an array."
  syntax: |
    for item in items {
      process(item)
    }
  details: "At top level, `for` is also used by out-of-body interface implementations: `implements Interface for Type { ... }`."

while:
  summary: "Repeats a block as long as the condition is true."
  syntax: |
    while count < 10 {
      count = count + 1
    }

let:
  summary: "Binds a value to a name. Use `let` for all variable declarations."
  syntax: |
    let name = "Alice"
    let count = items.length()

in:
  summary: "Used with `for` loops to iterate over a collection."
  syntax: |
    for item in [1, 2, 3] {
      item
    }

break:
  summary: "Exits the innermost `for` or `while` loop immediately."
  syntax: |
    for item in items {
      if item == target {
        break
      }
    }

continue:
  summary: "Skips the rest of the current loop iteration and continues with the next."
  syntax: |
    for item in items {
      if item.is_empty() {
        continue
      }
      process(item)
    }

return:
  summary: "Returns a value from the current function."
  syntax: |
    function add(a: int, b: int) -> int {
      return a + b
    }

watch:
  summary: "Observes a stream of values as they arrive."
  syntax: |
    watch stream {
      on_value(value) { process(value) }
      on_done(final) { handle(final) }
    }

throw:
  summary: "Raises an error value, unwinding to the nearest `catch`."
  syntax: |
    throw baml.errors.InvalidArgument {
      message: "value must be positive"
    }

throws:
  summary: "Declares that a function may raise an error of the given type."
  syntax: |
    function parse(text: string) -> int throws ParseError {
      // ...
    }

catch:
  summary: "Catches a specific error type from a preceding expression."
  syntax: |
    let result = risky_call() catch errors.Timeout {
      default_value
    }

catch_all:
  summary: "Catches any error from a preceding expression."
  syntax: |
    let result = risky_call() catch_all {
      fallback_value
    }

match:
  summary: "Pattern matching — branches based on the shape or type of a value."
  syntax: |
    match value {
      x is string => handle_string(x),
      x is int    => handle_int(x),
    }

is:
  summary: "Tests whether a value matches a type or pattern."
  syntax: |
    if x is string {
      // x is narrowed to string here
    }

as:
  summary: "Projects a value or type through an interface, and maps interface fields to class fields."
  syntax: |
    // Field mapping inside an implements block.
    interface HasId {
      type Id
      id: Id
    }

    class User {
      implements HasId {
        type Id = string
        id as user_id
      }
      full_name: string
      user_id: string
    }

    function label(user: User) -> string {
      return user.as<HasId>.id
    }

    // Associated type projection in a type position.
    type UserId = (User as HasId).Id
  details: "Use `value.as<Interface>` when a class implements multiple interfaces with the same member name or when you need the interface view. Use `(Type as Interface).Assoc` for qualified associated type projection in a type position; do not write `Type.as<Interface>` as a type. Inside an `implements` block, `interface_field as class_field` maps an interface field to a differently named class field."

projection:
  summary: "Explains interface value projections and associated type projections."
  syntax: |
    function label(user: User) -> string {
      return user.as<Named>.name
    }

    function head<S extends Stream>(stream: S) -> (S as Iterator).Item? {
      return stream.next()
    }

    type Parsed = (IntParser as Parser).Output
  details: "`value.as<Interface>` selects an interface view for member access. `T.Assoc`, `Self.Assoc`, and `(T as Interface).Assoc` project associated types in type positions; use the qualified `(T as Interface).Assoc` form when multiple required interfaces define the same associated type name. `Type.as<Interface>` is not type syntax."

requires:
  summary: "Declares that an interface depends on other interfaces."
  syntax: |
    interface Named {
      name: string
    }
    interface Aged {
      age: int
    }
    interface HasKey {
      type Key
      key: Self.Key
    }
    interface Person requires Named, Aged, HasKey<Key = string> {
      function introduce(self) -> string
    }
  details: "`requires` is interface composition, not inheritance. Required interfaces may include associated type bindings, as in `requires HasKey<Key = string>`. Implementors of a required interface must also implement the required parent interfaces; cycles are rejected. Use `requires`, not `extends`, between interfaces."

implements:
  summary: "Declares that a class or type implements an interface contract."
  syntax: |
    class Dog {
      name: string
      implements Named {}
    }

    implements<T extends Named> Printable for Box<T> {
      function display(self) -> string {
        return self.value.name
      }
    }
  details: "A class-body `implements I { ... }` block can map fields with `field as class_field`, bind associated types with `type Name = Concrete`, and define required or override methods. A top-level `implements I for T { ... }` block adds an out-of-body implementation. For blanket implementations, declare the implementation's own type parameters immediately after `implements`, as in `implements<T extends Named> Printable for Box<T> { ... }`; those parameters must appear in the `for` type. Associated type bindings are not allowed in the `implements` target itself; write `implements Iterator { type Item = int }`, not `implements Iterator<Item = int>`."

blanket:
  summary: "Explains generic out-of-body implementations such as `implements<T> I for Box<T>`."
  syntax: |
    interface Named {
      name: string
    }

    interface Printable {
      function print(self) -> string
    }

    class Box<T> {
      value: T
    }

    implements<T extends Named> Printable for Box<T> {
      function print(self) -> string {
        return self.value.name
      }
    }
  details: "A blanket implementation is a generic `implements` rule that applies to every type matching the `for` target and bounds. The binder goes immediately after `implements`, before the interface target: `implements<T extends Bound> Interface for Wrapper<T> { ... }`. Each implementation generic parameter must appear in the `for` type, and associated type bindings go inside the block with `type Name = ...`."

blanket_impl:
  summary: "Alias topic for blanket implementations."
  syntax: |
    implements<T extends Named> Printable for Box<T> {
      function print(self) -> string {
        return self.value.name
      }
    }
  details: "See `baml describe blanket`."

blanket-impl:
  summary: "Alias topic for blanket implementations."
  syntax: |
    implements<T extends Named> Printable for Box<T> {
      function print(self) -> string {
        return self.value.name
      }
    }
  details: "See `baml describe blanket`."

implement:
  summary: "Accepted singular spelling of `implements`; prefer `implements`."
  syntax: |
    interface Label {
      function label(self) -> string
    }

    implement Label for int {
      function label(self) -> string {
        return self.to_string()
      }
    }
  details: "The formatter prints the canonical spelling as `implements`."

impl:
  summary: "Rust-style shorthand is not BAML syntax; use `implements`."
  syntax: |
    implements Label for int {
      function label(self) -> string {
        return self.to_string()
      }
    }
  details: "BAML accepts `implements` and the singular `implement`; it does not use `impl`."

associated:
  summary: "Explains associated types on interfaces."
  syntax: |
    interface Parser {
      type Output
      function parse(self, input: string) -> Self.Output
    }

    class IntParser {
      implements Parser {
        type Output = int
        function parse(self, input: string) -> Self.Output {
          return 42
        }
      }
    }

    function parse_one<P extends Parser>(parser: P) -> P.Output {
      return parser.parse("42")
    }
  details: "Associated types are declared inside interfaces with `type Name`, optionally with `extends Bound` and/or `= Default`. Implementors bind them inside `implements` blocks with `type Name = Concrete`. In type positions, use `Interface<Name = Type>` to require a binding, `T.Name` or `Self.Name` to project from a bound type, and `(T as Interface).Name` to disambiguate when multiple required interfaces define the same associated type. Generic bounds use `T extends Interface<Name = Type>`, not `T: Interface<Name = Type>`."

associated_type:
  summary: "Alias topic for associated types."
  syntax: |
    interface Iterator {
      type Item
    }
    type Item = (IntIterator as Iterator).Item
  details: "See `baml describe associated` for the full associated type guide."

associated-type:
  summary: "Alias topic for associated types."
  syntax: |
    interface Iterator {
      type Item
    }
    type Item = (IntIterator as Iterator).Item
  details: "See `baml describe associated` for the full associated type guide."

associated_types:
  summary: "Alias topic for associated types."
  syntax: |
    interface Iterator {
      type Item
    }
    type Item = (IntIterator as Iterator).Item
  details: "See `baml describe associated` for the full associated type guide."

associated-types:
  summary: "Alias topic for associated types."
  syntax: |
    interface Iterator {
      type Item
    }
    type Item = (IntIterator as Iterator).Item
  details: "See `baml describe associated` for the full associated type guide."

extends:
  summary: "Adds a type bound; it is not interface inheritance."
  syntax: |
    class Box<T extends Named> {
      value: T
    }

    function take<I extends Iterator<Item = int>>(it: I) -> I.Item? {
      return it.next()
    }

    interface Graph {
      type Edge extends Named
    }
  details: "Use `extends` in generic parameter bounds and associated type bounds. Do not write `interface Child extends Parent`; interfaces compose with `requires`."

Self:
  summary: "The implementing receiver type inside interface methods and associated type projections."
  syntax: |
    interface Iterator {
      type Item
      function next(self) -> Self.Item?
    }
  details: "`Self.Item` projects an associated type from the concrete implementor or the current interface-bound receiver. Use `(T as Interface).Item` when the projection would otherwise be ambiguous."

self:
  summary: "The receiver parameter for instance methods."
  syntax: |
    interface Greeter {
      function greet(self) -> string
    }

    class Person {
      name: string
      implements Greeter {
        function greet(self) -> string {
          return self.name
        }
      }
    }
  details: "`self` is the value receiver in class and interface methods. Use capital `Self` only in type positions, such as `Self.Item` for an associated type projection."

default:
  summary: "Calls an interface default method body from inside an `implements` override."
  syntax: |
    interface Greeter {
      function greet(self) -> string {
        return "hello"
      }
    }

    class LoudGreeter {
      implements Greeter {
        function greet(self) -> string {
          return default.greet().to_upper()
        }
      }
    }
  details: "`default.method(...)` is only meaningful inside an `implements` block. It deliberately invokes the interface's default implementation instead of the class override."

check:
  summary: "Explains how to ask the CLI to validate a project."
  syntax: |
    baml run --from .
    baml run --from . --list
    baml fmt --from .
  details: "There is no standalone `baml check` command in this CLI. Commands such as `baml run`, `baml run --list`, and `baml fmt` load and check the project before doing their main work. Use `baml run --list` when you want a quick compile-and-signature view without running a specific function."

spawn:
  summary: "Launches a concurrent task that runs in the background."
  syntax: |
    let future = spawn {
      expensive_computation()
    }
    let result = await future

await:
  summary: "Waits for a spawned future to complete and returns its result."
  syntax: |
    let future = spawn { compute() }
    let result = await future

dynamic:
  summary: "Marks a class as dynamic — fields can be added at runtime."
  syntax: |
    class DynamicConfig dynamic {
      // fields can be added dynamically
    }

type_builder:
  summary: "Marks a class for use with the type builder API."
  syntax: |
    class Flexible type_builder {
      // ...
    }

with:
  summary: "Attaches context or configuration to an expression."
  syntax: |
    call_llm_function(MyFunc, args) with { client: MyClient }
