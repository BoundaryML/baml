[package]
name = "bex_aot"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Runtime for BAML programs compiled ahead of time to native Rust"

[dependencies]
baml_type = { workspace = true, features = [ "serde" ] }
bex_lang = { workspace = true }
bex_str = { workspace = true }
indexmap = { workspace = true }
num-bigint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Count heap allocations and frees (`bex_aot::mem::stats`), keep a weak
# registry of live objects (`bex_aot::mem::unreachable`) and honour
# `BAML_MEM_TORTURE=1`. Off in every generated program: without it a handle
# is exactly `Rc<RefCell<T>>`.
mem-stats = [  ]

[lints]
workspace = true
