[package]
name = "baml_db"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
baml_artifact = { workspace = true }
baml_base = { workspace = true }
baml_builtins2 = { workspace = true }
baml_compiler2_ast = { workspace = true }
baml_compiler2_emit = { workspace = true }
baml_compiler2_hir = { workspace = true }
baml_compiler2_hir_ty = { workspace = true }
baml_compiler2_mir = { workspace = true }
baml_compiler2_rust = { workspace = true, optional = true }
baml_compiler_diagnostics = { workspace = true }
baml_compiler_lexer = { workspace = true }
baml_compiler_parser = { workspace = true }
baml_compiler_syntax = { workspace = true }
baml_linker = { workspace = true }
baml_linker_types = { workspace = true }
baml_type = { workspace = true }
bex_vm_types = { workspace = true }
borsh = { workspace = true }
ignore = { workspace = true }
indexmap = { workspace = true }
rayon = { workspace = true }
salsa = { workspace = true }
serde = { workspace = true }
text-size = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# The MIR-to-Rust backend (`baml __emit-rust`). Off by default: it pulls
# `syn` (full), `quote` and `prettyplease` into every `baml_db` consumer,
# including the LSP and the `bridge_wasm` browser bundle, which never emit
# Rust. `baml_cli` and `baml_tests` turn it on. ("native" already means
# non-wasm in this workspace, hence "rust".)
rust-backend = [ "dep:baml_compiler2_rust" ]
