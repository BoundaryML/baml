[package]
name = "bex_snapshot"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Snapshot and restore of paused BEX VM threads (durable functions proof of concept)"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
baml_type = { workspace = true }
bex_heap = { workspace = true }
bex_vm = { workspace = true }
bex_vm_types = { workspace = true }
borsh = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
baml_db = { workspace = true }

[features]
default = [  ]
heap_debug = [ "bex_heap/heap_debug", "bex_vm/heap_debug", "bex_vm_types/heap_debug" ]

# Native only: links zstd (C) and builds scratch VMs through the native-only
# `BexVm::from_program` signature.
[package.metadata.ci]
wasm_support = false
