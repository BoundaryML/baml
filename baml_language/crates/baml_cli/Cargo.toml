strsim = { workspace = true }
tar = { workspace = true }
text-size = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
uuid = { workspace = true }
webbrowser = { workspace = true }

[features]
default = [ "aws-crypto" ]
aws-crypto = [ "bex_engine/aws-crypto", "sys_native/aws-crypto" ]
ring-crypto = [ "bex_engine/ring-crypto", "sys_native/ring-crypto" ]
native-tls = [ "sys_native/native-tls" ]
rustls = [ "aws-crypto" ]
defaults = [  ]
internal = [  ]
skip-integ-tests = [  ]

[dev-dependencies]
baml_tests = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "baml-cli"
path = "src/main.rs"

[package.metadata.ci]
wasm_support = false
