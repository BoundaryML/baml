[package]
name = "baml_cli"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
baml_artifact = { workspace = true }
baml_builtins2 = { workspace = true }
baml_codegen_types = { workspace = true }
baml_crypto = { workspace = true }
baml_db = { workspace = true }
baml_exec = { workspace = true }
baml_fmt = { workspace = true }
baml_home = { workspace = true }
baml_http = { workspace = true }
baml_ide = { workspace = true }
baml_lsp_server = { workspace = true }
baml_release = { workspace = true, optional = true }
baml_type = { workspace = true }
baml_version = { workspace = true }
bex_cache = { workspace = true }
bex_engine = { workspace = true }
bex_events = { workspace = true }
bex_project = { workspace = true }
bex_vm_types = { workspace = true }
btel_settings = { workspace = true }
sdkgen_cpp = { workspace = true }
sdkgen_csharp = { workspace = true }
sdkgen_go = { workspace = true }
sdkgen_java = { workspace = true }
sdkgen_python_pydantic2 = { workspace = true }
sdkgen_rust = { workspace = true }
sdkgen_swift = { workspace = true }
sdkgen_typescript_shared = { workspace = true }
sys_native = { workspace = true, features = [ "bundle-http" ] }
anyhow = { workspace = true }
base64 = { workspace = true }
borsh = { workspace = true }
clap = { workspace = true, features = [ "color", "env", "wrap_help" ] }
console = { workspace = true }
ctrlc = { workspace = true }
hex = { workspace = true }
indicatif = { workspace = true }
libsui = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }
mime_guess = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml2 = { workspace = true }
sha2 = { workspace = true }
strsim = { workspace = true }
text-size = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
uuid = { workspace = true }
webbrowser = { workspace = true }

[features]
baml-defaults = [
  "baml_lsp_server/baml-defaults",
  "bex_project/baml-defaults",
  "sys_native/baml-defaults",
  "dep:baml_release",
  "dep:libsui",
  "dep:mimalloc",
]
default = [ "baml-defaults" ]
defaults = [  ]
internal = [  ]
skip-integ-tests = [  ]
# BAML never contacts anything on its own (see VENDOR.md).
no-phone-home = [ "baml_http/no-phone-home", "sys_native/no-phone-home" ]

[dev-dependencies]
baml_tests = { workspace = true }
btel_file = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "baml-cli"
path = "src/main.rs"

[package.metadata.ci]
wasm_support = false
