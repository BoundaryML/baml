syntax = "proto3";

package btel.cloud.v1;

message CloudUploadEnvelope {
  uint32 format_version = 1;
  string plan_id = 2;
  string upload_id = 3;
  optional bytes recording_file = 4;
  repeated CasObject cas_objects = 5;
}

message CasObject {
  bytes snapshot_id = 1;              // The CAS ID of this blob; a capture may be several.
  uint32 snapshot_format_version = 2; // The blob format version.
  bytes blob = 3;
  bytes blob_sha256 = 4;
  optional uint64 logical_bytes_v1 = 5; // Customer content size, including children; absent when unknown.
}
