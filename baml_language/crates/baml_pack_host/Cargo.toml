[package]
name = "baml_pack_host"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "Standalone host binary for packaged BAML programs"

[lints]
workspace = true

[dependencies]
baml_artifact = { workspace = true }
baml_exec = { workspace = true }
bex_engine = { workspace = true }
bex_events = { workspace = true }
bex_project = { workspace = true }
btel_settings = { workspace = true }
sys_native = { workspace = true, features = [ "bundle-http" ] }
libsui = { workspace = true }
tokio = { workspace = true, features = [ "rt" ] }

[features]
baml-defaults = [
  "baml_exec/baml-defaults",
  "bex_project/baml-defaults",
  "sys_native/baml-defaults",
]
default = [ "baml-defaults" ]
# BAML never contacts anything on its own (see VENDOR.md).
no-phone-home = [ "sys_native/no-phone-home" ]

[[bin]]
name = "baml-pack-host"
path = "src/main.rs"

# Standalone host binary for packed `baml pack` outputs — depends on
# `sys_native` (tokio + mio) and `libsui` (native ELF/Mach-O/PE patching).
# Both are inherently non-wasm. Excluded from `clippy-wasm` / wasm CI.
[package.metadata.ci]
wasm_support = false
