[package]
name = "baml_pack_host"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "Standalone host binary for packaged BAML programs"

[lints]
workspace = true

[dependencies]
baml_exec = { workspace = true }
bex_engine = { workspace = true }
bex_events = { workspace = true }
bex_vm_types = { workspace = true }
sys_native = { workspace = true }
anyhow = { workspace = true }
bitcode = { workspace = true }
libsui = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = [ "rt" ] }

[features]
default = [ "native-tls" ]
native-tls = [ "sys_native/native-tls" ]

[[bin]]
name = "baml-pack-host"
path = "src/main.rs"
