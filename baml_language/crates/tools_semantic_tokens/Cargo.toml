[package]
name = "tools_semantic_tokens"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }

[[bin]]
name = "tools_semantic_tokens"
path = "src/main.rs"

[dependencies]
baml_lsp2_actions = { workspace = true }
# Reuses the inline-assertion test harness (parser / runner / updater) so the
# viewer computes the exact same token output the tests do, reads the committed
# `//- semantic_tokens` expectations, and "accepts" via the real UPDATE_EXPECT path.
baml_lsp2_actions_tests = { path = "../baml_lsp2_actions_tests" }
baml_project = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = [ "json" ] }
clap = { workspace = true, features = [ "derive" ] }
serde = { workspace = true, features = [ "derive" ] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [ "rt", "macros", "net" ] }

[lints]
workspace = true

[package.metadata.ci]
wasm_support = false
