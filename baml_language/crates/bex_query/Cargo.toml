# bex_query — the sans-io observability query engine (TASK/design.md §9.2).
# Three hosts, one engine: native (mmap), wasm (linear-memory CacheSource),
# HTTP Range. No tokio in core; queries either complete from resident bytes
# or return the byte ranges they need.
[package]
name = "bex_query"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "Sans-io query engine over BAML observability artifacts (.bamlseg/.bamlcct/.bamlmeta)"

[lib]
doctest = false

[lints]
workspace = true

[features]
default = ["native"]
# mmap-backed sources; off for wasm.
native = ["dep:memmap2"]

[dependencies]
base64 = { workspace = true }
bex_events = { workspace = true }
memmap2 = { workspace = true, optional = true }
prost = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
