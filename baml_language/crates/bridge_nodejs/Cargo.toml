[package]
name = "bridge_nodejs"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "baml_node"
crate-type = [ "cdylib" ]

[features]
default = [ "bundle-http", "aws-crypto" ]
bundle-http = [ "bridge_cffi/bundle-http" ]
aws-crypto = [ "bex_project/aws-crypto", "bridge_cffi/aws-crypto" ]
ring-crypto = [ "bex_project/ring-crypto", "bridge_cffi/ring-crypto" ]

[dependencies]
bex_events = { workspace = true }
bex_project = { workspace = true }
bridge_cffi = { workspace = true }
bridge_ctypes = { workspace = true }
sys_native = { workspace = true }
log = { workspace = true }
napi = { workspace = true, features = [ "anyhow", "async", "napi5", "serde-json", "tokio_rt" ] }
napi-derive = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [ "rt", "rt-multi-thread" ] }

[build-dependencies]
napi-build = { workspace = true }

[package.metadata.ci]
wasm_support = false
