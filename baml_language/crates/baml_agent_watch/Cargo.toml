[package]
name = "baml_agent_watch"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "`baml agent watch`: streams every file change, run, and agent message in a directory to the Agent Activity page"

[lib]
doctest = false

[lints]
workspace = true

# The web bundle is served by the playground host, which links the runtime's
# HTTP stack; the binary picks its TLS provider (same shape as baml_cli).
[features]
default = [ "aws-crypto" ]
aws-crypto = [ "baml_lsp_server/aws-crypto" ]
ring-crypto = [ "baml_lsp_server/ring-crypto" ]
native-tls = [ "baml_lsp_server/native-tls" ]

[dependencies]
baml_lsp_server = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
dirs = { workspace = true }
ignore = { workspace = true }
notify = { workspace = true }
serde = { workspace = true, features = [ "derive" ] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = [ "sync", "rt-multi-thread", "net", "time", "macros" ] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.ci]
wasm_support = false
