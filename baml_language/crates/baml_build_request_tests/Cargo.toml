[package]
name = "baml_build_request_tests"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }

[lib]
doctest = false

[dependencies]
baml_db = { workspace = true }
baml_llm_interface = { workspace = true }
baml_project = { workspace = true }
baml_jinja_runtime = { workspace = true }
baml_program = { workspace = true }
ir_stub = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Engine dependencies for comparison tests
baml-runtime = { path = "../../../engine/baml-runtime", features = ["internal"] }
internal-baml-core = { path = "../../../engine/baml-lib/baml-core" }
internal-baml-jinja = { path = "../../../engine/baml-lib/jinja-runtime" }
baml-types = { path = "../../../engine/baml-lib/baml-types" }
baml-ids = { path = "../../../engine/baml-ids" }
indexmap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
insta = { workspace = true, features = ["glob", "toml", "json"] }
