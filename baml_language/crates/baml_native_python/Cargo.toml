[package]
name = "baml_native_python"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Calling a BAML program compiled to a native library from Python: a pyo3 module over baml_native_host's core"

[lib]
name = "_native"
crate-type = [ "cdylib" ]
doctest = false
test = false
doc = false

[dependencies]
baml_native_host = { workspace = true }
pyo3 = { workspace = true, features = [ "abi3-py310", "macros" ] }

[build-dependencies]
pyo3-build-config = { workspace = true }

[lints]
workspace = true

[package.metadata.ci]
wasm_support = false
