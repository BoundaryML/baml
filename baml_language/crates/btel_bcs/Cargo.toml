[package]
name = "btel_bcs"
version = { workspace = true }
publish = false
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Bounded direct-upload delivery for Btel recordings"

[lints]
workspace = true

[features]
default = [ "aws-crypto" ]
aws-crypto = [ "reqwest/rustls", "rustls/aws_lc_rs", "rustls/std", "bcs_api/aws-crypto" ]
ring-crypto = [ "reqwest/rustls-no-provider", "rustls/ring", "rustls/std", "bcs_api/ring-crypto" ]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bcs_api.workspace = true
btel_processor = { workspace = true }
btel_recorder = { workspace = true }
btel_records = { workspace = true }
btel_settings = { workspace = true }
btel_snapshot = { workspace = true }
btel_types = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = [ "rt", "sync", "time", "net", "macros" ] }
uuid = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
baml_type = { workspace = true }
btel_clock = { workspace = true }
num-bigint = { workspace = true }
tokio = { workspace = true, features = [ "rt-multi-thread", "test-util" ] }
wiremock = { workspace = true }
