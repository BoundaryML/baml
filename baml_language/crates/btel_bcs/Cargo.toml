[package]
name = "btel_bcs"
version = { workspace = true }
publish = false
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Bounded direct-upload delivery for Btel recordings"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
baml_http = { workspace = true }
baml_crypto = { workspace = true }
btel_processor = { workspace = true }
btel_recorder = { workspace = true }
btel_records = { workspace = true }
btel_settings = { workspace = true }
btel_snapshot = { workspace = true }
btel_types = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
prost = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [ "rt", "sync", "time", "net", "macros" ] }
uuid = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sha2 = { workspace = true }
btel_clock = { workspace = true }
tokio = { workspace = true, features = [ "rt-multi-thread", "test-util" ] }
wiremock = { workspace = true }
