# obs-bench — the observability benchmark & acceptance harness
# (TASK/design.md §10.3). Clones the tools_size_gate architecture:
# per-platform TOML baselines under .ci/obs-bench/, NDJSON row output,
# check/refresh-baseline subcommands, and a reusable CI workflow.
[package]
name = "tools_obs_bench"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "Benchmark & acceptance harness for BAML observability (C1–C13 gates)"

[[bin]]
name = "obs-bench"
path = "src/main.rs"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
bex_events = { workspace = true }
bex_query = { path = "../bex_query" }
clap = { workspace = true, features = [ "derive" ] }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
