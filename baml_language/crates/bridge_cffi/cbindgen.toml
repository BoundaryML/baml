autogen_warning = """/* DO NOT MODIFY THIS MANUALLY! This file was generated using cbindgen.
 * To regenerate:
 *   BLESS=1 cargo test -p bridge_cffi --test header_is_current
 */"""
include_guard = "BAML_CFFI_H"
include_version = true
cpp_compat = true
braces = "SameLine"
line_length = 100
tab_width = 2
language = "C"

[enum]
prefix_with_name = true

[parse]
# HostDispatchFn / HostReleaseFn typedefs live in these crates; without them
# the generated header references undeclared types.
parse_deps = true
include = ["sys_native", "bex_resource_types"]
clean = false
extra_bindings = []
