language = "C"
cpp_compat = true
usize_is_size_t = true
no_includes = true
documentation_style = "doxy"
line_length = 100
tab_width = 2
line_endings = "LF"
braces = "SameLine"
include_version = true

autogen_warning = """/* Generated by cbindgen 0.29.0 from the Rust ABI declarations.
 * DO NOT EDIT. Regenerate with:
 *   cargo test -p bridge_cffi --test header_generation regenerate -- --ignored --exact
 */"""

header = """#ifndef BAML_CFFI_H
#define BAML_CFFI_H

#include <stdbool.h>
#include <stddef.h>
#include <stdint.h>

/*
 * All functions and callbacks use Rust's `extern \"C\"` ABI. On supported
 * Windows/MSVC targets (x86_64 and ARM64), this is the platform C calling
 * convention. BAML_CFFI_API supplies import/export decoration for consumers
 * that link directly; dynamic loaders should resolve only baml_get_api_v1.
 */
#if defined(_WIN32)
#  define BAML_CFFI_CALL __cdecl
#  if defined(BAML_CFFI_BUILD)
#    define BAML_CFFI_API __declspec(dllexport)
#  else
#    define BAML_CFFI_API __declspec(dllimport)
#  endif
#else
#  define BAML_CFFI_CALL
#  if defined(BAML_CFFI_BUILD) && (defined(__GNUC__) || defined(__clang__))
#    define BAML_CFFI_API __attribute__((visibility(\"default\")))
#  else
#    define BAML_CFFI_API
#  endif
#endif"""

trailer = """/* Size of the original required V1 prefix. Future V1 fields may only follow it. */
#define BAML_API_V1_MIN_SIZE \\
  (offsetof(BamlApiV1, register_bridge) + sizeof(((BamlApiV1 *)0)->register_bridge))

/*
 * Validate the original V1 prefix without rejecting a runtime that appended
 * fields. Consumers must perform an equivalent end-of-field check before
 * reading any future appended field.
 */
static inline bool baml_api_v1_is_compatible(const BamlApiV1 *api) {
  return api != NULL && api->abi_version == BAML_API_V1_ABI_VERSION &&
         api->struct_size >= BAML_API_V1_MIN_SIZE;
}

#endif /* BAML_CFFI_H */"""

[export]
include = [
  "BAML_API_V1_ABI_VERSION",
  "BamlCffiMediaKind",
  "BamlCffiHandleType",
  "BamlCffiStatus",
  "Buffer",
  "BridgeLanguage",
  "BamlBridgeInfoV1",
  "BamlResultCallback",
  "BamlHostDispatchCallback",
  "BamlHostReleaseCallback",
  "BamlUnhandledSpawnErrorCallback",
  "BamlVersionFn",
  "BamlInitializeRuntimeFromBytecodeFn",
  "BamlFreeBufferFn",
  "BamlRegisterCallbackFn",
  "BamlCallFunctionFn",
  "BamlNewFunctionCallFn",
  "BamlCancelFunctionCallFn",
  "BamlRegisterHostDispatchCallbackFn",
  "BamlRegisterHostReleaseCallbackFn",
  "BamlRegisterUnhandledSpawnErrorCallbackFn",
  "BamlShutdownRuntimeFn",
  "BamlCompleteHostCallFn",
  "BamlHandleCloneFn",
  "BamlHandleReleaseFn",
  "BamlMediaConstructorFn",
  "BamlMediaAccessorFn",
  "BamlRegisterBridgeFn",
  "BamlGetApiV1Fn",
  "BamlApiV1",
  "baml_get_api_v1",
]
exclude = [
  "call_function",
  "new_function_call",
  "release_function_call",
  "cancel_function_call",
  "register_callback",
  "baml_handle_clone",
  "baml_handle_release",
  "__testonly_seed_function_ref",
  "__testonly_seed_generic_media",
  "baml_media_from_url",
  "baml_media_from_file",
  "baml_media_from_base64",
  "baml_media_url",
  "baml_media_file",
  "baml_media_base64",
  "baml_media_mime_type",
  "register_host_dispatch_callback",
  "register_host_release_callback",
  "register_unhandled_spawn_error_callback",
  "shutdown_runtime",
  "complete_host_call",
  "free_buffer",
  "flush_events",
  "version",
  "create_baml_runtime",
  "initialize_runtime_from_bytecode",
  "destroy_baml_runtime",
  "invoke_runtime_cli",
]

[export.rename]
Buffer = "BamlBuffer"
BridgeLanguage = "BamlBridgeLanguage"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[fn]
prefix = "BAML_CFFI_API"
sort_by = "None"

[parse]
parse_deps = false
clean = false
