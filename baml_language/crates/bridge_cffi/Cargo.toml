[package]
name = "bridge_cffi"
# Must match the version expected by baml-sys
version = "0.218.1"
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
# Library name is bridge_cffi; baml-sys/integ-tests still look for baml_cffi. For release,
# the artifact can be renamed (e.g. via mv) as needed when we switch to this bridge.
name = "bridge_cffi"
crate-type = [ "cdylib", "lib" ]

[features]
default = [ "bundle-http" ]
bundle-http = [ "sys_native/bundle-http" ]
# BAML never contacts anything on its own (see VENDOR.md).
no-phone-home = [ "sys_native/no-phone-home" ]

[dependencies]
baml_version = { workspace = true }
bex_project = { workspace = true }
bridge_ctypes = { workspace = true }
sys_ops = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
prost = { workspace = true }
semver = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
vfs = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bex_events = { workspace = true }
sys_native = { workspace = true }
sys_types = { workspace = true }
libc = { workspace = true }
once_cell = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [ "rt", "rt-multi-thread" ] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
cbindgen = { workspace = true }

[target.'cfg(target_os = "windows")'.dev-dependencies]

[dev-dependencies]
baml_artifact = { workspace = true, features = [ "test-support" ] }
cc = { workspace = true }

[package.metadata.ci]
wasm_support = true
