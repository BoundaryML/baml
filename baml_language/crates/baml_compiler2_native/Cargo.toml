[package]
name = "baml_compiler2_native"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Ahead-of-time native code backend: MIR to object code through Cranelift"

[lib]
doctest = false

[lints]
workspace = true

[package.metadata.ci]
wasm_support = false

[dependencies]
baml_base = { workspace = true }
baml_compiler2_hir = { workspace = true }
baml_compiler2_hir_ty = { workspace = true }
baml_compiler2_mir = { workspace = true }
baml_type = { workspace = true }
cranelift-codegen = { workspace = true }
cranelift-frontend = { workspace = true }
cranelift-module = { workspace = true }
cranelift-native = { workspace = true }
cranelift-object = { workspace = true }
num-bigint = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
baml_builtins2_codegen = { workspace = true }

[dev-dependencies]
baml_db = { workspace = true }
bex_engine = { workspace = true }
bex_external_types = { workspace = true }
sys_native = { workspace = true, features = [ "bundle-http", "aws-crypto" ] }
sys_ops = { workspace = true }
sys_types = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [ "macros", "net", "rt-multi-thread" ] }
