[package]
name = "baml_bridge_cffi"
# Must match the version expected by baml-sys
version = "0.218.0"
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "baml_cffi"
crate-type = ["cdylib"]

[dependencies]
# Internal workspace dependencies
baml_base = { workspace = true }
baml_compiler_emit = { workspace = true }
baml_compiler_hir = { workspace = true }
baml_compiler_tir = { workspace = true }
baml_project = { workspace = true }
baml_snapshot = { workspace = true }
baml_workspace = { workspace = true }
bex_engine = { workspace = true }
bex_external_types = { workspace = true }

# External dependencies
anyhow = { workspace = true }
indexmap = { workspace = true }
libc = { workspace = true }
once_cell = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[build-dependencies]
cbindgen = { workspace = true }
prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }
