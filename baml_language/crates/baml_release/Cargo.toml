[package]
name = "baml_release"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[features]
default = [ "aws-crypto" ]
aws-crypto = [ "reqwest/rustls", "baml_tls/aws-crypto" ]
ring-crypto = [ "reqwest/rustls-no-provider", "baml_tls/ring-crypto" ]
external-crypto = [ "reqwest/rustls-no-provider", "baml_tls/external-crypto" ]
self-update = [  ]
no-self-update = [  ]

[dependencies]
baml_tls = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
flate2 = { workspace = true }
reqwest = { workspace = true, features = [ "blocking" ] }
serde = { workspace = true, features = [ "derive" ] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
zip = { workspace = true }

[dev-dependencies]

[package.metadata.ci]
wasm_support = false
