[package]
name = "sys_native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
baml-defaults = [ "bridge_ctypes/baml-defaults", "jiff/tzdb-bundle-platform" ]
default = [ "baml-defaults" ]
# `baml.http` / `baml.ws` on the process's network transport (`baml_http`).
bundle-http = [ "dep:baml_http" ]
# BAML never contacts anything on its own (see VENDOR.md).
no-phone-home = [ "baml_http?/no-phone-home" ]

[dependencies]
baml_crypto = { workspace = true }
baml_http = { workspace = true, optional = true }
baml_type = { workspace = true }
bex_external_types = { workspace = true }
bex_heap = { workspace = true }
bex_resource_types = { workspace = true }
bridge_ctypes = { workspace = true, default-features = false }
sys_auth = { workspace = true }
sys_glob = { workspace = true }
sys_ops = { workspace = true }
sys_types = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
num-bigint = { workspace = true }
once_cell = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "sync",
  "fs",
  "net",
  "process",
  "io-util",
  "io-std",
  "time",
] }
tracing = { workspace = true }
walkdir = { workspace = true }

[lints]
workspace = true

[package.metadata.ci]
wasm_support = false
