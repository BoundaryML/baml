[package]
name = "sys_native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = [ "aws-crypto" ]
aws-crypto = [
  "dep:rustls",
  "reqwest/rustls",
  "rustls?/aws_lc_rs",
  "rustls?/std",
  "bridge_ctypes/aws-crypto",
]
ring-crypto = [
  "dep:rustls",
  "reqwest/rustls-no-provider",
  "rustls?/ring",
  "rustls?/std",
  "bridge_ctypes/ring-crypto",
]
native-tls = [ "reqwest/native-tls" ]
rustls = [ "aws-crypto" ]
bundle-http = [ "dep:reqwest" ]

[dependencies]
baml_type = { workspace = true }
bex_external_types = { workspace = true }
bex_heap = { workspace = true }
bex_resource_types = { workspace = true }
bridge_ctypes = { workspace = true, default-features = false }
sys_glob = { workspace = true }
sys_ops = { workspace = true }
sys_types = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
once_cell = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "sync",
  "fs",
  "net",
  "process",
  "io-util",
  "io-std",
  "time",
] }
tracing = { workspace = true }
walkdir = { workspace = true }

[lints]
workspace = true

[package.metadata.ci]
wasm_support = false
