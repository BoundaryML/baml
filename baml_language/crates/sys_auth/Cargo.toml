# The only provider-specific Rust that survives the sys_llm → native-BAML
# migration: the two auth seams BAML cannot express (RS256 JWT signing for
# Google Cloud, SigV4 HMAC-SHA256 for AWS). Everything else about a provider
# request is built and parsed in `.baml`.
[package]
name = "sys_auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
sys_types = { workspace = true }
async-trait = { workspace = true }
aws-config = { workspace = true }
aws-sigv4 = { workspace = true }
google-cloud-auth = { workspace = true }
indexmap = { workspace = true }
num-bigint = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = [ "rt", "macros" ] }

[lints]
workspace = true
