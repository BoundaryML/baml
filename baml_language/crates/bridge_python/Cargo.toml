[package]
name = "bridge_python"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "baml_py"
crate-type = ["cdylib"]

[dependencies]
bex_engine = { workspace = true }
bex_events = { workspace = true }
bex_external_types = { workspace = true }
bex_factory = { workspace = true }
bridge_cffi = { workspace = true }
bridge_ctypes = { workspace = true }
sys_native = { workspace = true }
baml_type = { workspace = true }
uuid = { workspace = true }
pyo3 = { workspace = true, features = ["abi3-py38", "extension-module", "indexmap"] }
pyo3-async-runtimes = { workspace = true, features = ["tokio-runtime"] }
indexmap = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
thiserror = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true }

[package.metadata.ci]
wasm_support = false
