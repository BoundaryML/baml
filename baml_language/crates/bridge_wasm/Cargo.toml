# This crate only supports wasm32-unknown-unknown. Build with:
#   cargo build -p bridge_wasm --target wasm32-unknown-unknown
[package]
name = "bridge_wasm"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = [ "cdylib", "rlib" ]

[dependencies]
baml_version = { workspace = true }
bex_project = { workspace = true }
base64 = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }
getrandom_03 = { workspace = true }
log = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-logger = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

[features]
default = [ "console_error_panic", "aws-crypto" ]
aws-crypto = [  ]
ring-crypto = [  ]
console_error_panic = [ "console_error_panic_hook" ]

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.ci]
wasm_support = true
