# This crate only supports wasm32-unknown-unknown. Build with:
#   cargo build -p bridge_wasm --target wasm32-unknown-unknown
[package]
name = "bridge_wasm"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
# Despite the name, this is not "BAML on wasm" — it is the browser host for the
# playground and editor surfaces only (promptfiddle, the app-website workbench,
# the VS Code webview), i.e. the language server plus the playground runtime.
# User-facing browser apps go through the published web SDK,
# `sdks/typescript/bridge_typescript_web` (on `sys_wasm`), which shares nothing
# with this crate above the compiler.
description = "Browser host for the BAML playground and editor: language server, playground runtime, and the wasm platform they run on"

[lib]
crate-type = [ "cdylib", "rlib" ]

[dependencies]
baml_compiler2_visualization = { workspace = true }
baml_db = { workspace = true }
baml_ide = { workspace = true }
baml_lsp = { workspace = true }
baml_version = { workspace = true }
bex_events = { workspace = true }
bex_heap = { workspace = true }
bex_project = { workspace = true }
bridge_ctypes = { workspace = true }
sys_glob = { workspace = true }
sys_ops = { workspace = true }
sys_types = { workspace = true }
sys_wasm = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }
futures = { workspace = true }
getrandom_03 = { workspace = true }
indexmap = { workspace = true }
js-sys = { workspace = true }
log = { workspace = true }
lsp-server = { workspace = true }
lsp-types = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = [ "derive" ] }
serde-wasm-bindgen = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tsify = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-logger = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
sys_wasm = { workspace = true }
js-sys = { workspace = true }
lsp-server = { workspace = true }
lsp-types = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen-test = { workspace = true }

[features]
default = [ "console_error_panic", "aws-crypto" ]
aws-crypto = [  ]
ring-crypto = [  ]
console_error_panic = [ "console_error_panic_hook" ]

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.ci]
wasm_support = true
