[package]
name = "baml_tests"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
build = "build.rs"

[lib]
doctest = false

[dependencies]
baml_base = { workspace = true }
baml_compiler2_ast = { workspace = true }
baml_compiler2_emit = { workspace = true }
baml_compiler2_hir = { workspace = true }
baml_compiler2_hir_ty = { workspace = true }
baml_compiler2_mir = { workspace = true }
baml_compiler2_ppir = { workspace = true }
baml_compiler_diagnostics = { workspace = true }
baml_db = { workspace = true }
baml_project = { workspace = true, features = [ "testing" ] }
baml_workspace = { workspace = true }
bex_engine = { workspace = true }
bex_project = { workspace = true }
bex_vm = { workspace = true }
bex_vm_types = { workspace = true }
sys_native = { workspace = true, features = [ "bundle-http", "aws-crypto" ] }
sys_ops = { workspace = true }
sys_types = { workspace = true }
indexmap = { workspace = true }
insta = { workspace = true }
salsa = { workspace = true }
similar = { workspace = true }
text-size = { workspace = true }

[build-dependencies]
prettyplease = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
baml_builtins2 = { workspace = true }
baml_cli = { workspace = true }
baml_compiler2_emit = { workspace = true }
baml_fmt = { workspace = true }
baml_type = { workspace = true }
bex_events = { workspace = true }
bex_external_types = { workspace = true }
bex_heap = { workspace = true }
borsh = { workspace = true }
darwin-kperf = { workspace = true }
darwin-kperf-events = { workspace = true }
divan = { workspace = true }
libc = { workspace = true }
mimalloc = { workspace = true }
num-bigint = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [ "rt-multi-thread", "macros", "net" ] }
wiremock = { workspace = true }

[[bench]]
name = "compiler_benchmark"
harness = false

[[bench]]
name = "runtime_benchmark"
harness = false

[[bench]]
name = "profiling_overhead"
harness = false

[[bench]]
name = "cache_profile"
harness = false

[[bench]]
name = "package_compile_benchmark"
harness = false

[features]
default = [  ]
heap_debug = [
  "bex_engine/heap_debug",
  "bex_vm/heap_debug",
  "bex_vm_types/heap_debug",
]

[package.metadata.ci]
wasm_support = false
