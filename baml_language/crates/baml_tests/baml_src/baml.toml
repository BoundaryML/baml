[package]
name = "baml_tests"

# Test profiles (schema: crates/baml_cli/src/manifest.rs:42-76; resolution:
# crates/baml_cli/src/test_command.rs:771-846). A profile is preset `baml test`
# argv, parsed by the real clap grammar.
#
# `default` is what a bare `baml-cli test` uses — including the corpus runner in
# crates/baml_tests/tests/baml_src.rs and therefore CI, which has no
# provider keys. It must keep selecting the whole offline corpus, so it only
# drops the opt-in `::live::` testsets and the compile-only `ns_fixtures/`
# subtree. `--exclude` beats `--include`, and an excluded testset subtree is
# pruned *before* its body runs (baml_std/testing/registry.baml:644-659), so an
# offline run never constructs a provider client or reads an API key.
#
# `root.fixtures.` drops every test under `ns_fixtures/`: those namespaces are
# compiler-phase snapshot fixtures (see crates/baml_tests/src/corpus.rs), and
# some of their test blocks fail by design when executed (e.g. a test whose
# body throws, kept to pin the compiled shape of a throwing test body). Both
# canonical-id forms carry the prefix: `root.fixtures.<ns>::<test>` (testset
# leaves) and `root.fixtures.<ns>.<Function>::<Test>` (legacy tests).
#
#   offline (default):
#     target/debug/baml-cli test --from crates/baml_tests/baml_src
#   live (real provider calls, needs keys):
#     infisical run -- baml_language/target/debug/baml-cli test \
#       --from baml_language/crates/baml_tests/baml_src --profile live
#
# See ns_llm_mock/README.md for the authoring rules these profiles assume.
[test]
default = "offline"

[test.profiles.offline]
args = ["-x", "::live::", "-x", "root.fixtures."]

[test.profiles.live]
args = ["-i", "::live::"]
