[package]
name = "sys_llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = [ "aws-crypto" ]
aws-crypto = [
  "dep:rustls",
  "rustls?/aws_lc_rs",
  "rustls?/std",
]
ring-crypto = [ "dep:rustls", "rustls?/ring", "rustls?/std" ]

[dependencies]
baml_base = { workspace = true }
baml_builtins2 = { workspace = true }
baml_type = { workspace = true }
bex_external_types = { workspace = true }
bex_heap = { workspace = true }
bex_resource_types = { workspace = true }
bex_sap = { workspace = true }
bex_vm_types = { workspace = true }
sys_types = { workspace = true }
async-trait = { workspace = true }
aws-bedrock = { workspace = true }
aws-sigv4 = { workspace = true }
base64 = { workspace = true }
google-cloud-auth = { workspace = true }
indexmap = { workspace = true }
infer = { workspace = true }
num-bigint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [ "rt" ] }
url = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aws-config = { workspace = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, features = [ "rt-multi-thread" ] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
aws-config = { workspace = true }
getrandom = { workspace = true, features = [ "js" ] }
getrandom_03 = { workspace = true }

[dev-dependencies]
rsa = { workspace = true, features = [ "sha2" ] }
tokio = { workspace = true, features = [ "rt", "macros" ] }

[package.metadata.cargo-shear]
ignored = [ "getrandom", "getrandom_03" ]

[lints]
workspace = true
