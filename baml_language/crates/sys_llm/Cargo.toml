[package]
name = "sys_llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = [ "aws-crypto" ]
aws-crypto = [
  "dep:rustls",
  "google-cloud-auth/default-rustls-provider",
  "rustls?/aws_lc_rs",
  "rustls?/std",
]
ring-crypto = [ "dep:rustls", "rustls?/ring", "rustls?/std" ]

[dependencies]
baml_base = { workspace = true }
baml_builtins2 = { workspace = true }
baml_type = { workspace = true }
bex_external_types = { workspace = true }
bex_heap = { workspace = true }
bex_resource_types = { workspace = true }
bex_sap = { workspace = true }
bex_vm_types = { workspace = true }
sys_jinja = { workspace = true }
sys_types = { workspace = true }
aws-credential-types = { workspace = true }
aws-sdk-bedrockruntime = { workspace = true }
aws-sigv4 = { workspace = true }
aws-smithy-async = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
aws-types = { workspace = true }
base64 = { workspace = true }
indexmap = { workspace = true }
infer = { workspace = true }
minijinja = { workspace = true }
percent-encoding = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [ "rt" ] }
url = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aws-config = { workspace = true, features = [
  "rt-tokio",
  "credentials-process",
  "sso",
] }
google-cloud-auth = { workspace = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, features = [ "rt-multi-thread" ] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
aws-config = { workspace = true }
futures-timer = { workspace = true }
getrandom = { workspace = true, features = [ "js" ] }
rsa = { workspace = true, features = [ "sha2" ] }
sha2 = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
rsa = { workspace = true, features = [ "sha2" ] }
tokio = { workspace = true, features = [ "rt", "macros" ] }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
