[package]
name = "bex_vm"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "BAML Virtual Machine"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
baml_builtins2 = { workspace = true }
baml_compiler_diagnostics = { workspace = true }
baml_crypto = { workspace = true }
baml_crypto_types = { workspace = true }
baml_type = { workspace = true }
bex_heap = { workspace = true }
bex_str = { workspace = true }
bex_vm_types = { workspace = true }
btel_clock = { workspace = true }
btel_processor = { workspace = true }
btel_records = { workspace = true }
btel_settings = { workspace = true }
btel_snapshot = { workspace = true }
btel_types = { workspace = true }
sys_regex = { workspace = true }
base64 = { workspace = true }
console = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
num-bigint = { workspace = true }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
rand_xoshiro = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = [ "macros" ] }
tokio-util = { workspace = true }
toml = { workspace = true }
yaml-rust2 = { workspace = true }

# Native-only: tokio runtime so CancelToken.any can `tokio::spawn` its watcher.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = [ "rt", "macros" ] }

# WASM-only: wasm-bindgen-futures for spawning the watcher.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }

[build-dependencies]
baml_builtins2_codegen = { workspace = true }

[dev-dependencies]
baml_db = { workspace = true }
indexmap = { workspace = true }

[features]
baml-defaults = [ "serde_json/arbitrary_precision" ]
default = [ "baml-defaults" ]
heap_debug = [ "bex_heap/heap_debug", "bex_vm_types/heap_debug" ]
# Enables the per-op VM counter for the `kperf` profiler's instructions/op
# breakdown. Off by default — pure measurement scaffolding on the hot path.
kperf = [  ]
