[package]
name = "bex_vm"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "BAML Virtual Machine"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
baml_artifact = { workspace = true }
baml_base = { workspace = true }
baml_builtins2 = { workspace = true }
baml_compiler_diagnostics = { workspace = true }
baml_env = { workspace = true }
baml_linker_types = { workspace = true }
baml_type = { workspace = true }
bex_heap = { workspace = true }
bex_sap = { workspace = true }
bex_str = { workspace = true }
bex_vm_types = { workspace = true }
btel_clock = { workspace = true }
btel_processor = { workspace = true }
btel_records = { workspace = true }
btel_settings = { workspace = true }
btel_snapshot = { workspace = true }
btel_types = { workspace = true }
sys_regex = { workspace = true }
sys_types = { workspace = true }
aes-gcm-siv = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
indexmap = { workspace = true }
itoa = { workspace = true }
num-bigint = { workspace = true }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
rand_xoshiro = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
time = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
zmij = { workspace = true }

# Compiled bodies run on a fiber per VM so they can pause mid-body; see
# `vm/compiled_rt/fiber.rs` for the targets without one.
[target.'cfg(not(any(target_arch = "wasm32", all(windows, target_arch = "aarch64"))))'.dependencies]
corosensei = { workspace = true }

# `rand_core` pulls in getrandom 0.2, which hard-errors on
# wasm*-unknown-unknown unless its `js` feature is enabled.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = [ "js" ] }

[build-dependencies]
baml_builtins2_codegen = { workspace = true }

[dev-dependencies]
baml_test_support = { workspace = true }
indexmap = { workspace = true }

[features]
default = [  ]
heap_debug = [ "bex_heap/heap_debug", "bex_vm_types/heap_debug" ]
# Enables the per-op VM counter for the `kperf` profiler's instructions/op
# breakdown. Off by default — pure measurement scaffolding on the hot path.
kperf = [  ]
