[package]
name = "baml_native_rt"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Runtime linked into natively compiled BAML programs"

[lib]
# `baml_compiler2_native` compiles `src/lib.rs` into the archive it links
# programs against; the workspace builds the same source as a static library so
# it is checked, linted and tested with everything else.
crate-type = [ "staticlib" ]
doctest = false

[lints]
workspace = true

[package.metadata.ci]
wasm_support = false
