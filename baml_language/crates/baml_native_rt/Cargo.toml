[package]
name = "baml_native_rt"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Runtime linked into natively compiled BAML programs"

[lib]
# `baml_compiler2_native` builds this package into the archive it links
# programs against, with a nested `cargo` and its own profile.
crate-type = [ "staticlib" ]
doctest = false

[dependencies]
sys_regex = { workspace = true }
num-bigint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [ "fs", "rt-multi-thread", "time" ] }
zmij = { workspace = true }

[build-dependencies]
baml_builtins2_codegen = { workspace = true }

[lints]
workspace = true

[package.metadata.ci]
wasm_support = false
