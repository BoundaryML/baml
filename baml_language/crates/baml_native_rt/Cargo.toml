[package]
name = "baml_native_rt"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Runtime linked into natively compiled BAML programs"

[lib]
# `baml_compiler2_native` builds this package into the archive it links
# programs against, with a nested `cargo` and its own profile.
crate-type = [ "staticlib" ]
doctest = false

[build-dependencies]
baml_builtins2_codegen = { workspace = true }

[lints]
workspace = true

[package.metadata.ci]
wasm_support = false
