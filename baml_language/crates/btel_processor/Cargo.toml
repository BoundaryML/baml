[package]
name = "btel_processor"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "Chunk-backed telemetry processing and storage recycling"

[features]
# Producer-side diagnostics: pool-wide cold-path counts, capture-pool peaks,
# and a warning the first time a producer takes storage beyond its budget.
# Measurement only; nothing reads them in production.
diagnostics = [ "bex_chunkedringbuffer/diagnostics", "btel_snapshot/stats", "dep:tracing" ]

[lints]
workspace = true

[dependencies]
bex_chunkedringbuffer = { workspace = true }
btel_records = { workspace = true }
btel_settings = { workspace = true }
btel_snapshot = { workspace = true }
btel_types = { workspace = true }
rustc-hash = { workspace = true }
tracing = { workspace = true, optional = true }
web-time = { workspace = true }

[dev-dependencies]
btel_clock = { workspace = true }
