[package]
name = "bex_project"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "Reusable compile-and-run runtime for BAML programs"
build = "build.rs"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
baml_artifact = { workspace = true }
baml_base = { workspace = true }
baml_builtins2 = { workspace = true }
baml_compiler2_emit = { workspace = true }
baml_compiler2_hir = { workspace = true }
baml_compiler2_hir_ty = { workspace = true }
baml_compiler_diagnostics = { workspace = true }
baml_compiler_lexer = { workspace = true }
baml_compiler_parser = { workspace = true }
baml_compiler_syntax = { workspace = true }
baml_db = { workspace = true }
baml_type = { workspace = true }
baml_version = { workspace = true }
bex_engine = { workspace = true }
bex_external_types = { workspace = true }
bex_heap = { workspace = true }
bex_vm = { workspace = true }
bex_vm_types = { workspace = true }
btel_settings = { workspace = true }
sys_ops = { workspace = true }
sys_types = { workspace = true }
async-trait = { workspace = true }
borsh = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
rowan = { workspace = true }
thiserror = { workspace = true }
vfs = { workspace = true }

[build-dependencies]
baml_compiler2_emit = { workspace = true }
baml_db = { workspace = true }
baml_version = { workspace = true }
borsh = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sys_native = { workspace = true, features = [ "bundle-http" ] }
baml_artifact = { workspace = true, features = [ "test-support" ] }
tempfile = { workspace = true }

[features]
default = [ "aws-crypto" ]
aws-crypto = [ "bex_engine/aws-crypto" ]
ring-crypto = [ "bex_engine/ring-crypto" ]
telemetry_diagnostics = [ "bex_engine/telemetry_diagnostics" ]
