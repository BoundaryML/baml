[package]
name = "bex_project"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "Reusable compile-and-run runtime for BAML programs"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
baml_base = { workspace = true }
baml_builtins2 = { workspace = true }
baml_compiler2_visualization = { workspace = true }
baml_compiler_diagnostics = { workspace = true }
baml_db = { workspace = true }
baml_fmt = { workspace = true }
baml_lsp2_actions = { workspace = true }
baml_path = { workspace = true }
baml_project = { workspace = true }
baml_type = { workspace = true }
baml_version = { workspace = true }
baml_workspace = { workspace = true }
bex_engine = { workspace = true }
bex_external_types = { workspace = true }
bex_heap = { workspace = true }
bex_vm_types = { workspace = true }
sys_ops = { workspace = true }
sys_types = { workspace = true }
async-trait = { workspace = true }
borsh = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
lsp-server = { workspace = true }
lsp-types = { workspace = true }
paste = { workspace = true }
percent-encoding = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = [ "derive" ] }
serde_json = { workspace = true }
sha2 = { workspace = true }
text-size = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
vfs = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bex_cache = { workspace = true, default-features = false }
ignore = { workspace = true }
# `rt-multi-thread` backs `wasm_helpers::fallback_runtime`'s
# `tokio::runtime::Runtime::new()`. It used to arrive by feature unification
# through `sys_llm`; that crate is gone, so declare it where it is used.
tokio = { workspace = true, features = [ "sync", "rt", "rt-multi-thread", "time" ] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sys_native = { workspace = true }
walkdir = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }

[features]
default = [ "aws-crypto" ]
aws-crypto = [ "bex_engine/aws-crypto", "bex_cache/aws-crypto" ]
ring-crypto = [ "bex_engine/ring-crypto", "bex_cache/ring-crypto" ]
