[package]
name = "baml_native_node"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Calling a BAML program compiled to a native library from Node: a Node-API addon over baml_native_host's core"

[lib]
crate-type = [ "cdylib" ]
# The addon references Node-API symbols that Node provides when it loads the
# addon, so a test binary cannot link: it is tested from JavaScript
# (`js/test`), as bridge_typescript is.
test = false
doctest = false

[dependencies]
baml_native_host = { workspace = true }
napi-sys = { workspace = true, features = [ "napi6" ] }

[build-dependencies]
napi-build = { workspace = true }

[dev-dependencies]
sdk_test_codegen = { path = "../../sdk_tests/codegen" }
sdkgen_typescript_shared = { workspace = true }

[lints]
workspace = true

[package.metadata.ci]
wasm_support = false
