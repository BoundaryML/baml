# Replace this crate to select non-TLS cryptographic implementations.
# No backend-selection features are required elsewhere in BAML.
[package]
name = "baml_crypto_provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
baml_crypto_types = { workspace = true }
aes-gcm-siv = { workspace = true }
chacha20poly1305 = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "ios")))'.dependencies]
aws-lc-rs = { workspace = true }

# The iOS SDK uses ring because the default AWS-LC objects do not link on iOS.
[target.'cfg(target_os = "ios")'.dependencies]
ring = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pem-rfc7468 = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
