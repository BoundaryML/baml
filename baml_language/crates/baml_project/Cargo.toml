[package]
name = "baml_project"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "Project management and centralized diagnostics for BAML"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
baml_base = { workspace = true }
baml_builtins2 = { workspace = true }
baml_codegen_types = { workspace = true }
baml_compiler2_ast = { workspace = true }
baml_compiler2_emit = { workspace = true }
baml_compiler2_hir = { workspace = true }
baml_compiler2_hir_ty = { workspace = true }
baml_compiler2_mir = { workspace = true }
baml_compiler2_ppir = { workspace = true }
baml_compiler2_visualization = { workspace = true }
baml_compiler_diagnostics = { workspace = true }
baml_db = { workspace = true }
baml_lsp2_actions = { workspace = true }
baml_package_interface = { workspace = true }
baml_surface = { workspace = true }
baml_type = { workspace = true }
baml_workspace = { workspace = true }
bex_vm_types = { workspace = true }
la-arena = { workspace = true }
lsp-types = { workspace = true }
rayon = { workspace = true }
salsa = { workspace = true }
serde = { workspace = true, features = [ "derive" ] }
serde_json = { workspace = true }
text-size = { workspace = true }

[features]
default = [  ]
# Exposes `baml_project::testing::*`, which contains compile helpers that panic
# on diagnostic errors and are not appropriate for production use.
testing = [  ]
