[package]
name = "bex_cache"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

# TLS provider selection mirrors sys_native/sys_llm: `rustls` on
# reqwest pins the aws-lc-rs provider, whose C objects don't link on
# iOS — Apple bridge builds select `ring-crypto` instead.
[features]
default = [ "aws-crypto" ]
aws-crypto = [ "reqwest/rustls" ]
ring-crypto = [
  "reqwest/rustls-no-provider",
  "dep:rustls",
  "rustls/ring",
  "rustls/std",
]

[dependencies]
baml_type = { workspace = true }
baml_version = { workspace = true }
bex_vm_types = { workspace = true }
borsh = { workspace = true }
reqwest = { workspace = true, features = [ "blocking" ] }
rustls = { workspace = true, optional = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[package.metadata.ci]
wasm_support = false
