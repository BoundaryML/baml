[package]
name = "bex_cache"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

# TLS provider selection mirrors sys_native: `rustls` on
# reqwest pins the aws-lc-rs provider, whose C objects don't link on
# iOS — Apple bridge builds select `ring-crypto` instead.
[features]
default = [ "aws-crypto" ]
aws-crypto = [ "reqwest/rustls", "baml_tls/aws-crypto" ]
ring-crypto = [ "reqwest/rustls-no-provider", "baml_tls/ring-crypto" ]
external-crypto = [ "reqwest/rustls-no-provider", "baml_tls/external-crypto" ]

[dependencies]
baml_tls = { workspace = true }
baml_type = { workspace = true }
baml_version = { workspace = true }
bex_vm_types = { workspace = true }
borsh = { workspace = true }
reqwest = { workspace = true, features = [ "blocking" ] }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[package.metadata.ci]
wasm_support = false
