[package]
name = "baml_lsp_server"
version.workspace = true
edition.workspace = true
description = "Native stdio host for the BAML language server: transport, admission scheduler, and the owner thread that runs baml_lsp"

[lints]
workspace = true

[dependencies]
baml_builtins2 = { workspace = true }
baml_lsp = { workspace = true }
baml_version = { workspace = true }
anyhow = { workspace = true }
crossbeam-channel = { workspace = true }
lsp-server = { workspace = true }
lsp-types = { workspace = true }
parking_lot = { workspace = true, features = [ "deadlock_detection" ] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.ci]
wasm_support = false
