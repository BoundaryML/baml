[package]
name = "baml_lsp_server"
version.workspace = true
edition.workspace = true
description = "Native stdio host for the BAML language server: transport, admission scheduler, and the owner thread that runs baml_lsp"

[lints]
workspace = true

[dependencies]
baml_builtins2 = { workspace = true }
baml_compiler2_visualization = { workspace = true }
baml_db = { workspace = true }
baml_http = { workspace = true }
baml_ide = { workspace = true }
baml_lsp = { workspace = true }
baml_version = { workspace = true }
bex_engine = { workspace = true }
bex_events = { workspace = true }
bex_heap = { workspace = true }
bex_project = { workspace = true }
bex_vm_types = { workspace = true }
bridge_ctypes = { workspace = true }
sys_native = { workspace = true, features = [ "bundle-http" ] }
sys_ops = { workspace = true }
sys_types = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true }
crossbeam-channel = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
lsp-server = { workspace = true }
lsp-types = { workspace = true }
notify = { workspace = true }
num-bigint = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = [ "derive" ] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [ "sync", "rt-multi-thread", "net", "time", "macros" ] }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
webbrowser = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = [ "macros", "rt-multi-thread" ] }

[package.metadata.ci]
wasm_support = false

[features]
default = [ "baml-defaults" ]
baml-defaults = [
  "bex_project/baml-defaults",
  "sys_native/baml-defaults",
  "dep:axum",
  "dep:tower-http",
  "parking_lot/deadlock_detection",
]
